name: 🚀 Feature Request
description: Suggest an idea that will improve BunkerWeb
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        #### Before submitting a feature request, please make sure the feature hasn't been already addressed by searching through [the existing and past feature requests](https://github.com/bunkerity/bunkerweb/issues?q=is%3Aissue+sort%3Acreated-desc+%5BFEATURE%5D+in%3Atitle).
  - type: markdown
    attributes:
      value: >
        📊 Wondering if your request is driven by an outage? Double-check https://status.bunkerweb.io/?utm_campaign=self&utm_source=github&utm_medium=issue-template to confirm it's not caused by an ongoing incident.
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select the primary area involved.
      options:
        - Web UI
        - API
        - Scheduler
        - Core plugins
        - External plugins
        - Docker / Autoconf
        - Swarm
        - Kubernetes
        - Linux
        - All-in-one
        - Documentation
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: whats-needed-and-why
    attributes:
      label: What's needed and why?
      description: Describe the feature you would like to see in the project and why it should be implemented.
    validations:
      required: true
  - type: textarea
    id: implementations-ideas
    attributes:
      label: Implementations ideas (optional)
      description: How it should be used and integrated into the project ? List some posts, research papers or codes that we can use as implementation.
  - type: checkboxes
    id: duplicate-search
    attributes:
      label: Duplicate search
      options:
        - label: I searched open and closed issues and did not find an existing request
          required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this feature request, you agree to follow our [Code of Conduct](https://github.com/bunkerity/bunkerweb/blob/master/.github/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
