name: Check CICD secrets

# Start it with `git push origin dev:secrets-check`, read the run, then `git push origin --delete secrets-check`.
# It compares CICD_SECRETS with the candidate in CICD_SECRETS_NEXT and checks that every value works.
# All the logic lives in .github/scripts/secrets-check.sh; it only prints names, statuses, zones and dates.
on:
  push:
    branches: [secrets-check]
  workflow_dispatch:

permissions:
  contents: read

# Same group as STAGING: the check never runs while a release run holds the reserved IPs.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'bunkerity/bunkerweb'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Install the Scaleway CLI
        env:
          SCW_VERSION: "2.65.1"
          SCW_SHA256: b9ced8bc52c27baba76136a24e65a5e0abd53e9499edf02226513977d45da503
        run: |
          curl -fsSL -o /tmp/scw "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_VERSION}/scaleway-cli_${SCW_VERSION}_linux_amd64"
          echo "${SCW_SHA256}  /tmp/scw" | sha256sum -c -
          sudo install -m 0755 /tmp/scw /usr/local/bin/scw
      - name: Install dig
        run: command -v dig >/dev/null || sudo apt-get install -y --no-install-recommends dnsutils || sudo apt-get install -y --no-install-recommends bind9-dnsutils
      - name: Write the secrets to private files
        env:
          CICD_SECRETS: ${{ secrets.CICD_SECRETS }}
          CICD_SECRETS_NEXT: ${{ secrets.CICD_SECRETS_NEXT }}
          TEST_DOMAINS_DOCKER: ${{ secrets.TEST_DOMAINS_DOCKER }}
          TEST_DOMAINS_AUTOCONF: ${{ secrets.TEST_DOMAINS_AUTOCONF }}
          TEST_DOMAINS_KUBERNETES: ${{ secrets.TEST_DOMAINS_KUBERNETES }}
          TEST_DOMAINS_LINUX: ${{ secrets.TEST_DOMAINS_LINUX }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/secrets-check"
          mkdir -p "$dir/domains"
          printf '%s' "$CICD_SECRETS" >"$dir/live.env"
          if [ -n "$CICD_SECRETS_NEXT" ]; then printf '%s' "$CICD_SECRETS_NEXT" >"$dir/next.env"; fi
          for type in DOCKER AUTOCONF KUBERNETES LINUX; do
            name="TEST_DOMAINS_$type"
            printf '%s' "${!name}" >"$dir/domains/$name"
          done
      - name: Check the secrets
        run: |
          umask 077
          dir="$RUNNER_TEMP/secrets-check"
          : >"$dir/report.txt"
          args=(--live "$dir/live.env" --domains-dir "$dir/domains")
          if [ -s "$dir/next.env" ]; then args+=(--next "$dir/next.env"); fi
          # Every line goes to the log, so the runner processes the ::add-mask:: ones; report.txt gets none of them.
          set +e
          bash .github/scripts/secrets-check.sh "${args[@]}" | while IFS= read -r line || [ -n "$line" ]; do
            printf '%s\n' "$line"
            case $line in ::add-mask::*) ;; *) printf '%s\n' "$line" >>"$dir/report.txt" ;; esac
          done
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo '## Secrets check'
            echo '```'
            cat "$dir/report.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Remove the secret files
        if: always()
        run: |
          find "$RUNNER_TEMP/secrets-check" -type f -exec shred -u {} + || true
          rm -rf "$RUNNER_TEMP/secrets-check"
