name: Isolated two-worker end-to-end scenarios
on:
  push:
    branches: [audit/dev-e2e-20260916]
    paths: [.github/workflows/dev-e2e-runtime.yml, audit_runtime.py]
permissions:
  contents: read
  packages: read
concurrency:
  group: audit-runtime-scenarios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Execute isolated live-stack scenarios
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python3 -m py_compile audit_runtime.py
          python3 -u audit_runtime.py 2>&1 | tee audit-results/runtime-driver.log
      - name: Emergency cleanup of audit project only
        if: always()
        run: |
          if [ -f audit-results/compose.json ]; then
            docker compose --project-name bw-audit-runtime --file audit-results/compose.json down --volumes --remove-orphans || true
            rm -f audit-results/compose.json
          fi
          cp audit_runtime.py audit-results/
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-runtime-scenarios
          path: audit-results/
          retention-days: 1
          if-no-files-found: error
