name: Push packagecloud (REUSABLE)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      SEPARATOR:
        required: true
        type: string
      SUFFIX:
        required: true
        type: string
      REPO:
        required: true
        type: string
      LINUX:
        required: true
        type: string
      VERSION:
        required: true
        type: string
      PACKAGE:
        required: true
        type: string
      BW_VERSION:
        required: true
        type: string
      ARCH:
        required: true
        type: string
      PACKAGE_ARCH:
        required: true
        type: string
    secrets:
      PACKAGECLOUD_TOKEN:
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Prepare
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # pin every job in a run to one commit
          persist-credentials: false
      - name: Require a versioned package
        env:
          BW_VERSION: ${{ inputs.BW_VERSION }}
        run: |
          if [[ ! "$BW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([~_-](alpha|beta|rc)[0-9]*)?$ ]]; then
            echo "::error::Only published version numbers may be sent to packagecloud; floating packages are disabled."
            exit 1
          fi
      - name: Install ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.0"
      - name: Install packagecloud
        run: gem install package_cloud
      # Compute dynamic variables to remove per-distro duplication
      - name: Compute distribution & artifact names
        id: compute
        shell: bash
        run: |
          LINUX="${{ inputs.LINUX }}"
          VERSION="${{ inputs.VERSION }}"
          if [[ "$LINUX" =~ ^el-([0-9]+)$ ]]; then
            DIST="el/${BASH_REMATCH[1]}"
            ARTIFACT_NAME="package-rh${LINUX}-${{ inputs.PACKAGE_ARCH }}"
          elif [[ "$LINUX" == ubuntu-* ]]; then
            # Expect format ubuntu-<codename>
            CODENAME=${LINUX#ubuntu-}
            DIST="ubuntu/${CODENAME}"
            ARTIFACT_NAME="package-${LINUX}-${{ inputs.PACKAGE_ARCH }}"
          elif [[ "$LINUX" == fedora-* ]]; then
            FEDVER=${LINUX#fedora-}
            DIST="fedora/${FEDVER}"
            ARTIFACT_NAME="package-${LINUX}-${{ inputs.PACKAGE_ARCH }}"
          elif [[ "$LINUX" == debian-* ]]; then
            # Expect format debian-<codename>
            CODENAME=${LINUX#debian-}
            DIST="debian/${CODENAME}"
            ARTIFACT_NAME="package-${LINUX}-${{ inputs.PACKAGE_ARCH }}"
          else
            DIST="${LINUX}/${VERSION}"
            ARTIFACT_NAME="package-${LINUX}-${{ inputs.PACKAGE_ARCH }}"
          fi
          echo "DIST=$DIST" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "dist=$DIST" >> $GITHUB_OUTPUT
          echo "artifact=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
      # Download packages (single generic step)
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/${{ inputs.LINUX }}
      # Yank existing package (generic). Packagecloud stores the file under its
      # metadata-derived name, which on the dev/beta/alpha channels carries a -dev/-beta/-alpha
      # version the inputs don't — and RPM versions cannot hold a hyphen, so the
      # rpm channels store it as _dev/_beta/_alpha. Try every variant so a re-push never
      # collides.
      - name: Yank existing package
        run: |
          for V in "${{ inputs.BW_VERSION }}" "${{ inputs.BW_VERSION }}-dev" "${{ inputs.BW_VERSION }}-beta" "${{ inputs.BW_VERSION }}-alpha" "${{ inputs.BW_VERSION }}_dev" "${{ inputs.BW_VERSION }}_beta" "${{ inputs.BW_VERSION }}_alpha"; do
            package_cloud yank bunkerity/${{ inputs.REPO }}/${{ env.DIST }} "bunkerweb${{ inputs.SEPARATOR }}${V}${{ inputs.SEPARATOR }}${{ inputs.SUFFIX }}${{ inputs.PACKAGE_ARCH }}.${{ inputs.PACKAGE }}" || true
          done
        continue-on-error: true
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
      # Push package (single generic step)
      - name: Push package to packagecloud
        uses: danielmundi/upload-packagecloud@46cd0e61152bf952dbc0d1759e609d3d22649030 # v1
        with:
          PACKAGE-NAME: /tmp/${{ inputs.LINUX }}/*.${{ inputs.PACKAGE }}
          PACKAGECLOUD-USERNAME: bunkerity
          PACKAGECLOUD-REPO: ${{ inputs.REPO }}
          PACKAGECLOUD-DISTRIB: ${{ env.DIST }}
          PACKAGECLOUD-TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
      - name: Attest published package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/${{ inputs.LINUX }}/*.${{ inputs.PACKAGE }}
      - name: Record published package
        env:
          LINUX: ${{ inputs.LINUX }}
          PACKAGE: ${{ inputs.PACKAGE }}
          REPO: ${{ inputs.REPO }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/"$LINUX"/*."$PACKAGE")
          [ "${#files[@]}" -eq 1 ]
          mkdir inventory
          file=${files[0]}
          filename=$(basename "$file")
          # Packagecloud uses the metadata-derived DEB filename, not its upload name.
          if [ "$PACKAGE" = deb ]; then
            filename="$(dpkg-deb -f "$file" Package)_$(dpkg-deb -f "$file" Version)_$(dpkg-deb -f "$file" Architecture).deb"
          fi
          printf '%s  package\n' "$(sha256sum "$file" | cut -d ' ' -f1)" > inventory/package.sha256
          printf 'https://packagecloud.io/bunkerity/%s/packages/%s/%s/download.%s\n' "$REPO" "$DIST" "$filename" "$PACKAGE" > inventory/package.url
      - name: Upload package inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inventory-package-${{ inputs.LINUX }}-${{ inputs.ARCH }}
          path: inventory/
          if-no-files-found: error
