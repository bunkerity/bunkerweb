name: Isolated TLS and HTTP3 verification
on:
  push:
    branches: [audit/dev-e2e-20260916]
    paths: [.github/workflows/dev-e2e-tls.yml, audit_tls.py]
permissions:
  contents: read
  packages: read
concurrency:
  group: audit-tls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tls-and-mtls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install pinned HTTP3 client in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/audit-client"
          "$RUNNER_TEMP/audit-client/bin/pip" install aioquic==1.3.0
          mkdir -p audit-results
          "$RUNNER_TEMP/audit-client/bin/pip" freeze > audit-results/client-packages.txt
          curl --version > audit-results/curl-version.txt
      - name: Run real TLS and client-certificate scenarios
        run: |
          set -o pipefail
          "$RUNNER_TEMP/audit-client/bin/python" -m py_compile audit_tls.py audit_runtime.py audit_runtime_launch.py
          "$RUNNER_TEMP/audit-client/bin/python" -u audit_tls.py 2>&1 | tee audit-results/tls-driver.log
      - name: Emergency cleanup of audit project only
        if: always()
        run: |
          if [ -f audit-results/tls/compose.json ]; then
            docker compose --project-name bw-audit-runtime --file audit-results/tls/compose.json down --volumes --remove-orphans || true
            rm -f audit-results/tls/compose.json
          fi
          cp audit_tls.py audit_runtime*.py audit-results/
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-tls
          path: audit-results/
          retention-days: 1
          if-no-files-found: error
