name: Integration tests (REUSABLE)

# Ported from the 1.7 branch (bunkerity/bunkerweb-tests lineage) and adapted to 1.6. Differences, on purpose:
#   * action pins follow this repository's other workflows
#   * images are pulled under their `-tests` names, which is what container-build.yml pushes
#   * no worker image and no Swarm arm: 1.6 has neither a worker component nor the Swarm test arm
#   * the API image is pulled only for the `api` type, since a 1.6 stack has no API otherwise
#   * dependency install is scoped to tests/requirements.txt (a bare `find tests -name
#     "requirements*.txt"` would also drag in the unrelated tests/unit pytest set)

# Least privilege: `setup` only checks out and computes a matrix. `test` additionally logs in
# to ghcr to PULL the `-tests` images (it pushes nothing), so it alone gets `packages: read`.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      TYPE:
        required: true
        type: string
      TEST:
        required: true
        type: string
      RELEASE:
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.setup.outputs.integration }}
      architecture: ${{ steps.setup.outputs.architecture }}
      runs_on: ${{ steps.setup.outputs.runs_on }}
      specs: ${{ steps.setup.outputs.specs }}
      test: ${{ steps.setup.outputs.test }}
      linux_name: ${{ steps.setup.outputs.linux_name }}
      package: ${{ steps.setup.outputs.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set output variables
        id: setup
        env:
          INPUT_TEST: ${{ inputs.TEST }}
        run: |
          export INTEGRATION=$(echo "$INPUT_TEST" | cut -d ";" -f 1)
          echo "integration=${INTEGRATION//_/-}" >> $GITHUB_OUTPUT

          export ARCHITECTURE="$(echo "$INPUT_TEST" | cut -d ";" -f 2)"
          echo "architecture=$ARCHITECTURE" >> $GITHUB_OUTPUT

          export RUNS_ON="$(echo "$INPUT_TEST" | cut -d ";" -f 3)"
          export TEST="$(echo "$INPUT_TEST" | cut -d ";" -f 4-)"
          export SPECS=""
          if [[ "$TEST" == \[* ]]; then
            export SPECS="$RUNS_ON"
            export RUNS_ON="$(echo "$TEST" | cut -d ";" -f 1)"
            export TEST="$(echo "$TEST" | cut -d ";" -f 2-)"
          fi
          echo "runs_on=$RUNS_ON" >> $GITHUB_OUTPUT
          echo "specs=$SPECS" >> $GITHUB_OUTPUT
          echo "test=$TEST" >> $GITHUB_OUTPUT

          export LINUX_NAME=""
          export PACKAGE=""

          if [[ "$INTEGRATION" == "Linux" ]]; then
            pip install --require-hashes -r tests/requirements.txt
            python3 tests/parse_packages.py

            export NEEDRESTART_SUSPEND=1
            export DEBIAN_FRONTEND=noninteractive
            sudo apt install -y jq

            packages_info=$(cat /tmp/packages/packages_info.json)
            export LINUX_NAME="$(echo "$packages_info" | jq -r --arg specs "$SPECS" '.[$specs].name')"
            export PACKAGE="$(echo "$packages_info" | jq -r --arg specs "$SPECS" '.[$specs].package')"
          fi

          # `linux_name` doubles as the distro leg of linux-build.yml's matrix, and `architecture`
          # already carries the package-flavoured arch (x86_64/aarch64 for rpm, amd64/arm64 for
          # deb) — together they are the artefact name that job uploaded.
          echo "linux_name=$LINUX_NAME" >> $GITHUB_OUTPUT
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT

  test:
    permissions:
      contents: read
      packages: read # docker/login-action pulls the -tests images from ghcr
    needs: setup
    runs-on: ${{ fromJSON(needs.setup.outputs.runs_on) }}
    # The harness keeps every host path it bind-mounts under BW_TESTS_HOST_ROOT (default: a
    # directory inside the checkout, tests/scripts/utils.sh). A hosted runner is disposable, so
    # it keeps the real paths: "/" makes them /etc/bunkerweb, /var/www/html, /var/log/bunkerweb,
    # /var/lib/bunkerweb and /run/php, which is what "Setup configuration files" prepares and
    # what the Linux container below mounts. utils.sh derives the five from the root and would
    # do the same here; they are spelled out because "Run Linux container" runs
    # `docker compose` before the harness is ever sourced, and that compose file requires them.
    env:
      BW_TESTS_HOST_ROOT: /
      BW_TESTS_WWW: /var/www/html
      BW_TESTS_LOG: /var/log/bunkerweb
      BW_TESTS_LIB: /var/lib/bunkerweb
      BW_TESTS_PHP: /run/php
      BW_TESTS_ETC: /etc/bunkerweb
    steps:
      # Prepare
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The `*-tests:<RELEASE>` images pulled below were stamped by container-build.yml
      # ("Replace VERSION") and the Linux packages by linux-build.yml, so the
      # /usr/share/bunkerweb/VERSION inside every artifact under test is NOT this checkout's
      # src/VERSION. Stamp the checkout exactly the way the artifact was stamped.
      #
      # Only the rows where the two build workflows agree are mirrored: testing and dev map to
      # themselves in both. `ui` is stamped by linux-build.yml only (to the literal "ui"), so
      # stamping it here would break the Docker ui arm, whose images are not stamped at all.
      # Latent today: no ui spec asserts a version.
      - name: Replace VERSION
        if: inputs.RELEASE == 'testing' || inputs.RELEASE == 'dev'
        run: chmod +x ./misc/update-version.sh && ./misc/update-version.sh ${{ inputs.RELEASE }}
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Firefox manually and dependencies
        run: |
          export NEEDRESTART_SUSPEND=1
          export DEBIAN_FRONTEND=noninteractive

          # Import Mozilla Team PPA signing keys into dedicated keyrings (apt-key is
          # deprecated; fetch each key over HTTPS instead of the flaky HKP protocol).
          # The PPA dual-signs its release file with an old (2009) and a new (2024)
          # key while it rotates, so both are required. Keys are pinned by full
          # 160-bit fingerprint (64-bit IDs are collision-prone), fetched to a file
          # so curl failures surface instead of being masked by a pipe, and the
          # dearmored keyring is verified to actually contain the pinned fingerprint
          # before apt is allowed to trust it.
          sudo install -d -m 0755 /etc/apt/keyrings
          signed_by=""
          for fingerprint in 738BEB9321D1AAEC13EA9391AEBDF4819BE21867 \
                             0AB215679C571D1C8325275B9BDB3D89CE49EC21; do
            keyring="/etc/apt/keyrings/mozillateam-${fingerprint}.gpg"
            attempt=0
            until curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${fingerprint}&exact=on&options=mr" -o "key-${fingerprint}.asc" \
                  && [ -s "key-${fingerprint}.asc" ]; do
              attempt=$((attempt+1))
              if [ $attempt -ge 5 ]; then
                echo "::error::Failed to fetch Mozilla Team PPA key ${fingerprint} after $attempt attempts"
                exit 1
              fi
              echo "Retrying key fetch for ${fingerprint} (attempt $attempt)…"
              sleep 5
            done
            sudo gpg --batch --yes --dearmor -o "$keyring" "key-${fingerprint}.asc"
            rm -f "key-${fingerprint}.asc"
            if ! gpg --show-keys --with-colons "$keyring" | grep -qF ":${fingerprint}:"; then
              echo "::error::Fetched key does not match pinned fingerprint ${fingerprint}"
              exit 1
            fi
            signed_by="${signed_by:+${signed_by},}${keyring}"
          done
          echo "deb [signed-by=${signed_by}] https://ppa.launchpadcontent.net/mozillateam/ppa/ubuntu $(lsb_release -cs) main debug" | sudo tee /etc/apt/sources.list.d/mozillateam-ppa.list
          echo "deb-src [signed-by=${signed_by}] https://ppa.launchpadcontent.net/mozillateam/ppa/ubuntu $(lsb_release -cs) main debug" | sudo tee -a /etc/apt/sources.list.d/mozillateam-ppa.list
          sudo apt update -y

          sudo apt purge -y firefox
          echo '
          Package: *
          Pin: release o=LP-PPA-mozillateam
          Pin-Priority: 1001

          Package: firefox
          Pin: version 1:1snap1-0ubuntu5
          Pin-Priority: -1
          ' | sudo tee /etc/apt/preferences.d/mozilla-firefox

          sudo -E apt install --no-install-recommends -y \
            openssl git tar bzip2 wget curl grep libx11-xcb1 libappindicator3-1 \
            libasound2t64 libdbus-glib-1-2 libxtst6 libxt6 unzip firefox sed jq \
            dnsutils coreutils redis

          GECKODRIVER_VERSION=$(curl -sI https://github.com/mozilla/geckodriver/releases/latest \
            | grep -Po 'v[0-9]+\.[0-9]+\.[0-9]+')
          wget -O geckodriver.tar.gz \
            https://github.com/mozilla/geckodriver/releases/download/${GECKODRIVER_VERSION}/geckodriver-${GECKODRIVER_VERSION}-linux64.tar.gz
          sudo tar -xzf geckodriver.tar.gz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/geckodriver
          rm -f geckodriver.tar.gz
      - name: Login to ghcr
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute Minikube resources
        # `cpus: max` / `memory: max` make minikube claim 100% of the runner's RAM,
        # leaving no headroom for the host. On small runners this can make
        # the kic node container fail to provision (minikube exit code 80). Instead,
        # auto-discover the runner's resources and reserve overhead, so the same
        # config works on any flavor without hardcoding the VM size.
        if: needs.setup.outputs.integration == 'Kubernetes'
        id: mk_resources
        run: |
          total_mem_mb=$(free -m | awk '/^Mem:/{print $2}')
          # Reserve 25% of RAM (min 2048 MB) for the host/microVM OS.
          reserve=$(( total_mem_mb / 4 ))
          [ "$reserve" -lt 2048 ] && reserve=2048
          mk_mem=$(( total_mem_mb - reserve ))
          # minikube needs ~1800 MB minimum; floor it.
          [ "$mk_mem" -lt 2200 ] && mk_mem=2200
          mk_cpus=$(nproc)
          # Leave one core for the host, but minikube requires at least 2 CPUs.
          [ "$mk_cpus" -ge 3 ] && mk_cpus=$(( mk_cpus - 1 ))
          [ "$mk_cpus" -lt 2 ] && mk_cpus=2
          echo "cpus=${mk_cpus}" >> "$GITHUB_OUTPUT"
          echo "memory=${mk_mem}mb" >> "$GITHUB_OUTPUT"
          echo "Computed minikube resources: cpus=${mk_cpus} memory=${mk_mem}mb (total=${total_mem_mb}mb, reserved=${reserve}mb)"
      - name: Compute Minikube ports
        if: needs.setup.outputs.integration == 'Kubernetes'
        id: mk_ports
        run: |
          args="$(bash tests/scripts/minikube-ports.sh)"
          [ -n "$args" ] || { echo "::error::minikube-ports.sh produced no --ports flags"; exit 1; }
          printf 'args=%s\n' "$args" >> "$GITHUB_OUTPUT"
      - name: Set up Minikube
        if: needs.setup.outputs.integration == 'Kubernetes'
        uses: medyagh/setup-minikube@cea33675329b799adccc9526aa5daccc26cd5052 # v0.0.19
        with:
          driver: "docker"
          cpus: "${{ steps.mk_resources.outputs.cpus }}"
          memory: "${{ steps.mk_resources.outputs.memory }}"
          wait: "all"
          addons: "registry,storage-provisioner,default-storageclass"
          listen-address: "127.0.0.1"
          insecure-registry: "10.0.0.0/24"
          start-args: "--embed-certs --disable-metrics --disable-optimizations ${{ steps.mk_ports.outputs.args }}"
      - name: Minikube diagnostics on failure
        # Logs for failed runs are purged quickly; capture minikube/host state inline
        # so an exit-80 (or later) failure is diagnosable without re-running.
        if: failure() && needs.setup.outputs.integration == 'Kubernetes'
        run: |
          echo "::group::Host resources"; free -h; nproc; echo "::endgroup::"
          echo "::group::Minikube logs"; minikube logs --file=- 2>&1 | tail -300 || true; echo "::endgroup::"
          echo "::group::Docker state"; docker ps -a; echo "::endgroup::"
      # The package to install is the one `linux-build.yml` built earlier in this same run and
      # uploaded as `package-<distro>-<arch>` — the artefact push-packagecloud.yml already ships
      # from. `tests/linux/Dockerfile-<distro>` is a bare systemd runtime with no package in it,
      # so the package is staged next to the checkout and copied into the container below.
      - name: Download the Linux package
        if: needs.setup.outputs.integration == 'Linux'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ needs.setup.outputs.linux_name }}-${{ needs.setup.outputs.architecture }}
          path: linux-package
      - name: Stage the Linux package
        if: needs.setup.outputs.integration == 'Linux'
        env:
          PACKAGE: ${{ needs.setup.outputs.package }}
        run: |
          # package.sh names the file after the version it stamped, and every step below installs
          # `bunkerweb.${PACKAGE}` — so glob the artefact instead of rebuilding that name here.
          mapfile -t packages < <(find linux-package -maxdepth 1 -type f -name "*.${PACKAGE}")
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .${PACKAGE} in the package artefact, found ${#packages[@]}"
            find linux-package -maxdepth 1 -type f
            exit 1
          fi
          mv "${packages[0]}" "bunkerweb.${PACKAGE}"
      - name: Build Linux image
        if: needs.setup.outputs.integration == 'Linux'
        env:
          LINUX_NAME: ${{ needs.setup.outputs.linux_name }}
        run: docker build -t local/bunkerweb-linux -f "tests/linux/Dockerfile-${LINUX_NAME}" .
      # Images are published by container-build.yml under their `-tests` names; the
      # framework's stacks reference bunkerity/<image>:${BW_VERSION}, hence the retag.
      - name: Pull BW docker image
        if: needs.setup.outputs.integration == 'Docker' || needs.setup.outputs.integration == 'Autoconf' || needs.setup.outputs.integration == 'Kubernetes'
        run: docker pull ghcr.io/bunkerity/bunkerweb-tests:${{ inputs.RELEASE }} && docker tag ghcr.io/bunkerity/bunkerweb-tests:${{ inputs.RELEASE }} bunkerity/bunkerweb:tests
      - name: Pull Scheduler docker image
        if: needs.setup.outputs.integration == 'Docker' || needs.setup.outputs.integration == 'Autoconf' || needs.setup.outputs.integration == 'Kubernetes'
        run: docker pull ghcr.io/bunkerity/scheduler-tests:${{ inputs.RELEASE }} && docker tag ghcr.io/bunkerity/scheduler-tests:${{ inputs.RELEASE }} bunkerity/bunkerweb-scheduler:tests
      # A 1.6 stack runs the API service only for the `api` type.
      - name: Pull API docker image
        if: inputs.TYPE == 'api' && (needs.setup.outputs.integration == 'Docker' || needs.setup.outputs.integration == 'Autoconf' || needs.setup.outputs.integration == 'Kubernetes')
        run: docker pull ghcr.io/bunkerity/api-tests:${{ inputs.RELEASE }} && docker tag ghcr.io/bunkerity/api-tests:${{ inputs.RELEASE }} bunkerity/bunkerweb-api:tests
      - name: Pull UI docker image
        if: inputs.TYPE == 'ui' && (needs.setup.outputs.integration == 'Docker' || needs.setup.outputs.integration == 'Autoconf' || needs.setup.outputs.integration == 'Kubernetes')
        run: docker pull ghcr.io/bunkerity/ui-tests:${{ inputs.RELEASE }} && docker tag ghcr.io/bunkerity/ui-tests:${{ inputs.RELEASE }} bunkerity/bunkerweb-ui:tests
      - name: Pull Autoconf docker image
        if: needs.setup.outputs.integration == 'Autoconf' || needs.setup.outputs.integration == 'Kubernetes'
        run: docker pull ghcr.io/bunkerity/autoconf-tests:${{ inputs.RELEASE }} && docker tag ghcr.io/bunkerity/autoconf-tests:${{ inputs.RELEASE }} bunkerity/bunkerweb-autoconf:tests
      - name: Pull All-in-one docker image
        if: needs.setup.outputs.integration == 'All-in-one'
        run: docker pull ghcr.io/bunkerity/all-in-one-tests:${{ inputs.RELEASE }} && docker tag ghcr.io/bunkerity/all-in-one-tests:${{ inputs.RELEASE }} bunkerity/bunkerweb-all-in-one:tests
      - name: Setup configuration files
        run: |
          sudo chmod +x ./tests/scripts/*.sh
          # Create the host directories the harness mounts (BW_TESTS_* above); the harness itself
          # runs unprivileged and could not create the last three.
          sudo mkdir -p /etc/bunkerweb /var/www/html /var/log/bunkerweb /var/lib/bunkerweb /run/php
          sudo chown -R root:101 /etc/bunkerweb
          sudo cp tests/misc/index.php tests/misc/logo.png /var/www/html/
          grep '127.0.0.1 .*\.example\.com' "tests/misc/conf/dnsmasq.hosts" | awk '{print $2}' | while read -r hostname; do
            sudo mkdir -p "/var/www/html/${hostname}"
            sudo cp tests/misc/index.php tests/misc/logo.png "/var/www/html/${hostname}/"
          done
          sudo chown -R 33:101 /var/www/html
          sudo chmod -R 777 /etc/bunkerweb /var/www/html
          # Stop redis-server
          sudo systemctl disable --now redis-server
      - name: Edit /etc/resolv.conf file
        if: needs.setup.outputs.integration != 'Kubernetes'
        run: |
          sudo systemctl disable --now systemd-resolved
          echo -e "nameserver 127.0.0.1\nnameserver 9.9.9.9\nnameserver 8.8.8.8\nnameserver 8.8.4.4" | sudo tee /etc/resolv.conf
      - name: Add hosts to /etc/hosts file
        if: needs.setup.outputs.integration == 'Kubernetes'
        run: cat tests/misc/conf/dnsmasq.hosts | sudo tee -a /etc/hosts
      - name: Run Linux container
        if: needs.setup.outputs.integration == 'Linux'
        run: docker compose -f tests/linux/docker-compose.yml up -d
      - name: Install deb file
        if: needs.setup.outputs.integration == 'Linux' && (needs.setup.outputs.linux_name == 'ubuntu' || needs.setup.outputs.linux_name == 'ubuntu-noble' || needs.setup.outputs.linux_name == 'ubuntu-jammy' || needs.setup.outputs.linux_name == 'debian-bookworm' || needs.setup.outputs.linux_name == 'debian-trixie')
        env:
          PACKAGE: ${{ needs.setup.outputs.package }}
          TYPE: ${{ inputs.TYPE }}
        run: |
          docker cp "bunkerweb.${PACKAGE}" "bunkerweb-linux:/opt/bunkerweb.${PACKAGE}"
          if [ "$TYPE" != "ui" ]; then
            docker exec -e UI_WIZARD=no -u 0 bunkerweb-linux apt install -y /opt/bunkerweb.deb
          else
            docker exec -u 0 bunkerweb-linux apt install -y /opt/bunkerweb.deb
          fi
      - name: Install rpm file
        if: needs.setup.outputs.integration == 'Linux' && (needs.setup.outputs.linux_name == 'fedora-43' || needs.setup.outputs.linux_name == 'fedora-44' || needs.setup.outputs.linux_name == 'rhel-8' || needs.setup.outputs.linux_name == 'rhel-9' || needs.setup.outputs.linux_name == 'rhel-10')
        env:
          PACKAGE: ${{ needs.setup.outputs.package }}
          TYPE: ${{ inputs.TYPE }}
        run: |
          docker cp "bunkerweb.${PACKAGE}" "bunkerweb-linux:/opt/bunkerweb.${PACKAGE}"
          if [ "$TYPE" != "ui" ]; then
            docker exec -e UI_WIZARD=no -u 0 bunkerweb-linux dnf install -y /opt/bunkerweb.rpm
          else
            docker exec -u 0 bunkerweb-linux dnf install -y /opt/bunkerweb.rpm
          fi
      # `generate.py` runs as the unprivileged runner and writes the stack's env files straight
      # into this directory, which is the same inode as the container's /etc/bunkerweb (bind
      # mount, tests/linux/docker-compose.yml). The `chmod -R 777` in "Setup configuration files"
      # happens BEFORE the package is installed, and the two package formats disagree about what
      # an install does to a directory that already exists — measured on 2026-08-25 against a
      # throwaway package shipping the directory at 0755, pre-created at 0777:
      #
      #   dpkg 1.22.6 / 1.21.1 / 1.21.23  ->  0777 kept   (only the postinst's chown lands)
      #   rpm 6.0.2                       ->  0755 root-owned, and the runner is then refused
      #                                        both `unlink()` and creating a new file
      #
      # So the deb arm this workflow runs today is fine and the rpm arms are not: `api.env` does
      # not exist until the API service first starts, so writing it needs the DIRECTORY, not just
      # the file — which is what `run.sh`'s per-action `chmod 777 variables.env` cannot give.
      # Restoring the mode here keeps the harness independent of that difference.
      - name: Make /etc/bunkerweb writable again after the package install
        if: needs.setup.outputs.integration == 'Linux'
        run: docker exec -u 0 bunkerweb-linux chmod 777 /etc/bunkerweb
      - name: Install Python dependencies
        run: |
          export MAKEFLAGS="-j $(nproc)"
          pip install --break-system-packages --no-cache-dir --require-hashes -r tests/requirements.txt
      - name: Install Tools
        run: |
          tools=$(jq -r '.[]' tests/utils/tools.json)
          for tool in $tools; do
            echo "Installing $tool..."
            sudo apt-get install -y $tool
          done
      - name: Run test
        env:
          INTEGRATION: ${{ needs.setup.outputs.integration }}
          TYPE: ${{ inputs.TYPE }}
          RELEASE: ${{ inputs.RELEASE }}
          TEST: ${{ needs.setup.outputs.test }}
          IN_CICD: "1"
          # tests/scripts/before/latest_stable.py: authenticated GitHub API (1000 req/h per repo) instead
          # of the 60 req/h per-IP budget every hosted runner shares.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./tests/scripts/*.sh
          if [ -n "${{ runner.debug }}" ] && [ "${{ runner.debug }}" -eq 1 ] ; then
            export DEBUG=1
          fi
          ./tests/scripts/test.sh "$INTEGRATION" "$TYPE" "$RELEASE" "$TEST"
      - name: Add error image annotation
        if: inputs.TYPE == 'ui' && failure() && hashFiles('error.png') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: error-screenshot-${{ inputs.TEST }}
          path: error.png
