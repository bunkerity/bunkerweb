name: Release (tag push)

permissions: read-all

on:
  push:
    tags: ["v*"]

# One shared ARM VM and one shared image cache namespace: every release run
# serializes. Never cancel, a half-published release must finish or be aborted
# by hand.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # scorecards-analysis:
  #   uses: ./.github/workflows/scorecards-analysis.yml

  # Derive the channel from the tag and refuse a tag that does not add up.
  # Everything else hangs off this job, so a bad tag costs seconds, not a build.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.derive.outputs.version }}
      versionrpm: ${{ steps.derive.outputs.versionrpm }}
      channel: ${{ steps.derive.outputs.channel }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
      hidden: ${{ steps.derive.outputs.hidden }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Derive channel and version from the tag
        id: derive
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < src/VERSION)"

          # Guard 1 - the tag must match src/VERSION at the tagged commit,
          # otherwise every image and package ships under the wrong version.
          EXPECTED="v${VERSION//\~/-}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::tag $TAG does not match src/VERSION ($VERSION); expected $EXPECTED"
            exit 1
          fi

          # Guard 2 - annotated tags only. A lightweight tag records no tagger,
          # so nothing links the release to a human, and there is no tag object
          # to carry a signature.
          TAG_REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          OBJ_TYPE="$(printf '%s' "$TAG_REF" | jq -r '.object.type')"
          OBJ_SHA="$(printf '%s' "$TAG_REF" | jq -r '.object.sha')"
          if [ "$OBJ_TYPE" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -s"
            exit 1
          fi

          # Guard 3 - the tag must carry a signature GitHub can verify against a
          # key on the signer's account. The tag is what authorises the publish;
          # unsigned, it proves nothing about who asked for the release.
          VERIF="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}" --jq '"\(.verification.verified) \(.verification.reason)"')"
          if [ "${VERIF%% *}" != "true" ]; then
            echo "::error::$TAG is not signed by a verifiable key (${VERIF#* }); create it with git tag -s"
            exit 1
          fi

          # Guard 4 - never republish. A force-pushed tag would otherwise
          # overwrite published images with different bits under one version.
          # Only an explicit 404 means absent. A 403, a rate limit or a network
          # blip must not be read as permission to republish.
          if REL_ERR="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --silent 2>&1)"; then
            echo "::error::a GitHub release already exists for $TAG; refusing to republish"
            exit 1
          elif ! printf '%s' "$REL_ERR" | grep -q 'HTTP 404'; then
            echo "::error::cannot determine whether a release exists for $TAG: $REL_ERR"
            exit 1
          fi

          # Guard 5 - push-github.yml builds the release body from this section
          # and fails silently (empty body) when it is missing.
          # Exact match on the version token: "^## v1.6.15" also accepts
          # "## v1.6.150", and the dots are regex wildcards.
          if ! awk -v want="v${VERSION}" '$1 == "##" && $2 == want { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v${VERSION}' section"
            exit 1
          fi

          case "$TAG" in
            *-rc*)   CHANNEL=rc     ; PRERELEASE=true  ; HIDDEN=true  ;;
            *-beta*) CHANNEL=beta   ; PRERELEASE=true  ; HIDDEN=false ;;
            *)       CHANNEL=latest ; PRERELEASE=false ; HIDDEN=false ;;
          esac

          {
            echo "version=$VERSION"
            echo "versionrpm=${VERSION//-/_}"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "hidden=$HIDDEN"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing \`$VERSION\` on the \`$CHANNEL\` channel, from signed tag \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"

  plumber:
    needs: [prepare]
    uses: ./.github/workflows/plumber.yml
    permissions:
      contents: read
      security-events: write
      id-token: write

  codeql:
    needs: [prepare]
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # Build amd64 + 386 containers images
  build-containers:
    needs: [prepare]
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload
    strategy:
      fail-fast: false # keep all legs running so every image uploads its Trivy SARIF even when one gates red
      matrix:
        image: [bunkerweb, scheduler, autoconf, ui, api, all-in-one]
        arch: [linux/amd64, linux/386]
        include:
          - cache: false
            push: false
          - image: bunkerweb
            dockerfile: src/bw/Dockerfile
          - image: scheduler
            dockerfile: src/scheduler/Dockerfile
          - image: autoconf
            dockerfile: src/autoconf/Dockerfile
          - image: ui
            dockerfile: src/ui/Dockerfile
          - image: api
            dockerfile: src/api/Dockerfile
          - image: all-in-one
            dockerfile: src/all-in-one/Dockerfile
          - arch: linux/amd64
            cache_suffix: amd64
          - arch: linux/386
            cache_suffix: "386"
    uses: ./.github/workflows/container-build.yml
    with:
      RELEASE: ${{ needs.prepare.outputs.channel }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      CACHE: ${{ matrix.cache }}
      PUSH: ${{ matrix.push }}
      CACHE_SUFFIX: ${{ matrix.cache_suffix }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  # Create ARM environment
  create-arm:
    needs: [prepare]
    uses: ./.github/workflows/create-arm.yml
    secrets:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      ARM_SSH_KEY: ${{ secrets.ARM_SSH_KEY }}
      ARM_SSH_CONFIG: ${{ secrets.ARM_SSH_CONFIG }}

  # Build arm64 + arm/v7 images
  build-containers-arm:
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload
    needs: [prepare, create-arm]
    strategy:
      matrix:
        image: [bunkerweb, scheduler, autoconf, ui, api, all-in-one]
        arch: [linux/arm64, linux/arm/v7]
        include:
          - cache: false
            push: false
          - image: bunkerweb
            dockerfile: src/bw/Dockerfile
          - image: scheduler
            dockerfile: src/scheduler/Dockerfile
          - image: autoconf
            dockerfile: src/autoconf/Dockerfile
          - image: ui
            dockerfile: src/ui/Dockerfile
          - image: api
            dockerfile: src/api/Dockerfile
          - image: all-in-one
            dockerfile: src/all-in-one/Dockerfile
          - arch: linux/arm64
            cache_suffix: arm64
          - arch: linux/arm/v7
            cache_suffix: armv7
    uses: ./.github/workflows/container-build.yml
    with:
      RELEASE: ${{ needs.prepare.outputs.channel }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      CACHE: ${{ matrix.cache }}
      PUSH: ${{ matrix.push }}
      CACHE_SUFFIX: ${{ matrix.cache_suffix }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      ARM_SSH_KEY: ${{ secrets.ARM_SSH_KEY }}
      ARM_SSH_IP: ${{ needs.create-arm.outputs.ip }}
      ARM_SSH_CONFIG: ${{ secrets.ARM_SSH_CONFIG }}

  # Build Linux packages
  build-packages:
    permissions:
      contents: read
      packages: write
    needs: [prepare, create-arm]
    strategy:
      matrix:
        linux:
          [
            ubuntu,
            debian-bookworm,
            debian-trixie,
            fedora-43,
            fedora-44,
            rhel-8,
            rhel-9,
            rhel-10,
            ubuntu-noble,
            ubuntu-jammy,
          ]
        platforms: [linux/amd64, linux/arm64]
        include:
          - linux: ubuntu
            package: deb
          - linux: ubuntu-noble
            package: deb
          - linux: debian-bookworm
            package: deb
          - linux: debian-trixie
            package: deb
          - linux: fedora-43
            package: rpm
          - linux: fedora-44
            package: rpm
          - linux: rhel-8
            package: rpm
          - linux: rhel-9
            package: rpm
          - linux: rhel-10
            package: rpm
          - linux: ubuntu-jammy
            package: deb
    uses: ./.github/workflows/linux-build.yml
    with:
      RELEASE: ${{ needs.prepare.outputs.channel }}
      LINUX: ${{ matrix.linux }}
      PACKAGE: ${{ matrix.package }}
      TEST: false
      PLATFORMS: ${{ matrix.platforms }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      ARM_SSH_KEY: ${{ secrets.ARM_SSH_KEY }}
      ARM_SSH_IP: ${{ needs.create-arm.outputs.ip }}
      ARM_SSH_CONFIG: ${{ secrets.ARM_SSH_CONFIG }}

  # Publication gate. `environment:` is not allowed on a job that calls a
  # reusable workflow, so this plain job carries it and everything that
  # publishes hangs off it. It sits after every build and the Trivy hard gate,
  # so you only ever approve something already green.
  #
  # The `release` environment MUST exist with required reviewers. If it does
  # not, GitHub creates an unprotected one on the fly and this gate passes
  # without stopping.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    needs:
      [
        prepare,
        plumber,
        codeql,
        build-containers,
        build-containers-arm,
        build-packages,
      ]
    steps:
      - name: Approved
        run: |
          echo "Publishing \`${{ needs.prepare.outputs.version }}\` to the \`${{ needs.prepare.outputs.channel }}\` channel." >> "$GITHUB_STEP_SUMMARY"

  # Push Docker images
  push-images:
    permissions:
      contents: read
      packages: write
    needs: [prepare, create-arm, push-gh]
    strategy:
      matrix:
        image:
          [
            bunkerweb,
            bunkerweb-scheduler,
            bunkerweb-autoconf,
            bunkerweb-ui,
            bunkerweb-api,
            bunkerweb-all-in-one,
          ]
        include:
          - image: bunkerweb
            cache_from: bunkerweb
            dockerfile: src/bw/Dockerfile
          - image: bunkerweb-scheduler
            cache_from: scheduler
            dockerfile: src/scheduler/Dockerfile
          - image: bunkerweb-autoconf
            cache_from: autoconf
            dockerfile: src/autoconf/Dockerfile
          - image: bunkerweb-ui
            cache_from: ui
            dockerfile: src/ui/Dockerfile
          - image: bunkerweb-api
            cache_from: api
            dockerfile: src/api/Dockerfile
          - image: bunkerweb-all-in-one
            cache_from: all-in-one
            dockerfile: src/all-in-one/Dockerfile
    uses: ./.github/workflows/push-docker.yml
    with:
      IMAGE: ${{ matrix.image }}
      TAGS: bunkerity/${{ matrix.image }}:${{ needs.prepare.outputs.channel }},bunkerity/${{ matrix.image }}:${{ needs.prepare.outputs.version }},ghcr.io/bunkerity/${{ matrix.image }}:${{ needs.prepare.outputs.channel }},ghcr.io/bunkerity/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
      CACHE_FROM: ${{ matrix.cache_from }}-${{ needs.prepare.outputs.channel }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      ARM_SSH_KEY: ${{ secrets.ARM_SSH_KEY }}
      ARM_SSH_IP: ${{ needs.create-arm.outputs.ip }}
      ARM_SSH_CONFIG: ${{ secrets.ARM_SSH_CONFIG }}

  # Push Linux packages
  push-packages:
    needs: [prepare, push-gh]
    strategy:
      matrix:
        linux:
          [
            ubuntu,
            debian-bookworm,
            debian-trixie,
            fedora-43,
            fedora-44,
            el-8,
            el-9,
            el-10,
            ubuntu-noble,
            ubuntu-jammy,
          ]
        arch: [amd64, arm64]
        include:
          - repo: bunkerweb
          - linux: ubuntu
            separator: _
            suffix: ""
            version: resolute
            package: deb
          - linux: ubuntu-noble
            separator: _
            suffix: ""
            version: noble
            package: deb
          - linux: debian-bookworm
            separator: _
            suffix: ""
            version: bookworm
            package: deb
          - linux: debian-trixie
            separator: _
            suffix: ""
            version: trixie
            package: deb
          - linux: fedora-43
            separator: "-"
            suffix: "1."
            version: 43
            package: rpm
          - linux: fedora-44
            separator: "-"
            suffix: "1."
            version: 44
            package: rpm
          - linux: el-8
            separator: "-"
            suffix: "1."
            version: 8
            package: rpm
          - linux: el-9
            separator: "-"
            suffix: "1."
            version: 9
            package: rpm
          - linux: el-10
            separator: "-"
            suffix: "1."
            version: 10
            package: rpm
          - linux: ubuntu-jammy
            separator: _
            suffix: ""
            version: jammy
            package: deb
          - linux: ubuntu
            arch: amd64
            package_arch: amd64
          - linux: ubuntu-noble
            arch: amd64
            package_arch: amd64
          - linux: debian-bookworm
            arch: amd64
            package_arch: amd64
          - linux: debian-trixie
            arch: amd64
            package_arch: amd64
          - linux: fedora-43
            arch: amd64
            package_arch: x86_64
          - linux: fedora-44
            arch: amd64
            package_arch: x86_64
          - linux: el-8
            arch: amd64
            package_arch: x86_64
          - linux: el-9
            arch: amd64
            package_arch: x86_64
          - linux: el-10
            arch: amd64
            package_arch: x86_64
          - linux: ubuntu-jammy
            arch: amd64
            package_arch: amd64
          - linux: ubuntu
            arch: arm64
            package_arch: arm64
          - linux: ubuntu-noble
            arch: arm64
            package_arch: arm64
          - linux: debian-bookworm
            arch: arm64
            package_arch: arm64
          - linux: debian-trixie
            arch: arm64
            package_arch: arm64
          - linux: fedora-43
            arch: arm64
            package_arch: aarch64
          - linux: fedora-44
            arch: arm64
            package_arch: aarch64
          - linux: el-8
            arch: arm64
            package_arch: aarch64
          - linux: el-9
            arch: arm64
            package_arch: aarch64
          - linux: el-10
            arch: arm64
            package_arch: aarch64
          - linux: ubuntu-jammy
            arch: arm64
            package_arch: arm64
    uses: ./.github/workflows/push-packagecloud.yml
    with:
      SEPARATOR: ${{ matrix.separator }}
      SUFFIX: ${{ matrix.suffix }}
      REPO: ${{ matrix.repo }}
      LINUX: ${{ matrix.linux }}
      VERSION: ${{ matrix.version }}
      PACKAGE: ${{ matrix.package }}
      BW_VERSION: ${{ matrix.package == 'rpm' && needs.prepare.outputs.versionrpm || needs.prepare.outputs.version }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      ARCH: ${{ matrix.arch }}
    secrets:
      PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

  # Create doc PDF
  doc-pdf:
    needs: [prepare, gate]
    uses: ./.github/workflows/doc-to-pdf.yml
    with:
      VERSION: ${{ needs.prepare.outputs.version }}

  # Push on GH
  push-gh:
    needs: [prepare, doc-pdf]
    permissions:
      contents: write
      discussions: write
    uses: ./.github/workflows/push-github.yml
    with:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease == 'true' }}

  # Push doc
  push-doc:
    needs: [prepare, push-images, push-packages]
    permissions:
      contents: write
    uses: ./.github/workflows/push-doc.yml
    with:
      VERSION: ${{ needs.prepare.outputs.version }}
      ALIAS: ${{ needs.prepare.outputs.channel }}
      HIDDEN: ${{ needs.prepare.outputs.hidden == 'true' }}
    secrets:
      BUNKERBOT_TOKEN: ${{ secrets.BUNKERBOT_TOKEN }}

  # Remove ARM VM
  rm-arm:
    # `always()` alone also fires when `prepare` rejected the tag and create-arm
    # never ran, which deletes an empty ARM_ID and fails noisily.
    if: ${{ always() && needs.create-arm.outputs.id != '' }}
    needs: [create-arm, push-images, build-packages]
    uses: ./.github/workflows/rm-arm.yml
    secrets:
      ARM_ID: ${{ needs.create-arm.outputs.id }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
