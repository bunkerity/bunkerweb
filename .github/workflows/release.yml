name: Release (tag push)

permissions: read-all

on:
  push:
    tags: ["v*"]

# One shared ARM VM and staging infrastructure: every release/staging run
# serializes. Never cancel, a half-published release must finish or be aborted
# by hand.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # scorecards-analysis:
  #   uses: ./.github/workflows/scorecards-analysis.yml

  # Derive the channel from the tag and refuse a tag that does not add up.
  # Everything else hangs off this job, so a bad tag costs seconds, not a build.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # draft releases are only visible to callers with push access; this job only reads
      actions: read # inspect release environment protection
    outputs:
      version: ${{ steps.derive.outputs.version }}
      versionrpm: ${{ steps.derive.outputs.versionrpm }}
      channel: ${{ steps.derive.outputs.channel }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
      hidden: ${{ steps.derive.outputs.hidden }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Derive channel and version from the tag
        id: derive
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < src/VERSION)"

          # Guard 1 - the tag must match src/VERSION at the tagged commit,
          # otherwise every image and package ships under the wrong version.
          EXPECTED="v${VERSION//\~/-}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::tag $TAG does not match src/VERSION ($VERSION); expected $EXPECTED"
            exit 1
          fi

          # Guard 2 - annotated tags only. A lightweight tag records no tagger,
          # so nothing links the release to a human, and there is no tag object
          # to carry a signature.
          TAG_REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          OBJ_TYPE="$(printf '%s' "$TAG_REF" | jq -r '.object.type')"
          OBJ_SHA="$(printf '%s' "$TAG_REF" | jq -r '.object.sha')"
          if [ "$OBJ_TYPE" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -s"
            exit 1
          fi

          # Guard 3 - the tag must carry a signature GitHub can verify against a
          # key on the signer's account. The tag is what authorises the publish;
          # unsigned, it proves nothing about who asked for the release.
          TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}")"
          VERIF="$(printf '%s' "$TAG_OBJECT" | jq -r '"\(.verification.verified) \(.verification.reason)"')"
          if [ "${VERIF%% *}" != "true" ]; then
            echo "::error::$TAG is not signed by a verifiable key (${VERIF#* }); create it with git tag -s"
            exit 1
          fi

          echo "signed tag target $(printf '%s' "$TAG_OBJECT" | jq -r '.object.sha') vs GITHUB_SHA ${GITHUB_SHA}"
          if ! printf '%s' "$TAG_OBJECT" | jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' >/dev/null; then
            echo "::error::signed tag target differs from the triggering commit"
            exit 1
          fi

          # Guard 4 - include drafts: a draft can already own partially published
          # artifacts. Never rebuild after any release has claimed this version.
          if ! gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -e --arg tag "$TAG" 'type == "array" and all(.[]; type == "array") and all(.[][]; (.tag_name | type) == "string" and .tag_name != $tag)' >/dev/null; then
            echo "::error::release $TAG already exists (including drafts), or its absence cannot be verified"
            exit 1
          fi

          # Guard 5 - push-github.yml builds the release body from this section
          # and fails silently (empty body) when it is missing.
          # Exact match on the version token: "^## v1.6.15" also accepts
          # "## v1.6.150", and the dots are regex wildcards.
          if ! awk -v want="v${VERSION}" '$1 == "##" && $2 == want { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v${VERSION}' section"
            exit 1
          fi

          # GitHub otherwise silently creates missing environments without protection. Self-review
          # is accepted as long as every required reviewer is one of the release owners.
          gh api "repos/${GITHUB_REPOSITORY}/environments/release" |
            jq -e '.name == "release" and any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0 and all(.reviewers[]; .type == "User" and (.reviewer.login | IN("TheophileDiot", "fl0ppy-d1sk"))))' >/dev/null

          case "$TAG" in
            *-rc*)   CHANNEL=rc     ; PRERELEASE=true  ; HIDDEN=true  ;;
            *-beta*) CHANNEL=beta   ; PRERELEASE=true  ; HIDDEN=false ;;
            *)       CHANNEL=latest ; PRERELEASE=false ; HIDDEN=false ;;
          esac

          {
            echo "version=$VERSION"
            echo "versionrpm=${VERSION//-/_}"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "hidden=$HIDDEN"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing \`$VERSION\` on the \`$CHANNEL\` channel, from signed tag \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"

  plumber:
    needs: [prepare]
    uses: ./.github/workflows/plumber.yml
    permissions:
      contents: read
      security-events: write
      id-token: write

  codeql:
    needs: [prepare]
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # Build amd64 + 386 containers images
  build-containers:
    needs: [prepare]
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload
    strategy:
      fail-fast: false # keep all legs running so every image uploads its Trivy SARIF even when one gates red
      matrix:
        image: [bunkerweb, scheduler, autoconf, ui, api, all-in-one]
        arch: [linux/amd64, linux/386]
        include:
          - cache: false
            push: false
          - image: bunkerweb
            dockerfile: src/bw/Dockerfile
          - image: scheduler
            dockerfile: src/scheduler/Dockerfile
          - image: autoconf
            dockerfile: src/autoconf/Dockerfile
          - image: ui
            dockerfile: src/ui/Dockerfile
          - image: api
            dockerfile: src/api/Dockerfile
          - image: all-in-one
            dockerfile: src/all-in-one/Dockerfile
          - arch: linux/amd64
            cache_suffix: amd64
          - arch: linux/386
            cache_suffix: "386"
    uses: ./.github/workflows/container-build.yml
    with:
      RELEASE: ${{ needs.prepare.outputs.channel }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      CACHE: ${{ matrix.cache }}
      PUSH: ${{ matrix.push }}
      CACHE_SUFFIX: ${{ matrix.cache_suffix }}
      CANDIDATE: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  # Create ARM environment
  create-arm:
    needs: [prepare]
    uses: ./.github/workflows/create-arm.yml
    secrets:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      ARM_SSH_KEY: ${{ secrets.ARM_SSH_KEY }}
      ARM_SSH_CONFIG: ${{ secrets.ARM_SSH_CONFIG }}

  # Build arm64 + arm/v7 images
  build-containers-arm:
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload
    needs: [prepare, create-arm]
    strategy:
      fail-fast: false
      matrix:
        image: [bunkerweb, scheduler, autoconf, ui, api, all-in-one]
        arch: [linux/arm64, linux/arm/v7]
        include:
          - cache: false
            push: false
          - image: bunkerweb
            dockerfile: src/bw/Dockerfile
          - image: scheduler
            dockerfile: src/scheduler/Dockerfile
          - image: autoconf
            dockerfile: src/autoconf/Dockerfile
          - image: ui
            dockerfile: src/ui/Dockerfile
          - image: api
            dockerfile: src/api/Dockerfile
          - image: all-in-one
            dockerfile: src/all-in-one/Dockerfile
          - arch: linux/arm64
            cache_suffix: arm64
          - arch: linux/arm/v7
            cache_suffix: armv7
    uses: ./.github/workflows/container-build.yml
    with:
      RELEASE: ${{ needs.prepare.outputs.channel }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      CACHE: ${{ matrix.cache }}
      PUSH: ${{ matrix.push }}
      CACHE_SUFFIX: ${{ matrix.cache_suffix }}
      CANDIDATE: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      ARM_SSH_KEY: ${{ secrets.ARM_SSH_KEY }}
      ARM_SSH_IP: ${{ needs.create-arm.outputs.ip }}
      ARM_SSH_CONFIG: ${{ secrets.ARM_SSH_CONFIG }}

  # Build Linux packages
  build-packages:
    permissions:
      contents: read
      packages: write
    needs: [prepare, create-arm]
    strategy:
      matrix:
        linux:
          [
            ubuntu,
            debian-bookworm,
            debian-trixie,
            fedora-43,
            fedora-44,
            rhel-8,
            rhel-9,
            rhel-10,
            ubuntu-noble,
            ubuntu-jammy,
          ]
        platforms: [linux/amd64, linux/arm64]
        include:
          - linux: ubuntu
            package: deb
          - linux: ubuntu-noble
            package: deb
          - linux: debian-bookworm
            package: deb
          - linux: debian-trixie
            package: deb
          - linux: fedora-43
            package: rpm
          - linux: fedora-44
            package: rpm
          - linux: rhel-8
            package: rpm
          - linux: rhel-9
            package: rpm
          - linux: rhel-10
            package: rpm
          - linux: ubuntu-jammy
            package: deb
    uses: ./.github/workflows/linux-build.yml
    with:
      RELEASE: ${{ needs.prepare.outputs.channel }}
      LINUX: ${{ matrix.linux }}
      PACKAGE: ${{ matrix.package }}
      TEST: false
      CANDIDATE: true
      PLATFORMS: ${{ matrix.platforms }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      ARM_SSH_KEY: ${{ secrets.ARM_SSH_KEY }}
      ARM_SSH_IP: ${{ needs.create-arm.outputs.ip }}
      ARM_SSH_CONFIG: ${{ secrets.ARM_SSH_CONFIG }}

  # Candidate registry tags are internal transport only. The manifest pins the
  # assembled indexes and every platform/package before any integration runs.
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare, build-containers, build-containers-arm, build-packages]
    permissions:
      contents: read
      packages: write
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*
          path: receipts
          merge-multiple: true
      - name: Assemble final indexes and manifest
        id: manifest
        run: |
          python3 .github/scripts/release_artifacts.py assemble --directory receipts
          sha256sum release-manifest.json > release-manifest.json.sha256
          echo "sha256=$(cut -d ' ' -f 1 release-manifest.json.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: release-manifest.json*
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  create-infras:
    needs: [candidates]
    strategy:
      fail-fast: false
      matrix:
        type: [docker, autoconf, k8s, linux]
    uses: ./.github/workflows/staging-create-infra.yml
    with:
      TYPE: ${{ matrix.type }}
    secrets:
      CICD_SECRETS: ${{ secrets.CICD_SECRETS }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

  staging-tests:
    needs: [candidates, create-infras]
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: docker
            runs_on: '["self-hosted", "bw-docker"]'
          - type: autoconf
            runs_on: '["self-hosted", "bw-autoconf"]'
          - type: k8s
            runs_on: '["ubuntu-latest"]'
          - type: linux
            runs_on: '["self-hosted", "bw-linux"]'
            platform: linux/amd64
    uses: ./.github/workflows/staging-tests.yml
    with:
      TYPE: ${{ matrix.type }}
      RUNS_ON: ${{ matrix.runs_on }}
      MANIFEST_SHA256: ${{ needs.candidates.outputs.manifest_sha256 }}
      PLATFORM: ${{ matrix.platform || '' }}
    secrets:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      PRIVATE_REGISTRY: ${{ secrets.PRIVATE_REGISTRY }}
      ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      TEST_DOMAINS_DOCKER: ${{ secrets.TEST_DOMAINS_DOCKER }}
      TEST_DOMAINS_AUTOCONF: ${{ secrets.TEST_DOMAINS_AUTOCONF }}
      TEST_DOMAINS_KUBERNETES: ${{ secrets.TEST_DOMAINS_KUBERNETES }}
      TEST_DOMAINS_LINUX: ${{ secrets.TEST_DOMAINS_LINUX }}

  # arm64 packages run through QEMU and take several times longer than native ones. They get
  # their own job, and their own 360-minute ceiling, after the native suites so the shared Linux
  # test infrastructure and test domains are never used by two jobs at once.
  staging-tests-arm64:
    needs: [candidates, create-infras, staging-tests]
    uses: ./.github/workflows/staging-tests.yml
    with:
      TYPE: linux
      RUNS_ON: '["self-hosted", "bw-linux"]'
      MANIFEST_SHA256: ${{ needs.candidates.outputs.manifest_sha256 }}
      PLATFORM: linux/arm64
    secrets:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      PRIVATE_REGISTRY: ${{ secrets.PRIVATE_REGISTRY }}
      ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      TEST_DOMAINS_DOCKER: ${{ secrets.TEST_DOMAINS_DOCKER }}
      TEST_DOMAINS_AUTOCONF: ${{ secrets.TEST_DOMAINS_AUTOCONF }}
      TEST_DOMAINS_KUBERNETES: ${{ secrets.TEST_DOMAINS_KUBERNETES }}
      TEST_DOMAINS_LINUX: ${{ secrets.TEST_DOMAINS_LINUX }}

  smoke-images:
    needs: [candidates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/386, linux/arm64, linux/arm/v7]
    env:
      MANIFEST_SHA256: ${{ needs.candidates.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Start all six candidate images
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 .github/scripts/release_smoke.py "$PLATFORM"

  validate-tests:
    if: ${{ always() }}
    needs:
      [
        prepare,
        plumber,
        codeql,
        candidates,
        staging-tests,
        staging-tests-arm64,
        smoke-images,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
      - name: Require every candidate gate to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MANIFEST_SHA256: ${{ needs.candidates.outputs.manifest_sha256 }}
        run: python3 .github/scripts/release_artifacts.py gate

  delete-infras:
    if: ${{ always() }}
    needs: [create-infras, staging-tests]
    strategy:
      fail-fast: false
      matrix:
        type: [docker, autoconf, k8s]
    uses: ./.github/workflows/staging-delete-infra.yml
    with:
      TYPE: ${{ matrix.type }}
    secrets:
      CICD_SECRETS: ${{ secrets.CICD_SECRETS }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

  # The Linux test infrastructure is shared by both Linux test jobs, so it is torn down last.
  delete-infras-linux:
    if: ${{ always() }}
    needs: [create-infras, staging-tests, staging-tests-arm64]
    uses: ./.github/workflows/staging-delete-infra.yml
    with:
      TYPE: linux
    secrets:
      CICD_SECRETS: ${{ secrets.CICD_SECRETS }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

  # Required reviewers on the existing release environment approve only tested
  # candidates. Every public image/package/GitHub/docs publication descends here.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    needs: [prepare, validate-tests]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Recheck release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/release" |
            jq -e '.name == "release" and any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0 and all(.reviewers[]; .type == "User" and (.reviewer.login | IN("TheophileDiot", "fl0ppy-d1sk"))))' >/dev/null
      - name: Recheck signed tag target before publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(printf '%s' "$TAG_REF" | jq -r '.object.type')" = tag
          OBJ_SHA="$(printf '%s' "$TAG_REF" | jq -r '.object.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}" |
            jq -e --arg sha "$GITHUB_SHA" '.verification.verified == true and .object.type == "commit" and .object.sha == $sha' >/dev/null
      - name: Approved
        run: |
          echo "Publishing \`${{ needs.prepare.outputs.version }}\` to the \`${{ needs.prepare.outputs.channel }}\` channel." >> "$GITHUB_STEP_SUMMARY"

  # Push Docker images
  push-images:
    permissions:
      contents: read
      packages: write
    needs: [prepare, candidates, push-gh]
    strategy:
      matrix:
        image:
          [
            bunkerweb,
            bunkerweb-scheduler,
            bunkerweb-autoconf,
            bunkerweb-ui,
            bunkerweb-api,
            bunkerweb-all-in-one,
          ]
        include:
          - image: bunkerweb
            source: bunkerweb
          - image: bunkerweb-scheduler
            source: scheduler
          - image: bunkerweb-autoconf
            source: autoconf
          - image: bunkerweb-ui
            source: ui
          - image: bunkerweb-api
            source: api
          - image: bunkerweb-all-in-one
            source: all-in-one
    uses: ./.github/workflows/push-docker.yml
    with:
      IMAGE: ${{ matrix.source }}
      TAGS: bunkerity/${{ matrix.image }}:${{ needs.prepare.outputs.channel }},bunkerity/${{ matrix.image }}:${{ needs.prepare.outputs.version }},ghcr.io/bunkerity/${{ matrix.image }}:${{ needs.prepare.outputs.channel }},ghcr.io/bunkerity/${{ matrix.image }}:${{ needs.prepare.outputs.version }},registry.gitlab.com/bunkerity/bunkerweb/${{ matrix.image }}:${{ needs.prepare.outputs.channel }},registry.gitlab.com/bunkerity/bunkerweb/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
      MANIFEST_SHA256: ${{ needs.push-gh.outputs.manifest_sha256 }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      GITLAB_REGISTRY_USER: ${{ secrets.GITLAB_REGISTRY_USER }}
      GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}

  # Push Linux packages
  push-packages:
    needs: [prepare, candidates, push-gh]
    strategy:
      matrix:
        linux:
          [
            ubuntu,
            debian-bookworm,
            debian-trixie,
            fedora-43,
            fedora-44,
            el-8,
            el-9,
            el-10,
            ubuntu-noble,
            ubuntu-jammy,
          ]
        arch: [amd64, arm64]
        include:
          - repo: bunkerweb
          - linux: ubuntu
            separator: _
            suffix: ""
            version: resolute
            package: deb
          - linux: ubuntu-noble
            separator: _
            suffix: ""
            version: noble
            package: deb
          - linux: debian-bookworm
            separator: _
            suffix: ""
            version: bookworm
            package: deb
          - linux: debian-trixie
            separator: _
            suffix: ""
            version: trixie
            package: deb
          - linux: fedora-43
            separator: "-"
            suffix: "1."
            version: 43
            package: rpm
          - linux: fedora-44
            separator: "-"
            suffix: "1."
            version: 44
            package: rpm
          - linux: el-8
            separator: "-"
            suffix: "1."
            version: 8
            package: rpm
          - linux: el-9
            separator: "-"
            suffix: "1."
            version: 9
            package: rpm
          - linux: el-10
            separator: "-"
            suffix: "1."
            version: 10
            package: rpm
          - linux: ubuntu-jammy
            separator: _
            suffix: ""
            version: jammy
            package: deb
          - linux: ubuntu
            arch: amd64
            package_arch: amd64
          - linux: ubuntu-noble
            arch: amd64
            package_arch: amd64
          - linux: debian-bookworm
            arch: amd64
            package_arch: amd64
          - linux: debian-trixie
            arch: amd64
            package_arch: amd64
          - linux: fedora-43
            arch: amd64
            package_arch: x86_64
          - linux: fedora-44
            arch: amd64
            package_arch: x86_64
          - linux: el-8
            arch: amd64
            package_arch: x86_64
          - linux: el-9
            arch: amd64
            package_arch: x86_64
          - linux: el-10
            arch: amd64
            package_arch: x86_64
          - linux: ubuntu-jammy
            arch: amd64
            package_arch: amd64
          - linux: ubuntu
            arch: arm64
            package_arch: arm64
          - linux: ubuntu-noble
            arch: arm64
            package_arch: arm64
          - linux: debian-bookworm
            arch: arm64
            package_arch: arm64
          - linux: debian-trixie
            arch: arm64
            package_arch: arm64
          - linux: fedora-43
            arch: arm64
            package_arch: aarch64
          - linux: fedora-44
            arch: arm64
            package_arch: aarch64
          - linux: el-8
            arch: arm64
            package_arch: aarch64
          - linux: el-9
            arch: arm64
            package_arch: aarch64
          - linux: el-10
            arch: arm64
            package_arch: aarch64
          - linux: ubuntu-jammy
            arch: arm64
            package_arch: arm64
    uses: ./.github/workflows/push-packagecloud.yml
    with:
      SEPARATOR: ${{ matrix.separator }}
      SUFFIX: ${{ matrix.suffix }}
      REPO: ${{ matrix.repo }}
      LINUX: ${{ matrix.linux }}
      VERSION: ${{ matrix.version }}
      PACKAGE: ${{ matrix.package }}
      BW_VERSION: ${{ matrix.package == 'rpm' && needs.prepare.outputs.versionrpm || needs.prepare.outputs.version }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      ARCH: ${{ matrix.arch }}
      MANIFEST_SHA256: ${{ needs.push-gh.outputs.manifest_sha256 }}
    secrets:
      PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

  # Create doc PDF
  doc-pdf:
    needs: [prepare, gate]
    uses: ./.github/workflows/doc-to-pdf.yml
    with:
      VERSION: ${{ needs.prepare.outputs.version }}

  # Push on GH
  push-gh:
    needs: [prepare, candidates, doc-pdf]
    permissions:
      contents: write
      discussions: write
      actions: read # verify the original publisher failed before resuming a claim
    uses: ./.github/workflows/push-github.yml
    with:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease == 'true' }}
      MANIFEST_SHA256: ${{ needs.candidates.outputs.manifest_sha256 }}

  # Push doc
  push-doc:
    needs: [prepare, push-images, push-packages]
    permissions:
      contents: write
    uses: ./.github/workflows/push-doc.yml
    with:
      VERSION: ${{ needs.prepare.outputs.version }}
      ALIAS: ${{ needs.prepare.outputs.channel }}
      HIDDEN: ${{ needs.prepare.outputs.hidden == 'true' }}
    secrets:
      BUNKERBOT_TOKEN: ${{ secrets.BUNKERBOT_TOKEN }}

  # Remove ARM VM
  rm-arm:
    # `always()` alone also fires when `prepare` rejected the tag and create-arm
    # never ran, which deletes an empty ARM_ID and fails noisily.
    if: ${{ always() && needs.create-arm.outputs.id != '' }}
    needs: [create-arm, build-containers-arm, build-packages]
    uses: ./.github/workflows/rm-arm.yml
    secrets:
      ARM_ID: ${{ needs.create-arm.outputs.id }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
