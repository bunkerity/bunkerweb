name: Perform staging tests (REUSABLE — no test gate)

# The legacy integration harness this workflow drove (`tests/main.py` and the `*Test.py`
# classes) was deleted. Every *integration* it covered is now a spec under `tests/core/`, run
# by `.github/workflows/integration-tests.yml` from the dev pipelines — but that is a trade,
# not parity. This arm ran 4 example scenarios across 10 distros; the framework runs 40 core
# Linux specs against ubuntu/noble alone, because all four `parse.py` callers pass `--dev` and
# the 9 distro rows in `integrations.yml`'s `staging:` block have no caller at all. It also
# tested released artifacts against real domains with real Let's Encrypt certificates on
# staging infrastructure, which no dev pipeline does. See `tests/README.md`.
#
# DECIDE BEFORE THE NEXT PUSH TO `staging` OR `fix-cve`. As it stands, such a push provisions
# four cloud infrastructures with self-hosted runners, runs this five-second echo, destroys
# them, and then `push-images` and `push-packages` publish eight images to Docker Hub and ghcr
# and ten distro packages to packagecloud with NO integration gate in front of them.
#
# This file is kept, and kept callable with the same inputs and secrets, only so `staging.yml`'s
# `uses:` and the `needs: [staging-tests]` of `delete-infras`, `push-images` and `push-packages`
# stay valid. It annotates every run instead of passing silently.
#
# Two ways out, both the PO's call, neither in scope for the deletion:
#   1. drop the `staging-tests` job from `staging.yml`. Either keep the infra jobs and repoint
#      those three `needs:` at `create-infras`, or — since the infras existed only to host this
#      arm — delete `staging-create-infra.yml` and `staging-delete-infra.yml` too and repoint
#      at `[codeql, build-containers, build-packages]`;
#   2. port the staging arm to `integration-tests.yml`, which means `staging.yml` growing the
#      `parse.py` matrix step the dev pipelines already have, and a caller for the `staging:`
#      block. This is the only option that recovers the distro spread and the real-domain
#      coverage rather than accepting their loss.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      # Both inputs are unused while there is no gate. They stay declared because
      # `staging.yml` passes them and `required: true` is part of the existing contract.
      TYPE:
        required: true
        type: string
      RUNS_ON:
        required: true
        type: string
    secrets:
      # Same reason: `staging.yml` passes all seven, and a secret passed to a reusable
      # workflow that does not declare it is a hard error.
      SECRET_KEY:
        required: false
      PRIVATE_REGISTRY:
        required: false
      ROOT_DOMAIN:
        required: false
      TEST_DOMAINS_DOCKER:
        required: false
      TEST_DOMAINS_AUTOCONF:
        required: false
      TEST_DOMAINS_KUBERNETES:
        required: false
      TEST_DOMAINS_LINUX:
        required: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: No staging test gate
        env:
          TYPE: ${{ inputs.TYPE }}
        run: |
          echo "::warning title=No staging test gate::The legacy harness was deleted and the staging arm ($TYPE) has not been ported to integration-tests.yml, so nothing is tested here. See the header of .github/workflows/staging-tests.yml."
