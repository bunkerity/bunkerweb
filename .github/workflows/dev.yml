name: Automatic tests (DEV)

permissions: read-all

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  # Containers
  build-containers:
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        image: [bunkerweb, scheduler, bwcli, autoconf, ui, api, all-in-one]
        include:
          - image: bunkerweb
            dockerfile: src/bw/Dockerfile
          - image: scheduler
            dockerfile: src/scheduler/Dockerfile
          - image: bwcli
            dockerfile: src/scheduler/Dockerfile
            target: bwcli
          - image: autoconf
            dockerfile: src/autoconf/Dockerfile
          - image: ui
            dockerfile: src/ui/Dockerfile
          - image: api
            dockerfile: src/api/Dockerfile
          - image: all-in-one
            dockerfile: src/all-in-one/Dockerfile
    uses: ./.github/workflows/container-build.yml
    with:
      RELEASE: dev
      ARCH: linux/amd64
      CACHE: true
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      TARGET: ${{ matrix.target }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  # Build Linux packages
  build-packages:
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        linux:
          [
            ubuntu,
            debian-bookworm,
            debian-trixie,
            fedora-43,
            fedora-44,
            rhel-8,
            rhel-9,
            rhel-10,
            ubuntu-noble,
            ubuntu-jammy,
          ]
        include:
          - linux: ubuntu
            package: deb
          - linux: ubuntu-noble
            package: deb
          - linux: ubuntu-jammy
            package: deb
          - linux: debian-bookworm
            package: deb
          - linux: debian-trixie
            package: deb
          - linux: fedora-43
            package: rpm
          - linux: fedora-44
            package: rpm
          - linux: rhel-8
            package: rpm
          - linux: rhel-9
            package: rpm
          - linux: rhel-10
            package: rpm
    uses: ./.github/workflows/linux-build.yml
    with:
      RELEASE: dev
      LINUX: ${{ matrix.linux }}
      PACKAGE: ${{ matrix.package }}
      TEST: true
      PLATFORMS: linux/amd64
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # Integration tests — the framework lives in tests/ since the migration from
  # bunkerity/bunkerweb-tests, so specs and product are validated at the same SHA.
  parse-tests-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: parse_tests
        name: Parse core tests
        run: |
          pip install --require-hashes -r tests/requirements.txt
          python3 tests/parse.py "core" --dev
          echo "Linux_tests=$(cat /tmp/tests/Linux_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "Docker_tests=$(cat /tmp/tests/Docker_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "Autoconf_tests=$(cat /tmp/tests/Autoconf_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "Kubernetes_tests=$(cat /tmp/tests/Kubernetes_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "All_in_one_tests=$(cat /tmp/tests/All_in_one_tests.json || echo "[]")" >> $GITHUB_OUTPUT
    outputs:
      Linux_tests: ${{ steps.parse_tests.outputs.Linux_tests }}
      Docker_tests: ${{ steps.parse_tests.outputs.Docker_tests }}
      Autoconf_tests: ${{ steps.parse_tests.outputs.Autoconf_tests }}
      Kubernetes_tests: ${{ steps.parse_tests.outputs.Kubernetes_tests }}
      All_in_one_tests: ${{ steps.parse_tests.outputs.All_in_one_tests }}

  run-Docker-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Docker_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: dev

  run-Autoconf-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Autoconf_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: dev

  run-Linux-tests-core:
    needs: [build-packages, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Linux_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: dev

  run-Kubernetes-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Kubernetes_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: dev

  run-All-in-one-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.All_in_one_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: dev

  # Push with dev tag
  push-dev:
    needs:
      [
        build-containers,
        run-Docker-tests-core,
        run-Autoconf-tests-core,
        run-Linux-tests-core,
        run-Kubernetes-tests-core,
        run-All-in-one-tests-core,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - from: bunkerweb
            to: bunkerweb
          - from: scheduler
            to: bunkerweb-scheduler
          - from: autoconf
            to: bunkerweb-autoconf
          - from: ui
            to: bunkerweb-ui
          - from: api
            to: bunkerweb-api
          - from: all-in-one
            to: bunkerweb-all-in-one
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Login to ghcr
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push ${{ matrix.image.from }} to ${{ matrix.image.to }}
        run: docker pull ghcr.io/bunkerity/${{ matrix.image.from }}-tests:dev && docker tag ghcr.io/bunkerity/${{ matrix.image.from }}-tests:dev bunkerity/${{ matrix.image.to }}:dev && docker tag ghcr.io/bunkerity/${{ matrix.image.from }}-tests:dev ghcr.io/bunkerity/${{ matrix.image.to }}:dev && docker push bunkerity/${{ matrix.image.to }}:dev && docker push ghcr.io/bunkerity/${{ matrix.image.to }}:dev

  # Push Linux packages
  push-packages:
    # needs: [tests-ui-linux, tests-core-linux] # TODO: Uncomment when tests are back
    needs: [build-packages]
    strategy:
      matrix:
        linux:
          [
            ubuntu,
            debian-bookworm,
            debian-trixie,
            fedora-43,
            fedora-44,
            el-8,
            el-9,
            el-10,
            ubuntu-noble,
            ubuntu-jammy,
          ]
        arch: [amd64]
        include:
          - release: dev
            repo: bunkerweb
          - linux: ubuntu
            package_arch: amd64
            separator: _
            suffix: ""
            version: resolute
            package: deb
          - linux: debian-bookworm
            package_arch: amd64
            separator: _
            suffix: ""
            version: bookworm
            package: deb
          - linux: debian-trixie
            package_arch: amd64
            separator: _
            suffix: ""
            version: trixie
            package: deb
          - linux: fedora-43
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 43
            package: rpm
          - linux: fedora-44
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 44
            package: rpm
          - linux: el-8
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 8
            package: rpm
          - linux: el-9
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 9
            package: rpm
          - linux: el-10
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 10
            package: rpm
          - linux: ubuntu-noble
            package_arch: amd64
            separator: _
            suffix: ""
            version: noble
            package: deb
          - linux: ubuntu-jammy
            package_arch: amd64
            separator: _
            suffix: ""
            version: jammy
            package: deb
    uses: ./.github/workflows/push-packagecloud.yml
    with:
      SEPARATOR: ${{ matrix.separator }}
      SUFFIX: ${{ matrix.suffix }}
      REPO: ${{ matrix.repo }}
      LINUX: ${{ matrix.linux }}
      VERSION: ${{ matrix.version }}
      PACKAGE: ${{ matrix.package }}
      BW_VERSION: ${{ matrix.release }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      ARCH: ${{ matrix.arch }}
    secrets:
      PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
