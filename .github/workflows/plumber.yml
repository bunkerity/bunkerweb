name: Plumber CI/CD security scan

on:
  push:
    branches: [master, dev, 1.7]
  pull_request:
  schedule:
    - cron: "30 9 * * 1"

permissions: read-all

jobs:
  plumber:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write # OIDC identity required by score-push
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Run Plumber
        uses: getplumber/plumber@56369e7d43c4878049ee8ec6c2d600c21af45c4e # v0.4.40
        with:
          verify-attestation: true
          config-file: .github/plumber/plumber.yaml
          min-score: C
          soft-fail: true
          upload-sarif: true
          # Never publish from a pull_request: a fork PR gets a read-only token and no OIDC
          # identity, so the push errors, and a same-repo PR would publish a score computed on
          # unmerged branch code to the public badge.
          score-push: ${{ github.event_name != 'pull_request' }}
          upload-artifacts: true
