name: Automatic tests (UI)

permissions: read-all

on:
  push:
    branches: [ui]

jobs:
  # Containers
  build-containers:
    permissions:
      contents: read
      packages: write
      security-events: write # container-build.yml uploads the Trivy SARIF
    strategy:
      matrix:
        image: [bunkerweb, scheduler, ui]
        include:
          - image: bunkerweb
            dockerfile: src/bw/Dockerfile
          - image: scheduler
            dockerfile: src/scheduler/Dockerfile
          - image: ui
            dockerfile: src/ui/Dockerfile
    uses: ./.github/workflows/container-build.yml
    with:
      RELEASE: ui
      CACHE: true
      ARCH: linux/amd64
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  # Build Linux packages
  build-packages:
    permissions:
      contents: read
    strategy:
      matrix:
        linux: [ubuntu]
        include:
          - linux: ubuntu
            package: deb
    uses: ./.github/workflows/linux-build.yml
    with:
      RELEASE: ui
      LINUX: ${{ matrix.linux }}
      PACKAGE: ${{ matrix.package }}
      PLATFORMS: linux/amd64
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # UI tests — driven by the framework's ui specs (tests/ui/*.yml) since the migration
  # from bunkerity/bunkerweb-tests. The old matrix walked tests/ui/*_page.py, which the
  # retired harness owned.
  parse-tests-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: parse_tests
        name: Parse ui tests
        run: |
          pip install --require-hashes -r tests/requirements.txt
          python3 tests/parse.py "ui" --dev
          echo "Docker_tests=$(cat /tmp/tests/Docker_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "Linux_tests=$(cat /tmp/tests/Linux_tests.json || echo "[]")" >> $GITHUB_OUTPUT
    outputs:
      Docker_tests: ${{ steps.parse_tests.outputs.Docker_tests }}
      Linux_tests: ${{ steps.parse_tests.outputs.Linux_tests }}

  run-Docker-tests-ui:
    needs: [parse-tests-ui, build-containers]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-ui.outputs.Docker_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: ui
      TEST: ${{ matrix.test }}
      RELEASE: ui

  run-Linux-tests-ui:
    needs: [parse-tests-ui, build-packages]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-ui.outputs.Linux_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: ui
      TEST: ${{ matrix.test }}
      RELEASE: ui
