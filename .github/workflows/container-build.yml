name: Build container (REUSABLE)

permissions:
  contents: read
  packages: write
  security-events: write

on:
  workflow_call:
    inputs:
      RELEASE:
        required: true
        type: string
      ARCH:
        required: true
        type: string
      IMAGE:
        required: true
        type: string
      DOCKERFILE:
        required: true
        type: string
      CACHE:
        required: false
        type: boolean
        default: true
      PUSH:
        required: false
        type: boolean
        default: true
      CACHE_SUFFIX:
        required: false
        type: string
        default: ""
      CANDIDATE:
        description: Unique release run identifier; export final bits for testing and promotion
        required: false
        type: string
        default: ""
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true
      ARM_SSH_KEY:
        required: false
      ARM_SSH_IP:
        required: false
      ARM_SSH_CONFIG:
        required: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      # Prepare
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # pin every job in a run to one commit
          persist-credentials: false
      - name: Replace VERSION
        if: inputs.RELEASE == 'testing' || inputs.RELEASE == 'dev'
        run: chmod +x ./misc/update-version.sh && ./misc/update-version.sh ${{ inputs.RELEASE }}
      - name: Replace VERSION 1.5
        if: inputs.RELEASE == '1.5'
        run: chmod +x ./misc/update-version.sh && ./misc/update-version.sh dev
      - name: Setup SSH for ARM node
        if: startsWith(inputs.CACHE_SUFFIX, 'arm')
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa_arm
          chmod 600 ~/.ssh/id_rsa_arm
          echo "$SSH_CONFIG" | sed "s/SSH_IP/$SSH_IP/g" > ~/.ssh/config
          # Enhanced keepalive and timeout settings for long-running builds
          cat >> ~/.ssh/config << 'EOF'
          ServerAliveInterval 15
          ServerAliveCountMax 20
          TCPKeepAlive yes
          ConnectTimeout 30
          ConnectionAttempts 3
          ControlMaster auto
          ControlPath ~/.ssh/control-%C
          ControlPersist 1h
          StrictHostKeyChecking no
          EOF
        env:
          SSH_KEY: ${{ secrets.ARM_SSH_KEY }}
          SSH_IP: ${{ secrets.ARM_SSH_IP }}
          SSH_CONFIG: ${{ secrets.ARM_SSH_CONFIG }}
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: startsWith(inputs.CACHE_SUFFIX, 'arm') == false
      - name: Setup Buildx (ARM)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: startsWith(inputs.CACHE_SUFFIX, 'arm')
        with:
          endpoint: ssh://root@arm
          platforms: linux/arm64,linux/arm/v7
      - name: Login to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Login to ghcr
        if: inputs.PUSH == true || inputs.CANDIDATE != ''
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Compute metadata
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: bunkerity/${{ inputs.IMAGE }}
      # Build cached image
      - name: Build image
        if: inputs.CACHE == true && inputs.CANDIDATE == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.DOCKERFILE }}
          platforms: ${{ inputs.ARCH }}
          load: true
          tags: local/${{ inputs.IMAGE }}
          cache-from: type=registry,ref=docker.io/bunkerity/bw-images-cache:${{ inputs.IMAGE }}-${{ inputs.RELEASE }}
          cache-to: type=registry,ref=docker.io/bunkerity/bw-images-cache:${{ inputs.IMAGE }}-${{ inputs.RELEASE }},mode=max
          labels: ${{ steps.meta.outputs.labels }}
        env:
          DOCKER_BUILD_SUMMARY: "false" # skip the docker/build-push-action job summary; Trivy publishes its own
      # Build non-cached image
      - name: Build image
        if: inputs.CACHE != true && inputs.CANDIDATE == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.DOCKERFILE }}
          platforms: ${{ inputs.ARCH }}
          load: ${{ startsWith(inputs.CACHE_SUFFIX, 'arm') == false }}
          tags: local/${{ inputs.IMAGE }}
          cache-to: type=registry,ref=docker.io/bunkerity/bw-images-cache:${{ inputs.IMAGE }}-${{ inputs.RELEASE }}-${{ inputs.CACHE_SUFFIX }},mode=max
          labels: ${{ steps.meta.outputs.labels }}
        env:
          DOCKER_BUILD_SUMMARY: "false" # skip the docker/build-push-action job summary; Trivy publishes its own
      - name: Build final candidate image
        if: inputs.CANDIDATE != ''
        id: candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.DOCKERFILE }}
          platforms: ${{ inputs.ARCH }}
          tags: ghcr.io/bunkerity/${{ inputs.IMAGE }}-tests:${{ inputs.CANDIDATE }}-${{ inputs.CACHE_SUFFIX }}
          # The candidate index is what gets promoted byte for byte, so its layers must be
          # pullable everywhere: Docker Hub refuses tar+zstd, and older clients cannot read it.
          outputs: type=registry,oci-mediatypes=true
          provenance: true
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
        env:
          DOCKER_BUILD_SUMMARY: "false"
      - name: Select exact image for scanning
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ inputs.IMAGE }}
          CANDIDATE: ${{ inputs.CANDIDATE }}
        run: |
          if [ -n "$CANDIDATE" ]; then
            test -n "$DIGEST"
            echo "SCAN_REF=ghcr.io/bunkerity/$IMAGE-tests@$DIGEST" >> "$GITHUB_ENV"
          else
            echo "SCAN_REF=local/$IMAGE" >> "$GITHUB_ENV"
          fi
      # Install Trivy ourselves instead of through aquasecurity/trivy-action: the action fetches its installer
      # and the binary at run time, in the job that holds the registry credentials. This step downloads one
      # release asset and refuses it unless its sha256 equals the pin below. Every scan step runs on the
      # x86-64 runner (an ARM image is scanned from the registry), so only the Linux-64bit asset is needed.
      - name: Install Trivy
        id: trivy
        if: ${{ inputs.CANDIDATE != '' || startsWith(inputs.CACHE_SUFFIX, 'arm') == false }}
        env:
          TRIVY_VERSION: 0.70.0
          # sha256 of trivy_0.70.0_Linux-64bit.tar.gz; also the release asset digest and the subject of its GitHub build attestation.
          # To bump: change both values together, then `gh attestation verify <archive> -R aquasecurity/trivy`.
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/trivy-bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/trivy-bin/trivy" --version
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # Same DB cache the action kept: one vulnerability DB download shared by the parallel image jobs
      - name: Restore Trivy DB cache
        if: ${{ inputs.CANDIDATE != '' || startsWith(inputs.CACHE_SUFFIX, 'arm') == false }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.trivy.outputs.date }}
          restore-keys: cache-trivy-
      # Check vulnerabilities with Trivy — SARIF report (non-blocking, feeds the GitHub Security tab)
      - name: Trivy scan (SARIF)
        if: ${{ inputs.CANDIDATE != '' || startsWith(inputs.CACHE_SUFFIX, 'arm') == false }}
        run: trivy image "$SCAN_REF"
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          TRIVY_SCANNERS: vuln
          TRIVY_IGNORE_UNFIXED: "true"
          TRIVY_SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          TRIVY_SKIP_DIRS: /root/.cargo
          TRIVY_IGNOREFILE: .trivyignore
          TRIVY_IGNORE_POLICY: .github/trivy/ignore.rego # ignore pkg:pypi/* (pip/dependabot) and pkg:golang/* (manual deps/*.json pin bumps)
          TRIVY_FORMAT: sarif
          TRIVY_OUTPUT: trivy-results.sarif
          TRIVY_EXIT_CODE: "0"
          TRIVY_PLATFORM: ${{ inputs.ARCH }}
          # Priority list: Trivy falls back to the next repository on 429/5xx. Setting it overrides the defaults, so they are repeated here; ECR comes last (it was pinned alone in 2024 and now rate-limits the parallel image jobs).
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1
      - name: Upload Trivy SARIF report
        if: ${{ always() && (inputs.CANDIDATE != '' || startsWith(inputs.CACHE_SUFFIX, 'arm') == false) }}
        continue-on-error: true # don't let a missing/partial SARIF mask the real scan error (the gate is the source of truth)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ inputs.IMAGE }}-${{ inputs.ARCH }}
      # Hard gate — fail the build on ANY matching vulnerability
      - name: Trivy gate
        if: ${{ inputs.CANDIDATE != '' || startsWith(inputs.CACHE_SUFFIX, 'arm') == false }}
        run: trivy image "$SCAN_REF"
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          TRIVY_SCANNERS: vuln
          TRIVY_IGNORE_UNFIXED: "true"
          TRIVY_SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          TRIVY_SKIP_DIRS: /root/.cargo
          TRIVY_IGNOREFILE: .trivyignore
          TRIVY_IGNORE_POLICY: .github/trivy/ignore.rego # ignore pkg:pypi/* (pip/dependabot) and pkg:golang/* (manual deps/*.json pin bumps)
          TRIVY_FORMAT: template
          TRIVY_TEMPLATE: "@.github/trivy/summary.tpl"
          TRIVY_OUTPUT: trivy-summary.md
          TRIVY_EXIT_CODE: "1"
          TRIVY_PLATFORM: ${{ inputs.ARCH }}
          # Priority list: Trivy falls back to the next repository on 429/5xx. Setting it overrides the defaults, so they are repeated here; ECR comes last (it was pinned alone in 2024 and now rate-limits the parallel image jobs).
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1
      # Publish the Trivy results to the GitHub Actions run summary
      - name: Trivy summary
        if: ${{ always() && (inputs.CANDIDATE != '' || startsWith(inputs.CACHE_SUFFIX, 'arm') == false) }}
        run: |
          {
            echo "## Trivy — \`$IMAGE\` ($ARCH)"
            if [ -f trivy-summary.md ]; then cat trivy-summary.md; else echo "_No Trivy summary produced._"; fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: "${{ inputs.IMAGE }}"
          ARCH: "${{ inputs.ARCH }}"
      - name: Record scanned candidate
        if: inputs.CANDIDATE != ''
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ inputs.IMAGE }}
          PLATFORM: ${{ inputs.ARCH }}
          SUFFIX: ${{ inputs.CACHE_SUFFIX }}
        run: python3 .github/scripts/release_artifacts.py record-image --image "$IMAGE" --platform "$PLATFORM" --digest "$DIGEST" --output "image-$IMAGE-$SUFFIX.json"
      - name: Upload candidate receipt
        if: inputs.CANDIDATE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-image-${{ inputs.IMAGE }}-${{ inputs.CACHE_SUFFIX }}
          overwrite: true
          path: image-${{ inputs.IMAGE }}-${{ inputs.CACHE_SUFFIX }}.json
          if-no-files-found: error
          retention-days: 7
      # Push image
      - name: Push image
        if: inputs.PUSH == true && inputs.CANDIDATE == ''
        run: docker tag local/$IMAGE ghcr.io/bunkerity/$IMAGE-tests:$TAG && docker push ghcr.io/bunkerity/$IMAGE-tests:$TAG
        env:
          IMAGE: "${{ inputs.IMAGE }}"
          TAG: "${{ inputs.RELEASE }}"
