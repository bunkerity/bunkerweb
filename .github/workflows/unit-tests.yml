name: Unit tests (pytest)

# Fast, isolated pytest suite under tests/unit/ (complements the Docker integration
# tests in test-core*.yml). The SQLite job runs on every relevant push/PR; the full
# multi-engine matrix (SQLite + PostgreSQL + MariaDB) runs nightly / on demand so it
# never slows PRs. See tests/unit/README.md.

on:
  push:
    branches: [master, 1.7]
    paths:
      - "src/**"
      - "misc/install-bunkerweb.sh"
      - "tests/unit/**"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "misc/install-bunkerweb.sh"
      - "tests/unit/**"
      - ".github/workflows/unit-tests.yml"
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC — runs the full engine matrix
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: Unit tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/unit/requirements.txt
      - name: Install unit-test dependencies
        run: pip install --require-hashes -r tests/unit/requirements.txt
      # The Lua-layer tests shell out to the interpreter and skip without it, so install it
      # rather than let them silently pass by not running.
      - name: Install the Lua interpreter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 && sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
      # `backup_database`/`restore_database` shell out to `sqlite3`, and the backup/restore round
      # trip now FAILS rather than skips when an engine is present but its client is not -- so this
      # job's one engine needs its client installed rather than assumed from the runner image.
      - name: Install the SQLite client
        run: sudo apt-get install -y --no-install-recommends sqlite3
      - name: Run unit tests (SQLite, full suite incl. slow tier)
        if: github.ref_name != '1.7' && github.base_ref != '1.7'
        run: pytest tests/unit
      - name: Run unit tests with 1.7 coverage
        if: github.ref_name == '1.7' || github.base_ref == '1.7'
        run: >-
          pytest tests/unit
          --cov=src/common --cov=src/api --cov=src/ui
          --cov=src/autoconf --cov=src/scheduler --cov=src/worker
          --cov-branch --cov-report=json:coverage.json --cov-report=
      - name: Enforce direct 1.7 changed-line coverage
        if: github.ref_name == '1.7' || github.base_ref == '1.7'
        run: python tests/unit/check_changed_coverage.py coverage.json --fail-under 80

  matrix:
    name: Unit tests (SQLite + PostgreSQL + MariaDB)
    # Heavy (spins up DB service containers) — keep it off the PR path.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bw
          POSTGRES_PASSWORD: bw
          POSTGRES_DB: bw_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bw -d bw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_USER: bw
          MARIADB_PASSWORD: bw
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bw_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/unit/requirements.txt
      - name: Install unit-test dependencies
        run: pip install --require-hashes -r tests/unit/requirements.txt
      # The Lua-layer tests shell out to the interpreter and skip without it, so install it
      # rather than let them silently pass by not running.
      - name: Install the Lua interpreter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 && sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
      # Same reasoning as the Lua step, for the same reason it is spelled out there: the backup /
      # restore round trip (tests/unit/db/test_downgrade_round_trip.py) shells out to the real
      # dump and restore clients, exactly as `backup.py` does in production. Relying on whatever
      # the runner image happens to ship is not good enough -- it is the only test in tests/unit/
      # that needs a database client, so nothing else would go red first, and the day the image
      # drops one the downgrade guarantee silently reverts to unproven while the matrix stays
      # green. (The test itself now FAILS rather than skips when an engine is reachable but its
      # client is missing, so this step and that check back each other up.)
      #
      # mariadb-client, NOT mysql-client: `mysql_client_command` prefers `mariadb-dump`/`mariadb`,
      # and the service above is mariadb:11. Measured -- MySQL 8's mysqldump against a populated
      # MariaDB 11 server exits 2 with "Unknown table 'COLUMN_STATISTICS' in information_schema
      # (1109)", so mysql-client here would install a client that cannot dump this job's own
      # database.
      - name: Install the database clients
        run: sudo apt-get install -y --no-install-recommends sqlite3 postgresql-client mariadb-client
      - name: Run unit tests (all engines)
        env:
          BW_TEST_PG_URI: postgresql://bw:bw@127.0.0.1:5433/bw_test
          BW_TEST_MARIA_URI: mariadb://bw:bw@127.0.0.1:3307/bw_test
        run: pytest tests/unit --db-engines=sqlite,postgresql,mariadb
