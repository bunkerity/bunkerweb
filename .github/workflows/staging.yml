name: Automatic tests (STAGING)

permissions: read-all

on:
  push:
    branches: [staging, fix-cve]
  workflow_dispatch:

concurrency:
  # Scoped by ref, not just by workflow (unlike 1.7-dev.yml, which only ever triggers on one
  # branch): staging.yml triggers on both `staging` and `fix-cve`, and those two should queue
  # independently rather than blocking each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build Docker images
  build-containers:
    permissions:
      contents: read
      packages: write
      security-events: write # container-build.yml uploads the Trivy SARIF
    strategy:
      matrix:
        image:
          [bunkerweb, scheduler, bwcli, autoconf, ui, api, worker, all-in-one]
        include:
          - image: bunkerweb
            dockerfile: src/bw/Dockerfile
          - image: scheduler
            dockerfile: src/scheduler/Dockerfile
          - image: bwcli
            dockerfile: src/scheduler/Dockerfile
            target: bwcli
          - image: autoconf
            dockerfile: src/autoconf/Dockerfile
          - image: ui
            dockerfile: src/ui/Dockerfile
          - image: api
            dockerfile: src/api/Dockerfile
          - image: worker
            dockerfile: src/worker/Dockerfile
          - image: all-in-one
            dockerfile: src/all-in-one/Dockerfile
    uses: ./.github/workflows/container-build.yml
    with:
      RELEASE: testing
      ARCH: linux/amd64
      CACHE: true
      PUSH: true
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      TARGET: ${{ matrix.target }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  # Build Linux packages
  build-packages:
    permissions:
      contents: read
    strategy:
      matrix:
        linux:
          [
            ubuntu,
            debian-bookworm,
            debian-trixie,
            fedora-43,
            fedora-44,
            rhel-8,
            rhel-9,
            rhel-10,
            ubuntu-noble,
            ubuntu-jammy,
          ]
        include:
          - linux: ubuntu
            package: deb
          - linux: ubuntu-noble
            package: deb
          - linux: debian-bookworm
            package: deb
          - linux: debian-trixie
            package: deb
          - linux: fedora-43
            package: rpm
          - linux: fedora-44
            package: rpm
          - linux: rhel-8
            package: rpm
          - linux: rhel-9
            package: rpm
          - linux: rhel-10
            package: rpm
          - linux: ubuntu-jammy
            package: deb
    uses: ./.github/workflows/linux-build.yml
    with:
      RELEASE: testing
      LINUX: ${{ matrix.linux }}
      PACKAGE: ${{ matrix.package }}
      PLATFORMS: linux/amd64
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # Integration tests — same framework and images as 1.7-dev.yml/dev.yml, but parsed WITHOUT
  # --dev so tests/utils/integrations.yml's `staging:` block is used instead of `dev:`. That
  # block is the only one with more than one Linux runner row (9 live distros vs `dev:`'s
  # ubuntu/noble alone); every other integration resolves to the same single `ubuntu-latest`
  # row either way. This is the real-artifact test gate the legacy harness used to provide —
  # see tests/README.md "The legacy harness (deleted)" for what it recovers and what it does
  # not (real domains / real Let's Encrypt certs: not portable at all with the current
  # framework, see below — NOT because there is "no self-hosted fleet". There is one:
  # integration-tests.yml's `setup` job runs on `[self-hosted, fireactions]` for every arm,
  # staging included. The actually-dead thing is the `bw-docker`/`bw-autoconf`/`bw-linux`
  # runner labels the now-orphaned ansible playbooks (tests/ansible/, no caller left) used
  # to register — nothing in this repo references those labels any more).
  parse-tests-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: parse_tests
        name: Parse core tests
        run: |
          pip install --require-hashes -r tests/requirements.txt
          python3 tests/parse.py "core"
          # GitHub caps a single job's matrix at 256 entries. `staging:`'s Linux block is 9
          # distros; at today's 42 "all"-eligible core specs that is 378 Linux matrix entries
          # on its own, so the raw staging: spread cannot run as one job's matrix at all.
          # Subset to one current release per package family/arch instead of sharding the job:
          # ubuntu/noble + debian/bookworm (deb), el/9 + fedora/44 (rpm) — 4x dev.yml's single
          # distro, not the full 9x, but every core spec still runs on both package families.
          # ponytail: fixed 4-distro allowlist, ceiling ~64 core specs (256 / 4) before this
          # needs widening again — reduce the allowlist, or shard run-Linux-tests-core into
          # multiple jobs over disjoint distros, if the core spec count gets there.
          python3 -c "
          import json
          allow = {'ubuntu/noble', 'debian/bookworm', 'el/9', 'fedora/44'}
          path = '/tmp/tests/Linux_tests.json'
          data = json.load(open(path))
          json.dump([t for t in data if t.split(';')[2] in allow], open(path, 'w'))
          "
          echo "Linux_tests=$(cat /tmp/tests/Linux_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "Docker_tests=$(cat /tmp/tests/Docker_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "Autoconf_tests=$(cat /tmp/tests/Autoconf_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "Kubernetes_tests=$(cat /tmp/tests/Kubernetes_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "All_in_one_tests=$(cat /tmp/tests/All_in_one_tests.json || echo "[]")" >> $GITHUB_OUTPUT
    outputs:
      Linux_tests: ${{ steps.parse_tests.outputs.Linux_tests }}
      Docker_tests: ${{ steps.parse_tests.outputs.Docker_tests }}
      Autoconf_tests: ${{ steps.parse_tests.outputs.Autoconf_tests }}
      Kubernetes_tests: ${{ steps.parse_tests.outputs.Kubernetes_tests }}
      All_in_one_tests: ${{ steps.parse_tests.outputs.All_in_one_tests }}

  parse-tests-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: parse_tests
        name: Parse api tests
        run: |
          pip install --require-hashes -r tests/requirements.txt
          python3 tests/parse.py "api"
          echo "Docker_tests=$(cat /tmp/tests/Docker_tests.json || echo "[]")" >> $GITHUB_OUTPUT
    outputs:
      Docker_tests: ${{ steps.parse_tests.outputs.Docker_tests }}

  run-Docker-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Docker_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-Autoconf-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Autoconf_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-Linux-tests-core:
    needs: [build-packages, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Linux_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-Kubernetes-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Kubernetes_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-All-in-one-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.All_in_one_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-Docker-tests-api:
    needs: [build-containers, parse-tests-api]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-api.outputs.Docker_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: api
      TEST: ${{ matrix.test }}
      RELEASE: testing

  # Push Docker images
  push-images:
    needs:
      [
        codeql,
        run-Docker-tests-core,
        run-Autoconf-tests-core,
        run-Linux-tests-core,
        run-Kubernetes-tests-core,
        run-All-in-one-tests-core,
        run-Docker-tests-api,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Login to ghcr
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push BW image
        run: docker pull ghcr.io/bunkerity/bunkerweb-tests:testing && docker tag ghcr.io/bunkerity/bunkerweb-tests:testing bunkerity/bunkerweb:testing && docker push bunkerity/bunkerweb:testing && docker tag bunkerity/bunkerweb:testing ghcr.io/bunkerity/bunkerweb:testing && docker push ghcr.io/bunkerity/bunkerweb:testing
      - name: Push scheduler image
        run: docker pull ghcr.io/bunkerity/scheduler-tests:testing && docker tag ghcr.io/bunkerity/scheduler-tests:testing bunkerity/bunkerweb-scheduler:testing && docker push bunkerity/bunkerweb-scheduler:testing && docker tag bunkerity/bunkerweb-scheduler:testing ghcr.io/bunkerity/bunkerweb-scheduler:testing && docker push ghcr.io/bunkerity/bunkerweb-scheduler:testing
      - name: Push bwcli image
        run: docker pull ghcr.io/bunkerity/bwcli-tests:testing && docker tag ghcr.io/bunkerity/bwcli-tests:testing bunkerity/bunkerweb-bwcli:testing && docker push bunkerity/bunkerweb-bwcli:testing && docker tag bunkerity/bunkerweb-bwcli:testing ghcr.io/bunkerity/bunkerweb-bwcli:testing && docker push ghcr.io/bunkerity/bunkerweb-bwcli:testing
      - name: Push autoconf image
        run: docker pull ghcr.io/bunkerity/autoconf-tests:testing && docker tag ghcr.io/bunkerity/autoconf-tests:testing bunkerity/bunkerweb-autoconf:testing && docker push bunkerity/bunkerweb-autoconf:testing && docker tag bunkerity/bunkerweb-autoconf:testing ghcr.io/bunkerity/bunkerweb-autoconf:testing && docker push ghcr.io/bunkerity/bunkerweb-autoconf:testing
      - name: Push UI image
        run: docker pull ghcr.io/bunkerity/ui-tests:testing && docker tag ghcr.io/bunkerity/ui-tests:testing bunkerity/bunkerweb-ui:testing && docker push bunkerity/bunkerweb-ui:testing && docker tag bunkerity/bunkerweb-ui:testing ghcr.io/bunkerity/bunkerweb-ui:testing && docker push ghcr.io/bunkerity/bunkerweb-ui:testing
      - name: Push API image
        run: docker pull ghcr.io/bunkerity/api-tests:testing && docker tag ghcr.io/bunkerity/api-tests:testing bunkerity/bunkerweb-api:testing && docker push bunkerity/bunkerweb-api:testing && docker tag bunkerity/bunkerweb-api:testing ghcr.io/bunkerity/bunkerweb-api:testing && docker push ghcr.io/bunkerity/bunkerweb-api:testing
      - name: Push worker image
        run: docker pull ghcr.io/bunkerity/worker-tests:testing && docker tag ghcr.io/bunkerity/worker-tests:testing bunkerity/bunkerweb-worker:testing && docker push bunkerity/bunkerweb-worker:testing && docker tag bunkerity/bunkerweb-worker:testing ghcr.io/bunkerity/bunkerweb-worker:testing && docker push ghcr.io/bunkerity/bunkerweb-worker:testing
      - name: Push all-in-one image
        run: docker pull ghcr.io/bunkerity/all-in-one-tests:testing && docker tag ghcr.io/bunkerity/all-in-one-tests:testing bunkerity/bunkerweb-all-in-one:testing && docker push bunkerity/bunkerweb-all-in-one:testing && docker tag bunkerity/bunkerweb-all-in-one:testing ghcr.io/bunkerity/bunkerweb-all-in-one:testing && docker push ghcr.io/bunkerity/bunkerweb-all-in-one:testing

  # Push Linux packages
  push-packages:
    needs:
      [
        codeql,
        run-Docker-tests-core,
        run-Autoconf-tests-core,
        run-Linux-tests-core,
        run-Kubernetes-tests-core,
        run-All-in-one-tests-core,
        run-Docker-tests-api,
      ]
    strategy:
      matrix:
        linux:
          [
            ubuntu,
            debian-bookworm,
            debian-trixie,
            fedora-43,
            fedora-44,
            el-8,
            el-9,
            el-10,
            ubuntu-noble,
            ubuntu-jammy,
          ]
        arch: [amd64]
        include:
          - release: testing
            repo: bunkerweb
          - linux: ubuntu
            package_arch: amd64
            separator: _
            suffix: ""
            version: resolute
            package: deb
          - linux: ubuntu-noble
            package_arch: amd64
            separator: _
            suffix: ""
            version: noble
            package: deb
          - linux: debian-bookworm
            package_arch: amd64
            separator: _
            suffix: ""
            version: bookworm
            package: deb
          - linux: debian-trixie
            package_arch: amd64
            separator: _
            suffix: ""
            version: trixie
            package: deb
          - linux: fedora-43
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 43
            package: rpm
          - linux: fedora-44
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 44
            package: rpm
          - linux: el-8
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 8
            package: rpm
          - linux: el-9
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 9
            package: rpm
          - linux: el-10
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 10
            package: rpm
          - linux: ubuntu-jammy
            package_arch: amd64
            separator: _
            suffix: ""
            version: jammy
            package: deb
    uses: ./.github/workflows/push-packagecloud.yml
    with:
      SEPARATOR: ${{ matrix.separator }}
      SUFFIX: ${{ matrix.suffix }}
      REPO: ${{ matrix.repo }}
      LINUX: ${{ matrix.linux }}
      VERSION: ${{ matrix.version }}
      PACKAGE: ${{ matrix.package }}
      BW_VERSION: ${{ matrix.release }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      ARCH: ${{ matrix.arch }}
    secrets:
      PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

  # Push doc
  push-doc:
    needs: [push-images, push-packages]
    permissions:
      contents: write
    uses: ./.github/workflows/push-doc.yml
    with:
      VERSION: testing
      ALIAS: unstable
    secrets:
      BUNKERBOT_TOKEN: ${{ secrets.BUNKERBOT_TOKEN }}

  # Push on GH
  push-gh:
    needs: [push-doc]
    permissions:
      contents: write
      discussions: write
    uses: ./.github/workflows/push-github.yml
    with:
      VERSION: testing
      PRERELEASE: true
