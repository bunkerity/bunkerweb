name: Automatic tests (STAGING)

permissions: read-all

on:
  push:
    branches: [staging, fix-cve]
  workflow_dispatch:

# Staging and release runs queue behind each other (release.yml shares the group).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Build Docker images
  build-containers:
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload
    strategy:
      matrix:
        image: [bunkerweb, scheduler, autoconf, ui, api, all-in-one]
        include:
          - image: bunkerweb
            dockerfile: src/bw/Dockerfile
          - image: scheduler
            dockerfile: src/scheduler/Dockerfile
          - image: autoconf
            dockerfile: src/autoconf/Dockerfile
          - image: ui
            dockerfile: src/ui/Dockerfile
          - image: api
            dockerfile: src/api/Dockerfile
          - image: all-in-one
            dockerfile: src/all-in-one/Dockerfile
    uses: ./.github/workflows/container-build.yml
    with:
      RELEASE: testing
      ARCH: linux/amd64
      CACHE: true
      PUSH: true
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  # Build Linux packages
  build-packages:
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        linux:
          [
            ubuntu,
            debian-bookworm,
            debian-trixie,
            fedora-43,
            fedora-44,
            rhel-8,
            rhel-9,
            rhel-10,
            ubuntu-noble,
            ubuntu-jammy,
          ]
        include:
          - linux: ubuntu
            package: deb
          - linux: ubuntu-noble
            package: deb
          - linux: debian-bookworm
            package: deb
          - linux: debian-trixie
            package: deb
          - linux: fedora-43
            package: rpm
          - linux: fedora-44
            package: rpm
          - linux: rhel-8
            package: rpm
          - linux: rhel-9
            package: rpm
          - linux: rhel-10
            package: rpm
          - linux: ubuntu-jammy
            package: deb
    uses: ./.github/workflows/linux-build.yml
    with:
      RELEASE: testing
      LINUX: ${{ matrix.linux }}
      PACKAGE: ${{ matrix.package }}
      TEST: true
      PLATFORMS: linux/amd64
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  # The integration suites never boot the all-in-one or the standalone API image.
  smoke-images:
    needs: [build-containers]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start all six staging images
        run: python3 .github/scripts/release_smoke.py

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # Integration tests: same framework and images as dev.yml, but parsed WITHOUT --dev so the
  # `staging:` block of tests/utils/integrations.yml is used instead of `dev:`. That block lists
  # every live Linux distro; every other integration resolves to the same single `ubuntu-latest`
  # row either way.
  parse-tests-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: parse_tests
        name: Parse core tests
        run: |
          pip install --require-hashes -r tests/requirements.txt
          python3 tests/parse.py "core"
          # GitHub caps a single job's matrix at 256 entries. The `staging:` Linux block lists 9
          # distros, which at the core spec count does not fit one matrix. Keep one current
          # release per package family: ubuntu/noble + debian/bookworm (deb), el/9 + fedora/44
          # (rpm), so every core spec still runs on both package families.
          # shortcut: fixed 4-distro allowlist, ceiling ~64 core specs (256 / 4); shard
          # run-Linux-tests-core over disjoint distros when the spec count gets there.
          python3 -c "
          import json
          allow = {'ubuntu/noble', 'debian/bookworm', 'el/9', 'fedora/44'}
          path = '/tmp/tests/Linux_tests.json'
          data = json.load(open(path))
          json.dump([t for t in data if t.split(';')[2] in allow], open(path, 'w'))
          "
          echo "Linux_tests=$(cat /tmp/tests/Linux_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "Docker_tests=$(cat /tmp/tests/Docker_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "Autoconf_tests=$(cat /tmp/tests/Autoconf_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "Kubernetes_tests=$(cat /tmp/tests/Kubernetes_tests.json || echo "[]")" >> $GITHUB_OUTPUT
          echo "All_in_one_tests=$(cat /tmp/tests/All_in_one_tests.json || echo "[]")" >> $GITHUB_OUTPUT
    outputs:
      Linux_tests: ${{ steps.parse_tests.outputs.Linux_tests }}
      Docker_tests: ${{ steps.parse_tests.outputs.Docker_tests }}
      Autoconf_tests: ${{ steps.parse_tests.outputs.Autoconf_tests }}
      Kubernetes_tests: ${{ steps.parse_tests.outputs.Kubernetes_tests }}
      All_in_one_tests: ${{ steps.parse_tests.outputs.All_in_one_tests }}

  parse-tests-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: parse_tests
        name: Parse api tests
        run: |
          pip install --require-hashes -r tests/requirements.txt
          python3 tests/parse.py "api"
          echo "Docker_tests=$(cat /tmp/tests/Docker_tests.json || echo "[]")" >> $GITHUB_OUTPUT
    outputs:
      Docker_tests: ${{ steps.parse_tests.outputs.Docker_tests }}

  parse-tests-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: parse_tests
        name: Parse ui tests
        run: |
          pip install --require-hashes -r tests/requirements.txt
          python3 tests/parse.py "ui"
          echo "Docker_tests=$(cat /tmp/tests/Docker_tests.json || echo "[]")" >> $GITHUB_OUTPUT
    outputs:
      Docker_tests: ${{ steps.parse_tests.outputs.Docker_tests }}

  run-Docker-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Docker_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-Autoconf-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Autoconf_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-Linux-tests-core:
    needs: [build-packages, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Linux_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-Kubernetes-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.Kubernetes_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-All-in-one-tests-core:
    needs: [build-containers, parse-tests-core]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-core.outputs.All_in_one_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: core
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-Docker-tests-api:
    needs: [build-containers, parse-tests-api]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-api.outputs.Docker_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: api
      TEST: ${{ matrix.test }}
      RELEASE: testing

  run-Docker-tests-ui:
    needs: [build-containers, parse-tests-ui]
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.parse-tests-ui.outputs.Docker_tests) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      TYPE: ui
      TEST: ${{ matrix.test }}
      RELEASE: testing

  # Push Docker images
  push-images:
    needs:
      [
        codeql,
        run-Docker-tests-core,
        run-Autoconf-tests-core,
        run-Linux-tests-core,
        run-Kubernetes-tests-core,
        run-All-in-one-tests-core,
        run-Docker-tests-api,
        run-Docker-tests-ui,
        smoke-images,
      ]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Login to ghcr
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to GitLab registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      - name: Push BW image
        run: |
          SRC="ghcr.io/bunkerity/bunkerweb-tests:testing"
          docker pull "$SRC"
          for DST in \
            "bunkerity/bunkerweb:testing" \
            "ghcr.io/bunkerity/bunkerweb:testing" \
            "registry.gitlab.com/bunkerity/bunkerweb/bunkerweb:testing"; do
            docker tag "$SRC" "$DST"
            docker push "$DST"
          done
      - name: Push scheduler image
        run: |
          SRC="ghcr.io/bunkerity/scheduler-tests:testing"
          docker pull "$SRC"
          for DST in \
            "bunkerity/bunkerweb-scheduler:testing" \
            "ghcr.io/bunkerity/bunkerweb-scheduler:testing" \
            "registry.gitlab.com/bunkerity/bunkerweb/bunkerweb-scheduler:testing"; do
            docker tag "$SRC" "$DST"
            docker push "$DST"
          done
      - name: Push autoconf image
        run: |
          SRC="ghcr.io/bunkerity/autoconf-tests:testing"
          docker pull "$SRC"
          for DST in \
            "bunkerity/bunkerweb-autoconf:testing" \
            "ghcr.io/bunkerity/bunkerweb-autoconf:testing" \
            "registry.gitlab.com/bunkerity/bunkerweb/bunkerweb-autoconf:testing"; do
            docker tag "$SRC" "$DST"
            docker push "$DST"
          done
      - name: Push UI image
        run: |
          SRC="ghcr.io/bunkerity/ui-tests:testing"
          docker pull "$SRC"
          for DST in \
            "bunkerity/bunkerweb-ui:testing" \
            "ghcr.io/bunkerity/bunkerweb-ui:testing" \
            "registry.gitlab.com/bunkerity/bunkerweb/bunkerweb-ui:testing"; do
            docker tag "$SRC" "$DST"
            docker push "$DST"
          done
      - name: Push API image
        run: |
          SRC="ghcr.io/bunkerity/api-tests:testing"
          docker pull "$SRC"
          for DST in \
            "bunkerity/bunkerweb-api:testing" \
            "ghcr.io/bunkerity/bunkerweb-api:testing" \
            "registry.gitlab.com/bunkerity/bunkerweb/bunkerweb-api:testing"; do
            docker tag "$SRC" "$DST"
            docker push "$DST"
          done
      - name: Push all-in-one image
        run: |
          SRC="ghcr.io/bunkerity/all-in-one-tests:testing"
          docker pull "$SRC"
          for DST in \
            "bunkerity/bunkerweb-all-in-one:testing" \
            "ghcr.io/bunkerity/bunkerweb-all-in-one:testing" \
            "registry.gitlab.com/bunkerity/bunkerweb/bunkerweb-all-in-one:testing"; do
            docker tag "$SRC" "$DST"
            docker push "$DST"
          done

  # Push Linux packages
  push-packages:
    needs:
      [
        codeql,
        run-Docker-tests-core,
        run-Autoconf-tests-core,
        run-Linux-tests-core,
        run-Kubernetes-tests-core,
        run-All-in-one-tests-core,
        run-Docker-tests-api,
        run-Docker-tests-ui,
        smoke-images,
      ]
    strategy:
      matrix:
        linux:
          [
            ubuntu,
            debian-bookworm,
            debian-trixie,
            fedora-43,
            fedora-44,
            el-8,
            el-9,
            el-10,
            ubuntu-noble,
            ubuntu-jammy,
          ]
        arch: [amd64]
        include:
          - release: testing
            repo: bunkerweb
          - linux: ubuntu
            package_arch: amd64
            separator: _
            suffix: ""
            version: resolute
            package: deb
          - linux: ubuntu-noble
            package_arch: amd64
            separator: _
            suffix: ""
            version: noble
            package: deb
          - linux: debian-bookworm
            package_arch: amd64
            separator: _
            suffix: ""
            version: bookworm
            package: deb
          - linux: debian-trixie
            package_arch: amd64
            separator: _
            suffix: ""
            version: trixie
            package: deb
          - linux: fedora-43
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 43
            package: rpm
          - linux: fedora-44
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 44
            package: rpm
          - linux: el-8
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 8
            package: rpm
          - linux: el-9
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 9
            package: rpm
          - linux: el-10
            package_arch: x86_64
            separator: "-"
            suffix: "1."
            version: 10
            package: rpm
          - linux: ubuntu-jammy
            package_arch: amd64
            separator: _
            suffix: ""
            version: jammy
            package: deb
    uses: ./.github/workflows/push-packagecloud.yml
    with:
      SEPARATOR: ${{ matrix.separator }}
      SUFFIX: ${{ matrix.suffix }}
      REPO: ${{ matrix.repo }}
      LINUX: ${{ matrix.linux }}
      VERSION: ${{ matrix.version }}
      PACKAGE: ${{ matrix.package }}
      BW_VERSION: ${{ matrix.release }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      ARCH: ${{ matrix.arch }}
    secrets:
      PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

  # Push doc
  push-doc:
    needs: [push-images, push-packages]
    permissions:
      contents: write
    uses: ./.github/workflows/push-doc.yml
    with:
      VERSION: testing
      ALIAS: unstable
    secrets:
      BUNKERBOT_TOKEN: ${{ secrets.BUNKERBOT_TOKEN }}

  # Push on GH
  push-gh:
    needs: [push-doc]
    permissions:
      contents: write
      discussions: write
      actions: read
    uses: ./.github/workflows/push-github.yml
    with:
      VERSION: testing
      PRERELEASE: true
