name: Update cached mmdb files

permissions:
  contents: write

on:
  schedule:
    - cron: "0 12 5 * *"

jobs:
  mmdb-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.BUNKERBOT_TOKEN }}
          ref: dev
          persist-credentials: false
      - name: Set up Python for MMDB validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install existing MMDB validation dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir --no-deps --require-hashes -r misc/requirements-mmdb.txt
      - name: Download and verify mmdb files
        run: ./misc/update-mmdb.sh
      - name: Configure Git authentication
        run: gh auth setup-git --hostname github.com --force
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        env:
          GH_TOKEN: ${{ secrets.BUNKERBOT_TOKEN }}
        with:
          branch: dev
          commit_message: "Monthly mmdb update"
          commit_options: "--no-verify"
          commit_user_name: "BunkerBot"
          commit_user_email: "bunkerbot@bunkerity.com"
          file_pattern: src/bw/misc/asn.mmdb src/bw/misc/country.mmdb
