name: Promote tested image (REUSABLE)

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      IMAGE:
        required: true
        type: string
      TAGS:
        required: true
        type: string
      MANIFEST_SHA256:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true
      GITLAB_REGISTRY_USER:
        required: true
      GITLAB_REGISTRY_TOKEN:
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
      - name: Verify candidate manifest
        env:
          MANIFEST_SHA256: ${{ inputs.MANIFEST_SHA256 }}
        run: python3 .github/scripts/release_artifacts.py verify
      - name: Login to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Login to ghcr
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to GitLab registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      - name: Install registry copy tool
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y skopeo
      - name: Promote exact tested indexes and attestations
        env:
          IMAGE: ${{ inputs.IMAGE }}
          TAGS: ${{ inputs.TAGS }}
          MANIFEST_SHA256: ${{ inputs.MANIFEST_SHA256 }}
        run: python3 .github/scripts/release_artifacts.py promote --image "$IMAGE" --tags "$TAGS"
