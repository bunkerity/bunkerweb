# Same project name as docker-compose.yml so both halves land on the same project-scoped
# `bw-db` network. See the comment there for why the fixed `name:` keys were removed.
name: migration

services:
  bw-db:
    image: mariadb:11
    command: --max-allowed-packet=67108864
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "db"
      MYSQL_USER: "bunkerweb"
      MYSQL_PASSWORD: "secret"
    networks:
      - bw-db

networks:
  bw-db:
