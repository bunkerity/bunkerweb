# Same project name as docker-compose.yml so both halves land on the same project-scoped
# `bw-db` network. See the comment there for why the fixed `name:` keys were removed.
name: migration

services:
  bw-db:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_RANDOM_PASSWORD: "yes"
      APP_USER: "bunkerweb"
      APP_USER_PASSWORD: "secret"
    networks:
      - bw-db

networks:
  bw-db:
