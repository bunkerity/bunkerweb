# BunkerWeb on Docker Swarm -- reference stack (postgres).
#
# Deploy with `docker stack deploy -c swarm.postgres.ui.yml bunkerweb`, NOT with
# `docker compose up`. `docker stack deploy` SILENTLY IGNORES `container_name`, `depends_on`,
# `links`, `profiles` and the top-level `restart:` key, so none of them appear below: ordering
# comes from each component's own readiness loop plus `deploy.restart_policy`, and a service that
# starts before its dependency is expected to retry rather than to be sequenced.
#
# PREREQUISITE -- label the node that holds the state, once, before deploying:
#
#     docker node update --label-add bw-state=true <node>
#
# Every service below that owns a named volume is pinned to that node with
# `node.labels.bw-state == true`. This is NOT belt and braces. A named volume in Swarm is LOCAL
# TO A NODE: if the scheduler moves `bw-jobs-broker` to another node, it starts against an EMPTY
# append-only file and every job still queued is gone, silently, with nothing logged anywhere --
# the one failure the worker's at-least-once acknowledgements cannot cover. The same holds for
# `bw-storage`, `bw-worker-storage` and `bw-data`.
#
# The pin buys durability at the cost of failover: if that node dies, the state services do not
# come back elsewhere. The HA alternative is a SHARED volume driver (NFS, CephFS, a cloud block
# driver via a plugin) on all four volumes, after which the placement constraints can be dropped.
# That is an infrastructure prerequisite, so it is offered rather than assumed.
#
# A single-node CI gate CANNOT catch a mistake here -- on one node the local volume is stable and
# nothing is ever rescheduled. Treat this section as unverified-by-tests on purpose.

x-env: &env
  DATABASE_URI: "postgresql://bunkerweb:changeme@bw-db:5432/db" # Remember to set a stronger password for the database
  SWARM_MODE: "yes"
  API_URL: "http://bw-api:8888"
  API_TOKEN: "changeme" # Remember to set a stronger token: every component authenticates to the API with it
  CELERY_BROKER_URL: "redis://bw-jobs-broker:6379/0"

services:
  bunkerweb:
    image: bunkerity/bunkerweb:1.7.0-beta
    # `mode: global` is REQUIRED, not a recommendation. The autoconf controller registers each
    # instance under the task's DNS name `<service>.<NodeID>.<TaskID>`, which only resolves for a
    # global service; a replicated one produces `<service>.<slot>.<TaskID>` and the control plane
    # can never reach it. SwarmController refuses a non-global INSTANCE service and says so.
    deploy:
      mode: global
      # Service labels, not container labels: the controller reads `Spec.Labels` off the SERVICE.
      # A `labels:` block at service level would set CONTAINER labels, which it never looks at --
      # the stack would come up perfectly and the instance would simply never be discovered.
      labels:
        - "bunkerweb.INSTANCE=yes"
      restart_policy:
        condition: any
    ports:
      # `mode: host`, not the default routing mesh. The mesh source-NATs every connection, so
      # BunkerWeb would see the ingress network's address instead of the client's and every
      # IP-based decision it makes -- whitelist, blacklist, country, rate limit, bans -- would be
      # taken against the wrong address. `mode: host` on a global service publishes on each node
      # directly and preserves the real client IP.
      - target: 8080
        published: 80
        protocol: tcp
        mode: host
      - target: 8443
        published: 443
        protocol: tcp
        mode: host
    environment:
      <<: *env
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
    networks:
      - bw-universe
      - bw-services

  bw-autoconf:
    image: bunkerity/bunkerweb-autoconf:1.7.0-beta
    deploy:
      # The controller talks to the Swarm API, which only a manager serves.
      placement:
        constraints:
          - "node.role == manager"
      restart_policy:
        condition: any
    environment:
      <<: *env
      DOCKER_HOST: "tcp://bw-docker:2375"
    networks:
      - bw-universe
      - bw-docker
      - bw-db

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.7.0-beta
    deploy:
      placement:
        constraints:
          - "node.labels.bw-state == true" # owns bw-storage; see the header
      restart_policy:
        condition: any
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: ""
      SERVER_NAME: ""
      MULTISITE: "yes"
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
    networks:
      - bw-universe
      - bw-db

  bw-api:
    image: bunkerity/bunkerweb-api:1.7.0-beta
    deploy:
      restart_policy:
        condition: any
    environment:
      <<: *env
      API_USERNAME: "changeme"
      API_PASSWORD: "Ch@ngeme1234"
    networks:
      - bw-universe
      - bw-db

  bw-ui:
    image: bunkerity/bunkerweb-ui:1.7.0-beta
    deploy:
      placement:
        constraints:
          - "node.labels.bw-state == true" # owns bw-ui-data; see the header
      restart_policy:
        condition: any
      # Service labels again -- a container-level `labels:` block is invisible to the controller.
      labels:
        - "bunkerweb.SERVER_NAME=www.example.com"
        - "bunkerweb.USE_TEMPLATE=ui"
        - "bunkerweb.USE_REVERSE_PROXY=yes"
        - "bunkerweb.REVERSE_PROXY_URL=/changeme"
        - "bunkerweb.REVERSE_PROXY_HOST=http://bw-ui:7000"
    volumes:
      - bw-ui-data:/data # persists the UI secrets (Flask secret, TOTP encryption keys, Biscuit keys)
    environment:
      <<: *env
      ADMIN_USERNAME: "changeme"
      ADMIN_PASSWORD: "Ch@ngeme1234"
    networks:
      - bw-universe
      - bw-db

  bw-worker:
    image: bunkerity/bunkerweb-worker:1.7.0-beta
    deploy:
      placement:
        constraints:
          - "node.labels.bw-state == true" # owns bw-worker-storage; see the header
      restart_policy:
        condition: any
    volumes:
      # Its own volume: DATABASE_URI points at a real server here, so this /data holds nothing but
      # a scratch tree the worker rebuilds from the database.
      - bw-worker-storage:/data
    environment:
      <<: *env
    # Certificate material belongs HERE, not on the scheduler: the `custom-cert` job runs in the
    # worker. Mount the private key as a Swarm SECRET (never a config -- configs are unencrypted
    # in the raft on every manager) and point the label at the path:
    #
    #     docker secret create example.com.key.v1 ./example.com.key
    #     docker service update --secret-add source=example.com.key.v1,target=example.com.key bunkerweb_bw-worker
    #
    # then label the application service with
    # `bunkerweb.CUSTOM_SSL_KEY=/run/secrets/example.com.key`. Secrets and configs are IMMUTABLE
    # (only their labels can change), so rotation is a NEW named object plus a `service update`,
    # which restarts the worker task. Version the name -- `.v1`, `.v2` -- from the first one.
    #
    # secrets:
    #   - source: example.com.key.v1
    #     target: example.com.key
    networks:
      - bw-universe
      - bw-db

  bw-jobs-broker:
    image: valkey/valkey:8-alpine
    # noeviction on purpose: a broker that evicts under memory pressure drops queued jobs on the
    # floor, and nothing upstream would notice.
    # appendonly on purpose: a broker restart must not vaporise queued jobs. AOF, not RDB
    # ("--save" stays empty) -- a 60s RDB loss window on a job queue means silently dropped work.
    # This is a DIFFERENT server from any Redis/Valkey used as the WAF datastore (which runs
    # volatile-lru): one is a durable queue, the other a cache, and 1.7 separated the two roles.
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    deploy:
      placement:
        constraints:
          - "node.labels.bw-state == true" # the AOF is a LOCAL volume; see the header
      restart_policy:
        condition: any
    volumes:
      - bw-jobs-broker-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - bw-universe

  bw-db:
    image: postgres:18-alpine
    deploy:
      placement:
        constraints:
          - "node.labels.bw-state == true" # owns bw-data; see the header
      restart_policy:
        condition: any
    environment:
      POSTGRES_USER: "bunkerweb"
      POSTGRES_PASSWORD: "changeme" # Remember to set a stronger password for the database
      POSTGRES_DB: "db"
    volumes:
      - bw-data:/var/lib/postgresql
    networks:
      - bw-db

  bw-docker:
    image: tecnativa/docker-socket-proxy:nightly
    deploy:
      # The Swarm API is only served by a manager, and the socket has to be a manager's socket.
      placement:
        constraints:
          - "node.role == manager"
      restart_policy:
        condition: any
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Wider than the Docker-autoconf proxy on purpose: the Swarm controller lists and inspects
      # SERVICES and CONFIGS and reads their events, and resolves TASKS to build instance
      # hostnames. CONTAINERS stays off -- it never looks at one.
      SERVICES: "1"
      TASKS: "1"
      NODES: "1"
      CONFIGS: "1"
      EVENTS: "1"
      SWARM: "1"
      LOG_LEVEL: "warning"
    networks:
      - bw-docker

volumes:
  bw-jobs-broker-data:
  bw-worker-storage:
  bw-data:
  bw-storage:
  bw-ui-data:

networks:
  bw-universe:
    name: bw-universe
    driver: overlay
    # attachable so `docker run --network bw-universe` can reach the control plane for a one-off
    # diagnostic; a stack-only network refuses a plain container.
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
    driver: overlay
    attachable: true
  bw-docker:
    name: bw-docker
    driver: overlay
    attachable: true
  bw-db:
    name: bw-db
    driver: overlay
    attachable: true
