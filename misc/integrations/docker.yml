x-env: &env
  API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
  API_URL: "http://bw-api:8888"
  API_TOKEN: "changeme" # Remember to set a stronger token: every component authenticates to the API with it

services:
  bunkerweb:
    image: bunkerity/bunkerweb:1.7.0-beta
    ports:
      - 80:8080
      - 443:8443
    labels:
      - "bunkerweb.INSTANCE=yes"
    environment:
      <<: *env
    networks:
      - bw-universe
      - bw-services

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.7.0-beta
    depends_on:
      - bunkerweb
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
      SERVER_NAME: "www.example.com"
    networks:
      - bw-universe

  bw-api:
    image: bunkerity/bunkerweb-api:1.7.0-beta
    volumes:
      # Shares the scheduler's SQLite file (both run as uid 101). No bw-worker here for the
      # same reason: it runs as uid 102 and could not read this volume, so this stack runs no
      # background jobs (no certbot renewal, no blocklist downloads). Use one of the
      # docker.<engine>.yml stacks, where every component reaches the database over the network.
      - bw-storage:/data
    environment:
      <<: *env
      API_USERNAME: "changeme"
      API_PASSWORD: "changeme"
    networks:
      - bw-universe

volumes:
  bw-storage:

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
