x-env: &env
  DATABASE_URI: "postgresql://bunkerweb:changeme@bw-db:5432/db" # Remember to set a stronger password for the database
  AUTOCONF_MODE: "yes"
  API_URL: "http://bw-api:8888"
  API_TOKEN: "changeme" # Remember to set a stronger token: every component authenticates to the API with it
  CELERY_BROKER_URL: "redis://bw-jobs-broker:6379/0"

services:
  bunkerweb:
    image: bunkerity/bunkerweb:1.7.0-beta
    ports:
      - 80:8080
      - 443:8443
    labels:
      - "bunkerweb.INSTANCE=yes"
    environment:
      <<: *env
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
    networks:
      - bw-universe
      - bw-services

  bw-autoconf:
    image: bunkerity/bunkerweb-autoconf:1.7.0-beta
    depends_on:
      - bunkerweb
      - bw-docker
    environment:
      <<: *env
      DOCKER_HOST: "tcp://bw-docker:2375"
    networks:
      - bw-universe
      - bw-docker
      - bw-db

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.7.0-beta
    depends_on:
      - bunkerweb
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: ""
      SERVER_NAME: ""
      MULTISITE: "yes"
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
    networks:
      - bw-universe
      - bw-db

  bw-api:
    image: bunkerity/bunkerweb-api:1.7.0-beta
    environment:
      <<: *env
      API_USERNAME: "changeme"
      API_PASSWORD: "changeme"
    networks:
      - bw-universe
      - bw-db

  bw-worker:
    image: bunkerity/bunkerweb-worker:1.7.0-beta
    depends_on:
      - bw-api
      - bw-jobs-broker
    volumes:
      # Its own volume: DATABASE_URI points at a real server here, so this /data holds
      # nothing but a scratch tree the worker rebuilds from the database -- no reason to
      # share the scheduler's. The SQLite stack (docker.yml) does share it, because there
      # the database IS a file under /data.
      - bw-worker-storage:/data
    environment:
      <<: *env
    networks:
      - bw-universe
      - bw-db

  bw-ui:
    image: bunkerity/bunkerweb-ui:1.7.0-beta
    networks:
      - bw-universe
      - bw-db
    environment:
      <<: *env
      ADMIN_USERNAME: "changeme"
      ADMIN_PASSWORD: "changeme"
    labels:
      - "bunkerweb.SERVER_NAME=www.example.com"
      - "bunkerweb.USE_TEMPLATE=ui"
      - "bunkerweb.USE_REVERSE_PROXY=yes"
      - "bunkerweb.REVERSE_PROXY_URL=/changeme"
      - "bunkerweb.REVERSE_PROXY_HOST=http://bw-ui:7000"

  bw-jobs-broker:
    image: valkey/valkey:8-alpine
    # noeviction on purpose: a broker that evicts under memory pressure drops queued
    # jobs on the floor, and nothing upstream would notice.
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "unless-stopped"
    networks:
      - bw-universe

  bw-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "bunkerweb"
      POSTGRES_PASSWORD: "changeme" # Remember to set a stronger password for the database
      POSTGRES_DB: "db"
    volumes:
      - bw-data:/var/lib/postgresql
    networks:
      - bw-db

  bw-docker:
    image: tecnativa/docker-socket-proxy:nightly
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      LOG_LEVEL: "warning"
    networks:
      - bw-docker

volumes:
  bw-worker-storage:
  bw-data:
  bw-storage:

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
  bw-docker:
    name: bw-docker
  bw-db:
    name: bw-db
