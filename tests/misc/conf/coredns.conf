.:53 {
  log
  errors
  health {
    lameduck 5s
  }
  ready
  kubernetes cluster.local in-addr.arpa ip6.arpa {
    pods insecure
    fallthrough in-addr.arpa ip6.arpa
    ttl 30
  }
  # Authoritative NXDOMAIN for ndots:5 search-path escapes like
  # `registry.kube-system.svc.cluster.local.<host-search-domain>`. Without this,
  # such names fall through to `forward . /etc/resolv.conf` and get answered by
  # the host's upstream DNS (e.g. dedyn.io wildcard DNS), causing in-cluster
  # service hostnames to resolve to public IPs. This breaks, among other things,
  # registry-proxy -> registry bootstrap (nginx never starts, host push fails).
  # Matches any name of the form `*.cluster.local.<anything>.` — i.e. cluster.local
  # appearing as an INNER suffix rather than the terminal one. Legitimate absolute
  # FQDNs that end in `cluster.local.` are handled by the kubernetes plugin above
  # and do not match this regex.
  template IN ANY {
    match .+\.cluster\.local\..+\.$
    rcode NXDOMAIN
    fallthrough
  }
  prometheus :9153
  hosts {
    192.168.49.1 host.minikube.internal
    %HOSTS%
    fallthrough
  }
  forward . /etc/resolv.conf {
    max_concurrent 1000
  }
  rewrite name exact api.bunkerweb.io svc-custom-api.misc.svc.cluster.local
  cache 30 {
    disable success cluster.local
    disable denial cluster.local
  }
  loop
  reload
  loadbalance
}
