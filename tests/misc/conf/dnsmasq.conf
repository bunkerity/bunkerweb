# /etc/dnsmasq.conf

# Prevent dnsmasq from running a DHCP server
no-dhcp-interface=

# Docker's own resolver first, and it has to be first: `strict-order` below means the list is
# tried in order and a public resolver answers NXDOMAIN for a container name rather than failing,
# which ends the query. An example names its application containers itself (`myapp1`), so with
# this last BunkerWeb could not resolve its own upstream and answered 502.
server=127.0.0.11

# Cloudflare DNS
server=1.1.1.1

# Google DNS
server=8.8.4.4
server=8.8.8.8

# Quad9 DNS
server=149.112.112.112
server=9.9.9.9

# Log DNS queries
log-queries

# dont use hosts nameservers
no-resolv

# Strict order for DNS servers
strict-order

# Specify additional hosts file
addn-hosts=/etc/dnsmasq.hosts

# Create a canonical name
cname=api.bunkerweb.io,custom-api

# Specify the maximum number of concurrent DNS queries
dns-forward-max=5096

# Specify the maximum number of concurrent DNS queries for a single domain
min-cache-ttl=300

# Specify the rebind protection
rebind-domain-ok=
