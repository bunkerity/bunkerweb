services:
  syslog:
    image: balabit/syslog-ng:4.10.2@sha256:4c080c73e493b227b0cd1d38d26f13ebd1f8a3bba4046ee52f9e92b963da2b4d
    container_name: syslog
    ports:
      - "514:514/udp"
      - "601:601/tcp"
    command: --no-caps
    cap_add:
      - NET_BIND_SERVICE # Bind to low ports
      - NET_BROADCAST # Send broadcasts
      - NET_RAW # Use raw sockets
      - DAC_READ_SEARCH # Read files bypassing permissions
      - DAC_OVERRIDE # Override file permissions
      - CHOWN # Change ownership
      - SYSLOG # Write to system logs
    volumes:
      - ../conf/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf
      - /var/log/bunkerweb:/var/log/bunkerweb
    networks:
      bw-universe:
        ipv4_address: 10.20.30.254

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
