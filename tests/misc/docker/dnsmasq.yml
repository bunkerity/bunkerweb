services:
  dnsmasq:
    image: dockurr/dnsmasq:2.91@sha256:7873ce2dae1b0aa51d2c13dd4bd3aad47890c233088b3c7f6eb099a01e6e4307
    container_name: dnsmasq
    ports:
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
    command: --log-facility=/dev/stdout
    volumes:
      - ../conf/dnsmasq.conf:/etc/dnsmasq.conf
      - ../conf/dnsmasq.hosts:/etc/dnsmasq.hosts
    networks:
      bw-universe:
        ipv4_address: 10.20.30.20
      # Also on bw-services, for what it forwards rather than what it answers: unknown names go
      # to Docker's own resolver (server=127.0.0.11 in dnsmasq.conf), which only knows the
      # containers sharing a network with dnsmasq itself. An example brings its application
      # containers up there under their own aliases (`myapp1`), and without this BunkerWeb got
      # NXDOMAIN for its own upstream -- a 502 that reads like the application being down.
      bw-services:
        ipv4_address: 192.168.0.20
    restart: "unless-stopped"
    cap_add:
      - NET_ADMIN

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
    ipam:
      driver: default
      config:
        - subnet: 192.168.0.0/24
