        LOCAL_PHP_PATH: "/var/www/html"
    Kubernetes:
      string: 'alt="NGINX Logo"'
      config:
        REMOTE_PHP: null
        REMOTE_PHP_PATH: null

  ignored_user_agent:
    type: string
    url: "http://www.example.com"
    string: "Hello World!"
    follow_redirects: true
    headers:
      User-Agent: "BunkerBot"
    config:
      ANTIBOT_IGNORE_USER_AGENT: "BunkerBot"
      USE_REAL_IP: "yes"
      REAL_IP_FROM: "0.0.0.0/0"
      REMOTE_PHP: "php-fpm"
      REMOTE_PHP_PATH: "/var/www/html"
    Linux:
      config:
        REMOTE_PHP: null
        REMOTE_PHP_PATH: null
        LOCAL_PHP: "/run/php/php-fpm.sock"
        LOCAL_PHP_PATH: "/var/www/html"
    Kubernetes:
      string: 'alt="NGINX Logo"'
      config:
        REMOTE_PHP: null
        REMOTE_PHP_PATH: null

  ignored_uri:
    type: status
    url: "http://www.example.com/api"
    status: 404
    config:
      ANTIBOT_IGNORE_URI: "^/api"
    Kubernetes:
      status: 200

  ignored_uri_query:
    type: status
    url: "http://www.example.com/api?a=b&c=d"
    status: 404
    restart_stack: false
    config:
      ANTIBOT_IGNORE_URI: "^/api[?]a=b&c=d$"
    Kubernetes:
      status: 200

  ignored_uri_query_cache_miss:
    type: status
    url: "http://www.example.com/api?a=b&c=other"
    status: 302

  ignored_uri_multivalue_query:
    type: status
    url: "http://www.example.com/api?token=ok"
    status: 404
    config:
      ANTIBOT_IGNORE_URI: "^/admin$ ^/api[?]token=ok$"
    Kubernetes:
      status: 200

  only_us:
    type: string
    url: "http://www.example.com"
    string: 'name="captcha"'
    follow_redirects: true
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      ANTIBOT_ONLY_COUNTRY: "US"
      USE_REAL_IP: "yes"
      REAL_IP_FROM: "0.0.0.0/0"
      REMOTE_PHP: "php-fpm"
      REMOTE_PHP_PATH: "/var/www/html"
    Linux:
      config:
        REMOTE_PHP: null
        REMOTE_PHP_PATH: null
        LOCAL_PHP: "/run/php/php-fpm.sock"
        LOCAL_PHP_PATH: "/var/www/html"
    Kubernetes:
      string: 'alt="NGINX Logo"'
      config:
        REMOTE_PHP: null
        REMOTE_PHP_PATH: null
    restart_stack: false
  only_us_1:
