# Example-backed spec: the stack under test is examples/load-balancer itself,
# deployed the way a user would deploy it. The assertions live here so that the
# example directory holds only what someone reading the documentation needs.
example: load-balancer

integrations:
  - "Docker"

actions:
  string_check:
    type: string
    url: "https://www.example.com"
    string: "hello"
    ignore_case: true
    follow_redirects: true
    tls: "www.example.com"
    timeout: 120
