# Example-backed spec: the stack under test is examples/behind-reverse-proxy itself,
# deployed the way a user would deploy it. The assertions live here so that the
# example directory holds only what someone reading the documentation needs.
example: behind-reverse-proxy

integrations:
  - "Docker"
  # not converted: linux

actions:
  string_check:
    type: string
    url: "http://www.example.com"
    string: "hello"
    ignore_case: true
    # Same as every other example stack: the redirect lands on HTTPS and the certificate is
    # the self-signed fallback, since the test domains never leave the framework's dnsmasq.
    follow_redirects: true
    verify_ssl: false
    timeout: 210
