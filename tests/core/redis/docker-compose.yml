version: "3.5"

x-redis-sentinel: &redis-sentinel
  image: redis:8-alpine
  volumes:
    - ./acl:/acl:ro
    - ./tls:/tls:ro
  environment:
    REDIS_SENTINEL_PORT_NUMBER: "26379"
    REDIS_MASTER_HOST: "bw-redis"
    REDIS_MASTER_PORT_NUMBER: "6379"
    REDIS_MASTER_USERNAME: "bunkerweb"
    REDIS_MASTER_PASSWORD: ""
  command:
    - sh
    - -c
    - |
      until getent hosts "$${REDIS_MASTER_HOST}" >/dev/null 2>&1; do sleep 1; done
      cat > /tmp/sentinel.conf <<EOF
      port $${REDIS_SENTINEL_PORT_NUMBER}
      sentinel resolve-hostnames yes
      sentinel monitor bw-master $${REDIS_MASTER_HOST} $${REDIS_MASTER_PORT_NUMBER} 2
      sentinel down-after-milliseconds bw-master 5000
      sentinel failover-timeout bw-master 10000
      sentinel parallel-syncs bw-master 1
      EOF
      if [ -n "$${REDIS_MASTER_PASSWORD}" ]; then
        echo "sentinel auth-user bw-master $${REDIS_MASTER_USERNAME}" >> /tmp/sentinel.conf
        echo "sentinel auth-pass bw-master $${REDIS_MASTER_PASSWORD}" >> /tmp/sentinel.conf
      fi
      retries=0
      until redis-server /tmp/sentinel.conf --sentinel --aclfile /acl/sentinel.acl; do
        retries=$$((retries + 1))
        [ "$${retries}" -ge 30 ] && exit 1
        sleep 1
      done
  depends_on:
    - bw-redis
    - bw-redis-slave
  healthcheck:
    test:
      [
        "CMD-SHELL",
        'redis-cli -p "$${REDIS_SENTINEL_PORT_NUMBER}" --raw SENTINEL replicas bw-master | grep -q ''^ip$''',
      ]
    interval: 1s
    timeout: 3s
    retries: 30
  networks:
    - bw-services

services:
  bw:
    image: bunkerweb-tests
    pull_policy: never
    depends_on:
      - bw-redis
    labels:
      - "bunkerweb.INSTANCE=yes"
    volumes:
      - ./index.html:/var/www/html/index.html
    environment:
      API_WHITELIST_IP: "127.0.0.0/8 10.77.3.0/24 192.168.77.253"
    networks:
      bw-universe:
      bw-services:
        ipv4_address: 192.168.77.254

  bw-scheduler:
    image: scheduler-tests
    pull_policy: never
    depends_on:
      - bw
    environment:
      BUNKERWEB_INSTANCES: "bw"
      API_WHITELIST_IP: "127.0.0.0/8 10.77.3.0/24 192.168.77.253"
      HTTP_PORT: "80"
      USE_BUNKERNET: "no"
      SEND_ANONYMOUS_REPORT: "no"
      BLACKLIST_IP_URLS: ""
      LOG_LEVEL: "info"
      SESSIONS_NAME: "test"
      USE_REVERSE_SCAN: "no"
      USE_ANTIBOT: "no"
      USE_GREYLIST: "yes"
      GREYLIST_IP: "0.0.0.0/0"
      WHITELIST_COUNTRY: "AU"
      CUSTOM_LOG_LEVEL: "debug"

      # ? REDIS settings
      USE_REDIS: "yes"
      REDIS_HOST: "bw-redis"
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_SSL: "no"
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""
      REDIS_SENTINEL_HOSTS: ""
      REDIS_SENTINEL_USERNAME: ""
      REDIS_SENTINEL_PASSWORD: ""
      REDIS_SENTINEL_MASTER: "bw-master"
      CUSTOM_CONF_SERVER_HTTP_ready: |
        location /ready {
          default_type 'text/plain';
          rewrite_by_lua_block {
            ngx.print('ready')
            ngx.flush(true)
            ngx.exit(ngx.HTTP_OK)
          }
        }
    networks:
      - bw-universe

  bw-redis:
    image: redis:8-alpine
    volumes:
      - ./acl:/acl:ro
      - ./tls:/tls:ro
    environment:
      REDIS_PORT_NUMBER: "6379"
      REDIS_TLS_PORT_NUMBER: "6379"
      REDIS_TLS_ENABLED: "no"
      REDIS_TLS_AUTH_CLIENTS: "yes"
    command:
      - sh
      - -c
      - |
        if [ "$${REDIS_TLS_ENABLED}" = "yes" ]; then
          exec redis-server --port 0 --tls-port "$${REDIS_TLS_PORT_NUMBER}" --tls-cert-file /tls/redis.pem --tls-key-file /tls/redis.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients "$${REDIS_TLS_AUTH_CLIENTS}" --aclfile /acl/redis.acl
        else
          exec redis-server --port "$${REDIS_PORT_NUMBER}" --aclfile /acl/redis.acl
        fi
    networks:
      - bw-services

  bw-redis-slave:
    image: redis:8-alpine
    volumes:
      - ./acl:/acl:ro
      - ./tls:/tls:ro
    environment:
      REDIS_PORT_NUMBER: "6379"
      REDIS_TLS_PORT_NUMBER: "6379"
      REDIS_TLS_ENABLED: "no"
      REDIS_TLS_AUTH_CLIENTS: "yes"
      REDIS_MASTER_HOST: "bw-redis"
      REDIS_MASTER_PORT_NUMBER: "6379"
      REDIS_MASTER_USERNAME: "bunkerweb"
      REDIS_MASTER_PASSWORD: ""
    command:
      - sh
      - -c
      - |
        if [ "$${REDIS_TLS_ENABLED}" = "yes" ]; then
          if [ -n "$${REDIS_MASTER_PASSWORD}" ]; then
            exec redis-server --port 0 --tls-port "$${REDIS_TLS_PORT_NUMBER}" --tls-cert-file /tls/redis.pem --tls-key-file /tls/redis.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients "$${REDIS_TLS_AUTH_CLIENTS}" --tls-replication yes --aclfile /acl/redis.acl --replicaof "$${REDIS_MASTER_HOST}" "$${REDIS_MASTER_PORT_NUMBER}" --masteruser "$${REDIS_MASTER_USERNAME}" --masterauth "$${REDIS_MASTER_PASSWORD}"
          else
            exec redis-server --port 0 --tls-port "$${REDIS_TLS_PORT_NUMBER}" --tls-cert-file /tls/redis.pem --tls-key-file /tls/redis.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients "$${REDIS_TLS_AUTH_CLIENTS}" --tls-replication yes --aclfile /acl/redis.acl --replicaof "$${REDIS_MASTER_HOST}" "$${REDIS_MASTER_PORT_NUMBER}"
          fi
        elif [ -n "$${REDIS_MASTER_PASSWORD}" ]; then
          exec redis-server --port "$${REDIS_PORT_NUMBER}" --aclfile /acl/redis.acl --replicaof "$${REDIS_MASTER_HOST}" "$${REDIS_MASTER_PORT_NUMBER}" --masteruser "$${REDIS_MASTER_USERNAME}" --masterauth "$${REDIS_MASTER_PASSWORD}"
        else
          exec redis-server --port "$${REDIS_PORT_NUMBER}" --aclfile /acl/redis.acl --replicaof "$${REDIS_MASTER_HOST}" "$${REDIS_MASTER_PORT_NUMBER}"
        fi
    depends_on:
      - bw-redis
    networks:
      - bw-services

  bw-redis-sentinel-1:
    <<: *redis-sentinel
  bw-redis-sentinel-2:
    <<: *redis-sentinel
  bw-redis-sentinel-3:
    <<: *redis-sentinel

networks:
  bw-universe:
    name: fixtures_redis_universe
    ipam:
      driver: default
      config:
        - subnet: 10.77.3.0/24
  bw-services:
    name: fixtures_redis_services
    ipam:
      driver: default
      config:
        - subnet: 192.168.77.0/24
