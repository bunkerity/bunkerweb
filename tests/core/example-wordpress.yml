# Example-backed spec: the stack under test is examples/wordpress itself,
# deployed the way a user would deploy it. The assertions live here so that the
# example directory holds only what someone reading the documentation needs.
example: wordpress

integrations:
  - "Docker"
  - "Autoconf"
  # Not Linux: the framework's PHP for that integration is the `php:fpm-alpine` helper
  # (tests/misc/docker/php.yml), which ships no mysqli and has no database next to it, so
  # WordPress answers 500 on every request. A reader on Linux installs php-fpm and php-mysql
  # from their distribution; giving the helper the same would be a change to every integration
  # for one example. Same reason keeps `nextcloud` off Linux.

actions:
  string_check:
    type: string
    url: "https://www.example.com"
    verify_ssl: false
    string: "wordpress"
    ignore_case: true
    follow_redirects: true
    timeout: 120
    delay: 120
