integrations: "all"

actions:
  blacklist_good:
    type: status
    url: "http://www.example.com"
    status: 200
    headers:
      X-Forwarded-For: "84.200.69.80"
    config:
      BLACKLIST_COUNTRY: "US"
    restart_stack: false
  blacklist_bad:
    type: status
    url: "http://www.example.com"
    status: 403
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"

  whitelist_good:
    type: status
    url: "http://www.example.com"
    status: 200
    headers:
      X-Forwarded-For: "84.200.69.80"
    config:
      WHITELIST_COUNTRY: "DE"
    restart_stack: false
  whitelist_bad:
    type: status
    url: "http://www.example.com"
    status: 403
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      WHITELIST_COUNTRY: "DE"

  ignore_uri_blacklist:
    type: status
    url: "http://www.example.com/api"
    status: 404
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"
      COUNTRY_IGNORE_URI: "^/api"
    Kubernetes:
      status: 200

  ignore_uri_blacklist_not_matched:
    type: status
    url: "http://www.example.com/other"
    status: 403
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"
      COUNTRY_IGNORE_URI: "^/api"

  ignore_uri_query:
    type: status
    url: "http://www.example.com/api?a=b&c=d"
    status: 404
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"
      COUNTRY_IGNORE_URI: "^/api[?]a=b&c=d$"
    Kubernetes:
      status: 200

  ignore_uri_query_not_matched:
    type: status
    url: "http://www.example.com/api?a=b&c=other"
    status: 403
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"
      COUNTRY_IGNORE_URI: "^/api[?]a=b&c=d$"

  ignore_uri_multivalue:
    type: status
    url: "http://www.example.com/api?token=ok"
    status: 404
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"
      COUNTRY_IGNORE_URI: "^/admin$ ^/api[?]token=ok$"
    Kubernetes:
      status: 200

  ignore_uri_whitelist:
    type: status
    url: "http://www.example.com/api"
    status: 404
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      WHITELIST_COUNTRY: "DE"
      COUNTRY_IGNORE_URI: "^/api"
    Kubernetes:
      status: 200

  ignore_uri_lookahead_checked_path:
    type: status
    url: "http://www.example.com/search"
    status: 403
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"
      COUNTRY_IGNORE_URI: "^/(?!search)"

  ignore_uri_lookahead_other_path:
    type: status
    url: "http://www.example.com/other"
    status: 404
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"
      COUNTRY_IGNORE_URI: "^/(?!search)"
    restart_stack: false
    Kubernetes:
      status: 200

  # The raw path of the next three is routed to /search by NGINX: it must be checked, not ignored.
  ignore_uri_lookahead_double_slash:
    type: status
    url: "http://www.example.com//search"
    status: 403
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"
      COUNTRY_IGNORE_URI: "^/(?!search)"
    restart_stack: false

  ignore_uri_lookahead_percent_encoded:
    type: status
    url: "http://www.example.com/%73earch"
    status: 403
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"
      COUNTRY_IGNORE_URI: "^/(?!search)"
    restart_stack: false

  # The HTTP client drops a literal /./ segment before sending, so the dot is percent-encoded.
  ignore_uri_lookahead_dot_segment:
    type: status
    url: "http://www.example.com/%2e/search"
    status: 403
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"
      COUNTRY_IGNORE_URI: "^/(?!search)"
    restart_stack: false

config:
  USE_REAL_IP: "yes"
  REAL_IP_FROM: "0.0.0.0/0"
