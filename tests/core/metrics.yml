# The metrics plugin buffers a blocked-request report in the Lua LRU only when a plugin set a
# reason (metrics.lua:590 metrics:log(), `if reason then ... end`) -- a plain 404 from a missing
# file under /var/www/html sets none, so it is invisible to the reports feature no matter how
# many are sent. BLACKLIST_COUNTRY does set one (country.lua calls set_reason), and 403 is inside
# the 4xx `is_report()` window, so reusing the same blacklist-by-country trick country.yml and
# geoip.yml already rely on is what actually produces a persisted row here -- not a red herring,
# the trigger IS the subject under test's precondition.
#
# The scrape-persist-reports job (every: minute) is what moves a buffered report from the Lua LRU
# into bw_metrics_requests. Waiting a real minute is avoidable: JobScheduler.run_once() dispatches
# EVERY job of a changed plugin regardless of its `every`, and the scheduler's reload() is called
# on every config push -- so an action that changes a METRICS_* setting forces an immediate scrape,
# and wait_config.py's jobs_queue_quiet() (tests/wait_config.py) blocks the next action until that
# dispatch has actually finished, not merely started. Splitting "make the blocked request" and
# "change a METRICS_* setting" into two actions is what lets that ordering happen: dispatching the
# scrape in the SAME action as the blocked request would race it against the request that has not
# been made yet.
integrations:
  - "Docker"

config:
  USE_REAL_IP: "yes"
  REAL_IP_FROM: "0.0.0.0/0"

api:
  API_USERNAME: "admin"
  API_PASSWORD: "P@ssw0rd"

actions:
  blocked_http_request_is_buffered:
    type: status
    url: "http://www.example.com/"
    status: 403
    headers:
      X-Forwarded-For: "8.8.8.8"
    config:
      BLACKLIST_COUNTRY: "US"

  report_lands_in_the_database_with_the_http_discriminator:
    # No new HTTP request here on purpose: this action's only job is to force the scrape (see
    # the file banner) and then read what it persisted from the blocked request above.
    type: database
    query: "SELECT protocol, status, server_name FROM bw_metrics_requests WHERE ip = '8.8.8.8' AND reason LIKE '%country%' ORDER BY id DESC LIMIT 1"
    result: "http|403|www.example.com"
    config:
      BLACKLIST_COUNTRY: "US"
      METRICS_MAX_BLOCKED_REQUESTS: "2k"

  the_api_serves_the_same_report_back:
    # Docker only: dials the API on loopback:8888, the same pattern customcert.yml uses for the
    # certificate inventory. `search` is the DataTables free-text filter the UI itself sends
    # (db_methods/metrics.py); www.example.com is specific enough on a single-service stack that
    # this is unambiguous evidence the row above and this response describe the same event.
    type: string
    integrations:
      - "Docker"
    url: "http://127.0.0.1:8888/metrics/requests?search=www.example.com"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"protocol":"http"'

  the_api_reports_the_right_status_and_country:
    type: string
    integrations:
      - "Docker"
    url: "http://127.0.0.1:8888/metrics/requests?search=www.example.com"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"status":403'

  # --- METRICS_REDIS_TTL in the 1.6.16 suffixed form ---------------------------------------------
  # `1h` must reach Redis as 3600 seconds. The plugin used to read the value with its count parser,
  # where a trailing `m` meant millions and `h` did not parse; now it goes through the duration
  # parser. REDIS_TIMEOUT and REDIS_KEEPALIVE_IDLE carry a suffix too (`5s`, `30s`): the WAF
  # clusterstore reads them in milliseconds, and a misread value would leave Redis unreachable, so
  # the key below would never appear.
  #
  # The `redis` action matches a substring of the reply and the TTL keeps moving, so the key is
  # probed with EXPIRE ... LT (Redis 7+, sets the TTL only when the new one is SHORTER than the
  # current one, replies 1 if it did, 0 if not -- a key with no TTL counts as infinite):
  #   LT 3601 -> 0 : the TTL is already at most 3601 s, so it is not the 30 day default and not
  #                  permanent (a missing key also answers 0, hence the second probe);
  #   LT 3000 -> 1 : the TTL is above 3000 s, which also proves the key exists. It rewrites the TTL
  #                  to 3000 s; the next metrics cycle puts it back to 3600 s.
  # `requests:facets:initialized` is one of the keys `refresh_request_ttls` touches on every cycle.
  suffixed_ttl_blocked_request:
    type: status
    url: "http://www.example.com/"
    status: 403
    headers:
      X-Forwarded-For: "8.8.4.4"
    restart_stack: false
    config:
      BLACKLIST_COUNTRY: "US"
      USE_REDIS: "yes"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DATABASE: "1"
      REDIS_SSL: "no"
      REDIS_TIMEOUT: "5s"
      REDIS_KEEPALIVE_IDLE: "30s"
      METRICS_REDIS_TTL: "1h"
  suffixed_ttl_is_not_the_default:
    type: redis
    Docker:
      port: 6390
    query: "EXPIRE requests:facets:initialized 3601 LT"
    result: "0"
    delay: 20
    restart_stack: false
  suffixed_ttl_is_about_one_hour:
    type: redis
    Docker:
      port: 6390
    query: "EXPIRE requests:facets:initialized 3000 LT"
    result: "1"
    restart_stack: false
  # Leaves nothing behind for the next category: the product and the harness share this Redis.
  suffixed_ttl_cleanup:
    type: redis
    Docker:
      port: 6390
    query: "FLUSHALL"
    result: "True"
    full_clean: true
