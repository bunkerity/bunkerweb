integrations: "all"

actions:
  check_ssl:
    type: ssl
    url: "https://www.example.com"
    verify_ssl: false
    ssl_expiration: 365
    ssl_subject: "/CN=www.example.com/"
    restart_stack: false
  auto_redirect_https:
    type: status
    url: "http://www.example.com"
    status: 301
  check_ssl_data:
    type: ssl
    url: "https://www.example.com"
    verify_ssl: false
    ssl_expiration: 365
    ssl_subject: "/CN=www.example.com/"
    config:
      CUSTOM_SSL_CERT: ""
      CUSTOM_SSL_KEY: ""
      CUSTOM_SSL_CERT_DATA: "${CUSTOM_SSL_CERT_DATA}"
      CUSTOM_SSL_KEY_DATA: "${CUSTOM_SSL_KEY_DATA}"
  # USE_CUSTOM_SSL on with no certificate path and no inline data: nothing custom to serve, so the
  # default certificate is. Same subject as the letsencrypt fallback.
  fallback_to_default:
    type: ssl
    url: "https://www.example.com"
    verify_ssl: false
    ssl_expiration: 3650
    ssl_subject: "/C=AU/ST=Some-State/O=Internet Widgits Pty Ltd/CN=www.example.org/"
    config:
      CUSTOM_SSL_CERT: ""
      CUSTOM_SSL_KEY: ""
  # USE_CUSTOM_SSL off: no certificate is configured, so plain HTTP is served as is. With it on,
  # `auto_redirect_https` above gets a 301.
  deactivated:
    type: status
    url: "http://www.example.com"
    status: 200
    config:
      USE_CUSTOM_SSL: "no"

config:
  USE_CUSTOM_SSL: "yes"
  CUSTOM_SSL_CERT: "/tmp/output/certificate.pem"
  CUSTOM_SSL_KEY: "/tmp/output/privatekey.key"
