integrations: "all"

# The certificate-inventory actions authenticate as `admin:P@ssw0rd` — without this block the
# generated stack creates no API user at all and every view answers 401 Unauthorized.
api:
  API_USERNAME: "admin"
  API_PASSWORD: "P@ssw0rd"

actions:
  check_ssl:
    type: ssl
    url: "https://www.example.com"
    verify_ssl: false
    ssl_expiration: 365
    ssl_subject: "/CN=www.example.com/"
    restart_stack: false
  # 1.7 mirrors the two providers that never had a page of their own into the central certificate
  # inventory, so the material an operator can see and manage is the material actually in use.
  # `check_ssl` above proves the certificate is served; these prove the inventory learned about the
  # same act of issuance -- a provider that stopped mirroring would leave `check_ssl` green and the
  # certificates page empty. Docker only for now -- not evaluated for Autoconf/Kubernetes as part of
  # the wave-19 default-server pass below (out of that lane's 8-action scope); loopback:8888 is
  # NOT Docker-exclusive (see the reserved-default-server actions' comment further down), so if
  # these stay Docker-only the real reason is something else about the assertions (single-service
  # `?source=` scoping? single-site-only `service_id`?) and needs its own look, not an assumption.
  the_certificate_is_mirrored_into_the_inventory:
    type: string
    integrations:
      - "Docker"
    url: "http://127.0.0.1:8888/certificates?source=customcert"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"source":"customcert"'
    restart_stack: false
  the_inventory_entry_is_attached_to_the_service:
    type: string
    integrations:
      - "Docker"
    url: "http://127.0.0.1:8888/certificates?source=customcert"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"service_id":"www.example.com"'
    restart_stack: false
  the_inventory_entry_is_the_services_primary_certificate:
    # The `certificates` plugin materializes a service's PRIMARY attachment and hands it to NGINX
    # ahead of the settings-driven providers, so an entry attached without that flag would be
    # inventoried and never served.
    #
    # Three actions rather than one needle spanning the whole attachment object: `attachments` is a
    # nested JSON object whose key order is not part of any contract, so
    # `"service_id":...,"is_primary":true` as one string would be a wire-format bet. Split, they are
    # a weaker conjunction -- an entry attached to some OTHER service while this one is primary
    # would satisfy both -- but the `?source=` filter already scopes the response to one provider on
    # a single-service stack, and the alternative fails for a reason that has nothing to do with the
    # feature.
    type: string
    integrations:
      - "Docker"
    url: "http://127.0.0.1:8888/certificates?source=customcert"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"is_primary":true'
    restart_stack: false

  auto_redirect_https:
    type: status
    url: "http://www.example.com"
    status: 301
  check_ssl_data:
    type: ssl
    url: "https://www.example.com"
    verify_ssl: false
    ssl_expiration: 365
    ssl_subject: "/CN=www.example.com/"
    config:
      CUSTOM_SSL_CERT: ""
      CUSTOM_SSL_KEY: ""
      CUSTOM_SSL_CERT_DATA: "${CUSTOM_SSL_CERT_DATA}"
      CUSTOM_SSL_KEY_DATA: "${CUSTOM_SSL_KEY_DATA}"

  # --- default server certificate override (DEFAULT_SERVER_SSL_CERT / _KEY, option (a)) ---
  #
  # Two fixture certificates, from `tests/scripts/before/customcert.sh`:
  #   * CN=www.example.com (SAN www.example.com) -- the configured service's own. Handing THAT to
  #     the default server is exactly what the coalescence guard refuses: a certificate the default
  #     server may show for an unknown SNI must not also be usable for a service that never asked
  #     for it.
  #   * CN=unknown.test (SAN unknown.test) -- covers no configured service, so it is accepted.
  #
  # The internal leaf the refusal falls back to is the one `generate_default_server_cert`
  # (`src/common/helpers/utils.sh`) writes at boot; its subject and lifetime are the ones
  # `tests/core/ssl.yml:default_server_ssl` already pins.
  #
  # `restart_stack: false` means the NEXT action's config is never applied
  # (`tests/models/action.py`), so an action carrying a `config:` is always preceded by one that
  # restarts. Do not reorder these without re-checking that.
  default_server_override_refused_unknown_sni:
    type: ssl
    url: "https://localhost"
    verify_ssl: false
    ssl_expiration: 3650
    ssl_subject: "/C=AU/ST=Some-State/O=Internet Widgits Pty Ltd/CN=www.example.org/"
    All-in-one:
      url: "https://localhost/setup"
    config:
      DEFAULT_SERVER_SSL_CERT_DATA: "${CUSTOM_SSL_CERT_DATA}"
      DEFAULT_SERVER_SSL_KEY_DATA: "${CUSTOM_SSL_KEY_DATA}"
  # No SNI at all: Python omits the extension for an IP literal. Every certificate provider returns
  # early without a SNI, which is the path the override exists for.
  #
  # NOT a refusal assertion, despite the name (Criticos round 2, C2): this action carries no
  # `config:`, and its predecessor leaves `restart_stack` at its default true, so the stack is
  # regenerated from the base config and NO `DEFAULT_SERVER_SSL_*` override is live by the time it
  # runs -- measured in ci1-harness-docker-customcert.log ("Generating ... _refused_without_sni"
  # 23:10:28, "Restarting current stack" 23:10:29). What it really pins is the no-SNI fallback to
  # the internal leaf. Making it assert the refusal needs `restart_stack: false` on the action
  # above, which is a behavioural spec change and a harness run: deliberately not done here.
  #
  # KUBERNETES ADDED (wave 19): the internal leaf is generated unconditionally at boot by
  # `generate_default_server_cert` (`src/bw/entrypoint.sh:103`), the same entrypoint every arm's
  # BunkerWeb image runs. Unlike the sibling action below this one IS multisite-gated on
  # Autoconf/Kubernetes -- the no-SNI handshake still goes through `default-server-http.conf`
  # (`confs/http.conf:117-118`, included under `MULTISITE=yes`) -- but the fallback certificate it
  # serves is the same static directive on both paths: `/var/lib/bunkerweb/default-server-cert.pem`
  # on `ssl_certificate` in both `default-server-http.conf:71-72` (multisite) and
  # `server-http/ssl-certificate-lua.conf:1-2` (single-site). No provider resolves a certificate
  # without SNI, so the runner returns without calling `set_cert` and NGINX falls back to that same
  # directive either way -- single-site vs. multisite changes which template renders it, not which
  # certificate comes back, so it is not a distinguishing precondition for this assertion. Not
  # All-in-one: its default answer is the `/setup` wizard page (see the sibling
  # `default_server_override_refused_unknown_sni`'s `All-in-one:` override above), which this
  # action has no override for.
  default_server_override_refused_without_sni:
    type: ssl
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "Kubernetes"
    url: "https://127.0.0.1"
    verify_ssl: false
    ssl_expiration: 3650
    ssl_subject: "/C=AU/ST=Some-State/O=Internet Widgits Pty Ltd/CN=www.example.org/"
  # The accepted path: a certificate covering no configured service IS served for an unknown SNI,
  # in place of the internal self-signed leaf.
  #
  # MULTISITE ARMS ONLY. `ssl_certificate_default` -- the phase that consults this override -- is
  # appended by `confs/default-server-http.conf` and nowhere else, and `confs/http.conf` includes
  # that file only under `MULTISITE=yes`, `DISABLE_DEFAULT_SERVER=yes` or `IS_LOADING=yes`. The
  # Docker and Linux arms are single-site, so `www.example.com`'s own block is NGINX's implicit
  # default there and answers this handshake with the STATIC internal leaf
  # (`confs/server-http/ssl-certificate-lua.conf`), which is why the two refusal actions above stay
  # on every arm while this one cannot. Autoconf and Kubernetes set `MULTISITE=yes`
  # (`tests/generate.py`), the all-in-one entrypoint defaults it to `yes`.
  default_server_override_is_served_for_an_unknown_sni:
    type: ssl
    integrations:
      - "Autoconf"
      - "Kubernetes"
      - "All-in-one"
    url: "https://localhost"
    verify_ssl: false
    ssl_expiration: 365
    ssl_subject: "/CN=unknown.test/"
    All-in-one:
      url: "https://localhost/setup"
    config:
      DEFAULT_SERVER_SSL_CERT_DATA: "${DEFAULT_SERVER_SSL_CERT_DATA}"
      DEFAULT_SERVER_SSL_KEY_DATA: "${DEFAULT_SERVER_SSL_KEY_DATA}"
    restart_stack: false
  # Known SNI: the service keeps its own certificate. The override phase runs only inside the default
  # server and only after every SNI-indexed provider declined, so a configured service can never be
  # displaced by it.
  #
  # This runs on every arm, but it is not the same check on all of them. On Autoconf, Kubernetes and
  # All-in-one the action above has `restart_stack: false`, so this one meets the SAME stack with the
  # override live -- the displacement case. On Docker and Linux that action does not run at all now,
  # the predecessor is `default_server_override_refused_without_sni` with the default
  # `restart_stack: true`, and the stack is regenerated with no `DEFAULT_SERVER_SSL_*` at all: here
  # this is the weaker "the service still serves its own certificate" check. Kept on those arms
  # deliberately -- it is pre-1.7 behaviour and cheap -- but it is not evidence about the override
  # there.
  default_server_override_does_not_displace_the_service:
    type: ssl
    url: "https://www.example.com"
    verify_ssl: false
    ssl_expiration: 365
    ssl_subject: "/CN=www.example.com/"
  # Strict SNI closes the connection in ssl_client_hello_by_lua_block, which runs BEFORE any
  # certificate can be chosen (`confs/default-server-http.conf`), so the override is inert by
  # construction -- there is no handshake left to serve a certificate into.
  #
  # AUTOCONF AND KUBERNETES, for the same reason the accepted-override action above is: that lua
  # block is in `default-server-http.conf` and nowhere else, so `DISABLE_DEFAULT_SERVER_STRICT_SNI`
  # has nothing to run in on a single-site deployment and the handshake simply completes. The code
  # path: `core/misc/misc.lua:ssl_client_hello_default` is called from `default-server-http.conf`
  # and from no other template, and `confs/http.conf` includes that file only under
  # `MULTISITE=yes`, `DISABLE_DEFAULT_SERVER=yes` or `IS_LOADING=yes`. Kubernetes sets
  # `MULTISITE=yes` exactly like Autoconf (`tests/generate.py:186`), and `ssl_client_hello_by_lua_block`
  # runs before `ssl_certificate_by_lua_block` regardless of integration (NGINX phase order, not
  # config), so the same code path applies unmodified. Measured too, on the Docker arm before this
  # restriction: "SSL connection succeeded but was expected to fail" -- it had never been reached
  # there before, because the accepted-override action ahead of it stopped the run first (that log
  # was overwritten by the green re-run; the excerpt is quoted in `report-CI-1.md`).
  default_server_override_is_inert_under_strict_sni:
    type: ssl
    integrations:
      - "Autoconf"
      - "Kubernetes"
    url: "https://localhost"
    verify_ssl: false
    success: false
    config:
      DEFAULT_SERVER_SSL_CERT_DATA: "${DEFAULT_SERVER_SSL_CERT_DATA}"
      DEFAULT_SERVER_SSL_KEY_DATA: "${DEFAULT_SERVER_SSL_KEY_DATA}"
      DISABLE_DEFAULT_SERVER_STRICT_SNI: "yes"

  # ---------------------------------------------------------------------------------------------
  # The reserved `default-server` pseudo-service (conception option (b)). It is what the override
  # above is stored against once the API has seeded it, so it belongs in this file rather than in a
  # spec of its own.
  #
  # AUTOCONF AND KUBERNETES, for two reasons at once. The row is multisite-only (PO ruling
  # 2026-09-06): `seed_default_server_service` skips it once the scheduler has completed a pass
  # with `MULTISITE != yes`, and `GET /services` hides it anyway (`api/app/routers/services.py`),
  # so on the single-site Docker and Linux arms all four assertions below would fail on a row that
  # is correctly absent. Autoconf and Kubernetes are both multisite arms, and both publish the
  # control-plane API on 127.0.0.1:8888 -- Autoconf via `tests/docker/docker-compose.api.yml`,
  # Kubernetes via `tests/k8s/bunkerweb-api.yml`'s `svc-bunkerweb-api-nodeport` (nodePort 30088) --
  # that manifest is applied unconditionally for every Kubernetes run (`tests/scripts/start.sh:551`,
  # `tests/scripts/utils.sh:1889`) -- plus the host-side `8888:30088` mapping in
  # `tests/scripts/minikube-ports.sh:6`, applied once at cluster creation (`minikube start --ports`,
  # `tests/scripts/build.sh:349,382`, `.github/workflows/integration-tests.yml:230-231`), not per
  # run. Same loopback URL, same runner-side reachability either way; the
  # `plugin_stats_api` action in `tests/core/bunkernet.yml` already dials 127.0.0.1:8888
  # unmodified on Kubernetes, proving the path. (Wave-12 note this corrects: "Kubernetes does not"
  # publish the API on 127.0.0.1:8888 was true of the compose file it named, not of the arm.)
  the_reserved_default_server_is_seeded_and_flagged:
    # Seeding happens in the API's own startup, on every boot and idempotently -- never in a
    # migration -- so a stack that has come up at all must already have the row. `"reserved":true`
    # is what tells a client to pin it and offer no delete; a row present but unflagged would look
    # to the UI like a service somebody created called "default-server".
    type: string
    integrations:
      - "Autoconf"
      - "Kubernetes"
    url: "http://127.0.0.1:8888/services"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"id":"default-server"'
    restart_stack: false
  the_reserved_default_server_is_flagged_reserved:
    type: string
    integrations:
      - "Autoconf"
      - "Kubernetes"
    url: "http://127.0.0.1:8888/services"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"reserved":true'
    restart_stack: false
  deleting_the_reserved_default_server_is_refused:
    # The refusal message, which per the PO's "user friendly" ruling says WHAT the reserved service
    # is rather than just refusing. `raise_for_status: false` is required for any non-2xx here
    # (tests/core_handlers/http_string_handler.py:18); that handler checks no status code at all,
    # so what is pinned is the BODY -- a 200 delete-success body cannot contain this string, which
    # is what keeps the assertion meaningful. If the delete ever succeeds the deployment loses its
    # configurable default server silently: the block falls back to the global-only rendering with
    # every stored setting still in the database and none of it applied.
    type: string
    integrations:
      - "Autoconf"
    url: "http://127.0.0.1:8888/services/default-server"
    method: DELETE
    # The refusal IS the assertion, so the 403 must not be raised before the body is read
    # (`tests/core_handlers/http_string_handler.py:18`). Measured, not guessed: this action had never
    # run anywhere -- it was Docker-only, Docker is single-site, and the action ahead of it stopped
    # the run -- and its first execution, on Autoconf, died on
    # `httpx.HTTPStatusError: Client error '403 Forbidden'` with the message never inspected.
    raise_for_status: false
    auth:
      - "admin"
      - "P@ssw0rd"
    string: "match no configured service"
    restart_stack: false
  the_reserved_default_server_survives_the_refused_delete:
    type: string
    integrations:
      - "Autoconf"
    url: "http://127.0.0.1:8888/services"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"id":"default-server"'

  # ---------------------------------------------------------------------------------------------
  # The single-site half of DS-B5 hunk 5, which shipped with its two consequences stated and
  # deliberately untested (`report-DS-B5.md` §2, "Neither is covered by a test"). The rule is that
  # `custom-cert.py` and `Templator.__init__` have to agree on WHICH name the single rendered block
  # is, because that name is the cache directory `customcert.lua` reads
  # (`/var/cache/bunkerweb/customcert/<first token of the rendered SERVER_NAME>/cert.pem`). A
  # disagreement is silent: the job reports success, the cache is written, nothing reads it, and the
  # instance quietly serves the self-signed fallback instead of the operator's certificate.
  #
  # Docker and Linux only -- they are the single-site arms. On a multisite arm `default-server` is
  # the reserved pseudo-service and neither case below exists.
  #
  # Both actions assert `ssl_subject`, not a status code: a regression here does not break the
  # handshake, it changes whose certificate ends the handshake.
  single_site_alias_caches_under_the_name_the_templator_rendered:
    # `SERVER_NAME: "default-server www.example.com"`. The Templator strips the reserved id because
    # something else remains, so the block is `server_name www.example.com` and the Lua reads
    # `customcert/www.example.com/`. The job has to strip it too. Mutation M7 -- the flat
    # `all_domains = kept if multisite else all_domains` gate, which is the shape this lane's own
    # round 1 shipped -- keeps `default-server` first here, caches under `customcert/default-server/`
    # and leaves this dialling a self-signed certificate.
    type: ssl
    integrations:
      - "Docker"
      - "Linux"
    url: "https://www.example.com"
    verify_ssl: false
    ssl_expiration: 365
    ssl_subject: "/CN=www.example.com/"
    config:
      SERVER_NAME: "default-server www.example.com"
  single_site_only_name_still_renders_and_loads_its_certificate:
    # `SERVER_NAME: "default-server"` and nothing else. Here the Templator KEEPS the name (hunk 1:
    # strip the reserved id unless nothing else remains), so the job must keep it too. The blind
    # strip -- mutation M6 -- empties `all_domains`, hits `No services found, exiting ...` before the
    # per-service branch, caches nothing, and silently ignores a configured USE_CUSTOM_SSL.
    #
    # Not a `type: ssl` assertion (report-DS-B6.md §0): single-site never renders
    # `default-server-http.conf` (`confs/http.conf` includes it only under
    # MULTISITE/DISABLE_DEFAULT_SERVER/IS_LOADING=yes), so `ssl_certificate_default` never runs and
    # the only SNI the runner can dial (`www.example.com`, per `models/action.py:check_runner_host`)
    # is answered by the static internal leaf instead of the certificate loaded for `default-server`
    # -- the handshake cannot tell this case apart from the one already pinned by the green
    # `default_server_override_refused_unknown_sni` above. Dialling the name the deployment actually
    # serves needs the bare `default-server` host resolvable by the runner, which is harness DNS
    # work left for wave 15.
    #
    # Pinned on the instance log instead: `customcert:init()` must reach and log its success line
    # for the `default-server` cache key, and must never hit the nil-concat error the blind strip in
    # `config_read.py` used to cause on an empty `SERVER_NAME` (guarded in `customcert.lua` above
    # `first_server`).
    type: status
    integrations:
      - "Docker"
      - "Linux"
    url: "https://www.example.com"
    verify_ssl: false
    status: 200
    log: "customcert:init() call successful : success"
    not_log: "attempt to concatenate a nil value"
    config:
      SERVER_NAME: "default-server"
    full_clean: true

config:
  USE_CUSTOM_SSL: "yes"
  CUSTOM_SSL_CERT: "/tmp/output/certificate.pem"
  CUSTOM_SSL_KEY: "/tmp/output/privatekey.key"
