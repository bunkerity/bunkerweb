integrations: "all"

actions:
  generate:
    type: bwcli
    command: "plugin backup save"
    result: "created successfully"
    repeat: 6 # ? One extra backup will be generated in Autoconf and Kubernetes
    cooldown: 1
    Linux:
      repeat: 7
    Docker:
      repeat: 7
    All-in-one:
      repeat: 7
    restart_stack: false
  check:
    type: bwcli
    command: "plugin backup list"
    result: "Found 8 backups"
  rotation:
    type: bwcli
    command: "plugin backup list"
    result: "Found 7 backups"
  custom_rotation:
    type: bwcli
    command: "plugin backup list"
    result: "Found 5 backups"
    config:
      BACKUP_ROTATION: "5"
  # ── Controlled downgrade (lot A manifest + lot D --execute) ────────────────────────────────
  # Report mode only: nothing here mutates, and nothing here needs a quiescence hold. What only a
  # real image can prove is that the manifest lot A ships is actually FOUND at runtime -- if it
  # were missing from the image, `downgrade` would print "No manifest entry" and every pair would
  # silently fall back to restore_only forever.
  downgrade_reports_without_mutating:
    type: bwcli
    command: "plugin backup downgrade 1.6.14"
    result: "Nothing was changed"
    not_result: "Pre-downgrade backup taken"
    restart_stack: false
  # A job still in flight when the harness reaches the action below is a deterministic red, not a
  # flake to retry away: `check_writers` (src/common/core/backup/downgrade.py:350-379) refuses the
  # preflight on ANY job queued or in flight, by design (push 15, Autoconf CI -- AIO and Linux
  # passed the same spec in the same run). This waits it out with the SAME read-only preflight the
  # command below runs -- `wait_for_writers_idle.py`'s own docstring has the detail -- bounded at
  # 120s, so the harness cannot mask a real refusal by waiting forever; it only ever waits out this
  # one check, and the action right after re-runs the full preflight for real.
  downgrade_preflight_waits_for_writers_idle:
    type: script
    script:
      [
        "python3",
        "tests/core/backup/wait_for_writers_idle.py",
        "Docker",
        "1.6.14",
      ]
    result: "writers are idle"
    restart_stack: false
    Linux:
      script:
        [
          "python3",
          "tests/core/backup/wait_for_writers_idle.py",
          "Linux",
          "1.6.14",
        ]
    Autoconf:
      script:
        [
          "python3",
          "tests/core/backup/wait_for_writers_idle.py",
          "Autoconf",
          "1.6.14",
        ]
    Kubernetes:
      script:
        [
          "python3",
          "tests/core/backup/wait_for_writers_idle.py",
          "Kubernetes",
          "1.6.14",
        ]
    All-in-one:
      script:
        [
          "python3",
          "tests/core/backup/wait_for_writers_idle.py",
          "All-in-one",
          "1.6.14",
        ]
  downgrade_finds_the_shipped_manifest:
    type: bwcli
    command: "plugin backup downgrade 1.6.14"
    # "The manifest marks" is printed only when a row for this exact (from, to, engine) was found,
    # and it is the same phrase on both branches, so it does not pin the engine. Matching bare
    # "manifest" would have matched the check-name column and asserted nothing.
    result: "The manifest marks"
    not_result: "No manifest entry"
    restart_stack: false
  # The refusal half of the contract: without --execute the command reports success for a go and
  # for a restore_only answer, and FAILURE for `refuse` (bwcli/downgrade_execute.py:64, PO-4
  # option (b)), so a pipeline gating on it cannot sail past a half-finished migration. Asserting
  # the message alone would have passed on success too, which is the whole point of the exit_code
  # key.
  #
  # 1 and not 3, deliberately: `downgrade_execute.py` exits `EXECUTE_EXIT_CODES[REFUSED]` = 3, but
  # `bwcli` collapses every non-zero code -- src/common/cli/CLI.py:803-812 turns the SystemExit
  # into (False, "... failed with exit code 3") and src/common/cli/main.py:111-112 exits 1. The
  # product documents that on purpose at downgrade.py:941-942 ("The bwcli wrapper collapses every
  # non-zero code to 'failed'"), so 3 is only observable to a caller that runs the script directly
  # -- which is what tests/unit/backup/test_downgrade_execute.py asserts. This spec asserts the
  # contract at the bwcli boundary, which is the one an operator and a pipeline actually see.
  #
  # The target is deliberately a version that does not exist and never will: it makes
  # `is_downgrade` false whatever this build is stamped as, so the spec needs no version literal to
  # keep in step with src/VERSION. Kubernetes is left out because tests/utils/k8s.py's exec stream
  # carries no exit status -- the handler refuses the pair rather than pretending to check it.
  downgrade_refuses_an_upgrade:
    type: bwcli
    command: "plugin backup downgrade 9.9.9"
    exit_code: 1
    result: "this is an upgrade, not a downgrade"
    restart_stack: false
    integrations:
      - "Docker"
      - "Autoconf"
      - "Linux"
      - "All-in-one"
  # ── The broker-dependent half (DG-AD Q9, closed in wave 14) ────────────────────────────────
  # `tests/generate.py` now writes CELERY_BROKER_URL into variables.env for every arm that has a
  # bw-jobs-broker, the way misc/dev/docker-compose.ui.api.yml does, so bwcli inside the scheduler
  # reaches the real broker instead of falling back to downgrade.py's DEFAULT_BROKER_URL
  # (redis://127.0.0.1:6379/0, nothing listening in that container). Both actions below RED with
  # "Error while executing backup quiesce command" / "The job broker could not be asked" if that
  # key ever goes missing again -- which is exactly what makes them worth running.
  #
  # Linux and All-in-one keep their own arrangement and are covered by the same two actions: the
  # Linux package writes CELERY_BROKER_URL into /etc/bunkerweb/variables.env (which CLI.py merges
  # into the plugin's environment, src/common/cli/CLI.py:761-763), and the All-in-one runs its
  # embedded Redis on the 127.0.0.1:6379 the fallback names.
  quiesce_status_reaches_the_broker:
    type: bwcli
    command: "plugin backup quiesce --status"
    # Reporting no hold is the point: the answer can only come from a broker that was actually
    # reachable -- `hold_status` does a bare GET on the hold key (downgrade.py:704-706) and a dead
    # broker raises, which quiesce.py:158-159 turns into "Error while executing ...", exit 1.
    result: "No downgrade hold is in place"
    not_result: "Error while executing backup quiesce command"
    restart_stack: false
  # The mutating command, refused at its FIRST gate -- and that gate is the broker one
  # (downgrade.py:1076-1087), so this asserts the same reachability from the other side. Nothing is
  # touched: `execute_downgrade` returns before the preflight, before the safety backup and before
  # any migration. `--yes` is required or the refusal would come from the earlier terminal check
  # instead and would prove nothing about the broker.
  #
  # exit_code 1, not 3: EXECUTE_EXIT_CODES[REFUSED] is 3 and bwcli collapses every non-zero code to
  # 1 (see downgrade_refuses_an_upgrade above). Kubernetes is out for the same reason it is out
  # there -- tests/utils/k8s.py's exec stream carries no exit status.
  downgrade_execute_asks_the_broker_for_the_hold:
    type: bwcli
    command: "plugin backup downgrade 1.6.14 --execute --yes"
    exit_code: 1
    result: "No downgrade hold is in place"
    not_result: "The job broker could not be asked"
    restart_stack: false
    integrations:
      - "Docker"
      - "Autoconf"
      - "Linux"
      - "All-in-one"

  restore_1:
    type: database
    query: "UPDATE bw_metadata SET integration = 'Unknown'"
    result: null
    restart_stack: false
  restore_2:
    type: bwcli
    command: "plugin backup save"
    result: "created successfully"
    restart_stack: false
  restore_3:
    type: database
    query: "UPDATE bw_metadata SET integration = 'Windows'"
    result: null
    restart_stack: false
  restore_4:
    type: bwcli
    command: "plugin backup restore"
    result: "restored successfully"
    restart_stack: false
  restore_5:
    type: database
    query: "SELECT integration FROM bw_metadata"
    result: "Unknown"
    full_clean: true
  # Prepare: set a known value before backup
  prepare_mariadb_1:
    type: database
    integrations: # ? For the other integrations, mariadb is the default database
      - "Linux"
      - "Docker"
      - "All-in-one"
    query: "UPDATE bw_metadata SET integration = 'Unknown'"
    result: null
    database: "mariadb"
    restart_stack: false
  generate_mariadb:
    type: bwcli
    integrations: # ? For the other integrations, mariadb is the default database
      - "Linux"
      - "Docker"
      - "All-in-one"
    command: "plugin backup save"
    result: "created successfully"
    database: "mariadb"
    restart_stack: false
  prepare_mariadb_2:
    type: database
    integrations: # ? For the other integrations, mariadb is the default database
      - "Linux"
      - "Docker"
      - "All-in-one"
    query: "UPDATE bw_metadata SET integration = 'Windows'"
    result: null
    database: "mariadb"
    restart_stack: false
  restore_mariadb:
    type: bwcli
    integrations: # ? For the other integrations, mariadb is the default database
      - "Linux"
      - "Docker"
      - "All-in-one"
    command: "plugin backup restore"
    result: "restored successfully"
    database: "mariadb"
    restart_stack: false
  check_mariadb:
    type: database
    integrations: # ? For the other integrations, mariadb is the default database
      - "Linux"
      - "Docker"
      - "All-in-one"
    query: "SELECT integration FROM bw_metadata"
    result: "Unknown"
    database: "mariadb"
    full_clean: true
  # Prepare: set a known value before backup (MySQL)
  prepare_mysql_1:
    type: database
    query: "UPDATE bw_metadata SET integration = 'Unknown'"
    result: null
    database: "mysql"
    restart_stack: false
  generate_mysql:
    type: bwcli
    command: "plugin backup save"
    result: "created successfully"
    database: "mysql"
    restart_stack: false
  prepare_mysql_2:
    type: database
    query: "UPDATE bw_metadata SET integration = 'Windows'"
    result: null
    database: "mysql"
    restart_stack: false
  restore_mysql:
    type: bwcli
    command: "plugin backup restore"
    result: "restored successfully"
    database: "mysql"
    restart_stack: false
  check_mysql:
    type: database
    query: "SELECT integration FROM bw_metadata"
    result: "Unknown"
    database: "mysql"
    full_clean: true
  prepare_postgresql_1:
    type: database
    query: "UPDATE bw_metadata SET integration = 'Unknown'"
    result: null
    database: "postgresql"
    restart_stack: false
  generate_postgresql:
    type: bwcli
    command: "plugin backup save"
    result: "created successfully"
    database: "postgresql"
    restart_stack: false
  prepare_postgresql_2:
    type: database
    query: "UPDATE bw_metadata SET integration = 'Windows'"
    result: null
    database: "postgresql"
    restart_stack: false
  restore_postgresql:
    type: bwcli
    command: "plugin backup restore"
    result: "restored successfully"
    restart_stack: false
    database: "postgresql"
  check_postgresql:
    type: database
    query: "SELECT integration FROM bw_metadata"
    result: "Unknown"
    database: "postgresql"
    full_clean: true
  # generate_oracle:
  #   type: bwcli
  #   command: "plugin backup save"
  #   result: "not supported"
  #   database: "oracle"
  #   restart_stack: false
  # restore_oracle:
  #   type: bwcli
  #   command: "plugin backup restore"
  #   result: "not supported"
  #   full_clean: true
  #   database: "oracle"

config:
  USE_BACKUP: "yes"
  BACKUP_SCHEDULE: "daily"
  BACKUP_ROTATION: "7"
  BACKUP_DIRECTORY: "/var/lib/bunkerweb/backups"
