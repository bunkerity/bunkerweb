integrations:
  - "Linux"
  - "Docker"
  - "Autoconf"

actions:
  dirb:
    type: tool
    tool: "dirb"
    arguments: 'http://127.0.0.1 -H "Host: www.example.com" -H "User-Agent: LegitOne" -f'
    # dirb is a provocation, not an assertion: it exists to make CrowdSec ban the runner, and
    # `blocked_live` below is what actually checks the result. It cannot be left unbounded,
    # because it deadlocks on its own success -- once the ban lands, its remaining requests
    # hang and it never returns. Measured: 86112 requests sent, then 0 CPU for 6.5 minutes.
    # 30s is chosen from what the scenario needs, not from taste: the ban fires after 4
    # `http-admin-interface-probing` events, and dirb reaches the `admin*` words in roughly the
    # first 1% of its scan, i.e. a few seconds. 30s is a large multiple of that, and it stays
    # well under CROWDSEC_UPDATE_FREQUENCY (60) so it cannot push the stream-mode assertions
    # past the bouncer's next pull. Too short a bound is safe: it reds `blocked_live` with a
    # 200 rather than passing quietly.
    timeout: 30
    restart_stack: false
  blocked_live:
    type: status
    url: "http://www.example.com"
    status: 403
    full_clean: true

  dirb_1:
    type: tool
    tool: "dirb"
    arguments: 'http://127.0.0.1 -H "Host: www.example.com" -H "User-Agent: LegitOne" -f'
    # Same bound, and here it also protects the next assertion rather than only this action:
    # `not_yet_blocked_stream` demands a 200, so this scan must finish before the bouncer pulls
    # the decision at CROWDSEC_UPDATE_FREQUENCY=60. Unbounded, it outlasted that window.
    timeout: 30
    config:
      CROWDSEC_MODE: "stream"
    restart_stack: false
  not_yet_blocked_stream:
    type: status
    url: "http://www.example.com"
    status: 200
    restart_stack: false
  blocked_stream:
    type: status
    url: "http://www.example.com"
    status: 403
    # Longer than CROWDSEC_UPDATE_FREQUENCY so the bouncer has pulled the decision by now.
    delay: 70

config:
  USE_MODSECURITY: "no"
  USE_BAD_BEHAVIOR: "no"
  USE_LIMIT_REQ: "no"
  USE_LIMIT_CONN: "no"
  USE_CROWDSEC: "yes"
  CROWDSEC_API: "http://crowdsec:8080"
  CROWDSEC_API_KEY: "s3cr3tb0unc3rk3y"
  CROWDSEC_MODE: "live"
  CROWDSEC_ENABLE_INTERNAL: "no"
  CROWDSEC_REQUEST_TIMEOUT: "1000"
  CROWDSEC_EXCLUDE_LOCATION: ""
  CROWDSEC_CACHE_EXPIRATION: "1"
  # not_yet_blocked_stream asserts the bouncer has NOT pulled the ban yet, so this window has to
  # outlast the dirb run that triggers it -- at 10s the assertion raced dirb's own duration and
  # failed on any host where the scan takes longer than the interval.
  CROWDSEC_UPDATE_FREQUENCY: "60"
  CROWDSEC_APPSEC_URL: "http://crowdsec:7422"
  CROWDSEC_APPSEC_FAILURE_ACTION: "passthrough"
  CROWDSEC_APPSEC_CONNECT_TIMEOUT: "100"
  CROWDSEC_APPSEC_SEND_TIMEOUT: "100"
  CROWDSEC_APPSEC_PROCESS_TIMEOUT: "100"
  CROWDSEC_ALWAYS_SEND_TO_APPSEC: "no"
  CROWDSEC_APPSEC_SSL_VERIFY: "no"

All-in-one:
  config:
    CROWDSEC_API: null
    CROWDSEC_API_KEY: null
    CROWDSEC_APPSEC_URL: null
    CROWDSEC_EXTRA_COLLECTIONS: null
    CROWDSEC_DISABLE_PARSERS: "crowdsecurity/whitelists"

crowdsec_config:
  BOUNCER_KEY_bunkerweb: "s3cr3tb0unc3rk3y"
  COLLECTIONS: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules bunkerity/bunkerweb"
  DISABLE_PARSERS: "crowdsecurity/whitelists"

Linux:
  config:
    # Follows the host port published in tests/misc/docker/crowdsec.yml.
    CROWDSEC_API: "http://crowdsec:8889"
