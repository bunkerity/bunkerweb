# Example-backed spec: the stack under test is examples/docker-configs itself,
# deployed the way a user would deploy it. The assertions live here so that the
# example directory holds only what someone reading the documentation needs.
example: docker-configs

integrations:
  - "Docker"

actions:
  string_app1_example_com_hello:
    type: string
    url: "https://app1.example.com/hello"
    string: "world"
    ignore_case: true
    follow_redirects: true
    tls: "app1.example.com"
    timeout: 120
    delay: 120
  string_app2_example_com_hello:
    type: string
    url: "https://app2.example.com/hello"
    string: "world"
    ignore_case: true
    follow_redirects: true
    tls: "app2.example.com"
    timeout: 120
    delay: 120
  string_app1_example_com_app1:
    type: string
    url: "https://app1.example.com/app1"
    string: "app1"
    ignore_case: true
    follow_redirects: true
    tls: "app1.example.com"
    timeout: 120
    delay: 120
  string_app2_example_com_app2:
    type: string
    url: "https://app2.example.com/app2"
    string: "app2"
    ignore_case: true
    follow_redirects: true
    tls: "app2.example.com"
    timeout: 120
    delay: 120
