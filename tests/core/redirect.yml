integrations: ["all", "Swarm"]

actions:
  check_status:
    type: status
    url: "http://www.example.com"
    status: 301
    config:
      REDIRECT_TO: "https://view-transitions.chrome.dev/profiles/mpa/"
  check_status_tweaked:
    type: status
    url: "http://www.example.com"
    status: 302
    config:
      REDIRECT_TO: "https://view-transitions.chrome.dev/profiles/mpa/"
      REDIRECT_TO_STATUS_CODE: "302"
  # Reaches the public internet: the runner dials www.example.com (loopback) but follows the
  # redirect out to a third party's page, and asserts text from it. So this action reds when that
  # page is reworded or retired, with nothing wrong in BunkerWeb -- and it cannot run offline. The
  # bare-hostname guard does not see any of this: the external URL is in `config`, which is
  # container-side and deliberately unchecked.
  check_redirection:
    type: string
    url: "http://www.example.com"
    follow_redirects: true
    string: "List of Chrome DevRel"
    config:
      REDIRECT_TO: "https://view-transitions.chrome.dev/profiles/mpa/"
  check_redirection_request_uri:
    type: path
    url: "http://www.example.com/test"
    follow_redirects: true
    raise_for_status: false
    path: "/test"
    config:
      REDIRECT_TO: "https://view-transitions.chrome.dev/profiles/mpa/"
      REDIRECT_TO_REQUEST_URI: "yes"
  check_custom_from:
    type: status
    url: "http://www.example.com"
    status: 200
    restart_stack: false
    config:
      REDIRECT_FROM: "/test"
      REDIRECT_TO: "https://view-transitions.chrome.dev/profiles/mpa/"
  check_custom_from_1:
    type: status
    url: "http://www.example.com/test"
    status: 301
    restart_stack: false
    config:
      REDIRECT_FROM: "/test"
      REDIRECT_TO: "https://view-transitions.chrome.dev/profiles/mpa/"

# Kubernetes only (generate.py reads `annotations:` inside the Kubernetes branch alone). The
# blank REVERSE_PROXY_URL is LOAD-BEARING and is not the duplicate-location shield it looks like:
# an empty value sends generate.py:275 down its `else` branch, which skips the ingress rule
# entirely -- no rule, no /tmp/services.yml, no app1, and therefore no www.example.com *service*
# server. That is the topology `check_custom_from` above depends on. With REDIRECT_FROM moved to
# /test it asserts 200 on "/", and that 200 comes from the DEFAULT server: misc's
# default-server-http/page.conf renders `location / { root .../core/misc/files; }` and serves the
# BunkerWeb default page. Restore the ingress (the `/app1` pattern cors.yml/mtls.yml use) and
# www.example.com becomes a real service server where the redirect sits at /test, the reverse
# proxy at /app1 and "/" matches nothing -- server.conf ships an `index` but no `root` -- so the
# action gets a 404 instead. Moving the ingress back therefore needs check_custom_from rewritten
# first; it is not a drop-in.
#
# REDIRECT_FROM rides along as a plain config variable here for the same reason. In the ingress
# branch it would become a bunkerweb.io annotation, i.e. a SERVICE-level setting, and
# generate.py:380 applies action-level `config:` as GLOBALS -- so the annotation would shadow
# every per-action REDIRECT_FROM override instead of being overridden by it.
annotations:
  REDIRECT_FROM: "/"
  bunkerweb.io/REVERSE_PROXY_URL: ""
