integrations: "all"

actions:
  http:
    type: status
    url: "http://127.0.0.1:5001/ping"
    status: 200
    headers:
      Host: "bwapi"
    restart_stack: false
  wrong_host:
    type: status
    url: "http://127.0.0.1:5001/ping"
    headers:
      Host: "wrong-host"
    full_clean: true

  https:
    type: status
    url: "https://127.0.0.1:5443/ping"
    status: 200
    verify_ssl: false
    headers:
      Host: "bwapi"
    config:
      API_LISTEN_HTTPS: "yes"
    restart_stack: false
  http_again:
    type: status
    url: "http://127.0.0.1:5001/ping"
    status: 200
    headers:
      Host: "bwapi"
    full_clean: true

  http_deactivated:
    type: status
    url: "http://127.0.0.1:5001/ping"
    headers:
      Host: "bwapi"
    config:
      API_LISTEN_HTTP: "no"

config:
  USE_API: "yes"
  API_LISTEN_HTTP: "yes"
  API_LISTEN_HTTPS: "no"
  API_HTTP_PORT: "5000"
  API_HTTPS_PORT: "5443"
  API_SERVER_NAME: "bwapi"
  API_WHITELIST_IP: "0.0.0.0/0"

Linux:
  config:
    API_LISTEN_IP: "0.0.0.0"
    API_HTTP_PORT: "5001"

All-in-one:
  config:
    API_LISTEN_IP: "0.0.0.0"
