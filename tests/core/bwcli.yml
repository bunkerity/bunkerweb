# `bwcli ban`, `unban` and `bans` had no coverage anywhere once the retired per-feature stacks
# stopped running: the `bwcli` action type is used only for `plugin backup save/list/restore`, and
# the `/bans` API specs exercise the HTTP path rather than the CLI.
#
# The CLI is not a thin wrapper over that path. `bans` reads the database first and treats it as the
# source of truth, precisely because it is the only source that still answers when an instance has
# just restarted with an empty shared dict or is unreachable, and `ban` persists there before it
# fans out. So this covers the durable path, which is the one a restart depends on.
#
# Assertions sit on contiguous plain text: the CLI interleaves ANSI colour codes, so "IP <addr> has
# been banned" never appears as one string, while "has been banned" and the bare address do.
integrations:
  - "Docker"

# The database/instance-view actions authenticate as `admin:P@ssw0rd` — without this block the
# generated stack creates no API user at all and every view answers 401 Unauthorized.
api:
  API_USERNAME: "admin"
  API_PASSWORD: "P@ssw0rd"

actions:
  ban_an_ip_globally:
    type: bwcli
    command: "ban 10.99.0.1 -exp 3600 -reason spec"
    result: "has been banned"
    restart_stack: false

  the_ban_is_listed:
    type: bwcli
    command: "bans"
    result: "10.99.0.1"
    restart_stack: false

  # What the CLI printed is not where the ban went. Since 1.7 `ban` writes `bw_bans` first and then
  # fans out to the instances, and the two can disagree: a database write that failed still sends,
  # while an instance that was unreachable keeps enforcing an unban it never received. `GET /bans`
  # answers from the database and `GET /bans/instances` asks the instances what they are actually
  # enforcing right now, so asserting both is what tells the durable path from the runtime one --
  # neither is visible in `bwcli bans` output, which reads the database and stops there.
  the_database_has_the_global_ban:
    type: string
    url: "http://127.0.0.1:8888/bans"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"ip":"10.99.0.1"'
    restart_stack: false
  the_instances_enforce_the_global_ban:
    type: string
    url: "http://127.0.0.1:8888/bans/instances"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"ip":"10.99.0.1"'
    restart_stack: false

  ban_an_ip_for_one_service:
    # -service scopes the ban instead of applying it globally; an unknown name falls back to a
    # global ban with a warning, so the service has to be one the stack actually serves.
    type: bwcli
    command: "ban 10.99.0.2 -exp 3600 -reason spec -service www.example.com"
    result: "has been banned"
    restart_stack: false

  the_service_ban_is_listed:
    type: bwcli
    command: "bans"
    result: "10.99.0.2"
    restart_stack: false

  the_database_has_the_service_ban:
    type: string
    url: "http://127.0.0.1:8888/bans"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"ip":"10.99.0.2"'
    restart_stack: false
  the_instances_enforce_the_service_ban:
    type: string
    url: "http://127.0.0.1:8888/bans/instances"
    auth:
      - "admin"
      - "P@ssw0rd"
    string: '"ip":"10.99.0.2"'
    restart_stack: false

  unban_the_global_ip:
    type: bwcli
    command: "unban 10.99.0.1"
    result: "has been unbanned"
    restart_stack: false

  unban_the_service_ip:
    type: bwcli
    command: "unban 10.99.0.2 -service www.example.com"
    result: "has been unbanned"
    restart_stack: false

  # `unban` printing "has been unbanned" proves it printed a message, not that the row is gone: an
  # unban that reported success and removed nothing passed every assertion above. These two close
  # that. The needles are the same ones `the_ban_is_listed` and `the_service_ban_is_listed` match
  # while the bans exist -- confirmed against real output on 2026-08-19 at 12:42:08 and 12:42:12 --
  # so they provably CAN appear here, which is what makes their absence mean something.
  the_global_ban_is_gone:
    type: bwcli
    command: "bans"
    not_result: "10.99.0.1"
    restart_stack: false

  the_service_ban_is_gone:
    type: bwcli
    command: "bans"
    not_result: "10.99.0.2"
    restart_stack: false

  # The same two views after the unbans. A revoke that cannot be persisted is refused, so an empty
  # database view is the durable half; an instance that still enforces a revoked ban is the failure
  # `sync-bans` exists to repair, and only the runtime view can see it. The needles are the ones the
  # four actions above matched while the bans existed, which is what makes their absence mean
  # something.
  the_database_has_no_ban_left:
    type: string
    url: "http://127.0.0.1:8888/bans"
    auth:
      - "admin"
      - "P@ssw0rd"
    not_string: '"ip":"10.99.0.'
    restart_stack: false
  the_instances_enforce_no_ban_left:
    type: string
    url: "http://127.0.0.1:8888/bans/instances"
    auth:
      - "admin"
      - "P@ssw0rd"
    not_string: '"ip":"10.99.0.'
