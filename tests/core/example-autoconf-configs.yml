# Example-backed spec: the stack under test is examples/autoconf-configs itself,
# deployed the way a user would deploy it. The assertions live here so that the
# example directory holds only what someone reading the documentation needs.
example: autoconf-configs

integrations:
  - "Autoconf"

actions:
  string_app1_example_com_hello:
    type: string
    url: "https://app1.example.com/hello"
    string: "app1"
    ignore_case: true
    follow_redirects: true
    tls: "app1.example.com"
    timeout: 120
    delay: 180
  string_app2_example_com_hello:
    type: string
    url: "https://app2.example.com/hello"
    string: "app2"
    ignore_case: true
    follow_redirects: true
    tls: "app2.example.com"
    timeout: 120
    delay: 180
  string_app3_example_com_hello:
    type: string
    url: "https://app3.example.com/hello"
    string: "app3"
    ignore_case: true
    follow_redirects: true
    tls: "app3.example.com"
    timeout: 120
    delay: 180
