integrations:
  - "Linux"
  - "Docker"
  - "Autoconf"
  - "Kubernetes"

actions:
  # Runner-side URLs use the PUBLISHED port on loopback, never the `custom-api` name. The suite
  # assumes the runner resolves container names through its dnsmasq; a workstation resolves them
  # through its own resolver, and a bare name there picks up the host's DNS `search` domains -- on
  # this machine `custom-api` resolved to a PUBLIC address and the request left the box and timed
  # out after 10s. tests/misc/docker/custom-api.yml publishes 8000:8000, so loopback needs no name
  # resolution at all. `BUNKERNET_SERVER` below is deliberately NOT changed: that one is resolved
  # inside the container network, where `custom-api` is correct.
  setup:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    restart_stack: false

  check_registered:
    type: status
    url: "http://127.0.0.1:8000/bunkernet/instance_id"
    delay: 0.0
    status: 200
    restart_stack: false
  # `type: string` is substring containment, and this endpoint answers
  # `{"result":"ok","data":<n>}`. A bare "0" therefore matched `"data":100` as readily as
  # `"data":0` -- and 100 is precisely the value this spec expects a few actions later, so the
  # assertion could not tell "nothing has been reported yet" from "everything was reported
  # early". Anchored on the field and its closing brace, which only the intended value produces.
  check_report:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/report_num"
    delay: 0.0
    string: '"data":0}'
    restart_stack: false

  global_403:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "random"
    repeat: 199

  check_report_second:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/report_num"
    delay: 0.0
    string: '"data":100}'
    restart_stack: false

  # What a report carries. The mock API keeps every report it receives and `/bunkernet/last_report?url=<text>`
  # returns the latest one whose URL contains <text> (404 when none arrived, so a report that never shows up
  # fails the action). Each block below sends 200 blocked requests from random addresses, every one carrying the
  # same marker in its URL, so the batch of 100 goes out on the next scheduler start and the check can find it.
  # The requests carry headers outside the User-Agent/Accept/Accept-Encoding/Accept-Language/Content-Type/
  # Content-Length allowlist (one of them credentials) and a script tag in a cookie and in a header, which
  # ModSecurity matches. The reason data then lists the matched values next to their variable names.
  # `header_names` is the sorted list of header names inside the report, so the list is asserted whole.
  #
  # The setting is applied by the restart that follows an action, so the setting a request is logged under and
  # the one in force when the scheduler sends it can differ. The three blocks use that on purpose:
  #   default:   logged and sent with the setting unset (no)    -> everything is sent as received
  #   queued:    logged with no, sent after it became yes       -> the scheduler filters the queued reports
  #   filter on: logged with yes, sent after it became no again -> the report was already filtered when logged
  # The last two show each side filtering on its own: the sender cannot hide a filter that is missing at
  # request time, and the request-time filter cannot hide a sender that does not filter.
  payload_default:
    type: status
    url: "http://www.example.com/?bn_probe=default"
    status: 403
    headers: &payload_headers
      X-Forwarded-For: "random"
      Cookie: "sid=<script>alert(1)</script>"
      Authorization: "Bearer bn-probe-token"
      Referer: "http://www.example.com/<script>alert(1)</script>"
      X-Bn-Probe: "bn-probe-value"
      Accept-Language: "en"
    repeat: 199

  check_payload_default_headers:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/last_report?url=bn_probe=default"
    delay: 0.0
    string: '"header_names":["accept","accept-encoding","accept-language","authorization","connection","cookie","host","referer","user-agent","x-bn-probe","x-forwarded-for"]'
    restart_stack: false
  check_payload_default_cookie_value:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/last_report?url=bn_probe=default"
    delay: 0.0
    string: '"cookie":"sid=<script>alert(1)</script>"'
    restart_stack: false
  # The quotes make this the whole value of a matched variable, not the tail of the header above.
  check_payload_default_matched_value:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/last_report?url=bn_probe=default"
    delay: 0.0
    string: '"<script>alert(1)</script>"'
    restart_stack: false

  payload_queued:
    type: status
    url: "http://www.example.com/?bn_probe=queued"
    status: 403
    headers: *payload_headers
    repeat: 199

  check_payload_queued_headers:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/last_report?url=bn_probe=queued"
    delay: 0.0
    string: '"header_names":["accept","accept-encoding","accept-language","user-agent"]'
    config:
      BUNKERNET_FILTER_HEADERS: "yes"
    restart_stack: false
  check_payload_queued_matched_names:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/last_report?url=bn_probe=queued"
    delay: 0.0
    string: "REQUEST_COOKIES:sid"
    config:
      BUNKERNET_FILTER_HEADERS: "yes"
    restart_stack: false
  check_payload_queued_no_payload:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/last_report?url=bn_probe=queued"
    delay: 0.0
    not_string: "alert(1)"
    config:
      BUNKERNET_FILTER_HEADERS: "yes"
    restart_stack: false

  payload_filter_on:
    type: status
    url: "http://www.example.com/?bn_probe=filter_on"
    status: 403
    headers: *payload_headers
    config:
      BUNKERNET_FILTER_HEADERS: "yes"
    repeat: 199

  check_payload_filter_on_headers:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/last_report?url=bn_probe=filter_on"
    delay: 0.0
    string: '"header_names":["accept","accept-encoding","accept-language","user-agent"]'
    config:
      BUNKERNET_FILTER_HEADERS: "no"
    restart_stack: false
  check_payload_filter_on_matched_names:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/last_report?url=bn_probe=filter_on"
    delay: 0.0
    string: "REQUEST_COOKIES:sid"
    config:
      BUNKERNET_FILTER_HEADERS: "no"
    restart_stack: false
  check_payload_filter_on_no_payload:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/last_report?url=bn_probe=filter_on"
    delay: 0.0
    not_string: "alert(1)"
    config:
      BUNKERNET_FILTER_HEADERS: "no"
    restart_stack: false

  reset_api:
    type: status
    url: "http://127.0.0.1:8000/bunkernet/reset"
    method: POST
    delay: 0.0
    status: 200

  setup_deactivated:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "8.0.0.3"
    config:
      USE_BUNKERNET: "no"
    restart_stack: false

  check_registered_deactivated:
    type: status
    url: "http://127.0.0.1:8000/bunkernet/instance_id"
    delay: 0.0
    status: 404
    config:
      USE_BUNKERNET: "no"
    restart_stack: false
  # Same substring trap as check_report, and it matters more here: this is the assertion that
  # proves a DEACTIVATED BunkerNet reports nothing. A bare "0" passed even if it had reported 100.
  check_report_deactivated:
    type: string
    url: "http://127.0.0.1:8000/bunkernet/report_num"
    delay: 0.0
    string: '"data":0}'
    config:
      USE_BUNKERNET: "no"

config:
  USE_BUNKERNET: "yes"
  BUNKERNET_SERVER: "http://custom-api:8000/bunkernet"
  USE_REAL_IP: "yes"
  REAL_IP_FROM: "0.0.0.0/0"
  USE_LIMIT_REQ: "no"
  USE_LIMIT_CONN: "no"

Kubernetes:
  config:
    BUNKERNET_SERVER: "http://svc-custom-api.misc.svc.cluster.local:8000/bunkernet"
