# Acceptance criterion 5: a customcert whose PRIVATE KEY is a Swarm secret mounted on bw-worker is
# served by the instance.
#
# Split from tests/core/swarm.yml rather than folded into it because it needs a different stack --
# the worker carries a secret and a config mount, which cannot be added without restarting the
# task -- and because a failure here means something quite different from a discovery failure.
#
# The design under test, in one line: a Swarm secret's payload is NEVER returned by the Engine API
# (swarmkit nils Spec.Data on every read path), so the controller cannot read it the way the
# Kubernetes controller reads secret.data; the key is therefore mounted on the service that runs
# the job, and the label carries only a path.
integrations:
  - "Docker"

actions:
  a_custom_certificate_keyed_by_a_swarm_secret_is_served:
    type: script
    script: ["./tests/core/swarm-secrets/test.sh", "docker"]
    result: "swarm-secrets: all checks passed"
    restart_stack: false
    timeout: 900
