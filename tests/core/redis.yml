  tls_check:
    type: redis
    query: "PING"
    result: "True"
    db: 0
    tls: true
    tls_port: 6380
    config:
      REDIS_HOST: "redis-master"
      REDIS_DATABASE: "0"
      REDIS_SSL: "yes"
    Linux:
      config:
        REDIS_PORT: "6380"
    Kubernetes:
      config:
        REDIS_HOST: "svc-redis-master.redis.svc.cluster.local"
    restart_stack: false
  bad_request_tls:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    restart_stack: false
  tls:
    type: redis
    query: "keys *"
    keys:
      - "plugin_bad_behavior_www.example.com_192.168.0.254"
    db: 0
    tls: true
    tls_port: 6380
    delay: 6
    restart_stack: false
  clear_keys_4:
    type: redis
    query: "FLUSHALL"
    result: "True"
    db: 0
    tls: true
    tls_port: 6380
    full_clean: true

  sentinel_check:
    type: redis
    query: "PING"
    result: "True"
    db: 0
    sentinel: true
    config:
      REDIS_HOST: "redis-master"
      REDIS_DATABASE: "0"
      REDIS_SENTINEL_HOSTS: "redis-sentinel-1:26379 redis-sentinel-2:26379 redis-sentinel-3:26379"
    Linux:
      config:
        REDIS_PORT: "6380"
        REDIS_SENTINEL_HOSTS: "redis-sentinel-1:26379 redis-sentinel-2:26380 redis-sentinel-3:26381"
    Kubernetes:
      config:
        REDIS_HOST: "svc-redis-master.redis.svc.cluster.local"
        REDIS_SENTINEL_HOSTS: "redis-sentinel-0.svc-redis-sentinel-headless.redis.svc.cluster.local:26379 redis-sentinel-1.svc-redis-sentinel-headless.redis.svc.cluster.local:26379 redis-sentinel-2.svc-redis-sentinel-headless.redis.svc.cluster.local:26379"
    restart_stack: false
  bad_request_sentinel:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    restart_stack: false
  sentinel:
    type: redis
    query: "keys *"
    keys:
      - "plugin_bad_behavior_www.example.com_192.168.0.254"
    db: 0
    sentinel: true
    delay: 6
    restart_stack: false
  clear_keys_5:
    type: redis
    query: "FLUSHALL"
    result: "True"
    db: 0
    sentinel: true
    sentinel_type: "master"
    full_clean: true

  sentinel_password_check:
    type: redis
    query: "PING"
    result: "True"
    db: 0
    password: "secret"
    sentinel: true
    config:
      REDIS_HOST: "redis-master"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: "secret"
      REDIS_SENTINEL_HOSTS: "redis-sentinel-1:26379 redis-sentinel-2:26379 redis-sentinel-3:26379"
      REDIS_SENTINEL_PASSWORD: ""
    Linux:
      config:
        REDIS_PORT: "6380"
        REDIS_SENTINEL_HOSTS: "redis-sentinel-1:26379 redis-sentinel-2:26380 redis-sentinel-3:26381"
    Kubernetes:
      config:
        REDIS_HOST: "svc-redis-master.redis.svc.cluster.local"
        REDIS_SENTINEL_HOSTS: "redis-sentinel-0.svc-redis-sentinel-headless.redis.svc.cluster.local:26379 redis-sentinel-1.svc-redis-sentinel-headless.redis.svc.cluster.local:26379 redis-sentinel-2.svc-redis-sentinel-headless.redis.svc.cluster.local:26379"
    restart_stack: false
  bad_request_sentinel_password:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    restart_stack: false
  sentinel_password:
    type: redis
    query: "keys *"
    keys:
      - "plugin_bad_behavior_www.example.com_192.168.0.254"
    db: 0
    password: "secret"
    sentinel: true
    delay: 6
    restart_stack: false
  clear_keys_6:
    type: redis
    query: "FLUSHALL"
    result: "True"
    db: 0
    password: "secret"
    sentinel: true
    sentinel_type: "master"
    full_clean: true

  sentinel_user_check:
    type: redis
    query: "PING"
    result: "True"
    db: 0
    sentinel: true
    sentinel_user:
      - "admin"
      - "secret"
    config:
      REDIS_HOST: "redis-master"
      REDIS_DATABASE: "0"
      REDIS_SENTINEL_HOSTS: "redis-sentinel-1:26379 redis-sentinel-2:26379 redis-sentinel-3:26379"
      REDIS_SENTINEL_USERNAME: "admin"
      REDIS_SENTINEL_PASSWORD: "secret"
    Linux:
      config:
        REDIS_PORT: "6380"
        REDIS_SENTINEL_HOSTS: "redis-sentinel-1:26379 redis-sentinel-2:26380 redis-sentinel-3:26381"
    Kubernetes:
      config:
        REDIS_HOST: "svc-redis-master.redis.svc.cluster.local"
        REDIS_SENTINEL_HOSTS: "redis-sentinel-0.svc-redis-sentinel-headless.redis.svc.cluster.local:26379 redis-sentinel-1.svc-redis-sentinel-headless.redis.svc.cluster.local:26379 redis-sentinel-2.svc-redis-sentinel-headless.redis.svc.cluster.local:26379"
    restart_stack: false
  bad_request_sentinel_user:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    restart_stack: false
  sentinel_user:
    type: redis
    query: "keys *"
    keys:
      - "plugin_bad_behavior_www.example.com_192.168.0.254"
    db: 0
    sentinel: true
    sentinel_user:
      - "admin"
      - "secret"
    delay: 6
    restart_stack: false
  clear_keys_7:
    type: redis
    query: "FLUSHALL"
    result: "True"
    db: 0
    sentinel: true
    sentinel_user:
      - "admin"
      - "secret"
    sentinel_type: "master"
    full_clean: true

  # Redis Cluster: three masters (tests/misc/docker/redis-cluster.yml) on the Docker-network arms.
  # Linux, Swarm and Kubernetes are not covered: the cluster stack has no manifest for them.

  # host:port nodes
  cluster_check:
    type: redis
    cluster: true
    query: "PING"
    result: "True"
    config:
      REDIS_DATABASE: "0"
      REDIS_CLUSTER_NODES: "redis-cluster-1:6379 redis-cluster-2:6379 redis-cluster-3:6379"
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  bad_request_cluster:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  cluster:
    type: redis
    cluster: true
    query: "keys *"
    # In cluster mode every key of an IP carries the IP as a hash tag. 192.168.0.254 hashes to slot
    # 14506, which redis-cli --cluster create assigns to the third node, so the key must not be
    # on the first node the client dialled.
    keys:
      - "plugin_bad_behavior_www.example.com_{192.168.0.254}"
    cluster_owner: 3
    delay: 6
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  clear_keys_cluster:
    type: redis
    cluster: true
    query: "FLUSHALL"
    result: "True"
    full_clean: true
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"

  # first seed refuses connections: the client must fall through to the next node
  cluster_dead_seed_check:
    type: redis
    cluster: true
    query: "PING"
    result: "True"
    config:
      REDIS_DATABASE: "0"
      REDIS_CLUSTER_NODES: "redis-cluster-1:6399 redis-cluster-1:6379 redis-cluster-2:6379 redis-cluster-3:6379"
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  bad_request_cluster_dead_seed:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    # The refused seed is tried first; the log line proves it was, not just that the cluster worked.
    log: "unable to connect ip:port redis-cluster-1:6399"
    headers:
      X-Forwarded-For: "192.168.0.254"
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  cluster_dead_seed:
    type: redis
    cluster: true
    query: "keys *"
    # In cluster mode every key of an IP carries the IP as a hash tag. 192.168.0.254 hashes to slot
    # 14506, which redis-cli --cluster create assigns to the third node, so the key must not be
    # on the first node the client dialled.
    keys:
      - "plugin_bad_behavior_www.example.com_{192.168.0.254}"
    cluster_owner: 3
    delay: 6
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  clear_keys_cluster_dead_seed:
    type: redis
    cluster: true
    query: "FLUSHALL"
    result: "True"
    full_clean: true
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"

  # authenticated cluster
  cluster_password_check:
    type: redis
    cluster: true
    query: "PING"
    result: "True"
    password: "secret"
    config:
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: "secret"
      REDIS_CLUSTER_NODES: "redis-cluster-1:6379 redis-cluster-2:6379 redis-cluster-3:6379"
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  bad_request_cluster_password:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  cluster_password:
    type: redis
    cluster: true
    query: "keys *"
    # In cluster mode every key of an IP carries the IP as a hash tag. 192.168.0.254 hashes to slot
    # 14506, which redis-cli --cluster create assigns to the third node, so the key must not be
    # on the first node the client dialled.
    keys:
      - "plugin_bad_behavior_www.example.com_{192.168.0.254}"
    cluster_owner: 3
    password: "secret"
    delay: 6
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  clear_keys_cluster_password:
    type: redis
    cluster: true
    query: "FLUSHALL"
    result: "True"
    password: "secret"
    full_clean: true
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"

  # port-less nodes: the port defaults to 6379 (1.6.16 behaviour); last, so a failure leaves the other actions run
  cluster_portless_check:
    type: redis
    cluster: true
    query: "PING"
    result: "True"
    config:
      REDIS_DATABASE: "0"
      REDIS_CLUSTER_NODES: "redis-cluster-1 redis-cluster-2 redis-cluster-3"
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  bad_request_cluster_portless:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  cluster_portless:
    type: redis
    cluster: true
    query: "keys *"
    # In cluster mode every key of an IP carries the IP as a hash tag. 192.168.0.254 hashes to slot
    # 14506, which redis-cli --cluster create assigns to the third node, so the key must not be
    # on the first node the client dialled.
    keys:
      - "plugin_bad_behavior_www.example.com_{192.168.0.254}"
    cluster_owner: 3
    delay: 6
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  clear_keys_cluster_portless:
    type: redis
    cluster: true
    query: "FLUSHALL"
    result: "True"
    full_clean: true
    integrations:
      - "Docker"
      - "Autoconf"
      - "All-in-one"

config:
  USE_LIMIT_REQ: "no"
  USE_LIMIT_CONN: "no"
  USE_DNSBL: "no"
  BAD_BEHAVIOR_BAN_SCOPE: "service"
  USE_REAL_IP: "yes"
  REAL_IP_FROM: "0.0.0.0/0"
  USE_REDIS: "yes"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DATABASE: "1"
  REDIS_SSL: "no"
  REDIS_SSL_VERIFY: "no"
  REDIS_TIMEOUT: "1000"
  REDIS_USERNAME: ""
  REDIS_PASSWORD: ""
  REDIS_SENTINEL_HOSTS: ""
  REDIS_SENTINEL_USERNAME: ""
  REDIS_SENTINEL_PASSWORD: ""
  REDIS_SENTINEL_MASTER: "bw-master"
  REDIS_KEEPALIVE_IDLE: "30000"
  REDIS_KEEPALIVE_POOL: "10"

# Linux resolves `redis` to loopback and reaches the shared fixture through its published port.
Linux:
  config:
    REDIS_PORT: "6390"

All-in-one:
  config:
    REDIS_HOST: "127.0.0.1"
    REDIS_DATABASE: "0"

# `redis` is a docker-compose service name and resolves nowhere in the cluster. generate.py sets an
# in-cluster default for Kubernetes, but the spec-level `config` above is merged AFTER it and wins,
# so the whole stack -- scheduler, API rate limiter, and the Celery worker that runs sync-bans --
# dialled `redis:6379` and timed out. Point it at the redis-master this spec deploys in the `redis`
# namespace, the same host the per-action Kubernetes overrides already use, so one datastore serves
# both the product (in-cluster) and the harness (host 6380 -> nodePort 30379).
Kubernetes:
  config:
    REDIS_HOST: "svc-redis-master.redis.svc.cluster.local"
