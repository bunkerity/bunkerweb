integrations: "all"

actions:
  bad_request:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  check_keys:
    type: redis
    # The shared Redis fixture publishes 6390 on the runner (TESTS_REDIS_PORT); Linux uses
    # the host network too. All-in-one uses its own Redis on 6383. See tests/misc/docker/redis.yml.
    Linux:
      port: 6390
    Docker:
      port: 6390
    Autoconf:
      port: 6390
    query: "keys *"
    keys:
      - "plugin_bad_behavior_www.example.com_192.168.0.254"
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    delay: 6
    restart_stack: false
    All-in-one:
      port: 6383
      db: 0
  # A second offence from the same address raises the counter: key plugin_bad_behavior_<service>_<ip>
  # (rediskeys.badbehavior, src/bw/lua/bunkerweb/rediskeys.lua:42). The threshold is 10, so nothing is banned.
  bad_request_again:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  check_counter_incremented:
    type: redis
    # Ports as in check_keys.
    Linux:
      port: 6390
    Docker:
      port: 6390
    Autoconf:
      port: 6390
    query: "GET plugin_bad_behavior_www.example.com_192.168.0.254"
    result: "2"
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    delay: 6
    restart_stack: false
    All-in-one:
      port: 6383
      db: 0
  # #3818: `bwcli unban` used to leave the Bad Behavior counter behind, so the next watched status
  # banned the address at once. The counter lives in Redis too (utils.lua remove_ban deletes
  # rediskeys.badbehavior), and EXISTS answers 1 while the key is there, 0 once it is gone.
  unban_bad_behavior_ip:
    type: bwcli
    command: "unban 192.168.0.254"
    result: "has been unbanned"
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  check_counter_cleared_by_unban:
    type: redis
    # Ports as in check_keys.
    Linux:
      port: 6390
    Docker:
      port: 6390
    Autoconf:
      port: 6390
    query: "EXISTS plugin_bad_behavior_www.example.com_192.168.0.254"
    result: "0"
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    delay: 2
    restart_stack: false
    All-in-one:
      port: 6383
      db: 0
  clear_keys:
    type: redis
    # The shared Redis fixture publishes 6390 on the runner (TESTS_REDIS_PORT); Linux uses
    # the host network too. All-in-one uses its own Redis on 6383. See tests/misc/docker/redis.yml.
    Linux:
      port: 6390
    Docker:
      port: 6390
    Autoconf:
      port: 6390
    # Kubernetes publishes no host port for 6379: build.sh maps 6380 -> nodePort 30379 ->
    # svc-redis-master, which is the datastore the Kubernetes block at the bottom of this file
    # points the product at. Without this the action dialled 127.0.0.1:6379 and got ECONNREFUSED.
    Kubernetes:
      port: 6380
    query: "FLUSHALL"
    result: "True"
    full_clean: true
    All-in-one:
      port: 6383
      db: 0

  # The limit counter is a Redis key of its own: plugin_limit_<service><ip><uri>, written with a TTL of one
  # rate period (limit.lua limit_req_redis), so the rate is a minute to keep it there while the key is read.
  limit_requests:
    type: limit
    url: "http://www.example.com/"
    headers:
      X-Forwarded-For: "192.168.0.253"
    rate_limit: "1r/m"
    expect_limited: true
    rate_exceeded_count: 3
    restart_stack: false
    integrations:
      - "Linux"
      - "Docker"
      - "All-in-one"
    config:
      USE_LIMIT_REQ: "yes"
      LIMIT_REQ_URL: "/"
      LIMIT_REQ_RATE: "1r/m"
  check_keys_limit:
    type: redis
    # Ports as in check_keys.
    Linux:
      port: 6390
    Docker:
      port: 6390
    query: "keys *"
    keys:
      - "plugin_limit_www.example.com192.168.0.253/"
    integrations:
      - "Linux"
      - "Docker"
      - "All-in-one"
    delay: 1
    restart_stack: false
    All-in-one:
      port: 6383
      db: 0
  clear_keys_limit:
    type: redis
    # Ports as in clear_keys.
    Linux:
      port: 6390
    Docker:
      port: 6390
    Autoconf:
      port: 6390
    Kubernetes:
      port: 6380
    query: "FLUSHALL"
    result: "True"
    full_clean: true
    All-in-one:
      port: 6383
      db: 0

  # A session of the antibot cookie challenge is stored in Redis under sessions_:<cookie name>:<id>
  # (lua-resty-session redis storage; SESSIONS_NAME gives the name).
  session_cookie:
    type: "header"
    url: "http://www.example.com"
    raise_for_status: false
    response_headers:
      Set-Cookie: "^test=[A-Za-z0-9_-]{110,}"
    restart_stack: false
    integrations:
      - "Linux"
      - "Docker"
      - "All-in-one"
    config:
      USE_ANTIBOT: "cookie"
      SESSIONS_NAME: "test"
  check_keys_session:
    type: redis
    # Ports as in check_keys.
    Linux:
      port: 6390
    Docker:
      port: 6390
    query: "keys sessions_:test:*"
    result: "sessions_:test:"
    integrations:
      - "Linux"
      - "Docker"
      - "All-in-one"
    delay: 1
    restart_stack: false
    All-in-one:
      port: 6383
      db: 0
  clear_keys_session:
    type: redis
    # Ports as in clear_keys.
    Linux:
      port: 6390
    Docker:
      port: 6390
    Autoconf:
      port: 6390
    Kubernetes:
      port: 6380
    query: "FLUSHALL"
    result: "True"
    full_clean: true
    All-in-one:
      port: 6383
      db: 0

  bad_request_global_scope:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    config:
      BAD_BEHAVIOR_BAN_SCOPE: "global"
    restart_stack: false
  check_keys_global_scope:
    type: redis
    # The shared Redis fixture publishes 6390 on the runner (TESTS_REDIS_PORT); Linux uses
    # the host network too. All-in-one uses its own Redis on 6383. See tests/misc/docker/redis.yml.
    Linux:
      port: 6390
    Docker:
      port: 6390
    Autoconf:
      port: 6390
    query: "keys *"
    keys:
      - "plugin_bad_behavior_192.168.0.254"
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    delay: 6
    restart_stack: false
    All-in-one:
      port: 6383
      db: 0
  clear_keys_1:
    type: redis
    # The shared Redis fixture publishes 6390 on the runner (TESTS_REDIS_PORT); Linux uses
    # the host network too. All-in-one uses its own Redis on 6383. See tests/misc/docker/redis.yml.
    Linux:
      port: 6390
    Docker:
      port: 6390
    Autoconf:
      port: 6390
    # Kubernetes publishes no host port for 6379: build.sh maps 6380 -> nodePort 30379 ->
    # svc-redis-master, which is the datastore the Kubernetes block at the bottom of this file
    # points the product at. Without this the action dialled 127.0.0.1:6379 and got ECONNREFUSED.
    Kubernetes:
      port: 6380
    query: "FLUSHALL"
    result: "True"
    full_clean: true
    All-in-one:
      port: 6383
      db: 0

  password_check:
    type: redis
    query: "PING"
    result: "True"
    port: 6380
    db: 0
    password: "secret"
    config:
      REDIS_HOST: "redis-master"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: "secret"
    Linux:
      config:
        REDIS_PORT: "6380"
    Kubernetes:
      port: 6380
      config:
        REDIS_HOST: "svc-redis-master.redis.svc.cluster.local"
    restart_stack: false
  bad_request_password:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    restart_stack: false
  password:
    type: redis
    query: "keys *"
    keys:
      - "plugin_bad_behavior_www.example.com_192.168.0.254"
    port: 6380
    db: 0
    password: "secret"
    delay: 6
    restart_stack: false
  clear_keys_2:
    type: redis
    query: "FLUSHALL"
    result: "True"
    port: 6380
    db: 0
    password: "secret"
    full_clean: true

  user_check:
    type: redis
    query: "PING"
    result: "True"
    port: 6380
    db: 0
    user:
      - "admin"
      - "secret"
    config:
      REDIS_HOST: "redis-master"
      REDIS_DATABASE: "0"
      REDIS_USERNAME: "admin"
      REDIS_PASSWORD: "secret"
    Linux:
      config:
        REDIS_PORT: "6380"
    Kubernetes:
