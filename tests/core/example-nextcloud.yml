# Example-backed spec: the stack under test is examples/nextcloud itself,
# deployed the way a user would deploy it. The assertions live here so that the
# example directory holds only what someone reading the documentation needs.
example: nextcloud

integrations:
  - "Docker"
  - "Autoconf"
  - "Kubernetes"
  # Not Linux: same blocker as `wordpress` — the framework's PHP there is the
  # `php:fpm-alpine` helper, with no database extensions and no database beside it.

actions:
  string_check:
    type: string
    url: "https://www.example.com"
    verify_ssl: false
    string: "nextcloud"
    ignore_case: true
    follow_redirects: true
    timeout: 120
    delay: 60
