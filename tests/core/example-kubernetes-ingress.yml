# Example-backed spec: the stack under test is examples/kubernetes-ingress itself,
# deployed the way a user would deploy it. The assertions live here so that the
# example directory holds only what someone reading the documentation needs.
example: kubernetes-ingress

integrations:
  - "Kubernetes"

actions:
  string_app1_example_com:
    type: string
    url: "https://app1.example.com"
    string: "hello"
    ignore_case: true
    tls: "app1.example.com"
    timeout: 120
    delay: 120
  string_app2_example_com:
    type: string
    url: "https://app2.example.com"
    string: "hello"
    ignore_case: true
    tls: "app2.example.com"
    timeout: 120
    delay: 120
  string_app3_example_com:
    type: string
    url: "https://app3.example.com"
    string: "hello"
    ignore_case: true
    tls: "app3.example.com"
    timeout: 120
    delay: 120
