actions:
  stack_reloaded:
    type: status
    url: "http://127.0.0.1/"
    headers:
      Host: "www.example.com"
    status: 200
    # Healthy comes before the first reload of this 76 KB config lands (~30 s when quiet) and `status` samples once (core.py never runs the `retries` field): 60 s covers a slow runner.
    delay: 60
    timeout: 300
    restart_stack: false

  # --- the UI name list ----------------------------------------------------------------------
  ui_first_alias_has_the_exception:
    type: status
    url: "http://127.0.0.1/?x=%3C%3Fphp%20phpinfo()%3B%20%3F%3E"
    headers:
      Host: "u0001.ui.example.com"
    status: 200
    restart_stack: false
  ui_last_alias_has_the_exception:
    type: status
    url: "http://127.0.0.1/?x=%3C%3Fphp%20phpinfo()%3B%20%3F%3E"
    headers:
      Host: "u1500.ui.example.com"
    status: 200
    restart_stack: false
  # The control: the same request on a host outside the UI list is still blocked.
  plain_service_is_still_blocked:
    type: status
    url: "http://127.0.0.1/?x=%3C%3Fphp%20phpinfo()%3B%20%3F%3E"
    headers:
      Host: "www.example.com"
    status: 403
    restart_stack: false

  # --- the antibot list ----------------------------------------------------------------------
  antibot_first_alias_redirects:
    type: status
    url: "http://127.0.0.1/"
    headers:
      Host: "b0001.bot.example.com"
    status: 302
    restart_stack: false
  antibot_last_alias_redirects:
    type: status
    url: "http://127.0.0.1/"
    headers:
      Host: "b1500.bot.example.com"
    status: 302
    restart_stack: false
  antibot_last_alias_serves_the_challenge:
    type: string
    url: "http://127.0.0.1/challenge"
    headers:
      Host: "b1500.bot.example.com"
    string: 'name="captcha"'
    restart_stack: false
  plain_service_has_no_challenge:
    type: status
    url: "http://127.0.0.1/"
    headers:
      Host: "www.example.com"
    status: 200
    restart_stack: false

  # --- the rendered rules --------------------------------------------------------------------
  rendered_markers:
    type: script
    script:
      ["./tests/core/modsecurity_global_crs_large_host_lists/check-rendered.sh"]
    result: "modsecurity_global_crs_large_host_lists: all checks passed"
    full_clean: true
    Docker:
      script:
        [
          "./tests/core/modsecurity_global_crs_large_host_lists/check-rendered.sh",
          "bunkerweb",
        ]
    All-in-one:
      script:
        [
          "./tests/core/modsecurity_global_crs_large_host_lists/check-rendered.sh",
          "bunkerweb-all-in-one",
        ]
