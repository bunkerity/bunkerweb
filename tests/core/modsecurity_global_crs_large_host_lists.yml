# LARGE HOST LISTS IN GLOBAL CRS MODE (1.6.18 regression).
#
# In global CRS mode the core templates `src/common/core/ui/confs/http/ui.modsec-crs` and
# `src/common/core/antibot/confs/http/antibot.modsec-crs` used to build ONE `@rx` out of every
# server name of the `USE_UI=yes` / antibot-enabled services. libModSecurity 3.0.17 (core 1.6.18)
# refuses an `@rx` past PCRE2's 64 KiB compiled limit (about 1,000 host names), so the rules file
# failed every reload: the scheduler never confirmed the configuration and the stack never became
# healthy. The templates now cut the list into chunks of at most 8 KiB, one phase-1 marker rule per
# chunk (`tx.bw_ui_host`, `tx.bw_ui_ip_host`, `tx.bw_antibot_host`), and the exception rules test
# the marker instead of the regex.
#
# One multisite stack, three services, all behind `app1`:
#   - `ui.example.com`  USE_UI=yes, 1,500 names plus 1,000 IP literals (both UI lists go past the cap)
#   - `bot.example.com` USE_ANTIBOT=captcha, 1,500 names
#   - `www.example.com` the plain control: no UI, no antibot
# The names are synthetic (`uNNNN.ui.example.com`, `bNNNN.bot.example.com`, `10.77.x.y`) and the
# runner never resolves them: every request goes to 127.0.0.1 with the name in the Host header.
#
# What the actions prove:
#   - `stack_reloaded`: the reload went through. This is the assertion that fails on 1.6.18, where
#     the stack never reports healthy, so the very first request cannot be answered.
#   - the UI list: CRS 933100 (a PHP open tag in an argument) is a 403 on any host, but rule 9802107
#     removes the `language-php` tag for a UI host, so the first and the last alias answer 200 while
#     the control answers 403. A marker that stopped at the first chunk would 403 the last alias.
#   - the antibot list: the first and the last alias get the captcha redirect and serve the challenge
#     page, the control gets neither.
#   - `rendered_markers`: the chunked marker rules are really in the rendered file, which is the only
#     way to see the IP list's marker (rule 9802111 removes 920350, a warning that never reaches the
#     anomaly threshold alone, so no request can tell it apart).
#
# Docker and All-in-one only: the Linux and orchestrator arms take the same environment, but the
# marker check below needs `docker exec`, and nothing about the templates changes per integration.
integrations:
  - "Docker"
  - "All-in-one"

config:
  MULTISITE: "yes"
  USE_MODSECURITY: "yes"
  USE_MODSECURITY_GLOBAL_CRS: "yes"
  SERVER_NAME: "www.example.com ui.example.com bot.example.com"
  USE_REVERSE_PROXY: "yes"
  REVERSE_PROXY_HOST: "http://app1.bw-services:8080"
  # The probes below are sent back to back from one address: keep the limiter and the ban out of it.
  USE_LIMIT_REQ: "no"
  USE_LIMIT_CONN: "no"
  USE_BAD_BEHAVIOR: "no"
  ui.example.com_USE_UI: "yes"
  # USE_UI marks the service as HTTPS-served, which turns on the automatic HTTP to HTTPS redirect (301);
  # the probes below talk plain HTTP.
  ui.example.com_AUTO_REDIRECT_HTTP_TO_HTTPS: "no"
  ui.example.com_SERVER_NAME: >-
