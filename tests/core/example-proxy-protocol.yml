# Example-backed spec: the stack under test is examples/proxy-protocol itself,
# deployed the way a user would deploy it. The assertions live here so that the
# example directory holds only what someone reading the documentation needs.
example: proxy-protocol

integrations:
  - "Docker"

actions:
  string_check:
    type: string
    url: "http://www.example.com"
    string: "hello"
    ignore_case: true
    # The example redirects to HTTPS and serves the self-signed fallback -- the test domains
    # resolve only through the framework's dnsmasq, so Let's Encrypt can never issue for them.
    follow_redirects: true
    verify_ssl: false
    timeout: 120
    delay: 30
