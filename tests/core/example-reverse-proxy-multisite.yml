# Example-backed spec: the stack under test is examples/reverse-proxy-multisite itself,
# deployed the way a user would deploy it. The assertions live here so that the
# example directory holds only what someone reading the documentation needs.
example: reverse-proxy-multisite

integrations:
  - "Docker"
  - "Autoconf"
  - "Kubernetes"

actions:
  string_app1_example_com:
    type: string
    url: "https://app1.example.com"
    verify_ssl: false
    string: "hello"
    ignore_case: true
    follow_redirects: true
    timeout: 120
    delay: 90
  string_app2_example_com:
    type: string
    url: "https://app2.example.com"
    verify_ssl: false
    string: "hello"
    ignore_case: true
    follow_redirects: true
    timeout: 120
    delay: 90
