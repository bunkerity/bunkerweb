integrations: "all"

actions:
  check:
    type: redis
    query: "PING"
    result: "True"
    port: 6479
    user:
      - "admin"
      - "secret"
    valkey: true
    restart_stack: false
  bad_request:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  check_keys:
    type: redis
    query: "keys *"
    keys:
      - "plugin_bad_behavior_www.example.com_192.168.0.254"
    port: 6479
    valkey: true
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    delay: 6
    restart_stack: false
  clear_keys:
    type: redis
    query: "FLUSHALL"
    result: "True"
    port: 6479
    valkey: true
    full_clean: true

  check_global:
    type: redis
    query: "PING"
    result: "True"
    port: 6479
    user:
      - "admin"
      - "secret"
    valkey: true
    config:
      BAD_BEHAVIOR_BAN_SCOPE: "global"
    restart_stack: false
  bad_request_global_scope:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    restart_stack: false
  check_keys_global_scope:
    type: redis
    query: "keys *"
    keys:
      - "plugin_bad_behavior_192.168.0.254"
    port: 6479
    valkey: true
    integrations:
      - "Linux"
      - "Docker"
      - "Autoconf"
      - "All-in-one"
    delay: 6
    restart_stack: false
  clear_keys_1:
    type: redis
    query: "FLUSHALL"
    result: "True"
    port: 6479
    valkey: true
    full_clean: true

  user_check:
    type: redis
    query: "PING"
    result: "True"
    port: 6479
    user:
      - "admin"
      - "secret"
    valkey: true
    config:
      REDIS_USERNAME: "admin"
      REDIS_PASSWORD: "secret"
    restart_stack: false
  bad_request_user:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    restart_stack: false
  user:
    type: redis
    query: "keys *"
    keys:
      - "plugin_bad_behavior_www.example.com_192.168.0.254"
    port: 6479
    user:
      - "admin"
      - "secret"
    valkey: true
    delay: 6
    restart_stack: false
  clear_keys_3:
    type: redis
    query: "FLUSHALL"
    result: "True"
    port: 6479
    user:
      - "admin"
      - "secret"
    valkey: true
    full_clean: true

  tls_check:
    type: redis
    query: "PING"
    result: "True"
    tls: true
    tls_port: 6480
    valkey: true
    config:
      REDIS_SSL: "yes"
      REDIS_PORT: "6380"
    # 6380 is the port valkey serves TLS on INSIDE its container, which is what BunkerWeb dials
    # on the arms that share `bw-universe` with it. The Linux container runs `network_mode: host`
    # (tests/linux/docker-compose.yml) and reaches valkey through the PUBLISHED ports instead --
    # which is why the spec-level Linux override is 6479 and not 6379. Same shift for TLS:
    # tests/misc/docker/valkey.yml publishes `127.0.0.1:6480:6380`. Without this the instance
    # dialled a port nothing listens on, wrote no key, and `tls` below read back an empty
    # database. `tests/core/redis.yml` follows the same pattern for its TLS actions but with
    # 6380 -- its arm talks to a HOST-PACKAGED redis, not these published container ports, so
    # do not "harmonise" the two values.
    Linux:
      config:
        REDIS_PORT: "6480"
    restart_stack: false
  bad_request_tls:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    headers:
      X-Forwarded-For: "192.168.0.254"
    restart_stack: false
  tls:
    type: redis
    query: "keys *"
    keys:
      - "plugin_bad_behavior_www.example.com_192.168.0.254"
    tls: true
    tls_port: 6480
    valkey: true
    config:
      REDIS_PORT: "6380"
    Linux:
      config:
        REDIS_PORT: "6480"
    delay: 6
    restart_stack: false
  clear_keys_4:
    type: redis
    query: "FLUSHALL"
    result: "True"
    tls: true
    tls_port: 6480
    valkey: true
    full_clean: true
    config:
      REDIS_PORT: "6380"
    Linux:
      config:
        REDIS_PORT: "6480"

