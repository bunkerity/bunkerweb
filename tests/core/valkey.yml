config:
  USE_LIMIT_REQ: "no"
  USE_LIMIT_CONN: "no"
  USE_DNSBL: "no"
  BAD_BEHAVIOR_BAN_SCOPE: "service"
  USE_REAL_IP: "yes"
  REAL_IP_FROM: "0.0.0.0/0"
  USE_REDIS: "yes"
  REDIS_HOST: "valkey"
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  REDIS_SSL: "no"
  REDIS_SSL_VERIFY: "no"
  REDIS_TIMEOUT: "1000"
  REDIS_USERNAME: ""
  REDIS_PASSWORD: ""
  REDIS_KEEPALIVE_IDLE: "30000"
  REDIS_KEEPALIVE_POOL: "10"
  REDIS_SENTINEL_HOSTS: ""
  REDIS_SENTINEL_USERNAME: ""
  REDIS_SENTINEL_PASSWORD: ""
  REDIS_SENTINEL_MASTER: "valkey-master"

Linux:
  config:
    REDIS_PORT: "6479"

Kubernetes:
  config:
    REDIS_HOST: "svc-valkey.redis.svc.cluster.local"
