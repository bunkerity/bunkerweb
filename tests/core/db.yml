    log_from: "scheduler"
    database: "mariadb"
    restart_stack: false
  mariadb_global:
    type: database
    query: "SELECT CONCAT('global=', setting_id, '=', value) FROM bw_global_values WHERE setting_id = 'GZIP_COMP_LEVEL'"
    result: "global=GZIP_COMP_LEVEL=3"
