    result: "custom_config=server_http/dbspec method=scheduler"
    log_from: "scheduler"
    integrations:
      - "Docker"
    database: "mariadb"
    restart_stack: false
  # ? Last of the engine on every integration: `full_clean` tears the stack down, so the next engine's boot action starts on its own database
  mariadb_service:
    type: database
    query: "SELECT CONCAT('service=', id) FROM bw_services"
    result: "service=www.example.com"
    log_from: "scheduler"
    database: "mariadb"
    full_clean: true
  mysql:
    type: database
    query: "SELECT 1"
    result: null
    not_log: "❌"
    log_from: "scheduler"
