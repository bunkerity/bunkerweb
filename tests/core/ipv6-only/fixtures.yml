x-client:
  image: bunkerity/bunkerweb-scheduler:tests
  entrypoint: &id001
    - sleep
    - infinity
  healthcheck: &id002
    disable: true
  mem_limit: 64m
  dns: &id003
    - fd42:1618:1::20
services:
  client:
    image: bunkerity/bunkerweb-scheduler:tests
    entrypoint: *id001
    healthcheck: *id002
    mem_limit: 64m
    dns: *id003
    container_name: ipv6-client
    networks:
      bw-services:
        ipv6_address: fd42:1618:2::a
  other:
    image: bunkerity/bunkerweb-scheduler:tests
    entrypoint: *id001
    healthcheck: *id002
    mem_limit: 64m
    dns: *id003
    container_name: ipv6-other
    networks:
      bw-services:
        ipv6_address: fd42:1618:2::b
  untrusted:
    image: bunkerity/bunkerweb-scheduler:tests
    entrypoint: *id001
    healthcheck: *id002
    mem_limit: 64m
    dns: *id003
    container_name: ipv6-untrusted
    networks:
      bw-universe:
        ipv6_address: fd42:1618:1::b
  backend:
    image: bunkerity/bunkerweb-scheduler:tests
    entrypoint:
      - python3
      - /fixtures/server.py
    healthcheck: *id002
    mem_limit: 64m
    dns: *id003
    container_name: ipv6-backend
    volumes:
      - ${PWD}/tests/core/ipv6/server.py:/fixtures/server.py:ro
    networks:
      ipv6-backend:
        ipv6_address: fd42:1618:3::80
networks:
  bw-universe:
    external: true
  bw-services:
    external: true
  ipv6-backend:
    name: ipv6-backend
    enable_ipv4: false
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd42:1618:3::/64
