integrations: "all"

actions:
  activated:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    log: '[ver "OWASP_CRS/4'
  deactivated:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 200
    config:
      USE_MODSECURITY: "no"
  deactivated_crs:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 200
    config:
      USE_MODSECURITY_CRS: "no"
  detect_only:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 200
    log: '[ver "OWASP_CRS/4'
    config:
      MODSECURITY_SEC_RULE_ENGINE: "DetectionOnly"
  security_detect_only:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 200
    log: '[ver "OWASP_CRS/4'
    config:
      SECURITY_MODE: "detect"
  crs_v3:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    log: '[ver "OWASP_CRS/3'
    config:
      MODSECURITY_CRS_VERSION: "3"
  # Kubernetes pins the plugin by direct archive URL instead of the registry name: a fresh
  # cluster has no warm cache, and download-crs-plugins.py's registry/releases lookup then hits
  # api.github.com, which a shared-runner IP can get rate-limited on (403, 4 attempts) -- empty
  # cache, exclusion plugin missing, request blocked with 403 instead of 405. An entry starting
  # with "http" skips the registry and releases lookup entirely (download-crs-plugins.py:425,
  # :347) -- keep the ".tar.gz" suffix: extraction picks the tar branch by extension
  # (download-crs-plugins.py:582), libmagic reports this archive as "application/gzip", not
  # "application/x-tar". The pinned URL is the exact archive get_download_url() already resolves
  # the bare name to today (coreruleset/wordpress-rule-exclusions-plugin, latest non-prerelease
  # release v1.2.0 -- verified with `curl -sI`, 302 -> 200), so the loaded plugin is identical
  # either way and the 405 Kubernetes has expected since 71247ab38 still holds. Other arms keep
  # the NAME form so registry resolution stays exercised there -- though they resolve the same
  # NAME through the same unauthenticated api.github.com call, so they remain exposed to the
  # same rate limit; this pin closes the observed Kubernetes flake, not the underlying exposure.
  crs_plugins:
    type: status
    url: "http://www.example.com/post/wp-login.php?pass1=<script>"
    method: POST
    not_log: "❌"
    status: 404
    config:
      MODSECURITY_CRS_PLUGINS: "wordpress-rule-exclusions"
    Kubernetes:
      status: 405
      config:
        MODSECURITY_CRS_PLUGINS: "https://github.com/coreruleset/wordpress-rule-exclusions-plugin/archive/refs/tags/v1.2.0.tar.gz"
    All-in-one:
      restart_stack: false
  crs_plugins_scheduler_logs:
    type: status
    url: "http://www.example.com/post/wp-login.php?pass1=<script>"
    method: POST
    not_log: "❌"
    log_from: "scheduler"
    status: 404
    integrations:
      - "All-in-one"
  # The only assertion that global CRS actually BLOCKS. crs_plugins_global below is a 404 by
  # design, and a global-crs include that rendered nothing would 404 exactly the same way -- so
  # without this action the whole global-CRS mode could stop loading rules and the spec would
  # stay green. Verified locally against bunkerity/bunkerweb:tests: emptying
  # /etc/nginx/http/modsecurity-rules-global-crs.conf.modsec and reloading turns this 403 into a
  # 200, and restoring it turns it back.
  global_crs_activated:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    log: '[ver "OWASP_CRS/4'
    config:
      USE_MODSECURITY_GLOBAL_CRS: "yes"
  crs_plugins_global:
    type: status
    url: "http://www.example.com/post/wp-login.php?pass1=<script>"
    method: POST
    not_log: "❌"
    # Same outcome as crs_plugins since 2e0ae130d: global CRS is one shared ruleset in the http
    # context, so it loads the union of every service's downloaded plugins instead of loading
    # none of them. wordpress-rule-exclusions therefore applies here too, the request is no
    # longer blocked and nginx answers for a path that does not exist.
    status: 404
    config:
      USE_MODSECURITY_GLOBAL_CRS: "yes"
      MODSECURITY_CRS_PLUGINS: "wordpress-rule-exclusions"
    Kubernetes:
      status: 405
      # Direct-URL pin, same reasoning and same archive as crs_plugins above.
      config:
        MODSECURITY_CRS_PLUGINS: "https://github.com/coreruleset/wordpress-rule-exclusions-plugin/archive/refs/tags/v1.2.0.tar.gz"
    All-in-one:
      restart_stack: false
  crs_plugins_global_scheduler_logs:
    type: status
    url: "http://www.example.com/post/wp-login.php?pass1=<script>"
    method: POST
    not_log: "❌"
    log_from: "scheduler"
    status: 404
    integrations:
      - "All-in-one"

config:
  USE_MODSECURITY: "yes"
