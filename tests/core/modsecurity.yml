integrations: "all"

actions:
  activated:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    log: '[ver "OWASP_CRS/4'
  deactivated:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 200
    config:
      USE_MODSECURITY: "no"
  deactivated_crs:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 200
    config:
      USE_MODSECURITY_CRS: "no"
  detect_only:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 200
    log: '[ver "OWASP_CRS/4'
    config:
      MODSECURITY_SEC_RULE_ENGINE: "DetectionOnly"
  security_detect_only:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 200
    log: '[ver "OWASP_CRS/4'
    config:
      SECURITY_MODE: "detect"
  crs_v3:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    log: '[ver "OWASP_CRS/3'
    config:
      MODSECURITY_CRS_VERSION: "3"
  crs_plugins:
    type: status
    url: "http://www.example.com/post/wp-login.php?pass1=<script>"
    method: POST
    not_log: "❌"
    status: 404
    config:
      MODSECURITY_CRS_PLUGINS: "wordpress-rule-exclusions"
    Kubernetes:
      status: 405
    All-in-one:
      restart_stack: false
  crs_plugins_scheduler_logs:
    type: status
    url: "http://www.example.com/post/wp-login.php?pass1=<script>"
    method: POST
    not_log: "❌"
    log_from: "scheduler"
    status: 404
    integrations:
      - "All-in-one"
  # The only assertion that global CRS actually BLOCKS. crs_plugins_global below is a 404 by
  # design, and a global-crs include that rendered nothing would 404 exactly the same way -- so
  # without this action the whole global-CRS mode could stop loading rules and the spec would
  # stay green. Verified locally against bunkerity/bunkerweb:tests: emptying
  # /etc/nginx/http/modsecurity-rules-global-crs.conf.modsec and reloading turns this 403 into a
  # 200, and restoring it turns it back.
  global_crs_activated:
    type: status
    url: "http://www.example.com/?id=/etc/passwd"
    status: 403
    log: '[ver "OWASP_CRS/4'
    config:
      USE_MODSECURITY_GLOBAL_CRS: "yes"
  crs_plugins_global:
    type: status
    url: "http://www.example.com/post/wp-login.php?pass1=<script>"
    method: POST
    not_log: "❌"
    # Same outcome as crs_plugins since 2e0ae130d: global CRS is one shared ruleset in the http
    # context, so it loads the union of every service's downloaded plugins instead of loading
    # none of them. wordpress-rule-exclusions therefore applies here too, the request is no
    # longer blocked and nginx answers for a path that does not exist.
    status: 404
    config:
      USE_MODSECURITY_GLOBAL_CRS: "yes"
      MODSECURITY_CRS_PLUGINS: "wordpress-rule-exclusions"
    Kubernetes:
      status: 405
    All-in-one:
      restart_stack: false
  crs_plugins_global_scheduler_logs:
    type: status
    url: "http://www.example.com/post/wp-login.php?pass1=<script>"
    method: POST
    not_log: "❌"
    log_from: "scheduler"
    status: 404
    integrations:
      - "All-in-one"

config:
  USE_MODSECURITY: "yes"
