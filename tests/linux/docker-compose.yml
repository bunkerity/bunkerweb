services:
  bunkerweb-linux:
    pull_policy: never
    image: local/bunkerweb-linux
    # image: local/bunkerweb-linux-rhel-10
    # image: local/bunkerweb-linux-alma-10
    container_name: bunkerweb-linux
    network_mode: host
    tty: true
    privileged: true
    cgroup: host
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /run/php:/run/php
      # generate.py writes the env files on the host, the packaged BunkerWeb reads them
      # in here — the two have to be the same directory or the tests configure nothing.
      - ${BW_TESTS_ETC:-/etc/bunkerweb}:/etc/bunkerweb
      - /var/www/html:/var/www/html
      - /var/log/bunkerweb:/var/log/bunkerweb
      - /var/lib/bunkerweb:/var/lib/bunkerweb
      - /tmp/output:/tmp/output
    labels:
      - bunkerweb.INSTANCE=yes
      - bunkerweb.type=scheduler
