integrations:
  - "Docker"

actions:
  web_cache:
    type: ui
    steps:
      wizard_setup:
        type: setup
        admin_username: "admin"
        admin_password: "P@ssw0rd"
        server_name: "www.example.com"
      access_page:
        type: access
        url: "%BASE_URL%/web-cache"
        sleep: 2.0
      login:
        type: login
        next_page: "web-cache"
        username: "admin"
        password: "P@ssw0rd"
      # Panels are components/card.html, whose title is an <h5 class="card-title">.
      assert_status:
        type: find
        selector: '//h5[contains(text(), "Instance storage")]'
      assert_metrics:
        type: find
        selector: '//h5[contains(text(), "Aggregate hit / miss distribution")]'
      # "Purge all" is destructive, so the danger-zone button only opens a confirmation modal --
      # the POST is the modal's own submit.
      purge_all:
        type: click
        selector: '//div[contains(@class, "web-cache-danger")]//button[normalize-space()="Purge all"]'
      purge_all_confirm:
        type: click
        selector: '//div[@id="purge-all"]//button[@type="submit"]'
        sleep: 0.5
      # Matching only "Web cache purged" passed on the partial branch too -- routes/web_cache.py
      # flashes "Web cache purged on N instance(s); ..." as a *warning* when instances are
      # unreachable, and that contains the shorter string. This stack has one instance, so a
      # partial result is a real failure and has to red. Anchoring on the success branch's own
      # wording, "(all entries)", is what makes that possible.
      assert_all_success:
        type: find
        selector: '//div[contains(@class, "toast-body") and contains(text(), "Web cache purged (all entries)")]'
      fill_url:
        type: send_keys
        selector: '//input[@name="url"]'
        value: "http://www.example.com/"
      purge_url:
        type: click
        selector: '//button[normalize-space()="Purge URL"]'
      assert_url_success:
        type: find
        selector: '//div[contains(@class, "toast-body") and contains(text(), "http://www.example.com/")]'

config:
  USE_REVERSE_PROXY: "yes"
  # Network-qualified: the framework's dnsmasq answers NXDOMAIN for a bare container name and
  # NGINX does not fall through to the docker resolver.
  REVERSE_PROXY_HOST: "http://app1.bw-services:8080"
  USE_PROXY_CACHE: "yes"
  PROXY_CACHE_MIN_USES: "1"
