integrations: "all"

actions:
  configs:
    type: ui
    steps:
      wizard_setup:
        type: setup
        admin_username: "admin"
        admin_password: "P@ssw0rd"
        server_name: "www.example.com"

      access_configs:
        type: access
        url: "%BASE_URL%/configs"
        sleep: 2.0
      login:
        type: login
        next_page: "configs"
        username: "admin"
        password: "P@ssw0rd"

      # Regression guard for the onboarding drawer occlusion (fixed in src/ui/main.py by
      # pinning `onboarding_autoopen` to False). The drawer is `offcanvas-end`: 400 px of
      # fixed overlay with no backdrop, and when it auto-opened on the first page a session
      # rendered it sat on this page's toolbar. Every existing assertion stayed green through
      # that defect, because `type: find` with an xpath only proves the button is IN THE DOM --
      # the button was findable and not clickable. Measured with `document.elementFromPoint` at
      # each control's centre, the drawer covered this page's primary CTA 100% at 1920 and worse
      # at 1280.
      #
      # So assert what the defect actually broke: the centre of the CTA hit-tests back to the
      # CTA. `by: js` runs the expression in the page (utils/ui.py) and `find` fails the run
      # when it returns null, so this reds on any overlay -- drawer, toast, modal backdrop --
      # that takes the click, not just this one.
      #
      # The `#onboarding-button` check is the precondition, not decoration: the pill is
      # rendered only while the walkthrough is active for the session, so without it this
      # would pass vacuously on a user who had dismissed the walkthrough and would prove
      # nothing about the first run. If the walkthrough is ever removed, this reds and that is
      # the right outcome -- the guard has to be re-aimed, not silently kept green.
      first_run_cta_receives_click:
        type: find
        by: "js"
        selector: |-
          (function () {
            if (!document.getElementById('onboarding-button')) return null;
            var el = document.querySelector('a[role="button"][href="/configs/new"]');
            if (!el) return null;
            el.scrollIntoView({block: 'center', inline: 'center'});
            var r = el.getBoundingClientRect();
            if (r.width === 0 || r.height === 0) return null;
            var hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
            return (hit && (hit === el || el.contains(hit))) ? el : null;
          })()
      create_global_config:
        type: create
        item: "config"
        name: "my_global_config"
        config_type: "server_http"
        content: |
          location /hello {
            default_type 'text/plain';
            content_by_lua_block {
              ngx.say('world')
            }
          }
      verify_global_config:
        type: read
        item: "config"
        name: "my_global_config"
        config_type: "server_http"
        content: |
          location /hello {
            default_type 'text/plain';
            content_by_lua_block {
              ngx.say('world')
            }
          }
      access_global_config:
        type: access
        url: "http://www.example.com/hello"
        new_tab: true
      switch_to_global_config_tab:
        type: switch_tab
        tab: 1
      find_world:
        type: find
        by: "js"
        selector: 'Array.from(document.body.querySelectorAll("*"))
          .find(el => el.textContent && el.textContent.includes("world"))'
      close_global_config_tab:
        type: close_tab

      create_service:
        type: create
        item: "service"
        name: "app1.example.com"
        mode: "raw"
        config:
          USE_REVERSE_PROXY: "yes"
          REVERSE_PROXY_HOST: "http://192.168.0.254:8080"
        Kubernetes:
          config:
            REVERSE_PROXY_HOST: "http://svc-app1.services.svc.cluster.local"
      access_global_config_1:
        type: access
        url: "http://app1.example.com/hello"
        new_tab: true
        sleep: 10.0
      switch_to_global_config_tab_1:
        type: switch_tab
        tab: 1
      find_world_1:
        type: find
        by: "js"
        selector: 'Array.from(document.body.querySelectorAll("*"))
          .find(el => el.textContent && el.textContent.includes("world"))'
      close_global_config_tab_1:
        type: close_tab

      update_global_config:
        type: update
        item: "config"
        name: "my_global_config"
        new_service: "app1.example.com"
        config_type: "server_http"
        content: |
          location /hello {
            default_type 'text/plain';
            content_by_lua_block {
              ngx.say('world')
            }
          }
      access_service_config:
        type: access
        url: "http://app1.example.com/hello"
        new_tab: true
        sleep: 10.0
      switch_to_service_config_tab:
        type: switch_tab
        tab: 1
      find_world_service:
        type: find
        by: "js"
        selector: 'Array.from(document.body.querySelectorAll("*"))
          .find(el => el.textContent && el.textContent.includes("world"))'
      close_global_service_tab:
        type: close_tab
      access_service_config_non_existent:
        type: access
        url: "http://www.example.com/hello"
        new_tab: true
      switch_to_service_config_tab_non_existent:
        type: switch_tab
        tab: 1
      find_world_service_non_existent:
        type: find
        selector: '//span[contains(text(), "Not Found")]'
      close_global_service_tab_non_existent:
        type: close_tab

      # `check_config_deletion` below is a `findable: false`, and a negative assertion that has
      # never been seen to match is indistinguishable from one that cannot match. Asserting the
      # link positively here, while the config still exists, is what tells the two apart.
      #
      # It does, and the answer is that the deletion check has never been able to match: the row
      # is `/configs/global/server_http/my_global_config`, not `/configs/app1.example.com/...`.
      # `update_global_config` above sets `new_service: app1.example.com` and the listing still
      # reports the config as Global afterwards -- while `find_world_service_non_existent`, thirty
      # seconds earlier in the same run, proves `www.example.com/hello` returns Not Found, which a
      # config that were still global would serve. The behaviour moved; the listing did not.
      # Whether that is the listing lying or the move silently not persisting is a product
      # question, and it is with the PO -- so this asserts what the UI actually renders today, and
      # `check_config_deletion` is deliberately left as it was rather than re-pointed at a shape
      # nobody has confirmed is correct.
      access_configs_before_delete:
        type: access
        url: "%BASE_URL%/configs"
        sleep: 2.0
      check_config_link_present:
        type: find
        selector: '//a[@href="/configs/global/server_http/my_global_config"]'

      delete_clone_service:
        type: delete
        item: "service"
        name: "app1.example.com"

      access_configs_1:
        type: access
        url: "%BASE_URL%/configs"
        sleep: 10.0
      check_config_deletion:
        type: find
        selector: '//a[@href="/configs/app1.example.com/server_http/my_global_config"]'
        findable: false
      check_service_config_deletion:
        type: access
        url: "http://app1.example.com/hello"
        new_tab: true
      switch_to_service_config_tab_deletion:
        type: switch_tab
        tab: 1
      find_world_service_deletion:
        type: find
        selector: "//h3[contains(text(),'Nothing to see here ...')]"
      close_global_service_tab_deletion:
        type: close_tab

annotations:
  bunkerweb.io/SERVER_NAME: "test.example.com"
