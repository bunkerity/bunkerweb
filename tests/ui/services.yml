integrations: "all"

actions:
  services:
    type: ui
    steps:
      wizard_setup:
        type: setup
        admin_username: "admin"
        admin_password: "P@ssw0rd"
        server_name: "www.example.com"

      access_services:
        type: access
        url: "%BASE_URL%/services"
        sleep: 2.0
      login:
        type: login
        next_page: "services"
        username: "admin"
        password: "P@ssw0rd"

      # Regression guard for the onboarding drawer occlusion (fixed in src/ui/main.py by
      # pinning `onboarding_autoopen` to False). The drawer is `offcanvas-end`: 400 px of
      # fixed overlay with no backdrop, and when it auto-opened on the first page a session
      # rendered it sat on this page's toolbar. Every existing assertion stayed green through
      # that defect, because `type: find` with an xpath only proves the button is IN THE DOM --
      # the button was findable and not clickable. Measured with `document.elementFromPoint` at
      # each control's centre, the drawer covered this page's primary CTA 100% at 1920 and worse
      # at 1280.
      #
      # So assert what the defect actually broke: the centre of the CTA hit-tests back to the
      # CTA. `by: js` runs the expression in the page (utils/ui.py) and `find` fails the run
      # when it returns null, so this reds on any overlay -- drawer, toast, modal backdrop --
      # that takes the click, not just this one.
      #
      # The `#onboarding-button` check is the precondition, not decoration: the pill is
      # rendered only while the walkthrough is active for the session, so without it this
      # would pass vacuously on a user who had dismissed the walkthrough and would prove
      # nothing about the first run. If the walkthrough is ever removed, this reds and that is
      # the right outcome -- the guard has to be re-aimed, not silently kept green.
      first_run_cta_receives_click:
        type: find
        by: "js"
        selector: |-
          (function () {
            if (!document.getElementById('onboarding-button')) return null;
            var el = document.getElementById('services-create-btn');
            if (!el) return null;
            el.scrollIntoView({block: 'center', inline: 'center'});
            var r = el.getBoundingClientRect();
            if (r.width === 0 || r.height === 0) return null;
            var hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
            return (hit && (hit === el || el.contains(hit))) ? el : null;
          })()
      create_service:
        type: create
        item: "service"
        name: "app1.example.com"
        config:
          USE_REVERSE_PROXY: "yes"
          REVERSE_PROXY_HOST: "http://192.168.0.254:8080"
        Kubernetes:
          config:
            REVERSE_PROXY_HOST: "http://svc-app1.services.svc.cluster.local"
      verify_service:
        type: read
        item: "service"
        name: "app1.example.com"
        config:
          USE_REVERSE_PROXY: "yes"
          REVERSE_PROXY_HOST: "http://192.168.0.254:8080"
        Kubernetes:
          config:
            REVERSE_PROXY_HOST: "http://svc-app1.services.svc.cluster.local"
      access_services_page:
        type: access
        page: "services"
      verify_service_type:
        type: find
        selector: '//span[@id="type-app1-example-com" and @data-value="online"]'
        sleep: 2.0
      verify_service_method:
        type: find
        selector: '//td[@id="method-app1-example-com" and contains(text(), "ui")]'
      check_service:
        type: click
        selector: '//a[@data-i18n="tooltip.link.access_service" and contains(@data-i18n-options, "app1.example.com")]'
        sleep: 15.0
      switch_to_service:
        type: switch_tab
        tab: 1
      check_service_1:
        type: find
        selector: '//img[contains(@alt, "NGINX")]'
      close_service_tab:
        type: close_tab

      clone_service_draft_raw:
        type: create
        item: "service"
        name: "app2.example.com"
        mode: "raw"
        draft: true
        clone: "app1.example.com"
      verify_clone_service_raw:
        type: read
        item: "service"
        name: "app2.example.com"
        mode: "raw"
        draft: true
        config:
          USE_REVERSE_PROXY: "yes"
          REVERSE_PROXY_HOST: "http://192.168.0.254:8080"
        sleep: 5.0
        Kubernetes:
          config:
            REVERSE_PROXY_HOST: "http://svc-app1.services.svc.cluster.local"
      access_services_page_1:
        type: access
        page: "services"
      verify_clone_service_type:
        type: find
        selector: '//span[@id="type-app2-example-com" and @data-value="draft"]'
        sleep: 2.0
      verify_clone_service_method:
        type: find
        selector: '//td[@id="method-app2-example-com" and contains(text(), "ui")]'
      check_clone_service:
        type: access
        url: "http://app2.example.com"
        new_tab: true
        sleep: 15.0
      check_clone_service_1:
        type: find
        selector: '//img[contains(@alt, "NGINX")]'
        findable: false
      close_clone_service_tab:
        type: close_tab
      convert_clone_service:
        type: click
        selector: '//button[@data-service-id="app2.example.com" and contains(@class, "convert-service")]'
      convert_clone_service_1:
        type: click
        selector: '//div[@id="modal-convert-services"]//button[@type="submit"]'
      verify_clone_service_type_1:
        type: find
        selector: '//span[@id="type-app2-example-com" and @data-value="online"]'
        sleep: 5.0
      check_clone_service_2:
        type: click
        selector: '//a[@data-i18n="tooltip.link.access_service" and contains(@data-i18n-options, "app2.example.com")]'
        sleep: 15.0
      switch_to_clone_service_1:
        type: switch_tab
        tab: 1
      check_clone_service_3:
        type: find
        selector: '//img[contains(@alt, "NGINX")]'
      close_clone_service_tab_1:
        type: close_tab
      delete_clone_service:
        type: delete
        item: "service"
        name: "app2.example.com"

      clone_service_draft_2:
        type: create
        item: "service"
        name: "app2.example.com"
        mode: "raw"
        draft: true
        clone: "app1.example.com"
      verify_clone_service_2:
        type: read
        item: "service"
        name: "app2.example.com"
        mode: "raw"
        draft: true
        config:
          USE_REVERSE_PROXY: "yes"
          REVERSE_PROXY_HOST: "http://192.168.0.254:8080"
        sleep: 5.0
        Kubernetes:
          config:
            REVERSE_PROXY_HOST: "http://svc-app1.services.svc.cluster.local"
      access_services_page_2:
        type: access
        page: "services"
      verify_clone_service_type_2:
        type: find
        selector: '//span[@id="type-app2-example-com" and @data-value="draft"]'
        sleep: 5.0

      select_services:
        type: click
        sleep: 1.0
        # DataTables 2 wraps every header cell in <div class="dt-column-header">, so the
        # select-all checkbox is no longer a direct child of its <th>.
        selector: '//thead//input[@type="checkbox"]'
      multiple_convert:
        type: click
        sleep: 1.0
        selector: "//button[contains(@class, 'action-button')]"
      multiple_convert_1:
        type: click
        sleep: 1.0
        # The clickable node is the <a class="dropdown-item"> INSIDE <li class="dt-button">, and
        # `contains(@class, "dt-button")` also matches the toolbar's own div.dt-buttons -- which is
        # what a looser selector clicks, silently doing nothing. The label is split too:
        # `Convert to<span class="d-none d-md-inline"> draft</span>`.
        selector: '//div[contains(@class, "dt-button-collection")]//a[contains(@class, "dropdown-item")][.//span[contains(text(), "draft")]]'
      multiple_convert_2:
        type: click
        selector: '//div[@id="modal-convert-services"]//button[@type="submit"]'
      verify_multiple_convert:
        type: find
        selector: '//span[@id="type-app1-example-com" and @data-value="draft"]'
        sleep: 5.0
      verify_multiple_convert_1:
        type: find
        selector: '//span[@id="type-www-example-com" and @data-value="online"]'

      select_services_1:
        type: click
        sleep: 1.0
        # DataTables 2 wraps every header cell in <div class="dt-column-header">, so the
        # select-all checkbox is no longer a direct child of its <th>.
        selector: '//thead//input[@type="checkbox"]'
      multiple_delete:
        type: click
        sleep: 1.0
        selector: "//button[contains(@class, 'action-button')]"
      multiple_delete_1:
        type: click
        sleep: 1.0
        # Same entry shape as above; "Delete" is the link's own text, only the icon is wrapped.
        selector: '//div[contains(@class, "dt-button-collection")]//a[contains(@class, "dropdown-item") and contains(normalize-space(), "Delete")]'
      multiple_delete_2:
        type: click
        selector: '//div[@id="modal-delete-services"]//button[@type="submit"]'
      verify_multiple_delete:
        type: find
        selector: '//span[@id="type-app1-example-com" and @data-value="draft"]'
        sleep: 5.0
        findable: false
      verify_multiple_delete_1:
        type: find
        selector: '//span[@id="type-www-example-com" and @data-value="online"]'
        sleep: 5.0

annotations:
  bunkerweb.io/SERVER_NAME: "test.example.com"
