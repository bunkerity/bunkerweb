integrations: "all"

# Selectors follow the 1.7 home page (status band + KPI tiles + mini-tiles + news carousel).
# The pre-1.7 dashboard put the plan, the counters and the news in a flat card grid; a spec
# written against that markup still logs in fine and then fails on the first `find`, which reads
# like a broken page rather than a moved one.
actions:
  home:
    type: ui
    steps:
      wizard_setup:
        type: setup
        admin_username: "admin"
        admin_password: "P@ssw0rd"
        server_name: "www.example.com"
      login:
        type: login
        username: "admin"
        password: "P@ssw0rd"
        sleep: 2.0
      assert_2fa_warning:
        type: find
        selector: '//div[@class="toast-body" and contains(text(), "Please enable two-factor authentication")]'
      # Status band, first column: the plan name, with the "Free plan" chip next to it.
      assert_plan_card:
        type: find
        selector: '//span[contains(@class, "sb-plan-name") and normalize-space(text()) = "FREE"]'
        sleep: 0.0
      assert_free_plan_chip:
        type: find
      # A red here means one of two things, and they look identical in the log: the element moved,
      # or its label rendered as a raw catalog key. The dot-free predicate is the second check --
      # with i18next gone there is no browser-side English fallback, so a key missing from the
      # catalog paints `dashboard.tile.bans_active` into the page and a structural-only selector
      # would happily match it. Check the rendered text before re-anchoring the selector.
        selector: '//div[contains(@class, "sb-plan")]//span[contains(@class, "sb-chip-muted") and not(contains(normalize-space(text()), "."))]'
        sleep: 0.0
      assert_memory_card:
        type: find
      # A red here means one of two things, and they look identical in the log: the element moved,
      # or its label rendered as a raw catalog key. The dot-free predicate is the second check --
      # with i18next gone there is no browser-side English fallback, so a key missing from the
      # catalog paints `dashboard.tile.bans_active` into the page and a structural-only selector
      # would happily match it. Check the rendered text before re-anchoring the selector.
        selector: '//div[contains(@class, "sb-ram")]//span[contains(@class, "sb-eyebrow") and not(contains(normalize-space(text()), "."))]'
        sleep: 0.0
      assert_instances_number:
        type: find
        selector: '//a[@href="/instances"]//span[contains(@class, "don-jose") and contains(text(), "01")]'
        sleep: 0.0
      assert_services_number:
        type: find
        selector: '//a[@href="/services"]//span[contains(@class, "don-jose") and contains(text(), "01")]'
        sleep: 0.0
      # The plugin count left the dashboard with the reskin; Upstreams and Certificates took the
      # two remaining tiles. A fresh stack declares no upstream, so that tile reads exactly 0.
      assert_upstreams_number:
        type: find
        selector: '//a[@href="/upstreams"]//span[contains(@class, "bw-kpi-value") and normalize-space(text()) = "0"]'
        sleep: 0.0
      assert_certificates_tile:
        type: find
        selector: '//a[@href="/certificates"]//span[contains(@class, "bw-kpi-value")]'
        sleep: 0.0
      # Mini-tile row below the KPI tiles.
      assert_bans_tile:
        type: find
      # A red here means one of two things, and they look identical in the log: the element moved,
      # or its label rendered as a raw catalog key. The dot-free predicate is the second check --
      # with i18next gone there is no browser-side English fallback, so a key missing from the
      # catalog paints `dashboard.tile.bans_active` into the page and a structural-only selector
      # would happily match it. Check the rendered text before re-anchoring the selector.
        selector: '//div[contains(@class, "mini-tile") and contains(@class, "bad")]//div[contains(@class, "lbl")]/span[not(contains(normalize-space(text()), "."))]'
        sleep: 0.0
      # Map, blocked-IP donut and top-reasons table are filled from /home/metrics after the page
      # paints, so give the fetch a moment before asking for the rendered Leaflet panes.
      assert_map:
        type: find
        selector: '//div[@id="requests-map"]//div[contains(@class, "leaflet-pane")]'
        sleep: 3.0
      # Only the carousel itself. Its cards are injected client-side from
      # www.bunkerweb.io/wp-json (utils.js: the BROWSER fetches it, cross-origin, not the UI
      # container), so asserting on them makes this spec fail whenever that site is slow,
      # unreachable from the runner, or changes its REST shape -- which says nothing about
      # BunkerWeb. Covering the cards needs a stubbed feed, not a live one.
      assert_news:
        type: find
        selector: '//div[contains(@class, "news-carousel")]//div[@id="data-news-container-home"]'
        sleep: 1.0
      assert_news_sidebar:
        type: find
        selector: '//div[@id="data-news-container"]'
        sleep: 0.0
