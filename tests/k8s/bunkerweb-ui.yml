apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunkerweb-ui
  namespace: bunkerweb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bunkerweb-ui
  template:
    metadata:
      labels:
        app: bunkerweb-ui
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      serviceAccountName: sa-bunkerweb
      containers:
        - name: bunkerweb-ui
          image: localhost:5000/bunkerity/bunkerweb-ui:tests
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: bw-ui-secret
          livenessProbe:
            exec:
              command:
                - /usr/share/bunkerweb/helpers/healthcheck-ui.sh
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /usr/share/bunkerweb/helpers/healthcheck-ui.sh
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: svc-bunkerweb-ui
  namespace: bunkerweb
spec:
  type: ClusterIP
  selector:
    app: bunkerweb-ui
  ports:
    - name: http
      protocol: TCP
      port: 7000
      targetPort: 7000
---
apiVersion: v1
kind: Service
metadata:
  name: svc-bunkerweb-ui-nodeport
  namespace: bunkerweb
spec:
  type: NodePort
  selector:
    app: bunkerweb-ui
  ports:
    - name: http
      protocol: TCP
      port: 7000
      targetPort: 7000
      nodePort: 30070
