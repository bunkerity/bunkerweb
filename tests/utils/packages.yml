packages_info:
  ubuntu/noble:
    name: "ubuntu"
    separator: "_"
    suffix: "-1_"
    package: deb
  ubuntu/jammy:
    name: "ubuntu-jammy"
    separator: "_"
    suffix: "-1_"
    package: deb
  debian/trixie:
    name: "debian-trixie"
    separator: "_"
    suffix: "-1_"
    package: deb
  debian/bookworm:
    name: "debian-bookworm"
    separator: "_"
    suffix: "-1_"
    package: deb
  el/10:
    name: "rhel-10"
    separator: "-"
    suffix: "-1."
    package: rpm
  el/9:
    name: "rhel-9"
    separator: "-"
    suffix: "-1."
    package: rpm
  el/8:
    name: "rhel-8"
    separator: "-"
    suffix: "-1."
    package: rpm
  # fedora/42 was declared here after `a41583c35 drop fedora 42 support` deleted
  # src/linux/Dockerfile-fedora-42. The CI workflows never referenced it; only this manifest did.
  fedora/43:
    name: "fedora-43"
    separator: "-"
    suffix: "-1."
    package: rpm
  fedora/44:
    name: "fedora-44"
    separator: "-"
    suffix: "-1."
    package: rpm
# freebsd/13 and freebsd/14 lived here until the PO dropped FreeBSD packaging on 2026-08-20.
# There is no `pkg` artefact to install any more, so a target named here would be a manifest
# entry nothing can build -- a lie the next reader believes, and one nothing fails on.
