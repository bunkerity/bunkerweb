# Runner selection per integration/architecture.
# Values are JSON (fromJSON() in .github/workflows/integration-tests.yml feeds them
# straight to runs-on), so they must be valid JSON — single-quoted arrays are not.
# The monorepo has no self-hosted fleet: everything runs on GitHub-hosted runners.
