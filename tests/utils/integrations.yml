# Runner selection per integration/architecture.
# Values are JSON (fromJSON() in .github/workflows/integration-tests.yml feeds them
# straight to runs-on), so they must be valid JSON — single-quoted arrays are not.
# The monorepo has no self-hosted fleet: everything runs on GitHub-hosted runners.
staging:
  Linux:
    x86_64:
      el/8: '["ubuntu-latest"]'
      el/9: '["ubuntu-latest"]'
      el/10: '["ubuntu-latest"]'
      # fedora/42 had a live runner here after `a41583c35 drop fedora 42 support` removed
      # src/linux/Dockerfile-fedora-42, so a staging run would have tried to build a target with
      # no Dockerfile on either side.
      fedora/43: '["ubuntu-latest"]'
      fedora/44: '["ubuntu-latest"]'
    amd64:
      ubuntu/noble: '["ubuntu-latest"]'
      ubuntu/jammy: '["ubuntu-latest"]'
      debian/bookworm: '["ubuntu-latest"]'
      debian/trixie: '["ubuntu-latest"]'
      # freebsd/13 and freebsd/14 were here until the PO dropped FreeBSD packaging on 2026-08-20.
      # They never had a runner ("TODO") and now have no package to install either.
    aarch64:
      el/8: "TODO"
      el/9: "TODO"
      el/10: "TODO"
      # fedora/42 dropped with `a41583c35`. fedora/44 has never been listed for aarch64.
      fedora/43: "TODO"
    arm64:
      ubuntu/noble: "TODO"
      ubuntu/jammy: "TODO"
      debian/bookworm: "TODO"
      debian/trixie: "TODO"
  Docker:
    386: "TODO"
    amd64: '["ubuntu-latest"]'
    arm/v7: "TODO"
    arm64: "TODO"
  Autoconf:
    386: "TODO"
    amd64: '["ubuntu-latest"]'
    arm/v7: "TODO"
    arm64: "TODO"
  # Swarm: a real per-spec arm now exists (tests/swarm/harness-stack.yml and
  # tests/scripts/swarm-services.py) and deploys a single-node Swarm stack per spec. It is
  # opt-in: tests/parse.py only routes a spec here when that spec names "Swarm" explicitly,
  # so integrations: "all" cannot reach it. Only the specs proven green on a real swarm are
  # enrolled. 386, arm/v7 and arm64 stay TODO for the same reason every other integration's do.
  Swarm:
    386: "TODO"
    amd64: '["ubuntu-latest"]'
    arm/v7: "TODO"
    arm64: "TODO"
  Kubernetes:
    386: "TODO"
    amd64: '["ubuntu-latest"]'
    arm/v7: "TODO"
    arm64: "TODO"
  All_in_one:
    386: "TODO"
    amd64: '["ubuntu-latest"]'
    arm/v7: "TODO"
    arm64: "TODO"

dev:
  Linux:
    amd64:
      ubuntu/noble: '["ubuntu-latest"]'
      # freebsd/14 was here too -- dropped with FreeBSD packaging on 2026-08-20.
  Docker:
    amd64: '["ubuntu-latest"]'
  Autoconf:
    amd64: '["ubuntu-latest"]'
  # Swarm: see the note above — a real opt-in per-spec arm.
  Swarm:
    amd64: '["ubuntu-latest"]'
  Kubernetes:
    amd64: '["ubuntu-latest"]'
  All_in_one:
    amd64: '["ubuntu-latest"]'
