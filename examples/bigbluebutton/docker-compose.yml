# clone the repository https://github.com/bigbluebutton/docker into the root directory and run the following command: ./scripts/setup
# when executing the file ./scripts/setup do this:

# Should greenlight be included? (y/n): y
# Should an automatic HTTPS Proxy be included? (y/n): n
# ...
# Please enter the domain name: www.example.com (your domain name)

# after generating your bigbluebutton docker-compose.yml file, you can modify the following to add bunkerweb to it

x-env: &env
  # The worker reads an unset DATABASE_URI as "no database at all", so it is spelled out
  # rather than left to the default.
  DATABASE_URI: "sqlite:////var/lib/bunkerweb/db.sqlite3"
  API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
  API_URL: "http://bw-api:8888"
  API_TOKEN: "changeme" # Remember to set a stronger token: every component authenticates to the API with it
  CELERY_BROKER_URL: "redis://bw-jobs-broker:6379/0"

services:

  ...

  nginx:
    ...
    # comment this line
    # network_mode: host
    # then add the following lines
    networks:
      bbb-net:
        ipv4_address: 10.7.7.253
    ...

  ...

  bunkerweb:
    image: bunkerity/bunkerweb:1.7.0-beta
    container_name: bunkerweb
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp" # for QUIC
    environment:
      <<: *env
    restart: "unless-stopped"
    networks:
      bbb-net:
        ipv4_address: 10.7.7.254
      bw-universe:

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.7.0-beta
    container_name: bw-scheduler
    depends_on:
      - bunkerweb
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
      SERVER_NAME: "${DOMAIN}"
      AUTO_LETS_ENCRYPT: "yes"
      USE_CLIENT_CACHE: "yes"
      USE_GZIP: "yes"
      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_WS: "yes"
      REVERSE_PROXY_URL: "/"
      REVERSE_PROXY_HOST: "http://10.7.7.253:8080"
    restart: "unless-stopped"
    networks:
      - bw-universe

  bw-api:
    image: bunkerity/bunkerweb-api:1.7.0-beta
    container_name: bw-api
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      API_USERNAME: "changeme"
      API_PASSWORD: "Ch@ngeme1234"
    restart: "unless-stopped"
    networks:
      - bw-universe

  bw-worker:
    image: bunkerity/bunkerweb-worker:1.7.0-beta
    container_name: bw-worker
    depends_on:
      - bw-api
      - bw-jobs-broker
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
    restart: "unless-stopped"
    networks:
      - bw-universe

  bw-jobs-broker:
    image: valkey/valkey:8-alpine
    container_name: bw-jobs-broker
    command:
      ["valkey-server", "--save", "", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - bw-jobs-broker-data:/data
    restart: "unless-stopped"
    networks:
      - bw-universe

  ...

volumes:
  ...
  bw-storage:
  bw-jobs-broker-data:

networks:
  ...
  bw-universe:
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
