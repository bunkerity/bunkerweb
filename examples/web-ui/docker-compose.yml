x-env: &env
  DATABASE_URI: "mariadb+pymysql://bunkerweb:changeme@bw-db:3306/db"
  API_WHITELIST_IP: "127.0.0.0/24 10.20.30.0/24"
  API_URL: "http://bw-api:8888"
  API_TOKEN: "changeme" # Remember to set a stronger token: every component authenticates to the API with it
  CELERY_BROKER_URL: "redis://bw-jobs-broker:6379/0"

services:
  bunkerweb:
    image: bunkerity/bunkerweb:1.7.0-beta
    container_name: bunkerweb
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp" # for QUIC
    environment:
      <<: *env
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-services

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.7.0-beta
    container_name: bw-scheduler
    depends_on:
      - bunkerweb
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
      SERVER_NAME: "www.example.com"
      MULTISITE: "yes"
      SERVE_FILES: "no"
      AUTO_LETS_ENCRYPT: "yes"
      USE_CLIENT_CACHE: "yes"
      USE_GZIP: "yes"
      www.example.com_USE_TEMPLATE: "ui" # Template specific to the web-ui
      www.example.com_USE_REVERSE_PROXY: "yes"
      www.example.com_REVERSE_PROXY_URL: "/changeme"
      www.example.com_REVERSE_PROXY_HOST: "http://bw-ui:7000"
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-db

  bw-api:
    image: bunkerity/bunkerweb-api:1.7.0-beta
    container_name: bw-api
    environment:
      <<: *env
      API_USERNAME: "changeme"
      API_PASSWORD: "Ch@ngeme1234"
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-db

  bw-worker:
    image: bunkerity/bunkerweb-worker:1.7.0-beta
    container_name: bw-worker
    depends_on:
      - bw-api
      - bw-jobs-broker
    volumes:
      # Its own volume: DATABASE_URI points at a real server here, so this /data holds
      # nothing but a scratch tree the worker rebuilds from the database.
      - bw-worker-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-db

  bw-jobs-broker:
    image: valkey/valkey:8-alpine
    container_name: bw-jobs-broker
    # noeviction on purpose: a broker that evicts under memory pressure drops queued
    # jobs on the floor, and nothing upstream would notice.
    # appendonly on purpose: a broker restart must not vaporise queued jobs.
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - bw-jobs-broker-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "unless-stopped"
    networks:
      - bw-universe

  bw-ui:
    image: bunkerity/bunkerweb-ui:1.7.0-beta
    container_name: bw-ui
    environment:
      <<: *env
      ADMIN_USERNAME: "changeme"
      ADMIN_PASSWORD: "changeme" # Remember to set a stronger password for the changeme user
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-db

  bw-db:
    image: mariadb:11
    command: --max-allowed-packet=67108864
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "db"
      MYSQL_USER: "bunkerweb"
      MYSQL_PASSWORD: "changeme" # replace with a stronger password
    volumes:
      - bw-data:/var/lib/mysql
    restart: "unless-stopped"
    networks:
      - bw-db

volumes:
  bw-data:
  bw-storage:
  bw-worker-storage:
  bw-jobs-broker-data:

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
  bw-db:
    name: bw-db
