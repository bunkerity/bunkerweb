services:
  myapp1:
    image: nginxdemos/nginx-hello
    networks:
      - bw-services
    deploy:
      # No placement constraint on purpose: this example must deploy on a single-node swarm, where
      # the only node is a manager and `node.role==worker` would leave every task Pending forever.
      # On a real multi-node cluster, pin application services to your workers by adding:
      #   placement:
      #     constraints:
      #       - "node.role==worker"
      labels:
        - "bunkerweb.SERVER_NAME=app1.example.com"
        - "bunkerweb.USE_REVERSE_PROXY=yes"
        - "bunkerweb.REVERSE_PROXY_URL=/"
        - "bunkerweb.REVERSE_PROXY_HOST=http://myapp1:8080"

  myapp2:
    image: nginxdemos/nginx-hello
    networks:
      - bw-services
    deploy:
      # No placement constraint on purpose: this example must deploy on a single-node swarm, where
      # the only node is a manager and `node.role==worker` would leave every task Pending forever.
      # On a real multi-node cluster, pin application services to your workers by adding:
      #   placement:
      #     constraints:
      #       - "node.role==worker"
      labels:
        - "bunkerweb.SERVER_NAME=app2.example.com"
        - "bunkerweb.USE_REVERSE_PROXY=yes"
        - "bunkerweb.REVERSE_PROXY_URL=/"
        - "bunkerweb.REVERSE_PROXY_HOST=http://myapp2:8080"

  myapp3:
    image: nginxdemos/nginx-hello
    networks:
      - bw-services
    deploy:
      # No placement constraint on purpose: this example must deploy on a single-node swarm, where
      # the only node is a manager and `node.role==worker` would leave every task Pending forever.
      # On a real multi-node cluster, pin application services to your workers by adding:
      #   placement:
      #     constraints:
      #       - "node.role==worker"
      labels:
        - "bunkerweb.SERVER_NAME=app3.example.com"
        - "bunkerweb.USE_REVERSE_PROXY=yes"
        - "bunkerweb.REVERSE_PROXY_URL=/"
        - "bunkerweb.REVERSE_PROXY_HOST=http://myapp3:8080"

networks:
  bw-services:
    external: true
    name: bw-services
