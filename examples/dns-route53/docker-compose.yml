x-env: &env
  # Spelled out even though it is the default everywhere else: the worker is the one component
  # that reads an unset DATABASE_URI as "no database at all" (worker/app.py::init_worker_db)
  # rather than falling back to this path.
  DATABASE_URI: "sqlite:////var/lib/bunkerweb/db.sqlite3"
  API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
  API_URL: "http://bw-api:8888"
  API_TOKEN: "changeme" # Remember to set a stronger token: every component authenticates to the API with it
  CELERY_BROKER_URL: "redis://bw-jobs-broker:6379/0"

services:
  bunkerweb:
    image: bunkerity/bunkerweb:1.7.0-beta
    container_name: bunkerweb
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp" # for QUIC
    environment:
      <<: *env
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-services

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.7.0-beta
    container_name: bw-scheduler
    depends_on:
      - bunkerweb
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
      SERVER_NAME: "app1.example.com app2.example.com app3.example.com" # replace with your domains
      MULTISITE: "yes"
      SERVE_FILES: "no"
      DISABLE_DEFAULT_SERVER: "yes"
      USE_CLIENT_CACHE: "yes"
      USE_GZIP: "yes"
      USE_REVERSE_PROXY: "yes"

      # Let's Encrypt configuration
      AUTO_LETS_ENCRYPT: "yes"
      EMAIL_LETS_ENCRYPT: "changeme@example.com" # replace with your email to receive notifications about certificate expiration
      LETS_ENCRYPT_CHALLENGE: "dns"
      LETS_ENCRYPT_DNS_PROVIDER: "route53"
      LETS_ENCRYPT_DNS_PROPAGATION: "default" # change this to a number of seconds if you have a slow DNS provider (It's recommended to use the default value)
      LETS_ENCRYPT_DNS_CREDENTIAL_ITEM: "aws_access_key_id <your-aws-access-key-id>" # replace with your AWS access key ID
      LETS_ENCRYPT_DNS_CREDENTIAL_ITEM_1: "aws_secret_access_key <your-aws-secret-access-key>" # replace with your AWS secret access key

      # Reverse proxy configuration
      app1.example.com_REVERSE_PROXY_URL: "/"
      app1.example.com_REVERSE_PROXY_HOST: "http://app1:8080"
      app2.example.com_REVERSE_PROXY_URL: "/"
      app2.example.com_REVERSE_PROXY_HOST: "http://app2:8080"
      app3.example.com_REVERSE_PROXY_URL: "/"
      app3.example.com_REVERSE_PROXY_HOST: "http://app3:8080"
    restart: "unless-stopped"
    networks:
      - bw-universe

  bw-api:
    image: bunkerity/bunkerweb-api:1.7.0-beta
    restart: "unless-stopped"
    volumes:
      # The scheduler, the API and the worker share this volume because the SQLite database
      # is a file inside it. Point DATABASE_URI at a real server before putting this under load.
      - bw-storage:/data
    environment:
      <<: *env
      API_USERNAME: "changeme"
      API_PASSWORD: "Ch@ngeme1234"
    networks:
      - bw-universe

  bw-worker:
    image: bunkerity/bunkerweb-worker:1.7.0-beta
    restart: "unless-stopped"
    depends_on:
      - bw-api
      - bw-jobs-broker
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
    networks:
      - bw-universe

  bw-jobs-broker:
    image: valkey/valkey:8-alpine
    # noeviction on purpose: a broker that evicts under memory pressure drops queued
    # jobs on the floor, and nothing upstream would notice.
    # appendonly on purpose: a broker restart must not vaporise queued jobs.
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - bw-jobs-broker-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "unless-stopped"
    networks:
      - bw-universe

  app1:
    image: nginxdemos/nginx-hello
    networks:
      - bw-services

  app2:
    image: nginxdemos/nginx-hello
    networks:
      - bw-services

  app3:
    image: nginxdemos/nginx-hello
    networks:
      - bw-services

volumes:
  bw-jobs-broker-data:
  bw-storage:

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
