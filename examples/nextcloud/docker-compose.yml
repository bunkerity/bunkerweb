x-env: &env
  # Spelled out even though it is the default everywhere else: the worker is the one component
  # that reads an unset DATABASE_URI as "no database at all" (worker/app.py::init_worker_db)
  # rather than falling back to this path.
  DATABASE_URI: "sqlite:////var/lib/bunkerweb/db.sqlite3"
  API_WHITELIST_IP: "127.0.0.1 10.20.30.0/24"
  API_URL: "http://bw-api:8888"
  API_TOKEN: "changeme" # Remember to set a stronger token: every component authenticates to the API with it
  CELERY_BROKER_URL: "redis://bw-jobs-broker:6379/0"

services:
  bunkerweb:
    image: bunkerity/bunkerweb:1.7.0-beta
    container_name: bunkerweb
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp" # for QUIC
    environment:
      <<: *env
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-services

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.7.0-beta
    container_name: bw-scheduler
    depends_on:
      - bunkerweb
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
      SERVER_NAME: "www.example.com" # replace with your domain
      AUTO_LETS_ENCRYPT: "yes"
      DISABLE_DEFAULT_SERVER: "yes"
      MAX_CLIENT_SIZE: "10G"
      USE_CLIENT_CACHE: "yes"
      SERVE_FILES: "no"
      ALLOWED_METHODS: "GET|POST|HEAD|COPY|DELETE|LOCK|MKCOL|MOVE|PROPFIND|PROPPATCH|PUT|UNLOCK|OPTIONS"
      X_FRAME_OPTIONS: "SAMEORIGIN"
      USE_GZIP: "yes"
      BAD_BEHAVIOR_STATUS_CODES: "400 401 403 405 444"
      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_URL: "/"
      REVERSE_PROXY_HOST: "http://mync"
      LIMIT_REQ_URL_1: "/apps"
      LIMIT_REQ_RATE_1: "5r/s"
      LIMIT_REQ_URL_2: "/apps/text/session/sync"
      LIMIT_REQ_RATE_2: "8r/s"
      LIMIT_REQ_URL_3: "/core/preview"
      LIMIT_REQ_RATE_3: "5r/s"
      MODSECURITY_CRS_PLUGINS: "nextcloud-rule-exclusions" # This is a CRS plugin specific to Nextcloud
    restart: "unless-stopped"
    networks:
      - bw-universe

  bw-api:
    image: bunkerity/bunkerweb-api:1.7.0-beta
    restart: "unless-stopped"
    volumes:
      # The scheduler, the API and the worker share this volume because the SQLite database
      # is a file inside it. Point DATABASE_URI at a real server before putting this under load.
      - bw-storage:/data
    environment:
      <<: *env
      API_USERNAME: "changeme"
      API_PASSWORD: "Ch@ngeme1234"
    networks:
      - bw-universe

  bw-worker:
    image: bunkerity/bunkerweb-worker:1.7.0-beta
    restart: "unless-stopped"
    depends_on:
      - bw-api
      - bw-jobs-broker
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
    networks:
      - bw-universe

  bw-jobs-broker:
    image: valkey/valkey:8-alpine
    # noeviction on purpose: a broker that evicts under memory pressure drops queued
    # jobs on the floor, and nothing upstream would notice.
    # appendonly on purpose: a broker restart must not vaporise queued jobs.
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - bw-jobs-broker-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "unless-stopped"
    networks:
      - bw-universe

  mync:
    image: nextcloud:stable-apache
    volumes:
      - nc-files:/var/www/html
    environment:
      NEXTCLOUD_ADMIN_USER: "admin" # replace with the admin username
      NEXTCLOUD_ADMIN_PASSWORD: "changeme" # replace with a stronger password
      NEXTCLOUD_TRUSTED_DOMAINS: "www.example.com" # replace with your domain(s)
      TRUSTED_PROXIES: "192.168.0.0/16 172.16.0.0/12 10.0.0.0/8"
      APACHE_DISABLE_REWRITE_IP: "1"
      MYSQL_HOST: "mydb"
      MYSQL_DATABASE: "nc"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "db-user-pwd" # set a stronger password in a .env file (must match MYSQL_PASSWORD)
    networks:
      - nextcloud-net
      - bw-services

  mydb:
    image: mariadb:11
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "db-root-pwd" # replace with a stronger password
      MYSQL_DATABASE: "nc"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "db-user-pwd" # replace with a stronger password (must match MYSQL_PASSWORD)
    networks:
      - nextcloud-net

volumes:
  bw-jobs-broker-data:
  bw-storage:
  db-data:
  nc-files:

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
  nextcloud-net:
    name: nextcloud-net
