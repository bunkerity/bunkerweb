x-env: &env
  # Spelled out even though it is the default everywhere else: the worker is the one component
  # that reads an unset DATABASE_URI as "no database at all" (worker/app.py::init_worker_db)
  # rather than falling back to this path.
  DATABASE_URI: "sqlite:////var/lib/bunkerweb/db.sqlite3"
  API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
  API_URL: "http://bw-api:8888"
  API_TOKEN: "changeme" # Remember to set a stronger token: every component authenticates to the API with it
  CELERY_BROKER_URL: "redis://bw-jobs-broker:6379/0"

services:
  bunkerweb:
    image: bunkerity/bunkerweb:1.7.0-beta
    container_name: bunkerweb
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp" # for QUIC
    environment:
      <<: *env
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-services

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.7.0-beta
    container_name: bw-scheduler
    depends_on:
      - bunkerweb
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
      SERVER_NAME: "www.example.com" # replace with your domain
      SERVE_FILES: "no"
      DISABLE_DEFAULT_SERVER: "yes"
      # AUTO_LETS_ENCRYPT: "yes"
      GENERATE_SELF_SIGNED_SSL: "yes"
      USE_CLIENT_CACHE: "yes"
      USE_GZIP: "yes"
      MAX_CLIENT_SIZE: "20m" # The default `client_max_body_size` is 10m, this might not be enough for some posters, etc.
      LIMIT_REQ_RATE: "10r/s"
      COOKIE_FLAGS: "* SameSite=Lax"
      REVERSE_PROXY_SEND_TIMEOUT: "300s"
      REVERSE_PROXY_READ_TIMEOUT: "300s"
      PERMISSIONS_POLICY: "accelerometer=(), ambient-light-sensor=(), battery=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), document-domain=(), encrypted-media=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), keyboard-map=(), local-fonts=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()"
      CONTENT_SECURITY_POLICY: "default-src https: data: blob: ; img-src 'self' https://* ; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.youtube.com blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; font-src 'self'"
      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_URL: "/"
      REVERSE_PROXY_HOST: "http://jellyfin:8096"
      REVERSE_PROXY_BUFFERING: "no"
      REVERSE_PROXY_URL_1: "/socket"
      REVERSE_PROXY_HOST_1: "http://jellyfin:8096"
      REVERSE_PROXY_WS_1: "yes"
      CUSTOM_CONF_MODSEC_CRS_jellyfin: |
        SecRule REQUEST_FILENAME "/web/config.json" "id:1000000,ctl:ruleRemoveById=930130,ctl:ruleRemoveById=949110,nolog"
    restart: "unless-stopped"
    networks:
      - bw-universe

  bw-api:
    image: bunkerity/bunkerweb-api:1.7.0-beta
    restart: "unless-stopped"
    volumes:
      # The scheduler, the API and the worker share this volume because the SQLite database
      # is a file inside it. Point DATABASE_URI at a real server before putting this under load.
      - bw-storage:/data
    environment:
      <<: *env
      API_USERNAME: "changeme"
      API_PASSWORD: "Ch@ngeme1234"
    networks:
      - bw-universe

  bw-worker:
    image: bunkerity/bunkerweb-worker:1.7.0-beta
    restart: "unless-stopped"
    depends_on:
      - bw-api
      - bw-jobs-broker
    volumes:
      - bw-storage:/data
    environment:
      <<: *env
      BUNKERWEB_INSTANCES: "bunkerweb"
    networks:
      - bw-universe

  bw-jobs-broker:
    image: valkey/valkey:8-alpine
    # noeviction on purpose: a broker that evicts under memory pressure drops queued
    # jobs on the floor, and nothing upstream would notice.
    # appendonly on purpose: a broker restart must not vaporise queued jobs.
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - bw-jobs-broker-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "unless-stopped"
    networks:
      - bw-universe

  jellyfin:
    image: jellyfin/jellyfin:10
    container_name: jellyfin
    volumes:
      - ./jellyfin-data/config:/config
      - ./jellyfin-data/cache:/cache
      - ./jellyfin-data/media:/media
    restart: "unless-stopped"
    environment:
      - JELLYFIN_PublishedServerUrl=https://www.example.com
    networks:
      - bw-services

volumes:
  bw-jobs-broker-data:
  bw-storage:

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
