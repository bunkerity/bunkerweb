{#- Custom pages are served from a named location whenever nginx allows it: a bare-path
    error_page re-enters the server rewrite phase and resets $reason and $ctx_ref, which
    turns the report reason into "unknown". Code 400 keeps the bare path, the request line
    may not be parsed yet and named locations need a URI. The exact location stays so a
    direct request for the page is still refused. -#}
{%- if ERRORS != "" -%}
  {%- for element in ERRORS.split() -%}
		{%- if element -%}
			{%- set code = element.split("=")[0] -%}
			{%- set page = element.split("=")[1] -%}
			{%- if code != "400" and page.startswith("/") %}
error_page {{ code }} @bwcustomerror{{ code }};
location @bwcustomerror{{ code }} {
	root {% if ROOT_FOLDER == "" %}/var/www/html/{% if MULTISITE == "yes" %}{{ SERVER_NAME.split(" ")[0] }}{% endif %}{% else %}{{ ROOT_FOLDER }}{% endif %};
	modsecurity off;
	auth_basic off;
	rewrite ^ {{ page }} break;
}
{% else %}
error_page {{ code }} {{ page }};
{% endif %}
location = {{ page }} {
	root {% if ROOT_FOLDER == "" %}/var/www/html/{% if MULTISITE == "yes" %}{{ SERVER_NAME.split(" ")[0] }}{% endif %}{% else %}{{ ROOT_FOLDER }}{% endif %};
	modsecurity off;
	internal;
	auth_basic off;
}

		{% endif %}
  {% endfor %}
{%- endif %}

{%- if INTERCEPTED_ERROR_CODES != "" -%}
  {%- for intercepted_error_code in INTERCEPTED_ERROR_CODES.split() %}
    {%- if not intercepted_error_code + "=" in ERRORS -%}
      {%- if intercepted_error_code == "400" -%}
error_page 400 /bwerror400;
      {%- else -%}
error_page {{ intercepted_error_code }} @bwerror{{ intercepted_error_code }};
      {%- endif %}

location {% if intercepted_error_code == "400" %}= /{% else %} @{% endif %}bwerror{{ intercepted_error_code }} {
	auth_basic off;
	internal;
	modsecurity off;
	default_type 'text/html';
	root /usr/share/bunkerweb/core/errors/files;
	content_by_lua_block {
		local logger = require "bunkerweb.logger"
		local cerrors = require "errors.errors"
		local errors = cerrors:new()
		errors:render_template(tostring(ngx.status))
	}
}

    {% endif %}
  {%- endfor %}
{%- endif %}
