{% set redirects = namespace() %}
{% set redirects.list = [] %}
{% for k, v in all.items() %}
    {% if k.startswith("REDIRECT_TO") and v != "" %}
        {% set suffix = k[11:] %}
        {% if not suffix or suffix.startswith("_") %}
            {% set index_str = suffix[1:] if suffix else "0" %}
            {% if index_str.isdigit() %}
                {% set index = index_str|int %}
                {% set redirects.list = redirects.list + [(index, k, v)] %}
            {% endif %}
        {% endif %}
    {% endif %}
{% endfor %}
{% for index, k, to in redirects.list|sort %}
    {% set suffix = "_" ~ index if index > 0 else "" %}
    {% set from = all["REDIRECT_FROM" ~ suffix] if "REDIRECT_FROM" ~ suffix in all else "/" %}
    {#- An anchored value is a regex location, but an explicit NGINX modifier in the value wins:
        prefixing "~" onto "~* ..." or "^~ ..." produces a config NGINX refuses. Same rule as
        reverseproxy's reverse-proxy.conf; location_claims.rendered_location() mirrors it so the
        conflict checks compare what NGINX receives, not what was typed. -#}
    {#- Any whitespace separates the modifier from the operand, not a literal " ": "~  /a"
        used to render a regex requiring a leading space, and a tab was not recognised as a
        modifier at all. NOT the same rule as location_claims.rendered_location(), which
        collapses EVERY whitespace run -- so an operand with inner whitespace is still claimed
        as its collapsed form while rendering verbatim (PO note, false refusal only; the
        operand regex refuses that whole class at write time). -#}
    {% set from_parts = from.split() %}
    {% set from_head = from_parts[0] if from_parts else "" %}
    {% set from_is_regex = from_head not in ("~", "~*", "=", "^~") and (from.startswith("^") or from.endswith("$")) %}
    {% set from_has_modifier = from_head in ("~", "~*", "=", "^~") %}
    {% set from_modifier = from_head if from_has_modifier else ("~" if from_is_regex else "") %}
    {% set from_operand = (from.split(None, 1)[1] if from_parts|length > 1 else "") if from_has_modifier else from %}
    {% set quoted_from = from_operand|replace('\\', '\\\\')|replace('"', '\\"') %}
    {#- An empty operand renders `location ""`, which NGINX accepts as a prefix location matching
        EVERY uri -- it used to render `location  {` and be refused outright, so quoting turned a
        loud [emerg] into a silent catch-all proxy. The plugin.json regex refuses an empty value and
        a bare modifier, but that is a write-time guard: a stored setting is never re-validated at
        render, and IGNORE_REGEX_CHECK=yes disables it wholesale. A location with no path claims
        nothing, so it renders nothing. -#}
    {% if from_operand %}
    {% set request_uri = all["REDIRECT_TO_REQUEST_URI" ~ suffix] if "REDIRECT_TO_REQUEST_URI" ~ suffix in all else "no" %}
    {% set status_code = all["REDIRECT_TO_STATUS_CODE" ~ suffix] if "REDIRECT_TO_STATUS_CODE" ~ suffix in all else "301" %}
location {% if from_modifier %}{{ from_modifier }} {% endif %}"{{ quoted_from }}" {
	{% if request_uri == "yes" %}
	return {{ status_code }} {{ to }}$request_uri;
	{% else %}
	return {{ status_code }} {{ to }};
	{% endif %}
}
    {% else %}
# redirect rule {{ index if index is defined else "" }} skipped: REDIRECT_FROM has no path (empty, or a bare location modifier), and a location with no path would match every URI.
    {% endif %}
{% endfor %}
