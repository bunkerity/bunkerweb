{%+ if USE_ANTIBOT != "no" -%}
location {% if USE_ANTIBOT == "altcha" %}= {% endif %}{{ ANTIBOT_URI }} {
    {% if USE_ANTIBOT == "altcha" -%}
    {% set limit = MAX_CLIENT_SIZE | lower -%}
    {% set units = {"k": 1024, "m": 1048576, "g": 1073741824} -%}
    {% set limit_bytes = (limit[:-1] | int * units[limit[-1]]) if limit[-1] in units else limit | int -%}
    {% if limit_bytes == 0 or limit_bytes > 16384 -%}
    client_max_body_size 16k;
    {% endif -%}
    client_body_buffer_size 16k;
    {% endif -%}
    default_type 'text/html';
    root /usr/share/bunkerweb/core/antibot/files;
    {% if INJECT_HEAD != "" or INJECT_BODY != "" -%}
    # The challenge page sends a nonce-based CSP, so HTML injected by INJECT_HEAD/INJECT_BODY
    # is blocked there. A location only inherits the server sub_filter rules when it has none
    # of its own, and NGINX has no "sub_filter off": this no-op rule stops the inheritance.
    sub_filter '</head>' '</head>';
    {% endif -%}
    content_by_lua_block {
        local logger   = require "bunkerweb.logger":new("ANTIBOT")
        local helpers  = require "bunkerweb.helpers"

        local ngx = ngx
        local ERR = ngx.ERR
        local INFO = ngx.INFO
        local fill_ctx = helpers.fill_ctx
        local save_ctx = helpers.save_ctx
        local tostring = tostring

        local ok, ret, errors, ctx = fill_ctx()
        if not ok then
            logger:log(ERR, "fill_ctx() failed : " .. ret)
        elseif errors then
            for i, error in ipairs(errors) do
                logger:log(ERR, "fill_ctx() error " .. tostring(i) .. " : " .. error)
            end
        end
        local antibot  = require "antibot.antibot":new(ctx)
        local ret      = antibot:content()
        if not ret.ret then
            logger:log(ERR, "antibot:content() failed : " .. ret.msg)
        else
            logger:log(INFO, "antibot:content() success : " .. ret.msg)
        end
        save_ctx(ctx)
    }
}
{%- endif %}
