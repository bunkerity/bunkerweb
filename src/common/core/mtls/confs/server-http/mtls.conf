{% if USE_MTLS == "yes" %}
	{%- set pathlib = import("pathlib") -%}
	{%- set verify_mode = MTLS_VERIFY_CLIENT -%}
	{%- set ca_cache = "/var/cache/bunkerweb/mtls/" ~ SERVER_NAME.split(" ")[0] ~ "/ca.pem" -%}
	{%- set crl_cache = "/var/cache/bunkerweb/mtls/" ~ SERVER_NAME.split(" ")[0] ~ "/crl.pem" -%}
	{% if pathlib.Path(ca_cache).is_file() %}
ssl_client_certificate {{ ca_cache }};
ssl_trusted_certificate {{ ca_cache }};
		{% if pathlib.Path(crl_cache).is_file() %}
ssl_crl {{ crl_cache }};
		{% endif %}
	{% elif verify_mode != "optional_no_ca" %}
# No validated client CA bundle available yet for this server: mTLS points at a placeholder CA nothing can be validated against, so the verification directives stay in place instead of being dropped. Set MTLS_CA_CERTIFICATE or MTLS_CA_CERTIFICATE_DATA; the Scheduler validates the bundle and distributes it to every instance.
ssl_client_certificate /usr/share/bunkerweb/core/mtls/misc/placeholder-ca.pem;
ssl_trusted_certificate /usr/share/bunkerweb/core/mtls/misc/placeholder-ca.pem;
	{% endif %}

ssl_verify_client {{ verify_mode }};
ssl_verify_depth {{ MTLS_VERIFY_DEPTH }};

{# nginx answers a missing (496) or invalid (495) client certificate with its own stock 400 page. The named
    location marks the request, so Bad Behavior can tell this 400 apart from any other (MTLS_COUNT_BAD_BEHAVIOR),
    and renders BunkerWeb's 400 page when the errors plugin owns the 400 code (intercepted, no custom page).
    Any other setup keeps nginx's stock page. A named location keeps $reason and $ctx_ref, and the 400 is
    explicit because ngx.status still holds 495 or 496 there. #}
error_page 495 496 =400 @mtls_cert_error;
location @mtls_cert_error {
	internal;
	auth_basic off;
	modsecurity off;
	set $mtls_cert_error "yes";
	{% if "400" in INTERCEPTED_ERROR_CODES.split() and "400=" not in ERRORS %}
	default_type 'text/html';
	root /usr/share/bunkerweb/core/errors/files;
	{% if INJECT_HEAD != "" or INJECT_BODY != "" %}
	# Same as the errors plugin location: the page sends a nonce-based CSP, so injected HTML is blocked there.
	sub_filter '</head>' '</head>';
	{% endif %}
	content_by_lua_block {
		ngx.status = ngx.HTTP_BAD_REQUEST
		require("errors.errors"):new():render_template("400")
	}
	{% else %}
	return 400;
	{% endif %}
}
{% endif %}
