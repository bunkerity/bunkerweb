# Default of $mtls_cert_error, the mark that the @mtls_cert_error location of an mTLS service sets to "yes" (see
# server-http/mtls.conf) and that Bad Behavior reads for a counted failure on any service. A variable that only a
# `set` declares logs "using uninitialized variable" (warn) on every request that did not run that `set`, on any
# service once one mTLS service exists, and on a request that fails before the rewrite phase. The map is evaluated
# on first read, has a value for every request, and a later `set` in the location still replaces it.
map "" $mtls_cert_error {
	default "";
}
