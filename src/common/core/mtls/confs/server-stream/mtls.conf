{% if USE_MTLS == "yes" %}
	{%- set verify_mode = MTLS_VERIFY_CLIENT -%}
	{%- set ca_bundle_value = MTLS_CA_CERTIFICATE | trim -%}
	{%- set crl_value = MTLS_CRL | trim -%}
	{#- No is_file() probe on either path, deliberately: this template is rendered by the Scheduler
	    (or the Worker), while NGINX opens these files on the BunkerWeb instance, and the two do not
	    share a filesystem. A probe here answers about the wrong host -- it reports "missing" for a CA
	    that is correctly mounted on the instance, and client authentication is then silently skipped.
	    NGINX already refuses to load a missing CA or CRL (ngx_ssl_client_certificate / ngx_ssl_crl),
	    so it is the authority on presence, on the host that actually reads them. -#}
	{% if ca_bundle_value == "" and verify_mode != "optional_no_ca" %}
# mTLS is enabled for this stream server but MTLS_CA_CERTIFICATE is empty, so client certificates cannot be
# verified. Refuse TLS here rather than serve the site unauthenticated while appearing to require a
# certificate. A plain LISTEN_STREAM_PORT on this server still answers; only the TLS side is refused.
# Fix by setting MTLS_CA_CERTIFICATE, or MTLS_VERIFY_CLIENT=optional_no_ca if verification is
# genuinely delegated elsewhere.
ssl_reject_handshake on;
	{% else %}
		{% if ca_bundle_value != "" %}
ssl_client_certificate {{ ca_bundle_value }};
		{% endif %}
		{% if crl_value != "" %}
ssl_crl {{ crl_value }};
		{% endif %}
ssl_verify_client {{ verify_mode }};
ssl_verify_depth {{ MTLS_VERIFY_DEPTH }};
	{% endif %}
{% endif %}
