proxy_cache_path /var/tmp/bunkerweb/proxy_cache levels={{ PROXY_CACHE_PATH_LEVELS }} keys_zone=proxycache:{{ PROXY_CACHE_PATH_ZONE_SIZE }} {{ PROXY_CACHE_PATH_PARAMS }};
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
{# Named backend pools of the http context — used by both proxy_pass and grpc_pass. The
   UPSTREAM_* keys are not operator settings: upstream_resolver writes one numbered group per
   pool that at least one service attaches to, and each server line is already rendered as the
   arguments of a `server` directive. Stream pools are declared in the stream context instead. #}
{% set pools = namespace() %}
{% set pools.list = [] %}
{% for k, v in all.items() %}
	{% if k.startswith("UPSTREAM_NAME_") and v != "" %}
		{% set suffix = k[14:] %}
		{% if suffix.isdigit() and all["UPSTREAM_PROTOCOL_" ~ suffix] != "stream" %}
			{% set pools.list = pools.list + [(suffix|int, v)] %}
		{% endif %}
	{% endif %}
{% endfor %}
{% for index, name in pools.list|sort %}
	{% set method = all["UPSTREAM_METHOD_" ~ index] if "UPSTREAM_METHOD_" ~ index in all else "round_robin" %}
	{% set keepalive = all["UPSTREAM_KEEPALIVE_" ~ index] if "UPSTREAM_KEEPALIVE_" ~ index in all else "" %}
	{% set servers = all["UPSTREAM_SERVERS_" ~ index] if "UPSTREAM_SERVERS_" ~ index in all else "" %}
	{% if servers != "" %}
upstream {{ name }} {
		{% if method == "least_conn" %}
    least_conn;
		{% elif method == "ip_hash" %}
    ip_hash;
		{% endif %}
		{% for server in servers.split(";") %}
    server {{ server }};
		{% endfor %}
		{% if keepalive != "" %}
    keepalive {{ keepalive }};
		{% endif %}
}
	{% endif %}
{% endfor %}
