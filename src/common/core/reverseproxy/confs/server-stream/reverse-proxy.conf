{%- set stream_upstream = all["REVERSE_PROXY_UPSTREAM"] if "REVERSE_PROXY_UPSTREAM" in all else "" -%}
{%- if USE_REVERSE_PROXY == "yes" and (REVERSE_PROXY_HOST != "" or stream_upstream != "") -%}
	{%- if REVERSE_PROXY_SSL_SNI == "yes" -%}
proxy_ssl_server_name on;
		{% if REVERSE_PROXY_SSL_SNI_NAME != "" %}
proxy_ssl_name {{ REVERSE_PROXY_SSL_SNI_NAME }};
		{% endif %}
	{%- else %}
proxy_ssl_server_name off;
	{%- endif %}

	{% if REVERSE_PROXY_SSL_VERIFY == "yes" %}
		{%- set pathlib = import("pathlib") -%}
		{%- set rp_ca_cache = "/var/cache/bunkerweb/reverseproxy/" ~ SERVER_NAME.split(" ")[0] ~ "/trusted-ca.pem" -%}
		{% if pathlib.Path(rp_ca_cache).is_file() %}
proxy_ssl_verify on;
proxy_ssl_verify_depth {{ REVERSE_PROXY_SSL_VERIFY_DEPTH }};
proxy_ssl_trusted_certificate {{ rp_ca_cache }};
		{% else %}
# proxy_ssl_verify disabled: no trusted certificate available (set REVERSE_PROXY_SSL_TRUSTED_CERTIFICATE or _DATA, or point it at the system CA bundle).
proxy_ssl_verify off;
		{% endif %}
	{% else %}
proxy_ssl_verify off;
	{% endif %}

	{#- Mutual TLS towards the upstream. Unlike the http context, the stream module needs
	    `proxy_ssl on` for any TLS at all — it is emitted here only, so a service that does not
	    configure a client pair keeps its current plaintext behaviour. -#}
	{%- set stream_pathlib = import("pathlib") -%}
	{%- set rp_client_dir = "/var/cache/bunkerweb/reverseproxy/" ~ SERVER_NAME.split(" ")[0] -%}
	{% if stream_pathlib.Path(rp_client_dir ~ "/client-cert.pem").is_file() and stream_pathlib.Path(rp_client_dir ~ "/client-key.pem").is_file() %}
proxy_ssl on;
proxy_ssl_certificate {{ rp_client_dir }}/client-cert.pem;
proxy_ssl_certificate_key {{ rp_client_dir }}/client-key.pem;
	{% endif %}

{# Outbound PROXY protocol, toward the upstream. Distinct from the inbound
   USE_PROXY_PROTOCOL, which changes the shared listen socket and therefore stays global:
   until this setting existed the single global flag drove both directions at once, so
   accepting PROXY from a load balancer forced BunkerWeb to speak it to every backend.
   "auto" keeps exactly that behaviour, so no existing configuration changes meaning. #}
	{% set send_proxy_protocol = REVERSE_PROXY_SEND_PROXY_PROTOCOL | default("auto", true) %}
	{% if send_proxy_protocol == "yes" or (send_proxy_protocol == "auto" and USE_PROXY_PROTOCOL == "yes") %}
proxy_protocol on;
	{% endif %}

{# Either the attached pool, or the implicit single-server upstream stream.conf names after
   the service. #}
set $backend "{{ stream_upstream if stream_upstream != "" else SERVER_NAME.split(" ")[0] }}";
proxy_pass $backend;

{%- endif %}
