{# Named backend pools of the stream context. Same UPSTREAM_* keys as the http ones, filtered
   on the stream protocol; upstream_resolver already prefixed their names so they can never
   collide with the implicit per-service upstreams stream.conf builds. `keepalive` is an http
   directive and is never emitted here. #}
{% set pools = namespace() %}
{% set pools.list = [] %}
{% for k, v in all.items() %}
	{% if k.startswith("UPSTREAM_NAME_") and v != "" %}
		{% set suffix = k[14:] %}
		{% if suffix.isdigit() and all["UPSTREAM_PROTOCOL_" ~ suffix] == "stream" %}
			{% set pools.list = pools.list + [(suffix|int, v)] %}
		{% endif %}
	{% endif %}
{% endfor %}
{% for index, name in pools.list|sort %}
	{% set method = all["UPSTREAM_METHOD_" ~ index] if "UPSTREAM_METHOD_" ~ index in all else "round_robin" %}
	{% set servers = all["UPSTREAM_SERVERS_" ~ index] if "UPSTREAM_SERVERS_" ~ index in all else "" %}
	{% if servers != "" %}
upstream {{ name }} {
		{% if method == "least_conn" %}
    least_conn;
		{% elif method == "ip_hash" %}
    hash $remote_addr consistent;
		{% endif %}
		{% for server in servers.split(";") %}
    server {{ server }};
		{% endfor %}
}
	{% endif %}
{% endfor %}
