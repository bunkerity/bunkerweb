{%- if USE_UI == "yes" -%}
SecRule REQUEST_FILENAME "@rx /(support/config|global-(config|settings)|services/.+|templates/.+)$" "id:9802101,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=932235,ctl:ruleRemoveById=941130,ctl:ruleRemoveByTag=attack-rfi,ctl:ruleRemoveByTag=attack-lfi,ctl:ruleRemoveByTag=attack-rce,ctl:ruleRemoveByTag=attack-protocol,ctl:ruleRemoveByTag=attack-ssrf"
SecRule REQUEST_FILENAME "@rx /(services|cache)/.+$" "id:9802102,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=920440"
SecRule REQUEST_FILENAME "@rx /configs/.+$" "id:9802103,phase:1,pass,t:none,nolog,ctl:ruleRemoveByTag=attack-rce,ctl:ruleRemoveByTag=attack-rfi,ctl:ruleRemoveByTag=attack-lfi,ctl:ruleRemoveByTag=attack-rce,ctl:ruleRemoveByTag=attack-sqli"
# Configuration content may contain XSS rule patterns.
SecRule REQUEST_FILENAME "@rx /configs/(?:new|[^/]+/[^/]+/[^/]+)$" \
    "id:9802112,phase:1,pass,nolog,t:none,t:normalizePath,ctl:ruleRemoveTargetById=941140;ARGS:value,ctl:ruleRemoveTargetById=941160;ARGS:value,ctl:ruleRemoveTargetById=941210;ARGS:value,chain"
SecRule REQUEST_METHOD "@streq POST" "t:none"
SecRule REQUEST_FILENAME "@endsWith /logs" "id:9802104,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=953100,ctl:ruleRemoveByTag=attack-disclosure"
SecRule REQUEST_FILENAME "@rx /plugins/.+$" "id:9802105,phase:1,pass,t:none,nolog,ctl:ruleRemoveByTag=language-java"
SecRule REQUEST_FILENAME "@rx /fonts/.+$" "id:9802106,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=920440"
SecRule REQUEST_FILENAME "@endsWith /login" "id:9802107,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:password,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:password,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:password,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:password,ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:password,ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:password,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:password"
SecRule REQUEST_FILENAME "@endsWith /instances/new" "id:9802108,phase:1,pass,t:none,nolog,ctl:ruleRemoveTargetById=931100;ARGS:hostname"
SecRule REQUEST_FILENAME "@endsWith /reports/fetch" "id:9802109,phase:1,pass,t:none,nolog,ctl:ruleEngine=Off"
SecRuleRemoveByTag language-php
  {% set re = import("re") %}
  {% if re.match("^(?:\d{1,3}\.){3}\d{1,3}$|^\[[0-9a-fA-F:]+\]$", SERVER_NAME.split(" ")[0]) %}
SecRuleRemoveById 920350
  {% endif %}
{%- endif %}
