{% if USE_MODSECURITY == "yes" and USE_MODSECURITY_CRS == "yes" and USE_MODSECURITY_GLOBAL_CRS == "no" and SERVER_NAME != "" %}
	{% set re = import("re") %}
	{% set ip_hosts = [] %}
	{% for host in SERVER_NAME.split() %}
		{% if re.match("^(?:\\d{1,3}\\.){3}\\d{1,3}$", host) %}
			{% set _ = ip_hosts.append(re.escape(host.lower())) %}
		{% elif ":" in host %}
			{% set _ = ip_hosts.append("\\[" ~ re.escape(host.lower()) ~ "\\]") %}
		{% endif %}
	{% endfor %}
	{% if ip_hosts %}
# CRS 920350 flags a numeric Host header, which is the normal Host of a service named by an IP address.
# Drop it for the literals of this service only: any other numeric Host stays enforced.
SecRule REQUEST_HEADERS:Host "@rx ^(?:{{ ip_hosts | join('|') }})(?::\d+)?$" \
    "id:1007783,phase:1,pass,t:none,t:lowercase,nolog,ctl:ruleRemoveById=920350"
	{% endif %}
{% endif %}
