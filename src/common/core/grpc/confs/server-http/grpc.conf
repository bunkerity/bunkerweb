{%- if USE_GRPC == "yes" -%}
	{% macro default_grpc_header(name, value, custom_names) -%}
		{% if name|lower not in custom_names %}	grpc_set_header {{ name }} {{ value }};{% endif %}
	{%- endmacro %}

	{% if GRPC_SSL_SNI == "yes" %}
grpc_ssl_server_name on;
		{% if GRPC_SSL_SNI_NAME != "" %}
grpc_ssl_name {{ GRPC_SSL_SNI_NAME }};
		{% endif %}
	{% else %}
grpc_ssl_server_name off;
	{% endif %}

	{%- set pathlib = import("pathlib") -%}
	{%- set grpc_cache = "/var/cache/bunkerweb/grpc/" ~ SERVER_NAME.split(" ")[0] ~ "/" -%}
	{% if GRPC_SSL_VERIFY == "yes" %}
		{% if pathlib.Path(grpc_cache ~ "trusted-ca.pem").is_file() %}
grpc_ssl_verify on;
grpc_ssl_verify_depth {{ GRPC_SSL_VERIFY_DEPTH }};
grpc_ssl_trusted_certificate {{ grpc_cache }}trusted-ca.pem;
			{% if pathlib.Path(grpc_cache ~ "crl.pem").is_file() %}
grpc_ssl_crl {{ grpc_cache }}crl.pem;
			{% endif %}
		{% else %}
# grpc_ssl_verify disabled: no trusted certificate available (set GRPC_SSL_TRUSTED_CERTIFICATE or _DATA, or point it at the system CA bundle).
grpc_ssl_verify off;
		{% endif %}
	{% else %}
grpc_ssl_verify off;
	{% endif %}

	{% if pathlib.Path(grpc_cache ~ "client-cert.pem").is_file() and pathlib.Path(grpc_cache ~ "client-key.pem").is_file() %}
grpc_ssl_certificate {{ grpc_cache }}client-cert.pem;
grpc_ssl_certificate_key {{ grpc_cache }}client-key.pem;
	{% endif %}

	{% if GRPC_SSL_PROTOCOLS != "" %}
grpc_ssl_protocols {{ GRPC_SSL_PROTOCOLS }};
	{% endif %}

	{% if GRPC_SSL_CIPHERS != "" %}
grpc_ssl_ciphers {{ GRPC_SSL_CIPHERS }};
	{% endif %}

	{% if GRPC_INTERCEPT_ERRORS == "yes" %}
grpc_intercept_errors on;
	{% else %}
grpc_intercept_errors off;
	{% endif %}


	{% set hosts = namespace() %}
	{% set hosts.list = [] %}
	{% for k, v in all.items() %}
		{% if k.startswith("GRPC_HOST") and v != "" %}
			{% set suffix = k[9:] %}
			{% if not suffix or suffix.startswith("_") %}
				{% set index = suffix[1:] if suffix else "0" %}
				{% set hosts.list = hosts.list + [(index|int, k, v)] %}
			{% endif %}
		{% endif %}
	{% endfor %}
	{% for index, k, host in hosts.list|sort %}
			{% set url = all[k.replace("HOST", "URL")] if k.replace("HOST", "URL") in all else "/" %}
			{% set url_is_regex = url.split(" ")[0] not in ("~", "~*", "=", "^~") and (url.startswith("^") or url.endswith("$")) %}
			{% set url_has_modifier = url.split(" ")[0] in ("~", "~*", "=", "^~") %}
			{% set url_modifier = url.split(" ")[0] if url_has_modifier else ("~" if url_is_regex else "") %}
			{% set url_operand = url.split(" ", 1)[1] if url_has_modifier else url %}
			{% set quoted_url = url_operand|replace('\\', '\\\\')|replace('"', '\\"') %}
			{% set headers = all[k.replace("HOST", "HEADERS")] if k.replace("HOST", "HEADERS") in all else "" %}
			{% set custom_header_names = namespace(value=[]) %}
			{% for header in headers.split(";") if header.strip() %}
				{% set custom_header_names.value = custom_header_names.value + [header.split()[0]|lower] %}
			{% endfor %}
			{% set headers_client = all[k.replace("HOST", "HEADERS_CLIENT")] if k.replace("HOST", "HEADERS_CLIENT") in all else "" %}
			{% set hide_headers = all[k.replace("HOST", "HIDE_HEADERS")] if k.replace("HOST", "HIDE_HEADERS") in all else "" %}
			{% set pass_headers = all[k.replace("HOST", "PASS_HEADERS")] if k.replace("HOST", "PASS_HEADERS") in all else "" %}
			{% set ignore_headers = all[k.replace("HOST", "IGNORE_HEADERS")] if k.replace("HOST", "IGNORE_HEADERS") in all else "" %}
			{% set buffer_size = all[k.replace("HOST", "BUFFER_SIZE")] if k.replace("HOST", "BUFFER_SIZE") in all else "" %}
			{% set auth_request = all[k.replace("HOST", "AUTH_REQUEST")] if k.replace("HOST", "AUTH_REQUEST") in all else "" %}
			{% set auth_request_signin_url = all[k.replace("HOST", "AUTH_REQUEST_SIGNIN_URL")] if k.replace("HOST", "AUTH_REQUEST_SIGNIN_URL") in all else "" %}
			{% set auth_request_sets = all[k.replace("HOST", "AUTH_REQUEST_SET")] if k.replace("HOST", "AUTH_REQUEST_SET") in all else "" %}
			{% set connect_timeout = all[k.replace("HOST", "CONNECT_TIMEOUT")] if k.replace("HOST", "CONNECT_TIMEOUT") in all else "60s" %}
			{% set read_timeout = all[k.replace("HOST", "READ_TIMEOUT")] if k.replace("HOST", "READ_TIMEOUT") in all else "60s" %}
			{% set send_timeout = all[k.replace("HOST", "SEND_TIMEOUT")] if k.replace("HOST", "SEND_TIMEOUT") in all else "60s" %}
			{% set socket_keepalive = all[k.replace("HOST", "SOCKET_KEEPALIVE")] if k.replace("HOST", "SOCKET_KEEPALIVE") in all else "off" %}
			{% set next_upstream = all[k.replace("HOST", "NEXT_UPSTREAM")] if k.replace("HOST", "NEXT_UPSTREAM") in all else "" %}
			{% set next_upstream_timeout = all[k.replace("HOST", "NEXT_UPSTREAM_TIMEOUT")] if k.replace("HOST", "NEXT_UPSTREAM_TIMEOUT") in all else "" %}
			{% set next_upstream_tries = all[k.replace("HOST", "NEXT_UPSTREAM_TRIES")] if k.replace("HOST", "NEXT_UPSTREAM_TRIES") in all else "" %}
			{% set includes = all[k.replace("HOST", "INCLUDES")] if k.replace("HOST", "INCLUDES") in all else "" %}
			{% set max_client_size = all[k.replace("HOST", "MAX_CLIENT_SIZE")] if k.replace("HOST", "MAX_CLIENT_SIZE") in all else "" %}
location {% if url_modifier %}{{ url_modifier }} {% endif %}"{{ quoted_url }}" {
			{% if USE_MODSECURITY == "yes" %}
	# ModSecurity does not reliably support gRPC traffic patterns, it is always disabled on gRPC locations.
	modsecurity off;
			{% endif %}
			{% if max_client_size != "" %}
	client_max_body_size {{ max_client_size }};
			{% endif %}
	set $grpc_backend{{ index }} "{{ host }}";
	grpc_pass $grpc_backend{{ index }};
{{ default_grpc_header("Host", '"' ~ GRPC_CUSTOM_HOST ~ '"' if GRPC_CUSTOM_HOST != "" else "$host", custom_header_names.value) }}
{{ default_grpc_header("X-Forwarded-For", "$proxy_add_x_forwarded_for", custom_header_names.value) }}
{{ default_grpc_header("X-Real-IP", "$remote_addr", custom_header_names.value) }}
{{ default_grpc_header("X-Forwarded-Proto", "$scheme", custom_header_names.value) }}
{{ default_grpc_header("X-Forwarded-Protocol", "$scheme", custom_header_names.value) }}
{{ default_grpc_header("X-Forwarded-Host", '"' ~ GRPC_CUSTOM_HOST ~ '"' if GRPC_CUSTOM_HOST != "" else "$http_host", custom_header_names.value) }}
{{ default_grpc_header("TE", "trailers", custom_header_names.value) }}
			{% if not url_is_regex and url.startswith("/") %}
{{ default_grpc_header("X-Forwarded-Prefix", '"' ~ quoted_url ~ '"', custom_header_names.value) }}
			{% endif %}
			{% if USE_MTLS == "yes" and MTLS_FORWARD_CLIENT_HEADERS == "yes" %}
{{ default_grpc_header("X-SSL-Client-Verify", "$ssl_client_verify", custom_header_names.value) }}
{{ default_grpc_header("X-SSL-Client-DN", "$ssl_client_s_dn", custom_header_names.value) }}
{{ default_grpc_header("X-SSL-Issuer", "$ssl_client_i_dn", custom_header_names.value) }}
{{ default_grpc_header("X-SSL-Client-Serial", "$ssl_client_serial", custom_header_names.value) }}
{{ default_grpc_header("X-SSL-Client-Fingerprint", "$ssl_client_fingerprint", custom_header_names.value) }}
{{ default_grpc_header("X-SSL-Client-NotBefore", "$ssl_client_v_start", custom_header_names.value) }}
{{ default_grpc_header("X-SSL-Client-NotAfter", "$ssl_client_v_end", custom_header_names.value) }}
			{% endif %}
			{% if auth_request != "" %}
	auth_request {{ auth_request }};
			{% endif %}
			{% if auth_request_signin_url != "" %}
	error_page 401 =302 {{ auth_request_signin_url }};
			{% endif %}
			{% if auth_request_sets != "" %}
				{% for auth_request_set in auth_request_sets.split(";") %}
	auth_request_set {{ auth_request_set }};
				{% endfor %}
			{% endif %}
			{% if headers != "" %}
				{% for header in headers.split(";") %}
	grpc_set_header {{ header }};
				{% endfor %}
			{% endif %}
			{% if headers_client != "" %}
				{% for header_client in headers_client.split(";") %}
	add_header {{ header_client }};
				{% endfor %}
			{% endif %}
			{% if hide_headers != "" %}
				{% for hide_header in hide_headers.split() %}
	grpc_hide_header {{ hide_header }};
				{% endfor %}
			{% endif %}
			{% if pass_headers != "" %}
				{% for pass_header in pass_headers.split() %}
	grpc_pass_header {{ pass_header }};
				{% endfor %}
			{% endif %}
			{% if ignore_headers != "" %}
	grpc_ignore_headers {{ ignore_headers }};
			{% endif %}
			{% if buffer_size != "" %}
	grpc_buffer_size {{ buffer_size }};
			{% endif %}
	grpc_connect_timeout {{ connect_timeout }};
	grpc_read_timeout {{ read_timeout }};
	grpc_send_timeout {{ send_timeout }};
	grpc_socket_keepalive {{ socket_keepalive }};
			{% if next_upstream != "" %}
	grpc_next_upstream {{ next_upstream }};
			{% endif %}
			{% if next_upstream_timeout != "" %}
	grpc_next_upstream_timeout {{ next_upstream_timeout }};
			{% endif %}
			{% if next_upstream_tries != "" %}
	grpc_next_upstream_tries {{ next_upstream_tries }};
			{% endif %}
			{% if includes != "" %}
				{% for include in includes.split() %}
	include {{ include }};
				{% endfor %}
			{% endif %}
}

	{% endfor %}
{%- endif %}
