{%- if USE_GRPC == "yes" -%}

	{% if GRPC_SSL_SNI == "yes" %}
grpc_ssl_server_name on;
		{% if GRPC_SSL_SNI_NAME != "" %}
grpc_ssl_name {{ GRPC_SSL_SNI_NAME }};
		{% endif %}
	{% else %}
grpc_ssl_server_name off;
	{% endif %}

	{#- Mutual TLS towards the upstream uses the gRPC-owned pair cached by trusted-cert.
	    Both halves must exist before either directive is emitted. -#}
	{%- set pathlib = import("pathlib") -%}
	{%- set grpc_client_dir = "/var/cache/bunkerweb/reverseproxy/" ~ SERVER_NAME.split(" ")[0] -%}
	{% if GRPC_SSL_VERIFY == "yes" %}
		{% set grpc_ca_cache = grpc_client_dir ~ "/grpc-trusted-ca.pem" %}
		{% if pathlib.Path(grpc_ca_cache).is_file() %}
grpc_ssl_verify on;
grpc_ssl_verify_depth {{ GRPC_SSL_VERIFY_DEPTH }};
grpc_ssl_trusted_certificate {{ grpc_ca_cache }};
			{% set grpc_crl_cache = grpc_client_dir ~ "/grpc-crl.pem" %}
			{% if pathlib.Path(grpc_crl_cache).is_file() %}
grpc_ssl_crl {{ grpc_crl_cache }};
			{% endif %}
		{% else %}
# grpc_ssl_verify disabled: no trusted certificate available (set GRPC_SSL_TRUSTED_CERTIFICATE or _DATA, or point it at the system CA bundle).
grpc_ssl_verify off;
		{% endif %}
	{% endif %}
	{% if pathlib.Path(grpc_client_dir ~ "/grpc-client.pem").is_file() and pathlib.Path(grpc_client_dir ~ "/grpc-client.key").is_file() %}
grpc_ssl_certificate {{ grpc_client_dir }}/grpc-client.pem;
grpc_ssl_certificate_key {{ grpc_client_dir }}/grpc-client.key;
	{% endif %}
	{% if GRPC_SSL_PROTOCOLS | default("") != "" %}
grpc_ssl_protocols {{ GRPC_SSL_PROTOCOLS }};
	{% endif %}
	{% if GRPC_SSL_CIPHERS | default("") != "" %}
grpc_ssl_ciphers {{ GRPC_SSL_CIPHERS }};
	{% endif %}

	{% if GRPC_INTERCEPT_ERRORS == "yes" %}
grpc_intercept_errors on;
	{% else %}
grpc_intercept_errors off;
	{% endif %}

	{% set hosts = namespace() %}
	{% set hosts.list = [] %}
	{% for k, v in all.items() %}
		{% if k.startswith("GRPC_HOST") and v != "" %}
			{% set suffix = k[9:] %}
			{% if not suffix or suffix.startswith("_") %}
				{% set index = suffix[1:] if suffix else "0" %}
				{% set hosts.list = hosts.list + [(index|int, k, v)] %}
			{% endif %}
		{% endif %}
	{% endfor %}
	{% for index, k, host in hosts.list|sort %}
			{% set url = all[k.replace("HOST", "URL")] if k.replace("HOST", "URL") in all else "/" %}
			{#- An anchored value is a regex location, but an explicit NGINX modifier in the value wins:
			    prefixing "~" onto "~* ..." or "^~ ..." produces a config NGINX refuses. Same rule as
			    reverseproxy's reverse-proxy.conf; location_claims.rendered_location() mirrors it so the
			    conflict checks compare what NGINX receives, not what was typed. -#}
			{#- Any whitespace separates the modifier from the operand, not a literal " ": "~  /a"
			    used to render a regex requiring a leading space, and a tab was not recognised as a
			    modifier at all. NOT the same rule as location_claims.rendered_location(), which
			    collapses EVERY whitespace run -- so an operand with inner whitespace is still
			    claimed as its collapsed form while rendering verbatim (PO note, false refusal only;
			    the operand regex refuses that whole class at write time). -#}
			{% set url_parts = url.split() %}
			{% set url_head = url_parts[0] if url_parts else "" %}
			{% set url_is_regex = url_head not in ("~", "~*", "=", "^~") and (url.startswith("^") or url.endswith("$")) %}
			{% set url_has_modifier = url_head in ("~", "~*", "=", "^~") %}
			{% set url_modifier = url_head if url_has_modifier else ("~" if url_is_regex else "") %}
			{% set url_operand = (url.split(None, 1)[1] if url_parts|length > 1 else "") if url_has_modifier else url %}
			{% set quoted_url = url_operand|replace('\\', '\\\\')|replace('"', '\\"') %}
			{#- An empty operand renders `location ""`, which NGINX accepts as a prefix location matching
			    EVERY uri -- it used to render `location  {` and be refused outright, so quoting turned a
			    loud [emerg] into a silent catch-all proxy. The plugin.json regex refuses an empty value and
			    a bare modifier, but that is a write-time guard: a stored setting is never re-validated at
			    render, and IGNORE_REGEX_CHECK=yes disables it wholesale. A location with no path claims
			    nothing, so it renders nothing. -#}
			{% if url_operand %}
			{% set headers = all[k.replace("HOST", "HEADERS")] if k.replace("HOST", "HEADERS") in all else "" %}
			{% set custom_header_names = namespace(value=[]) %}
			{% for header in headers.split(";") if header.strip() %}
				{% set custom_header_names.value = custom_header_names.value + [header.split()[0]|lower] %}
			{% endfor %}
			{% set hide_headers = all[k.replace("HOST", "HIDE_HEADERS")] if k.replace("HOST", "HIDE_HEADERS") in all else "" %}
			{% set connect_timeout = all[k.replace("HOST", "CONNECT_TIMEOUT")] if k.replace("HOST", "CONNECT_TIMEOUT") in all else "60s" %}
			{% set read_timeout = all[k.replace("HOST", "READ_TIMEOUT")] if k.replace("HOST", "READ_TIMEOUT") in all else "60s" %}
			{% set send_timeout = all[k.replace("HOST", "SEND_TIMEOUT")] if k.replace("HOST", "SEND_TIMEOUT") in all else "60s" %}
			{% set socket_keepalive = all[k.replace("HOST", "SOCKET_KEEPALIVE")] if k.replace("HOST", "SOCKET_KEEPALIVE") in all else "off" %}
			{% set next_upstream = all[k.replace("HOST", "NEXT_UPSTREAM")] if k.replace("HOST", "NEXT_UPSTREAM") in all else "" %}
			{% set next_upstream_timeout = all[k.replace("HOST", "NEXT_UPSTREAM_TIMEOUT")] if k.replace("HOST", "NEXT_UPSTREAM_TIMEOUT") in all else "" %}
			{% set next_upstream_tries = all[k.replace("HOST", "NEXT_UPSTREAM_TRIES")] if k.replace("HOST", "NEXT_UPSTREAM_TRIES") in all else "" %}
			{% set includes = all[k.replace("HOST", "INCLUDES")] if k.replace("HOST", "INCLUDES") in all else "" %}
			{% set headers_client = all[k.replace("HOST", "HEADERS_CLIENT")] if k.replace("HOST", "HEADERS_CLIENT") in all else "" %}
			{% set pass_headers = all[k.replace("HOST", "PASS_HEADERS")] if k.replace("HOST", "PASS_HEADERS") in all else "" %}
			{% set ignore_headers = all[k.replace("HOST", "IGNORE_HEADERS")] if k.replace("HOST", "IGNORE_HEADERS") in all else "" %}
			{% set buffer_size = all[k.replace("HOST", "BUFFER_SIZE")] if k.replace("HOST", "BUFFER_SIZE") in all else "" %}
			{% set auth_request = all[k.replace("HOST", "AUTH_REQUEST")] if k.replace("HOST", "AUTH_REQUEST") in all else "" %}
			{% set auth_request_signin_url = all[k.replace("HOST", "AUTH_REQUEST_SIGNIN_URL")] if k.replace("HOST", "AUTH_REQUEST_SIGNIN_URL") in all else "" %}
			{% set auth_request_sets = all[k.replace("HOST", "AUTH_REQUEST_SET")] if k.replace("HOST", "AUTH_REQUEST_SET") in all else "" %}
			{% set max_client_size = all[k.replace("HOST", "MAX_CLIENT_SIZE")] if k.replace("HOST", "MAX_CLIENT_SIZE") in all else "" %}
location {% if url_modifier %}{{ url_modifier }} {% endif %}"{{ quoted_url }}" {
			{% if USE_MODSECURITY == "yes" %}
	modsecurity off;
			{% endif %}
			{% if max_client_size != "" %}
	client_max_body_size {{ max_client_size }};
			{% endif %}
	set $grpc_backend{{ index }} "{{ host }}";
	grpc_pass $grpc_backend{{ index }};
			{% if "host" not in custom_header_names.value %}
	grpc_set_header Host {{ '"' ~ GRPC_CUSTOM_HOST ~ '"' if GRPC_CUSTOM_HOST != "" else "$host" }};
			{% endif %}
			{% if "x-forwarded-for" not in custom_header_names.value %}
	grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			{% endif %}
			{% if "x-real-ip" not in custom_header_names.value %}
	grpc_set_header X-Real-IP $remote_addr;
			{% endif %}
			{% if "x-forwarded-proto" not in custom_header_names.value %}
	grpc_set_header X-Forwarded-Proto $scheme;
			{% endif %}
			{% if "x-forwarded-host" not in custom_header_names.value %}
	grpc_set_header X-Forwarded-Host {{ '"' ~ GRPC_CUSTOM_HOST ~ '"' if GRPC_CUSTOM_HOST != "" else "$http_host" }};
			{% endif %}
			{% if "TE"|lower not in custom_header_names.value %}
	grpc_set_header TE trailers;
			{% endif %}
			{% if not url_is_regex and url.startswith("/") %}
			{% if "x-forwarded-prefix" not in custom_header_names.value %}
	grpc_set_header X-Forwarded-Prefix {{ '"' ~ quoted_url ~ '"' }};
			{% endif %}
			{% endif %}
			{% if USE_MTLS == "yes" and MTLS_FORWARD_CLIENT_HEADERS == "yes" %}
			{% if "x-ssl-client-verify" not in custom_header_names.value %}
	grpc_set_header X-SSL-Client-Verify $ssl_client_verify;
			{% endif %}
			{% if "x-ssl-client-dn" not in custom_header_names.value %}
	grpc_set_header X-SSL-Client-DN $ssl_client_s_dn;
			{% endif %}
			{% if "x-ssl-issuer" not in custom_header_names.value %}
	grpc_set_header X-SSL-Issuer $ssl_client_i_dn;
			{% endif %}
			{% if "x-ssl-client-serial" not in custom_header_names.value %}
	grpc_set_header X-SSL-Client-Serial $ssl_client_serial;
			{% endif %}
			{% if "x-ssl-client-fingerprint" not in custom_header_names.value %}
	grpc_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;
			{% endif %}
			{% if "x-ssl-client-notbefore" not in custom_header_names.value %}
	grpc_set_header X-SSL-Client-NotBefore $ssl_client_v_start;
			{% endif %}
			{% if "x-ssl-client-notafter" not in custom_header_names.value %}
	grpc_set_header X-SSL-Client-NotAfter $ssl_client_v_end;
			{% endif %}
			{% endif %}
			{% if auth_request != "" %}
	auth_request {{ auth_request }};
			{% endif %}
			{% if auth_request_signin_url != "" %}
	error_page 401 =302 {{ auth_request_signin_url }};
			{% endif %}
			{% if auth_request_sets != "" %}
				{% for auth_request_set in auth_request_sets.split(";") %}
	auth_request_set {{ auth_request_set }};
				{% endfor %}
			{% endif %}
			{% if headers != "" %}
				{% for header in headers.split(";") %}
	grpc_set_header {{ header }};
				{% endfor %}
			{% endif %}
			{% if headers_client != "" %}
				{% for header_client in headers_client.split(";") %}
	add_header {{ header_client }};
				{% endfor %}
			{% endif %}
			{% if hide_headers != "" %}
				{% for hide_header in hide_headers.split() %}
	grpc_hide_header {{ hide_header }};
				{% endfor %}
			{% endif %}
			{% if pass_headers != "" %}
				{% for pass_header in pass_headers.split() %}
	grpc_pass_header {{ pass_header }};
				{% endfor %}
			{% endif %}
			{% if ignore_headers != "" %}
	grpc_ignore_headers {{ ignore_headers }};
			{% endif %}
			{% if buffer_size != "" %}
	grpc_buffer_size {{ buffer_size }};
			{% endif %}
	grpc_connect_timeout {{ connect_timeout }};
	grpc_read_timeout {{ read_timeout }};
	grpc_send_timeout {{ send_timeout }};
	grpc_socket_keepalive {{ socket_keepalive }};
			{% if next_upstream != "" %}
	grpc_next_upstream {{ next_upstream }};
			{% endif %}
			{% if next_upstream_timeout != "" %}
	grpc_next_upstream_timeout {{ next_upstream_timeout }};
			{% endif %}
			{% if next_upstream_tries != "" %}
	grpc_next_upstream_tries {{ next_upstream_tries }};
			{% endif %}
			{% if includes != "" %}
				{% for include in includes.split() %}
	include {{ include }};
				{% endfor %}
			{% endif %}
}
			{% else %}
# gRPC rule {{ index if index is defined else "" }} skipped: GRPC_URL has no path (empty, or a bare location modifier), and a location with no path would match every URI.
			{% endif %}

	{% endfor %}
{%- endif %}
