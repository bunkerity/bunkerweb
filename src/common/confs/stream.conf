# /etc/nginx/stream.conf

# preread buffer size
# TODO : global setting STREAM_PREREAD_BUFFER_SIZE
preread_buffer_size 16k;

# preread timeout
# TODO : global setting STREAM_PREREAD_TIMEOUT
preread_timeout 30s;

# PROXY protocol timeout
# TODO : global setting STREAM_PROXY_PROTOCOL_TIMEOUT
proxy_protocol_timeout 30s;

# resolvers to use
resolver {{ DNS_RESOLVERS }} {% if USE_IPV6 == "no" %}ipv6=off{% endif %};

# resolver timeout
# TODO : global setting STREAM_RESOLVER_TIMEOUT
resolver_timeout 30s;

# remove 200ms delay
tcp_nodelay on;

# lua path and dicts
lua_package_path "/usr/share/bunkerweb/lua/?.lua;/usr/share/bunkerweb/core/?.lua;/etc/bunkerweb/plugins/?.lua;/etc/bunkerweb/pro/plugins/?.lua;/usr/share/bunkerweb/deps/lib/lua/?.lua;/usr/share/bunkerweb/deps/lib/lua/?/init.lua;;";
lua_package_cpath "/usr/share/bunkerweb/deps/lib/?.so;/usr/share/bunkerweb/deps/lib/lua/?.so;;";
{# REDIS_SSL_CA joins this bundle rather than replacing it. A cosocket has no per-connection
    trust store, so `clusterstore.lua` verifies its Redis/Valkey connection against whatever this
    one directive names -- and so do antibot, BunkerNet and CrowdSec for their own HTTPS. The
    combined file is written by gen/main.py (write_lua_trusted_ca_bundle) into the rendered tree
    and travels to every instance with this configuration. `| default("", true)` rather than a
    bare comparison because an Undefined REDIS_SSL_CA compares NOT-equal to "" -- the naive guard
    would name a bundle that was never written and NGINX would refuse to start. #}
{% if REDIS_SSL_CA | default("", true) %}
lua_ssl_trusted_certificate "/etc/nginx/lua-trusted-ca.pem";
{% else %}
lua_ssl_trusted_certificate "/usr/share/bunkerweb/misc/root-ca.pem";
{% endif %}
lua_ssl_verify_depth 2;
{% if has_variable(all, "SERVER_TYPE", "stream") +%}
lua_shared_dict internalstore_stream {{ normalize_memory_size(INTERNALSTORE_MEMORY_SIZE) }};
lua_shared_dict datastore_stream {{ normalize_memory_size(DATASTORE_MEMORY_SIZE) }};
lua_shared_dict ban_sync_stream {{ normalize_memory_size(DATASTORE_MEMORY_SIZE) }};
lua_shared_dict cachestore_stream {{ normalize_memory_size(CACHESTORE_MEMORY_SIZE) }};
lua_shared_dict cachestore_ipc_stream {{ normalize_memory_size(CACHESTORE_IPC_MEMORY_SIZE) }};
lua_shared_dict cachestore_miss_stream {{ normalize_memory_size(CACHESTORE_MISS_MEMORY_SIZE) }};
lua_shared_dict cachestore_locks_stream {{ normalize_memory_size(CACHESTORE_LOCKS_MEMORY_SIZE) }};
# only show LUA socket errors at info/debug
{% if LOG_LEVEL != "info" and LOG_LEVEL != "debug" %}
lua_socket_log_errors off;
{% endif %}

# LUA init block
include /etc/nginx/init-stream-lua.conf;

# TODO add default stream server if that makes any sense ?

# server config(s)
{% if MULTISITE == "yes" and SERVER_NAME != "" %}
	{% set map_servers = {} %}
	{% for server_name in SERVER_NAME.split() %}
		{% if server_name + "_SERVER_NAME" in all and all[server_name + "_SERVER_TYPE"] == "stream" %}
			{% set x = map_servers.update({server_name : all[server_name + "_SERVER_NAME"].split()}) %}
		{% endif %}
	{% endfor %}
	{% for server_name in SERVER_NAME.split() %}
		{% if not server_name in map_servers %}
			{% set found = {"res": false} %}
			{% for first_server, servers in map_servers.items() %}
				{% if server_name in servers %}
					{% set x = found.update({"res" : true}) %}
				{% endif %}
			{% endfor %}
			{% if not found["res"] and all[server_name + "_SERVER_TYPE"] == "stream" %}
				{% set x = map_servers.update({server_name : [server_name]}) %}
			{% endif %}
		{% endif %}
	{% endfor %}
	{% for first_server in map_servers +%}
include /etc/nginx/{{ first_server }}/server-stream.conf;
		{# An attached stream upstream pool replaces this implicit single-server block: it is
		   declared in stream/upstreams.conf and referenced through REVERSE_PROXY_UPSTREAM. #}
		{% if all[first_server + "_USE_REVERSE_PROXY"] == "yes" and all[first_server + "_REVERSE_PROXY_HOST"] != "" and (first_server + "_REVERSE_PROXY_UPSTREAM") not in all +%}
upstream {{ first_server }} {
	server {{ all[first_server + "_REVERSE_PROXY_HOST"] }};
}
		{% endif %}
	{% endfor %}
{% elif MULTISITE == "no" and SERVER_NAME != "" and SERVER_TYPE == "stream" +%}
include /etc/nginx/server-stream.conf;
	{% if USE_REVERSE_PROXY == "yes" and REVERSE_PROXY_HOST != "" and "REVERSE_PROXY_UPSTREAM" not in all +%}
upstream {{ SERVER_NAME.split(" ")[0] }} {
	server {{ REVERSE_PROXY_HOST }};
}
	{% endif %}
{% endif %}

{% endif %}
