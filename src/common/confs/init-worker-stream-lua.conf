# Stream has no shared L1 with HTTP (internalstore_stream). Warm OCSP shards
# off the ssl_certificate critical path the same way HTTP does via ssl:init_workers.
init_worker_by_lua_block {
	local ngx = ngx
	local ERR = ngx.ERR
	local INFO = ngx.INFO
	local clogger = require "bunkerweb.logger"
	local cdatastore = require "bunkerweb.datastore"
	local ocsp = require "bunkerweb.ocsp"

	local logger = clogger:new("INIT-WORKER-STREAM-" .. tostring(ngx.worker.id()))
	local store = ngx.shared.internalstore_stream
	if not store then
		logger:log(INFO, "internalstore_stream missing; OCSP L1 warmer skipped")
		return
	end
	local internalstore = cdatastore:new(store)
	local ok, err = pcall(ocsp.start_l1_warmer, internalstore)
	if not ok then
		logger:log(ERR, "OCSP L1 warmer start failed: " .. tostring(err))
		return
	end
	logger:log(INFO, "OCSP L1 warmer armed for stream")
}
