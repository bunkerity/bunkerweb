ssl_certificate /var/cache/bunkerweb/misc/default-server-cert.pem;
ssl_certificate_key /var/cache/bunkerweb/misc/default-server-cert.key;
ssl_protocols {{ SSL_PROTOCOLS }};
{% if SSL_PROTOCOLS == "TLSv1.3" %}
ssl_prefer_server_ciphers off;
{% else %}
ssl_prefer_server_ciphers on;
{% endif %}
ssl_session_tickets off;
{% if "TLSv1.2" in SSL_PROTOCOLS or "TLSv1.1" in SSL_PROTOCOLS or "TLSv1" in SSL_PROTOCOLS %}
ssl_session_timeout 1d;
	{% if SSL_SESSION_CACHE_SIZE == "off" or SSL_SESSION_CACHE_SIZE == "none" %}
ssl_session_cache {{ SSL_SESSION_CACHE_SIZE }};
	{% else %}
ssl_session_cache shared:MozSSLStream:{{ SSL_SESSION_CACHE_SIZE }};
	{% endif %}
{% endif %}
ssl_ecdh_curve {{ resolve_ssl_ecdh_curve(SSL_ECDH_CURVE) }};
{% if "TLSv1.2" in SSL_PROTOCOLS +%}
ssl_dhparam /etc/nginx/dhparam;
	{% if SSL_CIPHERS_CUSTOM|default('')|trim != "" %}
ssl_ciphers {{ SSL_CIPHERS_CUSTOM }};
	{% else %}
		{% if SSL_CIPHERS_LEVEL == "old" %}
ssl_ciphers @SECLEVEL=0:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA;
		{% elif SSL_CIPHERS_LEVEL == "intermediate" %}
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
		{% elif SSL_PROTOCOLS != "TLSv1.3" %}
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
		{% endif %}
	{% endif %}
{% endif %}

{% set ssl_ports = [] %}
{% for k, port in all.items() if k.startswith("LISTEN_STREAM_PORT_SSL") and port %}
	{% if ssl_ports.append(port) %}{% endif %}
{% endfor %}
{% if ssl_ports|length > 0 %}
	{% for port in ssl_ports %}
listen 0.0.0.0:{{ port }} ssl{% if USE_PROXY_PROTOCOL == "yes" %} proxy_protocol{% endif %};
		{% if USE_IPV6 == "yes" %}
listen [::]:{{ port }} ssl{% if USE_PROXY_PROTOCOL == "yes" %} proxy_protocol{% endif %};
		{% endif %}
	{% endfor %}
{% endif %}

# Capture SNI + signature_algorithms before the cert callback so stream OCSP
# staples only after the handshake has bound a site leaf (and dual-cert slot
# preference matches ClientHello when possible).
ssl_client_hello_by_lua_block {
	local ocsp_staple = require "bunkerweb.ocsp"
	pcall(ocsp_staple.capture_client_hello)
}

ssl_certificate_by_lua_block {
	local class         = require "middleclass"
	local clogger       = require "bunkerweb.logger"
	local helpers       = require "bunkerweb.helpers"
	local utils         = require "bunkerweb.utils"
	local cdatastore    = require "bunkerweb.datastore"
	local cclusterstore = require "bunkerweb.clusterstore"
	local cjson         = require "cjson"
	local ssl			= require "ngx.ssl"

	local ngx = ngx
	local ngx_req = ngx.req
	local is_internal = ngx_req.is_internal
	local ERR = ngx.ERR
	local INFO = ngx.INFO
	local NOTICE = ngx.NOTICE
	local clear_certs = ssl.clear_certs
	local set_cert = ssl.set_cert
	local set_priv_key = ssl.set_priv_key
	local require_plugin = helpers.require_plugin
	local new_plugin = helpers.new_plugin
	local call_plugin = helpers.call_plugin
	local tostring = tostring
	local ocsp_staple = require "bunkerweb.ocsp"

	-- Start ssl_certificate phase
	local logger    = clogger:new("SSL-CERTIFICATE")
	local subsystem = ngx.config.subsystem
	local store = subsystem == "http" and ngx.shared.internalstore or ngx.shared.internalstore_stream
	local internalstore = cdatastore:new(store)
	logger:log(INFO, "ssl_certificate phase started")

	-- Get plugins order
	local order, err = internalstore:get("plugins_order", true)
	if not order then
		logger:log(ERR, "can't get plugins order from internalstore : " .. err)
		return
	end

	local function get_phase_order(ord, phase, server_name)
		if ord.per_site and server_name and ord.per_site[server_name] and ord.per_site[server_name][phase] then
			return ord.per_site[server_name][phase]
		elseif ord.global and ord.global[phase] then
			return ord.global[phase]
		end
		return ord[phase]
	end

	-- Prefer live ssl.server_name(); fall back to ClientHello capture.
	local server_name = ocsp_staple.handshake_sni(ssl.server_name())
	local prefer_kind = ngx.ctx and ngx.ctx.bw_ocsp_prefer_kind or nil
	local phase_order = get_phase_order(order, "ssl_certificate", server_name)

	local function run_ocsp_staple(cert_pem, cert_fp)
		-- Defer the single ngx.ocsp slot until SNI has bound this handshake's leaf/site.
		local sni = ocsp_staple.handshake_sni(server_name)
		if not sni or sni == "" then
			local must = false
			local ok_must, must_ret = pcall(ocsp_staple.requires_must_staple, cert_pem, cert_fp)
			if ok_must then
				must = must_ret and true or false
			end
			if must then
				-- Same OCSP_STAPLE_MODE fuse as staple(): normal aborts; staple_only/open
				-- continue without binding the slot (no SNI → global mode when site unset).
				local mode = "normal"
				local ok_mode, mode_ret = pcall(ocsp_staple.staple_mode, internalstore, server_name)
				if ok_mode and type(mode_ret) == "string" and mode_ret ~= "" then
					mode = mode_ret
				end
				local ok_soft, soft_ok, soft_reason =
					pcall(ocsp_staple.soften_must_staple, mode, false, "must_staple", "await_sni")
				if not ok_soft then
					logger:log(ERR, "OCSP await_sni soften error : " .. tostring(soft_ok))
					return ngx.exit(ngx.ERROR)
				end
				if soft_reason == "must_staple" then
					return ngx.exit(ngx.ERROR)
				end
				-- Soft fuse: continue handshake unstapled; do not call staple().
				return true
			end
			logger:log(
				NOTICE,
				"staple_decision=skip_slot detail=await_sni action=defer subsystem=stream"
			)
			return true
		end
		server_name = sni
		if
			(type(cert_pem) == "string" and cert_pem ~= "")
			or (type(cert_fp) == "string" and cert_fp ~= "")
		then
			local ok_call, stapled, reason =
				pcall(ocsp_staple.staple, internalstore, sni, cert_pem, cert_fp)
			if not ok_call then
				logger:log(ERR, "OCSP stapling error : " .. tostring(stapled))
			elseif reason == "must_staple" then
				-- Detail already logged as OCSP_MUST_STAPLE_REFUSE by bunkerweb.ocsp.
				logger:log(ERR, "staple_decision=unmet tag=OCSP_MUST_STAPLE_REFUSE action=abort subsystem=stream")
				return ngx.exit(ngx.ERROR)
			end
		end
		return true
	end

	-- Call ssl_certificate() methods
	logger:log(INFO, "calling ssl_certificate() methods of plugins ...")
	for i, plugin_id in ipairs(phase_order) do
		-- Require call
		local plugin_lua, err = require_plugin(plugin_id)
		if plugin_lua == false then
			logger:log(ERR, err)
		elseif plugin_lua == nil then
			logger:log(INFO, err)
		else
			-- Check if plugin has ssl_certificate method
			if plugin_lua.ssl_certificate ~= nil then
				-- New call
				local ok, plugin_obj = new_plugin(plugin_lua)
				if not ok then
					logger:log(ERR, plugin_obj)
				else
					local ok, ret = call_plugin(plugin_obj, "ssl_certificate")
					if not ok then
						logger:log(ERR, ret)
					elseif not ret.ret then
						logger:log(ERR, plugin_id .. ":ssl_certificate() call failed : " .. ret.msg)
					else
						logger:log(INFO, plugin_id .. ":ssl_certificate() call successful : " .. ret.msg)
						if ret.status then
							logger:log(INFO, plugin_id .. " is setting certificate/key : " .. ret.msg)
							local ok, err = clear_certs()
							if not ok then
								logger:log(ERR, "error while clearing certificates : " .. err)
							end
							-- Drop connection staple from a prior leaf (SSL_certs_clear does not).
							pcall(ocsp_staple.on_ssl_context_swap, internalstore)

							-- Prefer original PEMs (status[3]/[4]) so dual-cert RSA+ECDSA pairs
							-- install like HTTP and OCSP can pick one staple slot from ClientHello.
							local cert_pem = ret.status[3]
							local key_pem = ret.status[4]
							local cert_fp = ret.status[5]
							local installed = false

							if
								type(cert_pem) == "string"
								and cert_pem ~= ""
								and type(key_pem) == "string"
								and key_pem ~= ""
							then
								local ok_pem, leaf_pem, leaf_fp =
									ocsp_staple.set_certs_from_pem(cert_pem, key_pem, internalstore, server_name, prefer_kind)
								if ok_pem then
									installed = true
									-- Prefer the leaf SPKI from set_certs_from_pem (ClientHello kind,
									-- else ECDSA when dual-cert). Do not fall back to plugin cert_fp —
									-- it is often the RSA leaf.
									return run_ocsp_staple(leaf_pem, leaf_fp)
								end
								-- Must-Staple probe refused every leaf: do not fall back to install-then-staple.
								if leaf_pem == "must_staple" then
									local mode = "normal"
									local ok_mode, mode_ret =
										pcall(ocsp_staple.staple_mode, internalstore, server_name)
									if ok_mode and type(mode_ret) == "string" and mode_ret ~= "" then
										mode = mode_ret
									end
									local ok_soft, soft_ok, soft_reason = pcall(
										ocsp_staple.soften_must_staple,
										mode,
										false,
										"must_staple",
										leaf_fp or "probe_failed"
									)
									if not ok_soft then
										logger:log(ERR, "OCSP probe soften error : " .. tostring(soft_ok))
										return ngx.exit(ngx.ERROR)
									end
									if soft_reason == "must_staple" then
										return ngx.exit(ngx.ERROR)
									end
									-- Soft fuse: set_certs_from_pem should already soft-install under
									-- staple_only/open. If we still land here, install the parsed leaf
									-- without a staple so clear_certs does not leave the static cert.
									logger:log(
										ERR,
										"staple_decision="
											.. tostring(leaf_fp or "probe_failed")
											.. " tag=OCSP_MUST_STAPLE_REFUSE action=continue_install"
											.. " mode="
											.. tostring(mode)
											.. " subsystem=stream"
									)
									ok, err = set_cert(ret.status[1])
									if not ok then
										logger:log(ERR, "soft-fuse set_cert failed : " .. tostring(err))
										return ngx.exit(ngx.ERROR)
									end
									ok, err = set_priv_key(ret.status[2])
									if not ok then
										logger:log(ERR, "soft-fuse set_priv_key failed : " .. tostring(err))
										return ngx.exit(ngx.ERROR)
									end
									return true
								end
								logger:log(
									NOTICE,
									"OCSP set_certs_from_pem failed ("
										.. tostring(leaf_pem)
										.. "); falling back to parsed status[1]/[2]"
								)
							end

							if not installed then
								-- Probe Must-Staple before loading the parsed leaf when PEM/fp is available.
								local call_ok, r1, r2, r3 =
									pcall(ocsp_staple.probe, internalstore, server_name, cert_pem, cert_fp)
								if not call_ok then
									logger:log(ERR, "OCSP probe error : " .. tostring(r1))
								elseif r1 == false and r2 == "must_staple" then
									logger:log(
										ERR,
										"staple_decision="
											.. tostring(r3 or "probe_failed")
											.. " tag=OCSP_MUST_STAPLE_REFUSE action=abort subsystem=stream"
									)
									return ngx.exit(ngx.ERROR)
								end
								ok, err = set_cert(ret.status[1])
								if not ok then
									logger:log(ERR, "error while setting certificate : " .. err)
								else
									local ok, err = set_priv_key(ret.status[2])
									if not ok then
										logger:log(ERR, "error while setting private key : " .. err)
									else
										return run_ocsp_staple(cert_pem, cert_fp)
									end
								end
							end
						end
					end
				end
			else
				logger:log(INFO, "skipped execution of " .. plugin_id .. " because method ssl_certificate() is not defined")
			end
		end
	end
	logger:log(INFO, "called ssl_certificate() methods of plugins")

	logger:log(INFO, "ssl_certificate phase ended")

	return true
}
