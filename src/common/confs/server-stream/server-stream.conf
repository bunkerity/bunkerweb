server {

	# variables
	set $reason '';
	set $reason_data '';
	set $ctx_ref '';
	set $is_whitelisted 'no';

	# enriched session context (filled from ngx.ctx.bw)
	set $bw_kind '';
	set $bw_protocol '';
	set $bw_ip_is_global '';
	set $bw_ip_version '';
	set $bw_country '';
	set $bw_city '';
	set $bw_asn_number '';
	set $bw_asn_org '';

	# server name (vhost)
	server_name '{{ SERVER_NAME.split(" ")[0] }}';

	# listen
{% set stream_ports = [] %}
{% for k, listen_stream_port in all.items() if k.startswith("LISTEN_STREAM_PORT") and not k.startswith("LISTEN_STREAM_PORT_SSL") and listen_stream_port %}
	{% if stream_ports.append(listen_stream_port) %}{% endif %}
{% endfor %}
{% if LISTEN_STREAM == "yes" and stream_ports|length > 0 %}
	{%- set protocols = [] %}
	{%- if USE_TCP == "yes" %}{% if protocols.append("tcp") %}{% endif %}{% endif %}
	{%- if USE_UDP == "yes" %}{% if protocols.append("udp") %}{% endif %}{% endif %}

	{%- for listen_stream_port in stream_ports %}
		{% for proto in protocols %}
			{% set udp_directive = " udp" if proto == "udp" else "" %}
			{% set proxy_directive = " proxy_protocol" if USE_PROXY_PROTOCOL == "yes" else "" %}
			{# `reuseport` is a listen OPTION, and NGINX binds listen options to the addr:port, not to
			   the server block: a second block setting one on the same addr:port is fatal
			   ("duplicate listen options", src/deps/src/nginx/src/stream/ngx_stream.c:489-497). Two
			   stream services on one port therefore used to stop NGINX from starting -- with
			   LISTEN_STREAM_PORT defaulting to 1337, without overriding anything. The option is
			   KEPT, but only the service that owns this (proto, port) emits it; Templator elects
			   one owner per addr:port (utils/ports.py:stream_reuseport_owners). A single-service
			   deployment owns all of its ports, so this renders byte-identically there. #}
			{% set reuseport_directive = " reuseport" if (proto ~ ":" ~ listen_stream_port) in (STREAM_REUSEPORT_PORTS | default([])) else "" %}
	listen 0.0.0.0:{{ listen_stream_port }}{{ udp_directive }}{{ reuseport_directive }}{{ proxy_directive }};
			{% if USE_IPV6 == "yes" %}
	listen [::]:{{ listen_stream_port }}{{ udp_directive }}{{ reuseport_directive }}{{ proxy_directive }};
			{% endif %}
		{% endfor %}
	{% endfor %}
{% endif %}

	# custom config
	include /etc/bunkerweb/configs/server-stream/*.conf;
{% if MULTISITE == "yes" +%}
	include /etc/bunkerweb/configs/server-stream/{{ SERVER_NAME.split(" ")[0] }}/*.conf;
{% endif %}

	# include config files
	include {{ NGINX_PREFIX }}server-stream/*.conf;

	# include LUA files
	include {{ NGINX_PREFIX }}ssl-certificate-stream-lua.conf;
	include {{ NGINX_PREFIX }}preread-stream-lua.conf;
	include {{ NGINX_PREFIX }}log-stream-lua.conf;

}
