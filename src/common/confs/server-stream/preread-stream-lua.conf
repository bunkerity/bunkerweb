preread_by_lua_block {
	local clogger       = require "bunkerweb.logger"
	local helpers       = require "bunkerweb.helpers"
	local utils         = require "bunkerweb.utils"
	local cdatastore    = require "bunkerweb.datastore"
	local ccachestore   = require "bunkerweb.cachestore"

	local ngx = ngx
	local exit = ngx.exit
	local ERR = ngx.ERR
	local INFO = ngx.INFO
	local WARN = ngx.WARN
	local NOTICE = ngx.NOTICE
	local fill_ctx = helpers.fill_ctx
	local export_ctx_vars = helpers.export_ctx_vars
	local save_ctx = helpers.save_ctx
	local require_plugin = helpers.require_plugin
	local new_plugin = helpers.new_plugin
	local call_plugin = helpers.call_plugin
	local is_whitelisted = utils.is_whitelisted
	local is_ip_whitelisted = utils.is_ip_whitelisted
	local is_banned = utils.is_banned
	local set_reason = utils.set_reason
	local get_deny_status = utils.get_deny_status
	local get_security_mode = utils.get_security_mode
	local tostring = tostring

	-- Start preread phase
	local logger        = clogger:new("PREREAD")
	local internalstore     = cdatastore:new(ngx.shared.internalstore_stream)
	logger:log(INFO, "preread phase started")

	-- Update cachestore (IPC poll requires ngx.sleep, only safe in preread/access/rewrite/content/timer phases)
	local cachestore = ccachestore:new(false)
	local ok, err = cachestore:update()
	if not ok then
		logger:log(ERR, "can't update cachestore : " .. err)
	end

	-- Fill ctx
	logger:log(INFO, "filling ngx.ctx ...")
	local ok, ret, errors, ctx = fill_ctx()
	if not ok then
		logger:log(ERR, "fill_ctx() failed : " .. ret)
	elseif errors then
		for i, error in ipairs(errors) do
			logger:log(ERR, "fill_ctx() error " .. tostring(i) .. " : " .. error)
		end
	end
	logger:log(INFO, "ngx.ctx filled (ret = " .. ret .. ")")

	-- Export the enriched context to the $bw_* variables
	local export_ok, export_err = export_ctx_vars(ctx)
	if not export_ok and export_err then
		logger:log(ERR, export_err)
	end

	-- Get security mode
	local security_mode = get_security_mode(ctx)
	local status = nil

	local function call_preread_plugin(plugin_id)
		local plugin_lua, err = require_plugin(plugin_id)
		if plugin_lua == false then
			logger:log(ERR, err)
		elseif plugin_lua == nil then
			logger:log(INFO, err)
		elseif plugin_lua.preread ~= nil then
			local ok, plugin_obj = new_plugin(plugin_lua, ctx)
			if not ok then
				logger:log(ERR, plugin_obj)
			else
				local ok, ret = call_plugin(plugin_obj, "preread")
				if not ok then
					logger:log(ERR, ret)
				elseif not ret.ret then
					logger:log(ERR, plugin_id .. ":preread() call failed : " .. ret.msg)
				else
					logger:log(INFO, plugin_id .. ":preread() call successful : " .. ret.msg)
				end
				if ret.status then
					local reason_status = ret.status == get_deny_status()
					if security_mode == "detect" then
						if reason_status then
							set_reason(plugin_id, ret.data, ctx, security_mode)
							if is_whitelisted(ctx) then
								logger:log(WARN, "detected allow preread from " .. plugin_id .. " : " .. ret.msg)
							else
								logger:log(WARN, "detected deny preread from " .. plugin_id .. " : " .. ret.msg)
							end
							return true
						end
					elseif reason_status then
						set_reason(plugin_id, ret.data, ctx, security_mode)
						if is_whitelisted(ctx) then
							logger:log(WARN, "allowed preread from " .. plugin_id .. " : " .. ret.msg)
						else
							logger:log(WARN, "denied preread from " .. plugin_id .. " : " .. ret.msg)
						end
					else
						logger:log(NOTICE, plugin_id .. " returned status " .. tostring(ret.status) .. " : " .. ret.msg)
					end
					status = ret.status
				end
			end
		else
			logger:log(INFO, "skipped execution of " .. plugin_id .. " because method preread() is not defined")
		end
	end

	-- Stream has no set phase, so evaluate the whitelist before bans regardless of its configured preread order.
	local stop = call_preread_plugin("whitelist")
	if status then
		save_ctx(ctx)
		return exit(status)
	elseif stop then
		save_ctx(ctx)
		return true
	end

	-- Process bans as soon as possible
	if not is_whitelisted(ctx) then
		local banned, reason, ttl, reason_data = is_banned(ctx.bw.remote_addr, ctx.bw.server_name)
		if banned == nil then
			logger:log(ERR, "can't check if IP " .. ctx.bw.remote_addr .. " is banned : " .. reason)
		elseif banned then
			-- Same reason as the HTTP access phase: the flag above only reflects the
			-- whitelist cache, which nothing can fill while the IP stays banned.
			local whitelisted, wl_info = is_ip_whitelisted(ctx.bw.remote_addr, ctx.bw.server_name)
			if whitelisted == nil then
				logger:log(ERR, "can't check whitelist for banned IP " .. ctx.bw.remote_addr .. " : " .. wl_info)
			end
			if whitelisted then
				logger:log(WARN,
					"IP " .. ctx.bw.remote_addr .. " is banned with reason " .. reason .. " but is whitelisted (info : " .. wl_info .. "), ignoring the ban")
			else
				ctx.bw.is_banned = true
				set_reason(reason, reason_data, ctx, security_mode)
				save_ctx(ctx)
				if security_mode == "block" then
					logger:log(WARN,
						"IP " .. ctx.bw.remote_addr .. " is banned with reason " .. reason .. " (" .. tostring(ttl) .. "s remaining)")
					return exit(get_deny_status())
				end
				-- detect : the reason is recorded above so the session still shows up in Reports,
				-- but the flow is left alone. Returning here skips the preread plugins, which is
				-- what the HTTP path does with exit(OK).
				logger:log(WARN,
					"detected IP " .. ctx.bw.remote_addr .. " ban with reason " .. reason .. " (" .. tostring(ttl) .. "s remaining)")
				return
			end
		else
			logger:log(INFO, "IP " .. ctx.bw.remote_addr .. " is not banned")
		end
	end

	-- Get plugins order
	local order, err = internalstore:get("plugins_order", true)
	if not order then
		logger:log(ERR, "can't get plugins order from internalstore : " .. err)
		return
	end

	local function get_phase_order(ord, phase, server_name)
		if ord.per_site and server_name and ord.per_site[server_name] and ord.per_site[server_name][phase] then
			return ord.per_site[server_name][phase]
		elseif ord.global and ord.global[phase] then
			return ord.global[phase]
		end
		return ord[phase]
	end

	local phase_order = get_phase_order(order, "preread", ngx.var.server_name)

	-- Call preread() methods
	logger:log(INFO, "calling preread() methods of plugins ...")
	for i, plugin_id in ipairs(phase_order) do
		if plugin_id ~= "whitelist" then
			stop = call_preread_plugin(plugin_id)
			if status or stop then
				break
			end
		end
	end
	logger:log(INFO, "called preread() methods of plugins")

	-- Save ctx
	save_ctx(ctx)

	logger:log(INFO, "preread phase ended")

	-- Return status if needed
	if status then
		return exit(status)
	end

	return true
}
