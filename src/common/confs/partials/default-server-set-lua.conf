{#- The default server's `set` runner. Mirrors `server-http/set-lua.conf`, minus two things it has
    no use for here: the `$bw_*` export (the default server block declares none of those variables)
    and the internal-redirect rebuild that exists only to restore them. -#}
	set $default_server_dummy_set "";
	set_by_lua_block $default_server_dummy_set {
		local clogger		= require "bunkerweb.logger"
		local helpers		= require "bunkerweb.helpers"
		local cdatastore	= require "bunkerweb.datastore"

		local ngx = ngx
		local is_internal = ngx.req.is_internal
		local ERR = ngx.ERR
		local INFO = ngx.INFO
		local fill_ctx = helpers.fill_ctx
		local save_ctx = helpers.save_ctx
		local require_plugin = helpers.require_plugin
		local new_plugin = helpers.new_plugin
		local call_plugin = helpers.call_plugin
		local tostring = tostring

{% include "partials/default-server-preamble-lua.conf" %}

		-- Don't process internal requests
		local logger = clogger:new("SET-DEFAULT")
		if is_internal() then
			logger:log(INFO, "skipped set phase because request is internal")
			return true
		end

		-- Start set phase
		local internalstore = cdatastore:new(ngx.shared.internalstore)
		logger:log(INFO, "set phase started")

		-- Fill ctx
		logger:log(INFO, "filling ngx.ctx ...")
		local ok, ret, errors, ctx = fill_ctx()
		if not ok then
			logger:log(ERR, "fill_ctx() failed : " .. ret)
		elseif errors then
			for i, error in ipairs(errors) do
				logger:log(ERR, "fill_ctx() error " .. tostring(i) .. " : " .. error)
			end
		end
		logger:log(INFO, "ngx.ctx filled (ret = " .. ret .. ")")

		-- Bind to the reserved service id (see the preamble)
		local previous_server_name = ctx.bw.server_name
		ctx.bw.server_name = "{{ import("default_server").DEFAULT_SERVER_ID }}"

		-- Get plugins order
		local order, err = internalstore:get("plugins_order", true)
		if not order then
			logger:log(ERR, "can't get plugins order from internalstore : " .. err)
			ctx.bw.server_name = previous_server_name
			return true
		end

		-- Call set() methods of the curated subset
		logger:log(INFO, "calling set() methods of plugins ...")
		for _, plugin_id in ipairs(get_phase_order(order, "set")) do
			if not allowed_plugins[plugin_id] then
				logger:log(INFO, "skipped execution of " .. plugin_id .. " because it is not part of the default server subset")
			else
				local plugin_lua, err = require_plugin(plugin_id)
				if plugin_lua == false then
					logger:log(ERR, err)
				elseif plugin_lua == nil then
					logger:log(INFO, err)
				elseif plugin_lua.set == nil then
					logger:log(INFO, "skipped execution of " .. plugin_id .. " because method set() is not defined")
				else
					local ok, plugin_obj = new_plugin(plugin_lua, ctx)
					if not ok then
						logger:log(ERR, plugin_obj)
					else
						local ok, ret = call_plugin(plugin_obj, "set")
						if not ok then
							logger:log(ERR, ret)
						elseif not ret.ret then
							logger:log(ERR, plugin_id .. ":set() call failed : " .. ret.msg)
						else
							logger:log(INFO, plugin_id .. ":set() call successful : " .. ret.msg)
						end
					end
				end
			end
		end
		logger:log(INFO, "called set() methods of plugins")

		-- Restore the marker BEFORE saving : log_default reads this same context
		ctx.bw.server_name = previous_server_name
		save_ctx(ctx)

		return true
	}
