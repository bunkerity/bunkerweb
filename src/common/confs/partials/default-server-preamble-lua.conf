{#- Shared head of the three default-server phase runners (set / access / header).

    Not a copy of `server-http/*-lua.conf`'s head by accident: the default server has no service
    identity, so two things differ from a service block and BOTH are here rather than repeated
    three times.

    1. The curated plugin subset. `utils/default_server.py:DEFAULT_SERVER_PLUGINS` is the single
       source of truth, rendered in through `import()` so the Lua table and the UI page cannot
       drift. Default-DENY: a plugin absent from it never runs here. Refused on purpose --
       `reverseproxy`, `grpc`, `redirect` (no `Host` to route), `sessions`, `antibot`, `mtls`,
       `cors`, `authbasic` -- because they assume a service identity and would produce
       configuration that is valid and inert, which is worse than refusing them.

    2. The reserved service id. `server_name _;` stays (`utils.lua:768` and
       `misc/.../disable.conf:12` read `_` as "no service", and every plugin that tests for it
       keeps working), so `ngx.var.server_name` is still `_` and the RUNNER rebinds the context
       instead: `ctx.bw.server_name` becomes the reserved id for the duration of the plugin loop,
       which is what makes `utils.get_variable` resolve `variables["default-server"]` -- the
       settings an operator edits on the Default server page.

    The rebind is SCOPED: every runner restores `previous_server_name` before it returns, on EVERY
    path including the `ngx.exit` ones. `log_default` runs later on the same context and
    `badbehavior.lua:76` propagates a default-server ban to every service precisely by testing for
    `_`, so leaving the reserved id behind would silently narrow that ban to one pseudo-service.

    What makes the restore work is that the context is one TABLE shared by reference, not the
    `save_ctx` call: `ctx.stash_ref` stores a reference and returns early when `$ctx_ref` is already
    set, and `apply_ref` hands the SAME object back (`bunkerweb/ctx.lua:46-96`). So the in-place
    assignment is the restore, and its position relative to `save_ctx` is irrelevant. The invariant
    that does matter: no curated plugin may leave `access()` or `header()` through `ngx.exit` of its
    own, because that would skip the runner's restore entirely. It holds -- every curated plugin
    returns through `self:ret` -- and `tests/unit/common/test_default_server_runners_lua.py` pins
    it, because nothing in the runner can enforce it. -#}
{% set default_server = import("default_server") %}
	local allowed_plugins = {
{% for plugin_id in default_server.DEFAULT_SERVER_PLUGINS %}
		["{{ plugin_id }}"] = true,
{% endfor %}
	}

	local function get_phase_order(ord, phase)
		local server_name = "{{ default_server.DEFAULT_SERVER_ID }}"
		if ord.per_site and ord.per_site[server_name] and ord.per_site[server_name][phase] then
			return ord.per_site[server_name][phase]
		elseif ord.global and ord.global[phase] then
			return ord.global[phase]
		end
		return ord[phase] or {}
	end
