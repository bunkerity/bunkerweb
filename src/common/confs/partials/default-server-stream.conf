{#- The stream default server (conception option (b), PO ruling 6, gate approved 2026-09-02).

    Opt-in and empty by default. It exists only on the ports the reserved `default-server`
    pseudo-service declares in `DEFAULT_SERVER_STREAM_PORTS`, minus every port a stream service
    claims -- Templator drops those (`utils/default_server.py:default_server_stream_listeners`) and
    logs why, because stream has no SNI on plain TCP and none at all on UDP: NGINX picks the block
    by `address:port` alone, so a `default_server` there WINS over the service's block and would
    silently answer its traffic. The refusal fails safe towards the real service.

    `default_server_stream_ssl_ports` is the TLS switch of those ports: the reserved service's own
    `DEFAULT_SERVER_STREAM_PORTS_SSL`, required to be a SUBSET of the list above. It is a setting of
    its own rather than the reserved row's inherited `LISTEN_STREAM_PORT_SSL` (which is what this
    rendered from first): that one belongs to a stream SERVICE, defaults to `4242` in the `general`
    pseudo-plugin, and the reserved row inherited a value nobody typed -- with no field on the
    Default server page to correct it.

    It answers and closes. `return "";` is the content handler (`ngx_stream_return_module`, built
    in by default -- `auto/options:130`, and BunkerWeb never passes
    `--without-stream_return_module`): a stream server with no handler at all is a runtime error,
    not a closed connection. No `preread`/`log_stream` plugin runners, for the same reason the http
    half runs a curated subset -- there is no service identity to bind a plugin to here, and a
    connection that is about to be closed has nothing for one to inspect.

    Rendered by `stream.conf` alone, so it never becomes a configuration file of its own
    (`Templator._categorize_templates` does not know a "partials" context). -#}
{% for port in default_server_stream_ports %}
	{% set is_ssl = port in default_server_stream_ssl_ports %}
server {
	# listen
	listen 0.0.0.0:{{ port }}{% if is_ssl %} ssl{% endif %} default_server;
	{% if USE_IPV6 == "yes" %}
	listen [::]:{{ port }}{% if is_ssl %} ssl{% endif %} default_server;
	{% endif %}

	{% if is_ssl %}
	{#- TLS parameters. Same values as `server-stream/ssl-certificate-stream-lua.conf` and
	    `default-server-http.conf`, restated because NGINX has no way to share them between server
	    blocks rendered from different templates and stream.conf sets none at `stream{}` level.
	    Inheriting NGINX's own defaults instead would put weak ciphers on a port BunkerWeb opened.
	    ponytail: third copy of this block; a shared `partials/ssl-params.conf` is the consolidation,
	    which touches two templates outside this lane's scope.

	    Read from `DEFAULT_SERVER_TLS_RENDER`, not from the global names: all four settings are
	    `ssl` plugin settings and `ssl` is in `DEFAULT_SERVER_PLUGINS`, so an operator changes them
	    on the Default server page -- but `stream.conf` is a GLOBAL template and never receives the
	    reserved service's merge. Templator hands the four down derived
	    (`gen/Templator.py:_render_global`) so this block and `default-server-http.conf` cannot
	    answer differently for one field on one page. `default({})` + `.get(..., <global>)` because
	    every unit test that builds a Templator by hand renders this file without the derived dict.
	    #}
	{% set ds_tls = DEFAULT_SERVER_TLS_RENDER | default({}) %}
	{% set ds_ssl_protocols = ds_tls.get("SSL_PROTOCOLS", SSL_PROTOCOLS) %}
	{% set ds_ssl_ciphers_custom = ds_tls.get("SSL_CIPHERS_CUSTOM", SSL_CIPHERS_CUSTOM) %}
	{% set ds_ssl_ciphers_level = ds_tls.get("SSL_CIPHERS_LEVEL", SSL_CIPHERS_LEVEL) %}
	{% set ds_ssl_ecdh_curve = ds_tls.get("SSL_ECDH_CURVE", SSL_ECDH_CURVE) %}
	ssl_certificate /var/lib/bunkerweb/default-server-cert.pem;
	ssl_certificate_key /var/lib/bunkerweb/default-server-cert.key;
	ssl_protocols {{ ds_ssl_protocols }};
	{% if ds_ssl_protocols == "TLSv1.3" %}
	ssl_prefer_server_ciphers off;
	{% else %}
	ssl_prefer_server_ciphers on;
	{% endif %}
	ssl_session_tickets off;
	ssl_ecdh_curve {{ resolve_ssl_ecdh_curve(ds_ssl_ecdh_curve) }};
	{% if "TLSv1.2" in ds_ssl_protocols %}
	ssl_dhparam /etc/nginx/dhparam;
		{% if ds_ssl_ciphers_custom|default('')|trim != "" %}
	ssl_ciphers {{ ds_ssl_ciphers_custom }};
		{% elif ds_ssl_ciphers_level == "old" %}
	ssl_ciphers @SECLEVEL=0:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
		{% elif ds_ssl_ciphers_level == "intermediate" %}
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
		{% elif ds_ssl_protocols != "TLSv1.3" %}
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
		{% endif %}
	{% endif %}

	{#- ONE phase, `ssl_certificate_default` -- the DEFAULT_SERVER_SSL_CERT/_KEY override DS-A added
	    (`core/customcert/customcert.lua:334`, `"stream": "yes"`). Not the shared `ssl_certificate`
	    loop the service blocks run: that loop resolves a certificate for a hostname a service owns,
	    and this block only ever answers connections no service claimed. When the override is unset
	    the phase installs nothing and NGINX falls back to the static internal certificate above,
	    which is exactly what this port would have presented before.
	    `internalstore_stream`, not `internalstore`: `ngx.shared` is built per subsystem. #}
	ssl_certificate_by_lua_block {
		local clogger		= require "bunkerweb.logger"
		local helpers		= require "bunkerweb.helpers"
		local cdatastore	= require "bunkerweb.datastore"
		local ssl			= require "ngx.ssl"

		local ngx = ngx
		local ERR = ngx.ERR
		local INFO = ngx.INFO
		local clear_certs = ssl.clear_certs
		local set_cert = ssl.set_cert
		local set_priv_key = ssl.set_priv_key
		local require_plugin = helpers.require_plugin
		local new_plugin = helpers.new_plugin
		local call_plugin = helpers.call_plugin

		local logger = clogger:new("SSL-CERTIFICATE-DEFAULT-STREAM")
		local internalstore = cdatastore:new(ngx.shared.internalstore_stream)

		local order, err = internalstore:get("plugins_order", true)
		if not order then
			logger:log(ERR, "can't get plugins order from internalstore : " .. err)
			return
		end

		local phase_order = (order.global and order.global.ssl_certificate_default) or order.ssl_certificate_default
		if not phase_order then
			logger:log(INFO, "no plugin implements ssl_certificate_default()")
			return
		end

		for _, plugin_id in ipairs(phase_order) do
			local plugin_lua, err = require_plugin(plugin_id)
			if plugin_lua == false then
				logger:log(ERR, err)
			elseif plugin_lua == nil then
				logger:log(INFO, err)
			elseif plugin_lua.ssl_certificate_default == nil then
				logger:log(INFO, "skipped execution of " .. plugin_id .. " because method ssl_certificate_default() is not defined")
			else
				local ok, plugin_obj = new_plugin(plugin_lua)
				if not ok then
					logger:log(ERR, plugin_obj)
				else
					local ok, ret = call_plugin(plugin_obj, "ssl_certificate_default")
					if not ok then
						logger:log(ERR, ret)
					elseif not ret.ret then
						logger:log(ERR, plugin_id .. ":ssl_certificate_default() call failed : " .. ret.msg)
					elseif ret.status then
						local ok, err = clear_certs()
						if not ok then
							logger:log(ERR, "error while clearing certificates : " .. err)
						end
						ok, err = set_cert(ret.status[1])
						if not ok then
							logger:log(ERR, "error while setting certificate : " .. err)
						else
							local ok, err = set_priv_key(ret.status[2])
							if not ok then
								logger:log(ERR, "error while setting private key : " .. err)
							else
								logger:log(INFO, "default server certificate set by " .. plugin_id)
								return true
							end
						end
					end
				end
			end
		end
		return true
	}
	{% endif %}

	# answer and close: this block never proxies
	return "";
}
{% endfor %}
