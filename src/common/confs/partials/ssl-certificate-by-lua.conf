{#- The ssl_certificate phase runner, shared by every server block and by the default server.
    It lived inline in server-http/ssl-certificate-lua.conf until the default server needed it too
    (F-LE-3 part B): an unknown SNI reaches the default server, and without this it could only ever
    be shown the internal default certificate -- never the wildcard an operator configured for it.

    Kept as a Jinja include rather than an NGINX `include` because the two callers wrap it in
    different server blocks and NGINX cannot include a file into the middle of a directive context
    from a path that is rendered per server. Templator only renders templates whose top directory is
    a known context (Templator._categorize_templates), and "partials" is not one, so this file is
    reachable by `{% include %}` and is never written out on its own.

    The body carries exactly ONE piece of Jinja, `default_server_certificate_phase`, set by
    default-server-http.conf right before it includes this file and set by nothing else. It adds
    the `ssl_certificate_default` phase (the DEFAULT_SERVER_SSL_CERT override) after the shared
    loop, and it cannot live in a block of its own: NGINX accepts a single
    ssl_certificate_by_lua_block per server ("is duplicate",
    src/deps/src/lua-nginx-module/src/ngx_http_lua_ssl_certby.c:136). A service block renders the
    flag off, so the extra phase is not merely skipped there -- it is not in the file. -#}
ssl_certificate_by_lua_block {
	local class         = require "middleclass"
	local clogger       = require "bunkerweb.logger"
	local helpers       = require "bunkerweb.helpers"
	local utils         = require "bunkerweb.utils"
	local cdatastore    = require "bunkerweb.datastore"
	local cclusterstore = require "bunkerweb.clusterstore"
	local cjson         = require "cjson"
	local ssl			= require "ngx.ssl"

	local ngx = ngx
	local ngx_req = ngx.req
	local is_internal = ngx_req.is_internal
	local ERR = ngx.ERR
	local INFO = ngx.INFO
	local clear_certs = ssl.clear_certs
	local set_cert = ssl.set_cert
	local set_priv_key = ssl.set_priv_key
	local require_plugin = helpers.require_plugin
	local new_plugin = helpers.new_plugin
	local call_plugin = helpers.call_plugin
	local tostring = tostring

	-- Start ssl_certificate phase
	local logger    = clogger:new("SSL-CERTIFICATE")
	local internalstore = cdatastore:new(ngx.shared.internalstore)
	logger:log(INFO, "ssl_certificate phase started")

	-- Get plugins order
	local order, err = internalstore:get("plugins_order", true)
	if not order then
		logger:log(ERR, "can't get plugins order from internalstore : " .. err)
		return
	end

		local function get_phase_order(ord, phase, server_name)
			if ord.per_site and server_name and ord.per_site[server_name] and ord.per_site[server_name][phase] then
				return ord.per_site[server_name][phase]
			elseif ord.global and ord.global[phase] then
				return ord.global[phase]
			end
			return ord[phase]
		end

		local server_name = ssl.server_name()

	-- One runner, parameterised by phase name, because the default server runs two of them and
	-- NGINX gives it a single ssl_certificate_by_lua_block to do it in. `true` means a plugin
	-- installed a certificate and no later plugin -- or later phase -- should be consulted.
	local function run_certificate_phase(phase)
		local phase_order = get_phase_order(order, phase, server_name)
		if not phase_order then
			logger:log(INFO, "no plugin implements " .. phase .. "()")
			return false
		end

		-- Call <phase>() methods
		logger:log(INFO, "calling " .. phase .. "() methods of plugins ...")
		for i, plugin_id in ipairs(phase_order) do
			-- Require call
			local plugin_lua, err = require_plugin(plugin_id)
			if plugin_lua == false then
				logger:log(ERR, err)
			elseif plugin_lua == nil then
				logger:log(INFO, err)
			else
				-- Check if plugin has the phase method
				if plugin_lua[phase] ~= nil then
					-- New call
					local ok, plugin_obj = new_plugin(plugin_lua)
					if not ok then
						logger:log(ERR, plugin_obj)
					else
						local ok, ret = call_plugin(plugin_obj, phase)
						if not ok then
							logger:log(ERR, ret)
						elseif not ret.ret then
							logger:log(ERR, plugin_id .. ":" .. phase .. "() call failed : " .. ret.msg)
						else
							logger:log(INFO, plugin_id .. ":" .. phase .. "() call successful : " .. ret.msg)
							if ret.status then
								logger:log(INFO, plugin_id .. " is setting certificate/key : " .. ret.msg)
								local ok, err = clear_certs()
								if not ok then
									logger:log(ERR, "error while clearing certificates : " .. err)
								end
								ok, err = set_cert(ret.status[1])
								if not ok then
									logger:log(ERR, "error while setting certificate : " .. err)
								else
									local ok, err = set_priv_key(ret.status[2])
									if not ok then
										logger:log(ERR, "error while setting private key : " .. err)
									else
										logger:log(INFO, "certificate set by " .. plugin_id)
										return true
									end
								end
							end
						end
					end
				else
					logger:log(INFO, "skipped execution of " .. plugin_id .. " because method " .. phase .. "() is not defined")
				end
			end
		end
		logger:log(INFO, "called " .. phase .. "() methods of plugins")
		return false
	end

{# Default server only. `ssl_certificate_default` serves DEFAULT_SERVER_SSL_CERT, and it runs ONLY
    when no SNI-indexed provider above claimed the handshake -- so a certificate a service
    legitimately owns always wins, and the override is confined to hostnames nothing serves. #}
{% if default_server_certificate_phase is defined and default_server_certificate_phase %}
	if not run_certificate_phase("ssl_certificate") then
		run_certificate_phase("ssl_certificate_default")
	end
{% else %}
	run_certificate_phase("ssl_certificate")
{% endif %}

	logger:log(INFO, "ssl_certificate phase ended")

	return true
}
