# Shared HTTP ssl_certificate callback (named vhosts and the default server).
# If no plugin replaces the certificate, this returns and nginx keeps the static
# ssl_certificate. OCSP probe / staple / Must-Staple abort live here.
#
# =============================================================================
# REVIEWER MAP — OCSP stapling / Must-Staple (PR surface for this file)
# =============================================================================
# Companion code (behavior must stay aligned):
#   src/bw/lua/bunkerweb/ocsp_http.lua       — HTTP ssl_certificate logic moved here
#   src/bw/lua/bunkerweb/ocsp.lua          — shared vocabulary, allow-pin bus,
#                                            outside ligand (ligand_verdict), AIA,
#                                            multi-staple, colony min
#   src/common/core/ssl/jobs/ocsp-refresh.py — fetch, canary page, soft-recall,
#                                            in-place promote, floor, plasmid,
#                                            ligand+allow write, per-run restamp
#   src/common/utils/jobs.py               — restore fence, floor rank, coherence
#                                            (clears allow+ligand; stamps paged=false)
#   src/common/core/ssl/README.md          — staple_decision=CODE runbook (grep logs)
#
# On-disk layout (SPKI = SHA256 of SubjectPublicKeyInfo, 64 lowercase hex):
#   /var/cache/bunkerweb/ssl/{h1}/{h2}/{fp}/ocsp.der|ocsp.json|issuer.pem
#   /var/cache/bunkerweb/ssl/{h1}/{h2}/{fp}/serial-blacklist.json   (disk-local)
#   /var/cache/bunkerweb/ssl/ocsp-floor/{fp}   colony this_update_unix floor
#   /var/cache/bunkerweb/ssl/ocsp-ligand/{fp}  cross-zone der_sha256+gen+paged (outside shard)
#   /var/cache/bunkerweb/ssl/ocsp-allow/{fp}   canary allow-pin (missing = Must-Staple refuse)
#   /var/cache/bunkerweb/ssl/ocsp-refuse/{fp}  legacy sticky refuse (job cleanup only)
#   /var/cache/bunkerweb/ssl/.ocsp_epoch       L1 coherence (HTTP + stream shm)
#
# Call graph (ssl_certificate phase):
#   1. Plugin loop returns leaf PEM(s) + optional SPKI hint (status[3]/status[5]).
#   2. Dual-cert: order ClientHello-compatible leaves → probe each (probe_only=true)
#      → demote issuer-path Must-Staple failures → prefer fewest NULL multi-slots
#      → install ONE leaf (set_cert) → staple that leaf (probe_only=false).
#   3. set_ocsp_from_cache:
#        L1 (internalstore bw2) → disk ocsp.der
#        Post-lookup gates (body in hand): serial → shared ligand → allow-pin
#          → cluster_floor → tombstone → not_paged → AIA → CertID → attach.
#          (Path A may peer-refuse before body exists; do not reorder post-lookup
#          just to match a numbered list — refuse_cause strings must stay stable.)
#        L1 disk-match fail-closes on require miss / paged+ligand ENOENT; publish-gap
#          keep only while ligand_effective_sha still names the cached binding
#          (shared bunkerweb.ocsp.l1_body_matches_disk with stream).
#        Allow-pin: MISSING pin refuses Must-Staple; DROP_ALLOW compare-and-deletes.
#        refuse_must_staple uses bunkerweb.ocsp.should_skip_peer_bus (skip ⊆ KEEP).
#        Probe_only never writes the peer bus (skip_leaf must not DROP_ALLOW a sibling pin).
#        Probe_only runs without ngx.ocsp (policy gates); attach stays ocsp-gated.
#        issuer_path / module-miss fail-closed only for Must-Staple or unknown leaves.
#        resolve_leaf binds Must-Staple + allow-pin before peer / stapling-off / ngx.ocsp.
#        HTTP .ocsp_epoch via bunkerweb.ocsp.current_ocsp_epoch (same as stream).
#        Post-install throw / half-install: wipe_ssl_ctx + abort outside pcall when MS.
#   4. Must-Staple unmet under OCSP_STAPLE_MODE=normal → abort_must_staple + ngx.exit
#      outside the top-level pcall (ngx.exit must not run inside pcall).
#
# Soft fuse (OCSP_STAPLE_MODE=staple_only|open):
#   After install, continues unstapled and does NOT drop the allow-pin.
#   probe_only still aborts that leaf (never install Must-Staple without a live shard).
#   open clears Must-Staple before peer / stapling-off so probes cannot demote recovery.
#
# Design traps (do not "fix" without reading README):
#   - Canary paged=true skips handshake ngx.ocsp.validate — intentional (CLI↔FFI).
#   - Colony floor ranks this_update_unix only — never published_unix.
#   - soft_recall_gen + der_sha256 identity — leftover allow must not re-match after re-page.
#   - Intermediate plasmid body is shared; tenant control_fp keys negatives.
#   - ~700ms validate budget is leaf-issuer tries only (not intermediates).
#   - HTTP and stream cannot share lua_shared_dict; ligand + epoch + allow-pin couple them.
#   - Ligand lives outside the SPKI dir (in-place promote must not tear der_sha256).
#   - Allow-pin polarity: missing file refuses Must-Staple; only canary/restamp writes;
#     handshake compare-and-delete only (never erase a newer generation).
#   - Pin-state + clock + ligand_missing causes are KEEP_ALLOW (local view must not wipe the shared pin).
#   - HTTP and stream share bunkerweb.ocsp.ligand_verdict (no inlined ligand copy).
#   - L1 disk-match fail-closes like ligand_matches (require miss / paged+ENOENT drop L1).
#   - Raw refuse_cause (e.g. ligand_missing) may differ from staple_decision=shared_ligand.
#   - Do not unscoped-fail-closed issuer_path (bricks non-MS leaves when ngx.ocsp module missing).
#   - Do not treat unknown Must-Staple as false (resty/ocsp.json miss stays fail-closed).
#   - Do not write peer bus from probe_only / soft fuse.
#
# In-file SECTION index (search "-- SECTION:"):
#   (moved to src/bw/lua/bunkerweb/ocsp_http.lua)
# =============================================================================
ssl_certificate_by_lua_block {
	-- State table holds install flags that survive pcall throws.
	-- Updated by ocsp_http module with final Must-Staple decision.
	local state = {
		abort_must_staple = false,
		abort_must_staple_detail = nil,
		certs_cleared = false,
		leaf_installed = false,
		leaf_complete = false,
		leaf_must_staple = nil,
	}

	-- Top-level pcall to ensure any unexpected Lua error does not abort the handshake.
	-- Must-Staple failures set state.abort_must_staple and exit outside pcall (ngx.exit must not run inside pcall).
	local ok, err = pcall(function()
		local ocsp_http = require "bunkerweb.ocsp_http"
		ocsp_http.ssl_certificate(state)
	end)

	-- Must-Staple abort outside pcall: ngx.exit is illegal inside the protected block.
	-- abort_must_staple is set inside the pcall when refuse / soft-fuse / half-install
	-- decided the handshake must die; we exit here so ngx.exit is not swallowed.
	if state.abort_must_staple then
		ngx.log(
			ngx.ERR,
			"staple_decision="
				.. tostring(state.abort_must_staple_detail or "unmet")
				.. " tag=OCSP_MUST_STAPLE_REFUSE action=abort subsystem=http detail="
				.. tostring(state.abort_must_staple_detail or "unmet")
		)
		return ngx.exit(ngx.ERROR)
	end

	-- Post-pcall safety net (reviewers: pairs with state.certs_cleared / state.leaf_installed):
	--   1) Lua throw after clear_certs or after set_cert → abort. Returning true would
	--      let nginx fall through to the static ssl_certificate (Must-Staple hole).
	--      Non-MS half-install also aborts: clear already removed any prior leaf.
	--      Exception: state.leaf_complete with state.leaf_must_staple == false continues — the
	--      installed leaf is usable and only the (optional) staple is lost.
	--   2) Normal return with state.certs_cleared, no leaf installed, and Must-Staple
	--      required OR unknown (state.leaf_must_staple ~= false) → abort. Unknown must not
	--      fall through to the static ssl_certificate after clear. ocsp_http writes these
	--      flags on the shared state table (not bare globals).
	if not ok then
		ngx.log(ngx.ERR, ("SSL-CERTIFICATE critical error in Lua block: " .. tostring(err)):sub(1, 2048))
		if state.leaf_complete and state.leaf_must_staple == false then
			-- Cert + key installed and the leaf is proven non-Must-Staple: a throw in the
			-- OCSP code only costs the staple, so serve the handshake (upstream behavior).
			ngx.log(
				ngx.ERR,
				"staple_decision=unmet tag=OCSP_STAPLE_SKIP action=continue subsystem=http"
					.. " detail=ssl_certificate_exception_non_must_staple"
			)
		elseif state.certs_cleared or state.leaf_installed then
			local detail = "ssl_certificate_exception"
			if state.leaf_must_staple ~= false then
				detail = "ssl_certificate_exception_must_staple"
			end
			ngx.log(
				ngx.ERR,
				"staple_decision="
					.. detail
					.. " tag=OCSP_MUST_STAPLE_REFUSE action=abort subsystem=http detail="
					.. detail
					.. " certs_cleared="
					.. tostring(state.certs_cleared)
					.. " leaf_installed="
					.. tostring(state.leaf_installed)
			)
			return ngx.exit(ngx.ERROR)
		end
	elseif state.certs_cleared and not state.leaf_installed and state.leaf_must_staple ~= false then
		-- Cleared then no leaf installed, and Must-Staple is required OR unknown.
		-- Unknown (nil) must not fall through to nginx's static ssl_certificate —
		-- that was the post-clear hole when pair parse failed before MS was bound.
		ngx.log(
			ngx.ERR,
			"staple_decision=cleared_no_leaf tag=OCSP_MUST_STAPLE_REFUSE action=abort subsystem=http detail=cleared_no_leaf leaf_must_staple="
				.. tostring(state.leaf_must_staple)
		)
		return ngx.exit(ngx.ERROR)
	end
	return true  -- Always return true so nginx uses default certificate on any error
}
