{#- The default server's `access` runner. Mirrors `server-http/access-lua.conf` minus
    `save_session` (the `sessions` plugin is refused here, so there is never a session to save).

    Rendered ONLY when `core/ui/confs/default-server-http/ui.conf` does not render its own
    server-level `access_by_lua_block` -- the bootstrap mode where the default server IS the setup
    wizard. NGINX accepts exactly one `access_by_lua_block` per level ("is duplicate",
    ngx_http_lua_accessby.c), and ui.conf's is included into this same server block. The condition
    below is ui.conf:1 verbatim; `tests/unit/gen/test_default_server_service_render.py` renders both states
    and fails if this block and ui.conf's ever appear together. -#}
{% if not (UI_HOST != "" and not has_variable(all, "USE_UI", "yes")) %}
	access_by_lua_block {
		local clogger		= require "bunkerweb.logger"
		local helpers		= require "bunkerweb.helpers"
		local utils			= require "bunkerweb.utils"
		local cdatastore	= require "bunkerweb.datastore"
		local ccachestore	= require "bunkerweb.cachestore"

		local ngx = ngx
		local is_internal = ngx.req.is_internal
		local exit = ngx.exit
		local ngx_redirect = ngx.redirect
		local ERR = ngx.ERR
		local INFO = ngx.INFO
		local WARN = ngx.WARN
		local NOTICE = ngx.NOTICE
		local OK = ngx.OK
		local HTTP_MOVED_TEMPORARILY = ngx.HTTP_MOVED_TEMPORARILY
		local reason_statuses = {
			[ngx.HTTP_BAD_REQUEST] = true,
			[ngx.HTTP_TOO_MANY_REQUESTS] = true,
			[ngx.HTTP_NOT_ALLOWED] = true,
		}
		local fill_ctx = helpers.fill_ctx
		local save_ctx = helpers.save_ctx
		local require_plugin = helpers.require_plugin
		local new_plugin = helpers.new_plugin
		local call_plugin = helpers.call_plugin
		local is_whitelisted = utils.is_whitelisted
		local is_ip_whitelisted = utils.is_ip_whitelisted
		local is_banned = utils.is_banned
		local set_reason = utils.set_reason
		local get_deny_status = utils.get_deny_status
		local get_security_mode = utils.get_security_mode
		local tostring = tostring

{% include "partials/default-server-preamble-lua.conf" %}

		-- Don't process internal requests
		local logger = clogger:new("ACCESS-DEFAULT")
		if is_internal() then
			logger:log(INFO, "skipped access phase because request is internal")
			return true
		end

		-- Start access phase
		local internalstore = cdatastore:new(ngx.shared.internalstore)
		logger:log(INFO, "access phase started")

		-- Update cachestore (IPC poll requires ngx.sleep, only safe in access/rewrite/content/timer phases)
		local cachestore = ccachestore:new(false)
		local ok, err = cachestore:update()
		if not ok then
			logger:log(ERR, "can't update cachestore : " .. err)
		end

		-- Fill ctx
		logger:log(INFO, "filling ngx.ctx ...")
		local ok, ret, errors, ctx = fill_ctx()
		if not ok then
			logger:log(ERR, "fill_ctx() failed : " .. ret)
		elseif errors then
			for i, error in ipairs(errors) do
				logger:log(ERR, "fill_ctx() error " .. tostring(i) .. " : " .. error)
			end
		end
		logger:log(INFO, "ngx.ctx filled (ret = " .. ret .. ")")

		-- Bind to the reserved service id (see the preamble)
		local previous_server_name = ctx.bw.server_name
		ctx.bw.server_name = "{{ import("default_server").DEFAULT_SERVER_ID }}"

		local security_mode = get_security_mode(ctx)
		local status = nil
		local redirect = nil

		-- Process bans as soon as possible
		if not is_whitelisted(ctx) then
			local banned, reason, ttl, reason_data = is_banned(ctx.bw.remote_addr, ctx.bw.server_name)
			if banned == nil then
				logger:log(ERR, "can't check if IP " .. ctx.bw.remote_addr .. " is banned : " .. reason)
			elseif banned then
				-- Same authoritative re-check as the service blocks : the flag above only reflects
				-- the whitelist cache, which the plugin chain below is what fills.
				local whitelisted, wl_info = is_ip_whitelisted(ctx.bw.remote_addr, ctx.bw.server_name)
				if whitelisted == nil then
					logger:log(ERR, "can't check whitelist for banned IP " .. ctx.bw.remote_addr .. " : " .. wl_info)
				end
				if whitelisted then
					logger:log(WARN,
						"IP " .. ctx.bw.remote_addr .. " is banned with reason " .. reason .. " but is whitelisted (info : " .. wl_info .. "), ignoring the ban")
				else
					ctx.bw.is_banned = true
					set_reason(reason, reason_data, ctx, security_mode)
					ctx.bw.server_name = previous_server_name
					save_ctx(ctx)
					if security_mode == "block" then
						logger:log(WARN,
							"IP " .. ctx.bw.remote_addr .. " is banned with reason " .. reason .. " (" .. tostring(ttl) .. "s remaining)")
						return exit(get_deny_status())
					end
					logger:log(WARN,
						"detected IP " .. ctx.bw.remote_addr .. " ban with reason " .. reason .. " (" .. tostring(ttl) .. "s remaining)")
					return exit(OK)
				end
			else
				logger:log(INFO, "IP " .. ctx.bw.remote_addr .. " is not banned")
			end
		end

		-- Get plugins order
		local order, err = internalstore:get("plugins_order", true)
		if not order then
			logger:log(ERR, "can't get plugins order from internalstore : " .. err)
			ctx.bw.server_name = previous_server_name
			return true
		end

		-- Call access() methods of the curated subset
		logger:log(INFO, "calling access() methods of plugins ...")
		for _, plugin_id in ipairs(get_phase_order(order, "access")) do
			if not allowed_plugins[plugin_id] then
				logger:log(INFO, "skipped execution of " .. plugin_id .. " because it is not part of the default server subset")
			else
				local plugin_lua, err = require_plugin(plugin_id)
				if plugin_lua == false then
					logger:log(ERR, err)
				elseif plugin_lua == nil then
					logger:log(INFO, err)
				elseif plugin_lua.access == nil then
					logger:log(INFO, "skipped execution of " .. plugin_id .. " because method access() is not defined")
				else
					local ok, plugin_obj = new_plugin(plugin_lua, ctx)
					if not ok then
						logger:log(ERR, plugin_obj)
					else
						local ok, ret = call_plugin(plugin_obj, "access")
						if not ok then
							logger:log(ERR, ret)
						elseif not ret.ret then
							logger:log(ERR, plugin_id .. ":access() call failed : " .. ret.msg)
						else
							logger:log(INFO, plugin_id .. ":access() call successful : " .. ret.msg)
						end
						if ret.status and not ret.redirect then
							local reason_status = ret.status == get_deny_status() or reason_statuses[ret.status]
							if security_mode == "detect" then
								if reason_status then
									set_reason(plugin_id, ret.data, ctx, security_mode)
									if is_whitelisted(ctx) then
										logger:log(WARN, "detected allow access from " .. plugin_id .. " : " .. ret.msg)
									else
										logger:log(WARN, "detected deny access from " .. plugin_id .. " : " .. ret.msg)
									end
									break
								end
							elseif reason_status then
								set_reason(plugin_id, ret.data, ctx)
								if is_whitelisted(ctx) then
									logger:log(WARN, "allowed access from " .. plugin_id .. " : " .. ret.msg)
								else
									logger:log(WARN, "denied access from " .. plugin_id .. " : " .. ret.msg)
								end
							else
								logger:log(NOTICE, plugin_id .. " returned status " .. tostring(ret.status) .. " : " .. ret.msg)
							end
							status = ret.status
							break
						elseif ret.redirect then
							if ret.status then
								status = ret.status
							end
							logger:log(NOTICE, plugin_id .. " redirect to " .. ret.redirect .. " : " .. ret.msg)
							redirect = ret.redirect
							ctx.bw.location_header = redirect
							break
						end
					end
				end
			end
		end
		logger:log(INFO, "called access() methods of plugins")

		-- Restore the marker BEFORE saving : log_default reads this same context
		ctx.bw.server_name = previous_server_name
		save_ctx(ctx)

		logger:log(INFO, "access phase ended")

		if status then
			return exit(status)
		end

		if redirect then
			return ngx_redirect(redirect, status or HTTP_MOVED_TEMPORARILY)
		end

		return true
	}
{% endif %}
