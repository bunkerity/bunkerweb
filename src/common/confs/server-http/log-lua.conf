log_by_lua_block {
	local clogger    = require "bunkerweb.logger"
	local helpers    = require "bunkerweb.helpers"
	local cdatastore = require "bunkerweb.datastore"
	local utils      = require "bunkerweb.utils"
	local cjson		 = require "cjson"

	local ngx = ngx
	local ERR = ngx.ERR
	local INFO = ngx.INFO
	local fill_ctx = helpers.fill_ctx
	local get_reason = utils.get_reason
	local is_whitelisted = utils.is_whitelisted
	local require_plugin = helpers.require_plugin
	local new_plugin = helpers.new_plugin
	local call_plugin = helpers.call_plugin
	local tostring = tostring
	local encode = cjson.encode

	-- Start log phase
	local logger     = clogger:new("LOG")
	local internalstore  = cdatastore:new(ngx.shared.internalstore)
	logger:log(INFO, "log phase started")

	-- Fill ctx
	logger:log(INFO, "filling ngx.ctx ...")
	local ok, ret, errors, ctx = fill_ctx()
	if not ok then
		logger:log(ERR, "fill_ctx() failed : " .. ret)
	elseif errors then
		for i, error in ipairs(errors) do
			logger:log(ERR, "fill_ctx() error " .. tostring(i) .. " : " .. error)
		end
	end
	logger:log(INFO, "ngx.ctx filled (ret = " .. ret .. ")")

	-- Get plugins order
	local order, err = internalstore:get("plugins_order", true)
	if not order then
		logger:log(ERR, "can't get plugins order from internalstore : " .. err)
		return
	end

	local function get_phase_order(ord, phase, server_name)
		if ord.per_site and server_name and ord.per_site[server_name] and ord.per_site[server_name][phase] then
			return ord.per_site[server_name][phase]
		elseif ord.global and ord.global[phase] then
			return ord.global[phase]
		end
		return ord[phase]
	end

	local phase_order = get_phase_order(order, "log", ngx.var.server_name)

	-- Call log() methods
	logger:log(INFO, "calling log() methods of plugins ...")
	for i, plugin_id in ipairs(phase_order) do
		-- Require call
		local plugin_lua, err = require_plugin(plugin_id)
		if plugin_lua == false then
			logger:log(ERR, err)
		elseif plugin_lua == nil then
			logger:log(INFO, err)
		else
			-- Check if plugin has log method
			if plugin_lua.log ~= nil then
				-- New call
				local ok, plugin_obj = new_plugin(plugin_lua, ctx)
				if not ok then
					logger:log(ERR, plugin_obj)
				else
					local ok, ret = call_plugin(plugin_obj, "log")
					if not ok then
						logger:log(ERR, ret)
					elseif not ret.ret then
						logger:log(ERR, plugin_id .. ":log() call failed : " .. ret.msg)
					else
						logger:log(INFO, plugin_id .. ":log() call successful : " .. ret.msg)
					end
				end
			else
				logger:log(INFO, "skipped execution of " .. plugin_id .. " because method log() is not defined")
			end
		end
	end
	logger:log(INFO, "called log() methods of plugins")

	-- Display reason at info level
	local reason, reason_data, security_mode = get_reason(ctx)
	if reason then
		-- A served challenge (antibot, or CrowdSec's captcha delegated to it) or a workflow redirect
		-- answers the request itself instead of blocking it -- set_reason() records that as
		-- reason_data.action == "challenge"/"captcha" (antibot.lua:set_challenge_reason,
		-- crowdsec.lua) or "redirect" (workflows.lua:apply). Logging any of the three as "denied"
		-- reads as a false block to anyone tailing the log; the client got a page or a 30x, not a
		-- block. Same three-value set bans.py's report filter uses for the same reason.
		local answered_not_blocked = type(reason_data) == "table"
			and (reason_data.action == "challenge" or reason_data.action == "captcha" or reason_data.action == "redirect")
		if security_mode == "block" then
			if is_whitelisted(ctx) then
				logger:log(INFO, "client was allowed with reason " .. reason .. " and data = " .. encode(reason_data))
			elseif answered_not_blocked then
				logger:log(INFO, "client was challenged or redirected with reason " .. reason .. " and data = " .. encode(reason_data))
			else
				logger:log(INFO, "client was denied with reason " .. reason .. " and data = " .. encode(reason_data))
			end
		else
			if is_whitelisted(ctx) then
				logger:log(INFO, "detected client allow with reason " .. reason .. " and data = " .. encode(reason_data))
			elseif answered_not_blocked then
				logger:log(INFO, "detected client challenge or redirect with reason " .. reason .. " and data = " .. encode(reason_data))
			else
				logger:log(INFO, "detected client deny with reason " .. reason .. " and data = " .. encode(reason_data))
			end
		end
	end

	logger:log(INFO, "log phase ended")
}
