server {

	# variables
	set $reason '';
	set $reason_data '';
	set $ctx_ref '';
	set $is_whitelisted 'no';

	# enriched request context (filled from ngx.ctx.bw, usable in LOG_FORMAT)
	set $bw_kind '';
	set $bw_protocol '';
	set $bw_ip_is_global '';
	set $bw_ip_version '';
	set $bw_country '';
	set $bw_city '';
	set $bw_asn_number '';
	set $bw_asn_org '';

	# server name (vhost)
	server_name {{ SERVER_NAME }};

	# HTTP listen
{% set http_ports = [] %}
{% for k, port in all.items() if k.startswith("HTTP_PORT") and port %}
	{% if http_ports.append(port) %}{% endif %}
{% endfor %}
{% if LISTEN_HTTP == "yes" and http_ports|length > 0 %}
	{% set common_options = "" %}
	{# The three terms are the same ones ssl-certificate-lua.conf:57 already uses for the QUIC
	   `reuseport`, and for the same reason: they are exactly the complement of the condition that
	   includes default-server-http.conf (http.conf:91-93). Without `IS_LOADING`, a mono-site
	   instance rendering with IS_LOADING=yes emitted `listen 0.0.0.0:8080 default_server;` HERE and
	   again in the default server, and NGINX refuses to start on it:
	   "a duplicate default server for 0.0.0.0:8080" (src/deps/src/nginx/src/http/ngx_http.c:1308-1315).
	   The boot path never hit it because the entrypoint renders its loading config with an empty
	   SERVER_NAME (src/bw/entrypoint.sh:69), so no server block is included at all -- but
	   IS_LOADING is a declared setting (settings.json:2) and anything that sets it reaches this. #}
	{% if MULTISITE == "no" and DISABLE_DEFAULT_SERVER == "no" and IS_LOADING == "no" %}
		{% set common_options = common_options ~ " default_server" %}
	{% endif %}
	{% if USE_PROXY_PROTOCOL == "yes" %}
		{% set common_options = common_options ~ " proxy_protocol" %}
	{% endif %}
	{% for port in http_ports %}
	listen 0.0.0.0:{{ port }}{{ common_options }};
		{% if USE_IPV6 == "yes" %}
	listen [::]:{{ port }}{{ common_options }};
		{% endif %}
	{% endfor %}
{% endif %}

	index index.php index.html index.htm;

	# custom config
	include /etc/bunkerweb/configs/server-http/*.conf;
{% if MULTISITE == "yes" +%}
	include /etc/bunkerweb/configs/server-http/{{ SERVER_NAME.split(" ")[0] }}/*.conf;
{% endif %}

	# include config files
	include {{ NGINX_PREFIX }}server-http/*.conf;

	# include LUA files
	include {{ NGINX_PREFIX }}set-lua.conf;
	include {{ NGINX_PREFIX }}ssl-certificate-lua.conf;
	include {{ NGINX_PREFIX }}access-lua.conf;
	include {{ NGINX_PREFIX }}header-lua.conf;
	include {{ NGINX_PREFIX }}log-lua.conf;

}
