set $dummy_set "";
set_by_lua_block $dummy_set {
	local clogger     = require "bunkerweb.logger"
	local helpers     = require "bunkerweb.helpers"
	local cdatastore  = require "bunkerweb.datastore"

	local ngx = ngx
	local ngx_req = ngx.req
	local is_internal = ngx_req.is_internal
	local ERR = ngx.ERR
	local INFO = ngx.INFO
	local fill_ctx = helpers.fill_ctx
	local export_ctx_vars = helpers.export_ctx_vars
	local save_ctx = helpers.save_ctx
	local require_plugin = helpers.require_plugin
	local new_plugin = helpers.new_plugin
	local call_plugin = helpers.call_plugin
	local tostring = tostring

	-- Don't process internal requests
	local logger      = clogger:new("SET")
	if is_internal() then
		-- ... but DO rebuild the $bw_* variables before returning.
		--
		-- An internal redirect (`index`, `try_files`, `error_page`, X-Accel-Redirect) makes NGINX
		-- re-run the REWRITE phase for the new URI, and both halves of the context export live in
		-- that phase: server-http/server.conf's eight `set $bw_* '';` defaults, and this
		-- set_by_lua_block. So the redirect re-assigns every $bw_* to the empty string, and
		-- returning here without re-exporting leaves them that way for the rest of the request.
		-- The access log is written at the very end, after the redirect, so it records the wiped
		-- values: `$bw_country`, `$bw_city`, `$bw_asn_*` and friends are all silently empty in
		-- LOG_FORMAT for essentially every static-file request, since `index` alone is enough to
		-- trigger it. Plugin `set()` methods must still NOT run a second time -- only the export
		-- is repeated.
		--
		-- fill_ctx() rather than a cheap re-read of the stash: `set $ctx_ref '';` is declared in
		-- the same server block, so the redirect wipes the context reference along with
		-- everything else and apply_ref() has nothing left to restore. Rebuilding costs the geo
		-- lookups again (three FFI calls into libmaxminddb), which is the price of a correct log
		-- line; do not "optimise" it back into an early return.
		local _, _, _, ctx = fill_ctx()
		local export_ok, export_err = export_ctx_vars(ctx)
		if not export_ok and export_err then
			logger:log(ERR, export_err)
		end
		logger:log(INFO, "restored the $bw_* variables after an internal redirect, skipping the set phase")
		return true
	end

	-- Start set phase
	local internalstore = cdatastore:new(ngx.shared.internalstore)
	logger:log(INFO, "set phase started")

	-- Fill ctx
	logger:log(INFO, "filling ngx.ctx ...")
	local ok, ret, errors, ctx = fill_ctx()
	if not ok then
		logger:log(ERR, "fill_ctx() failed : " .. ret)
	elseif errors then
		for i, error in ipairs(errors) do
			logger:log(ERR, "fill_ctx() error " .. tostring(i) .. " : " .. error)
		end
	end
	logger:log(INFO, "ngx.ctx filled (ret = " .. ret .. ")")

	-- Export the enriched context to the $bw_* variables
	local export_ok, export_err = export_ctx_vars(ctx)
	if not export_ok and export_err then
		logger:log(ERR, export_err)
	end

	-- Get plugins order
	local order, err = internalstore:get("plugins_order", true)
	if not order then
		logger:log(ERR, "can't get plugins order from internalstore : " .. err)
		return
	end

	local function get_phase_order(ord, phase, server_name)
		if ord.per_site and server_name and ord.per_site[server_name] and ord.per_site[server_name][phase] then
			return ord.per_site[server_name][phase]
		elseif ord.global and ord.global[phase] then
			return ord.global[phase]
		end
		return ord[phase]
	end

	local phase_order = get_phase_order(order, "set", ngx.var.server_name)

	-- Call set() methods
	logger:log(ngx.INFO, "calling set() methods of plugins ...")
	for i, plugin_id in ipairs(phase_order) do
		-- Require call
		local plugin_lua, err = require_plugin(plugin_id)
		if plugin_lua == false then
			logger:log(ERR, err)
		elseif plugin_lua == nil then
			logger:log(INFO, err)
		else
			-- Check if plugin has set method
			if plugin_lua.set ~= nil then
				-- New call
				local ok, plugin_obj = new_plugin(plugin_lua, ctx)
				if not ok then
					logger:log(ERR, plugin_obj)
				else
					local ok, ret = call_plugin(plugin_obj, "set")
					if not ok then
						logger:log(ERR, ret)
					elseif not ret.ret then
						logger:log(ERR, plugin_id .. ":set() call failed : " .. ret.msg)
					else
						logger:log(INFO, plugin_id .. ":set() call successful : " .. ret.msg)
					end
				end
			else
				logger:log(INFO, "skipped execution of " .. plugin_id .. " because method set() is not defined")
			end
		end
	end
	logger:log(INFO, "called set() methods of plugins")

	-- Save ctx
	save_ctx(ctx)

	return true
}
