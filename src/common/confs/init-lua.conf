init_by_lua_block {
	local clogger    = require "bunkerweb.logger"
	local helpers    = require "bunkerweb.helpers"
	local cdatastore = require "bunkerweb.datastore"
	local cjson      = require "cjson"

	local ngx = ngx
	local INFO = ngx.INFO
	local ERR = ngx.ERR
	local NOTICE = ngx.NOTICE
	local WARN = ngx.WARN
	local shared = ngx.shared
	local subsystem = ngx.config.subsystem
	local popen = io.popen
	local open = io.open

	-- The reload marker holds the token of the reload that signalled this master. Taken before anything
	-- else runs: the marker is there before the signal and stays until the workers of this reload clear it.
	local marker_path = "/var/tmp/bunkerweb/reloading"
	local function read_marker()
		local marker = open(marker_path, "r")
		if not marker then
			return nil
		end
		local content = marker:read("*a")
		marker:close()
		if content == "" then
			return nil
		end
		return content
	end
	local marker_token = read_marker()
	-- The workers started from this configuration remove the marker only while it still holds this token
	package.loaded["bunkerweb.reload_marker_token"] = marker_token or false

	-- A reload that stops here starts no new workers, and they are what remove the reload marker. Left
	-- behind, it would keep every later reload and generation out. Only a reconfigure of the running
	-- master that carries the marker's token owns it: any other marker belongs to another reload.
	local function release_marker()
		if marker_token and require("ngx.process").type() == "master" and read_marker() == marker_token then
			os.remove(marker_path)
		end
	end
	local ABORTED = "init phase aborted"
	local function abort_init()
		release_marker()
		error(ABORTED, 0)
	end
	local logger = clogger:new("INIT")

	local function init_phase()
		local load_plugin = helpers.load_plugin
		local load_variables = helpers.load_variables
		local order_plugins = helpers.order_plugins
		local require_plugin = helpers.require_plugin
		local new_plugin = helpers.new_plugin
		local call_plugin = helpers.call_plugin
		local encode = cjson.encode

		-- Start init phase
		local internalstore  = cdatastore:new(subsystem == "http" and shared.internalstore or shared.internalstore_stream)
		logger:log(NOTICE, "init phase started")

		-- ============================================================
		-- PHASE 1: Load all data into local tables (no LRU mutation)
		-- ============================================================

		-- Load plugins from disk
		logger:log(NOTICE, "loading plugins ...")
		local new_plugins = {}
		local plugin_paths = { "/usr/share/bunkerweb/core", "/etc/bunkerweb/plugins", "/etc/bunkerweb/pro/plugins" }
		for i, plugin_path in ipairs(plugin_paths) do
			local paths = popen("find -L " .. plugin_path .. " -maxdepth 1 -type d ! -path " .. plugin_path)
			for path in paths:lines() do
				local ok, plugin = load_plugin(path .. "/plugin.json")
				if not ok then
					logger:log(ERR, plugin)
				else
					table.insert(new_plugins, plugin)
					logger:log(NOTICE, "loaded plugin " .. plugin.id .. " v" .. plugin.version)
				end
			end
			paths:close()
		end

		-- Load variables from disk
		logger:log(NOTICE, "loading variables ...")
		local file = open("/etc/nginx/variables.env")
		if not file then
			logger:log(ERR, "can't open /etc/nginx/variables.env file, aborting init")
			abort_init()
		end
		file:close()
		local all_variables = {}
		for line in io.lines("/etc/nginx/variables.env") do
			local variable, value = line:match("^([^=]+)=(.*)$")
			if variable then
				all_variables[variable] = value
			end
		end
		local ok, new_variables = load_variables(all_variables, new_plugins)
		if not ok then
			logger:log(ERR, "error while loading variables : " .. new_variables .. ", aborting init")
			abort_init()
		end

		-- Compute plugins order
		logger:log(NOTICE, "computing plugins order ...")
		local ok, new_order, missing_plugins = order_plugins(new_plugins, new_variables)
		if not ok then
			logger:log(ERR, "can't compute plugins order : " .. new_order .. ", aborting init")
			abort_init()
		end

		-- Anything that can still reject this configuration runs before the flush: past it, an abort leaves
		-- the old workers serving from a store that is partly emptied.
		local cachestore = require "bunkerweb.cachestore":new(false)

		-- ============================================================
		-- PHASE 2: All data loaded successfully — now flush and swap
		-- ============================================================

		logger:log(NOTICE, "all data loaded successfully, swapping internalstore ...")

		-- Flush old LRU data. It fails only when there is no LRU to flush, and then nothing was flushed and
		-- nothing can be saved into it: the old data stays.
		local ok, err = internalstore:flush_lru()
		if not ok then
			logger:log(ERR, "can't flush the internalstore LRU : " .. err .. ", aborting init")
			abort_init()
		end
		local data_keys = { "^plugin", "^misc_" }
		for i, key in pairs(data_keys) do
			local ok, err = internalstore:delete_all(key)
			if not ok then
				logger:log(ERR, "can't delete " .. key .. " from internalstore : " .. err)
				abort_init()
			end
			logger:log(INFO, "deleted " .. key .. " from internalstore")
		end

		-- Populate LRU with new data
		for _, plugin in ipairs(new_plugins) do
			local ok, err = internalstore:set("plugin_" .. plugin.id, plugin, nil, true)
			if not ok then
				logger:log(ERR, "can't save " .. plugin.id .. " into internalstore : " .. err)
			end
		end
		local ok, err = internalstore:set("plugins", new_plugins, nil, true)
		if not ok then
			logger:log(ERR, "can't save plugins into internalstore : " .. err)
			abort_init()
		end

		local ok, err = internalstore:set("variables", new_variables, nil, true)
		if not ok then
			logger:log(ERR, "can't save variables into internalstore : " .. err)
			abort_init()
		end
		logger:log(NOTICE, "saved variables into internalstore")

		-- Purge cache
		local ok, err = cachestore:purge()
		if not ok then
			logger:log(ERR, "can't purge cachestore : " .. err)
		end

		-- Log plugin order
		local log_orders = new_order.global or new_order
		for phase, id_list in pairs(log_orders) do
			if type(id_list) == "table" and phase ~= "per_site" then
				logger:log(NOTICE, "plugins order for phase " .. phase .. " : " .. encode(id_list))
			end
		end

		local function warn_missing(scope, phase_missing)
			for phase, ids in pairs(phase_missing) do
				for id, _ in pairs(ids) do
					logger:log(
						WARN,
						"plugin " .. id .. " referenced in " .. scope .. " PLUGINS_ORDER_" .. phase:upper() .. " is not available or doesn't implement the phase, skipping"
					)
				end
			end
		end
		if missing_plugins.global then
			warn_missing("global", missing_plugins.global)
		end
		if missing_plugins.per_site then
			for server_name, phase_missing in pairs(missing_plugins.per_site) do
				warn_missing("site " .. server_name, phase_missing)
			end
		end
		local ok, err = internalstore:set("plugins_order", new_order, nil, true)
		if not ok then
			logger:log(ERR, "can't save plugins order into internalstore : " .. err)
			abort_init()
		end
		logger:log(NOTICE, "saved plugins order into internalstore")

		-- Call init() method
		logger:log(NOTICE, "calling init() methods of plugins ...")
		for i, plugin_id in ipairs(new_order["init"]) do
			-- Require call
			local plugin_lua, err = require_plugin(plugin_id)
			if plugin_lua == false then
				logger:log(ERR, err)
			elseif plugin_lua == nil then
				logger:log(NOTICE, err)
			else
				-- Check if plugin has init method
				if plugin_lua.init ~= nil then
					-- New call
					local ok, plugin_obj = new_plugin(plugin_lua)
					if not ok then
						logger:log(ERR, plugin_obj)
					else
						local ok, ret = call_plugin(plugin_obj, "init")
						if not ok then
							logger:log(ERR, ret)
						elseif not ret.ret then
							logger:log(ERR, plugin_id .. ":init() call failed : " .. ret.msg)
						else
							logger:log(NOTICE, plugin_id .. ":init() call successful : " .. ret.msg)
						end
					end
				else
					logger:log(NOTICE, "skipped execution of " .. plugin_id .. " because method init() is not defined")
				end
			end
		end
		logger:log(NOTICE, "called init() methods of plugins")

		logger:log(NOTICE, "init phase ended")
	end

	-- Any error raised by the init phase rejects the reload like an explicit abort does: logged once with its
	-- traceback, then the marker it owns goes and the init fails, so nginx keeps the old workers.
	local ok, err = xpcall(init_phase, function(msg)
		if msg == ABORTED then
			return msg
		end
		return debug.traceback(tostring(msg), 2)
	end)
	if not ok then
		if err ~= ABORTED then
			logger:log(ERR, "init phase raised an error, aborting init : " .. err)
			pcall(release_marker)
		end
		error(ABORTED, 0)
	end
}
