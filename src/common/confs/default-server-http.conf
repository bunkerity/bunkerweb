server {

	# variables
	set $reason '';
	set $reason_data '';
	set $ctx_ref '';
	set $is_whitelisted 'no';
	# Malformed requests can skip rewrite/set phases, leaving these custom vars
	# uninitialized before log/content Lua accesses them.
	uninitialized_variable_warn off;

	server_name _;

	# HTTP listen
{% if LISTEN_HTTP == "yes" %}
	{% set common_options = " default_server" %}
	{% if USE_PROXY_PROTOCOL == "yes" %}
		{% set common_options = common_options ~ " proxy_protocol" %}
	{% endif %}
	{# ALL_*_PORTS is the UNION of the global ports and every port a service declares
	   (Templator, from utils/ports.py:union_ports). Iterating `all.items()` covered the global
	   ports only, so a port a single service declared had no default_server -- and the first
	   block on it became the implicit default, which takes DISABLE_DEFAULT_SERVER and the
	   strict-SNI rejection off that port (spike S2).
	   `if port` is redundant with union_ports, which already drops empty values, and is kept
	   because HTTP_PORT="" is a documented way to disable HTTP listening (settings.json:23):
	   an empty value here renders `listen 0.0.0.0: default_server;`, which NGINX rejects
	   outright ("invalid port", src/deps/src/nginx/src/core/ngx_inet.c:846). #}
	{% for port in ALL_HTTP_PORTS if port %}
	listen 0.0.0.0:{{ port }}{{ common_options }};
		{% if USE_IPV6 == "yes" %}
	listen [::]:{{ port }}{{ common_options }};
		{% endif %}
	{% endfor %}
{% endif %}

	# HTTPS listen
	# The internal default-server cert is generated at the instance entrypoint
	# (generate_default_server_cert in helpers/utils.sh) into /var/lib/bunkerweb
	# before this renders, so it is always present — no isfile gate needed.
	ssl_protocols {{ SSL_PROTOCOLS }};
	{% if SSL_PROTOCOLS == "TLSv1.3" %}
	ssl_prefer_server_ciphers off;
	{% else %}
	ssl_prefer_server_ciphers on;
	{% endif %}
	ssl_session_tickets off;
	{% if "TLSv1.2" in SSL_PROTOCOLS or "TLSv1.1" in SSL_PROTOCOLS or "TLSv1" in SSL_PROTOCOLS %}
	ssl_session_timeout 1d;
		{% if SSL_SESSION_CACHE_SIZE == "off" or SSL_SESSION_CACHE_SIZE == "none" %}
	ssl_session_cache {{ SSL_SESSION_CACHE_SIZE }};
		{% else %}
	ssl_session_cache shared:MozSSL:{{ SSL_SESSION_CACHE_SIZE }};
		{% endif %}
	{% endif %}
	ssl_ecdh_curve {{ resolve_ssl_ecdh_curve(SSL_ECDH_CURVE) }};
	{% if "TLSv1.2" in SSL_PROTOCOLS +%}
	ssl_dhparam /etc/nginx/dhparam;
		{% if SSL_CIPHERS_CUSTOM != "" %}
	ssl_ciphers {{ SSL_CIPHERS_CUSTOM }};
		{% else %}
			{% if SSL_CIPHERS_LEVEL == "old" %}
	ssl_ciphers @SECLEVEL=0:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA;
			{% elif SSL_CIPHERS_LEVEL == "intermediate" %}
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
			{% elif SSL_PROTOCOLS != "TLSv1.3" %}
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
			{% endif %}
		{% endif %}
	{% endif %}
	ssl_certificate /var/lib/bunkerweb/default-server-cert.pem;
	ssl_certificate_key /var/lib/bunkerweb/default-server-cert.key;
	{% if HTTP2 == "yes" %}
	http2 on;
	{% endif %}
	{% set common_options = " ssl default_server" %}
	{% if USE_PROXY_PROTOCOL == "yes" %}
		{% set common_options = common_options ~ " proxy_protocol" %}
	{% endif %}
	{# ALL_*_PORTS is the UNION of the global ports and every port a service declares
	   (Templator, from utils/ports.py:union_ports). Iterating `all.items()` covered the global
	   ports only, so a port a single service declared had no default_server -- and the first
	   block on it became the implicit default, which takes DISABLE_DEFAULT_SERVER and the
	   strict-SNI rejection off that port (spike S2).
	   `if port` is redundant with union_ports, which already drops empty values, and is kept
	   because HTTP_PORT="" is a documented way to disable HTTP listening (settings.json:23):
	   an empty value here renders `listen 0.0.0.0: default_server;`, which NGINX rejects
	   outright ("invalid port", src/deps/src/nginx/src/core/ngx_inet.c:846). #}
	{% for port in ALL_HTTPS_PORTS if port %}
	listen 0.0.0.0:{{ port }}{{ common_options }};
		{% if USE_IPV6 == "yes" %}
	listen [::]:{{ port }}{{ common_options }};
		{% endif %}
	{% endfor %}

	{% if "TLSv1.3" in SSL_PROTOCOLS and HTTP3 == "yes" and USE_PROXY_PROTOCOL == "no" %}
	http3 on;
		{% for port in ALL_HTTPS_PORTS if port %}
	listen 0.0.0.0:{{ port }} quic reuseport default_server;
			{% if USE_IPV6 == "yes" %}
	listen [::]:{{ port }} quic reuseport default_server;
			{% endif %}
		{% endfor %}
	add_header Alt-Svc 'h3=":{{ HTTP3_ALT_SVC_PORT }}"; ma=86400';
	{% endif %}

	{#- F-LE-3 part B. The default server answers every SNI that matched no server block, and it
	    used to have only the internal certificate above to show them. A wildcard certificate an
	    operator configured for *.example.com therefore never reached sub.example.com unless that
	    exact name was also a configured SERVER_NAME -- which is the smaller half of the problem.
	    The same phase runner the server blocks use resolves it here.

	    ssl_certificate / ssl_certificate_key above stay: when no plugin resolves anything the
	    runner returns without calling set_cert and NGINX falls back to them. They are the
	    fallback, not dead configuration.

	    Runs AFTER ssl_client_hello_by_lua_block below, so DISABLE_DEFAULT_SERVER_STRICT_SNI
	    (misc.lua:ssl_client_hello_default) still closes an unknown SNI before this can serve it,
	    and it cannot weaken mTLS: ssl_reject_handshake only ever renders into a service's own
	    server block, and mtls:access() enforces on $ssl_client_verify in the Host-selected server.
	    Derivation: .cache/results-2026-08-20/lane-b-mtls-axis2-default-server-derivation.md -#}
	{% include "partials/ssl-certificate-by-lua.conf" %}

	ssl_client_hello_by_lua_block {

		local clogger		= require "bunkerweb.logger"
		local cdatastore	= require "bunkerweb.datastore"
		local helpers		= require "bunkerweb.helpers"

		local ngx = ngx
		local INFO = ngx.INFO
		local ERR = ngx.ERR
		local WARN = ngx.WARN
		local HTTP_CLOSE = ngx.HTTP_CLOSE
		local exit = ngx.exit
		local tostring = tostring
		local require_plugin = helpers.require_plugin
		local new_plugin = helpers.new_plugin
		local call_plugin = helpers.call_plugin

		-- Start ssl_client_hello_default phase
		local logger	= clogger:new("SSL-CLIENT-HELLO-DEFAULT")
		local internalstore	= cdatastore:new(ngx.shared.internalstore)
		logger:log(INFO, "ssl_client_hello_default phase started")

		-- Get plugins order
		local order, err = internalstore:get("plugins_order", true)
		if not order then
			logger:log(ERR, "can't get plugins order from internalstore : " .. err)
			return
		end

		local plugin_order = order["ssl_client_hello_default"] or {}

		-- Call ssl_client_hello_default() methods
		logger:log(INFO, "calling ssl_client_hello_default() methods of plugins ...")
		local status = nil
		for _, plugin_id in ipairs(plugin_order) do
			-- Require call
			local plugin_lua, err = require_plugin(plugin_id)
			if plugin_lua == false then
				logger:log(ERR, err)
			elseif plugin_lua == nil then
				logger:log(INFO, err)
			else
				-- Check if plugin has ssl_client_hello_default method
				if plugin_lua.ssl_client_hello_default ~= nil then
					-- New call
					local ok, plugin_obj = new_plugin(plugin_lua)
					if not ok then
						logger:log(ERR, plugin_obj)
					else
						local ok, ret = call_plugin(plugin_obj, "ssl_client_hello_default")
						if not ok then
							logger:log(ERR, ret)
						elseif not ret.ret then
							logger:log(ERR, plugin_id .. ":ssl_client_hello_default() call failed : " .. ret.msg)
						else
							logger:log(INFO, plugin_id .. ":ssl_client_hello_default() call successful : " .. ret.msg)
						end
						if ok and ret.ret and ret.status then
							if ret.status == HTTP_CLOSE then
								logger:log(WARN, "denied ssl_client_hello_default from " .. plugin_id .. " : " .. ret.msg)
								status = ret.status
								break
							end
							logger:log(ERR, plugin_id .. " returned unsupported status " .. tostring(ret.status) .. " : " .. ret.msg)
						end
					end
				else
					logger:log(INFO, "skipped execution of " .. plugin_id .. " because method ssl_client_hello_default() is not defined")
				end
			end
		end
		logger:log(INFO, "called ssl_client_hello_default() methods of plugins")

		logger:log(INFO, "ssl_client_hello_default phase ended")

		-- Return status if needed
		if status then
			return exit(status)
		end

		return true

	}

{% if IS_LOADING == "yes" +%}
	location / {
		etag off;
		add_header Last-Modified "";
		server_tokens off;
		default_type 'text/html';
		root /usr/share/bunkerweb/loading;
		content_by_lua_block {
				local utils = require "bunkerweb.utils"
				local rand = utils.rand
				local subsystem = ngx.config.subsystem

				local template
				local render = nil
				if subsystem == "http" then
					template = require "resty.template"
					render = template.render
				end

				local nonce_style = rand(32)
				local nonce_script = rand(32)

				-- Override CSP header
				ngx.header["Content-Security-Policy"] = "default-src 'none'; script-src 'strict-dynamic' 'nonce-"
						.. nonce_script
						.. "'; style-src 'nonce-"
						.. nonce_style
						.. "'; frame-ancestors 'none'; base-uri 'none'; img-src data:; font-src data:; require-trusted-types-for 'script';"

				-- Remove server header
				ngx.header["Server"] = nil

				-- Override HSTS header
				if ngx.var.scheme == "https" then
					ngx.header["Strict-Transport-Security"] = "max-age=31536000; includeSubDomains; preload"
					ngx.header["Content-Security-Policy"] = ngx.header["Content-Security-Policy"] .. " upgrade-insecure-requests;"
				end

				-- Override X-Content-Type-Options header
				ngx.header["X-Content-Type-Options"] = "nosniff"

				-- Override Referrer-Policy header
				ngx.header["Referrer-Policy"] = "no-referrer"

				-- Override Permissions-Policy header
				ngx.header["Permissions-Policy"] = "accelerometer=(), ambient-light-sensor=(), attribution-reporting=(), autoplay=(), battery=(), bluetooth=(), browsing-topics=(), camera=(), ch-device-memory=(), ch-downlink=(), ch-dpr=(), ch-ect=(), ch-prefers-color-scheme=(), ch-prefers-reduced-motion=(), ch-prefers-reduced-transparency=(), ch-rtt=(), ch-save-data=(), ch-ua-arch=(), ch-ua-bitness=(), ch-ua-form-factors=(), ch-ua-full-version-list=(), ch-ua-full-version=(), ch-ua-mobile=(), ch-ua-model=(), ch-ua-platform-version=(), ch-ua-platform=(), ch-ua-wow64=(), ch-ua=(), ch-viewport-height=(), ch-viewport-width=(), ch-width=(), compute-pressure=(), device-attributes=(), digital-credentials-create=(), digital-credentials-get=(), display-capture=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), focus-without-user-activation=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), interest-cohort=(), keyboard-map=(), language-detector=(), language-model=(), local-fonts=(), magnetometer=(), manual-text=(), media-playback-while-not-visible=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), proofreader=(), publickey-credentials-create=(), publickey-credentials-get=(), rewriter=(), screen-wake-lock=(), serial=(), shared-storage-select-url=(), shared-storage=(), speaker-selection=(), storage-access=(), tools=(), translator=(), unload=(), usb=(), vertical-scroll=(), web-app-installation=(), web-share=(), webnn=(), window-management=(), writer=(), xr-spatial-tracking=()"

				-- Override Content-Type header
				ngx.header["Content-Type"] = "text/html; charset=utf-8"

				-- Override Cache-Control header
				ngx.header["Cache-Control"] = "no-cache, no-store, must-revalidate"

				-- Render template
				render("index.html", {
					nonce_style = nonce_style,
					nonce_script = nonce_script
				})
		}
	}
{% endif %}

	# include core and plugins default-server configurations
	include /etc/nginx/default-server-http/*.conf;

	# include custom default-server configurations
	include /etc/bunkerweb/configs/default-server-http/*.conf;

	log_by_lua_block {

		local utils			= require "bunkerweb.utils"
		local clogger		= require "bunkerweb.logger"
		local cdatastore	= require "bunkerweb.datastore"
		local helpers		= require "bunkerweb.helpers"
		local cjson			= require "cjson"

		local ngx = ngx
		local INFO = ngx.INFO
		local ERR = ngx.ERR
		local fill_ctx = helpers.fill_ctx
		local tostring = tostring
		local get_reason = utils.get_reason
		local is_whitelisted = utils.is_whitelisted
		local require_plugin = helpers.require_plugin
		local new_plugin = helpers.new_plugin
		local call_plugin = helpers.call_plugin

		-- Start log phase
		local logger	= clogger:new("LOG-DEFAULT")
		local internalstore	= cdatastore:new(ngx.shared.internalstore)
		logger:log(INFO, "log_default phase started")

		-- Fill ctx
		logger:log(INFO, "filling ngx.ctx ...")
		local ok, ret, errors, ctx = fill_ctx()
		if not ok then
			logger:log(ERR, "fill_ctx() failed : " .. ret)
		elseif errors then
			for i, error in ipairs(errors) do
				logger:log(ERR, "fill_ctx() error " .. tostring(i) .. " : " .. error)
			end
		end
		logger:log(INFO, "ngx.ctx filled (ret = " .. ret .. ")")

		-- Get plugins order
		local order, err = internalstore:get("plugins_order", true)
		if not order then
			logger:log(ERR, "can't get plugins order from internalstore : " .. err)
			return
		end

		local function get_phase_order(ord, phase, server_name)
			if ord.per_site and server_name and ord.per_site[server_name] and ord.per_site[server_name][phase] then
				return ord.per_site[server_name][phase]
			elseif ord.global and ord.global[phase] then
				return ord.global[phase]
			end
			return ord[phase]
		end

		local phase_order = get_phase_order(order, "log_default", ngx.var.server_name)

		-- Call log_default() methods
		logger:log(INFO, "calling log_default() methods of plugins ...")
		for i, plugin_id in ipairs(phase_order) do
			-- Require call
			local plugin_lua, err = require_plugin(plugin_id)
			if plugin_lua == false then
				logger:log(ERR, err)
			elseif plugin_lua == nil then
				logger:log(INFO, err)
			else
				-- Check if plugin has log method
				if plugin_lua.log_default ~= nil then
					-- New call
					local ok, plugin_obj = new_plugin(plugin_lua, ctx)
					if not ok then
						logger:log(ERR, plugin_obj)
					else
						local ok, ret = call_plugin(plugin_obj, "log_default")
						if not ok then
							logger:log(ERR, ret)
						elseif not ret.ret then
							logger:log(ERR, plugin_id .. ":log_default() call failed : " .. ret.msg)
						else
							logger:log(INFO, plugin_id .. ":log_default() call successful : " .. ret.msg)
						end
					end
				else
					logger:log(INFO, "skipped execution of " .. plugin_id .. " because method log_default() is not defined")
				end
			end
		end
		logger:log(INFO, "called log_default() methods of plugins")

		-- Display reason at info level
		local reason = get_reason(ctx)
		if reason then
			if is_whitelisted(ctx) then
				logger:log(INFO, "client was allowed with reason : " .. reason)
			else
				logger:log(INFO, "client was denied with reason : " .. reason)
			end
		end

		logger:log(INFO, "log_default phase ended")

	}

}
