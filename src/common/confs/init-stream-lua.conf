init_by_lua_block {
	local clogger    = require "bunkerweb.logger"
	local helpers    = require "bunkerweb.helpers"
	local cdatastore = require "bunkerweb.datastore"
	local cjson      = require "cjson"

	local ngx = ngx
	local INFO = ngx.INFO
	local ERR = ngx.ERR
	local NOTICE = ngx.NOTICE
	local WARN = ngx.WARN
	local shared = ngx.shared
	local subsystem = ngx.config.subsystem
	local popen = io.popen
	local open = io.open
	local load_plugin = helpers.load_plugin
	local load_variables = helpers.load_variables
	local order_plugins = helpers.order_plugins
	local require_plugin = helpers.require_plugin
	local new_plugin = helpers.new_plugin
	local call_plugin = helpers.call_plugin
	local encode = cjson.encode
	local random_bytes = require("resty.random").bytes
	local to_hex = require("resty.string").to_hex
	local execute = os.execute

	local INTERNAL_API_TOKEN_PATH = "/var/run/bunkerweb/api-internal.token"
	local INTERNAL_API_SOCKET_PATH = "/var/run/bunkerweb/api-internal.sock"
	local INTERNAL_API_TOKEN_KEY = "internal_api_token"

	local function command_ok(command)
		local ok, _, code = execute(command)
		return ok == true or ok == 0 or code == 0
	end

	local function load_internal_api_token()
		local exists = command_ok("[ -e " .. INTERNAL_API_TOKEN_PATH .. " ]")
		local file, read_err = open(INTERNAL_API_TOKEN_PATH, "r")
		local token = file and file:read("*l")
		if file then
			file:close()
		end
		if exists and not file then
			return nil, "can't read internal API token file : " .. tostring(read_err)
		end
		if token and token:match("^[0-9a-f]+$") and #token == 64 then
			if not command_ok("chmod 0600 " .. INTERNAL_API_TOKEN_PATH) then
				return nil, "can't secure internal API token file"
			end
			return token
		end
		if exists then
			return nil, "invalid internal API token file"
		end

		local bytes, err = random_bytes(32, true)
		if not bytes then
			return nil, "can't generate internal API token : " .. tostring(err)
		end
		token = to_hex(bytes)
		if not command_ok("umask 077; printf '%s\\n' " .. token .. " > " .. INTERNAL_API_TOKEN_PATH) then
			return nil, "can't write internal API token file"
		end
		if not command_ok("chmod 0600 " .. INTERNAL_API_TOKEN_PATH) then
			return nil, "can't secure internal API token file"
		end
		return token
	end

	-- Start init phase
	local logger     = clogger:new("INIT")
	local internalstore  = cdatastore:new(subsystem == "http" and shared.internalstore or shared.internalstore_stream)
	logger:log(NOTICE, "init-stream phase started")
	local internal_api_token, token_err = load_internal_api_token()
	if not internal_api_token then
		logger:log(ERR, token_err)
		error(token_err, 0)
	end
	if not command_ok('[ "$(id -u)" -ne 0 ] || chown nginx ' .. INTERNAL_API_SOCKET_PATH) then
		local socket_err = "can't assign internal API socket to the nginx worker"
		logger:log(ERR, socket_err)
		error(socket_err, 0)
	end
	if not command_ok("[ ! -S " .. INTERNAL_API_SOCKET_PATH .. " ] || chmod 0600 " .. INTERNAL_API_SOCKET_PATH) then
		local socket_err = "can't secure internal API socket"
		logger:log(ERR, socket_err)
		error(socket_err, 0)
	end

	-- ============================================================
	-- PHASE 1: Load all data into local tables (no LRU mutation)
	-- ============================================================

	-- Load plugins from disk
	logger:log(NOTICE, "loading plugins ...")
	local new_plugins = {}
	local plugin_paths = { "/usr/share/bunkerweb/core", "/etc/bunkerweb/plugins", "/etc/bunkerweb/pro/plugins" }
	for i, plugin_path in ipairs(plugin_paths) do
		local paths = popen("find -L " .. plugin_path .. " -maxdepth 1 -type d ! -path " .. plugin_path)
		for path in paths:lines() do
			local ok, plugin = load_plugin(path .. "/plugin.json")
			if not ok then
				logger:log(ERR, plugin)
			else
				table.insert(new_plugins, plugin)
				logger:log(NOTICE, "loaded plugin " .. plugin.id .. " v" .. plugin.version)
			end
		end
		paths:close()
	end

	-- Load variables from disk
	logger:log(NOTICE, "loading variables ...")
	local file = open("/etc/nginx/variables.env")
	if not file then
		logger:log(ERR, "can't open /etc/nginx/variables.env file, keeping previous LRU data")
		return false
	end
	file:close()
	local all_variables = {}
	for line in io.lines("/etc/nginx/variables.env") do
		local variable, value = line:match("^([^=]+)=(.*)$")
		if variable then
			all_variables[variable] = value
		end
	end
	local ok, new_variables = load_variables(all_variables, new_plugins)
	if not ok then
		logger:log(ERR, "error while loading variables : " .. new_variables .. ", keeping previous LRU data")
		return false
	end

	-- Compute plugins order
	logger:log(NOTICE, "computing plugins order ...")
	local ok, new_order, missing_plugins = order_plugins(new_plugins, new_variables)
	if not ok then
		logger:log(ERR, "can't compute plugins order, keeping previous LRU data")
		return false
	end

	-- ============================================================
	-- PHASE 2: All data loaded successfully — now flush and swap
	-- ============================================================

	logger:log(NOTICE, "all data loaded successfully, swapping internalstore ...")

	-- Flush old LRU data
	internalstore:flush_lru()
	local data_keys = { "^plugin", "^misc_" }
	for i, key in pairs(data_keys) do
		local ok, err = internalstore:delete_all(key)
		if not ok then
			logger:log(ERR, "can't delete " .. key .. " from internalstore : " .. err)
			return false
		end
		logger:log(INFO, "deleted " .. key .. " from internalstore")
	end

	-- Populate LRU with new data
	for _, plugin in ipairs(new_plugins) do
		local ok, err = internalstore:set("plugin_" .. plugin.id, plugin, nil, true)
		if not ok then
			logger:log(ERR, "can't save " .. plugin.id .. " into internalstore : " .. err)
		end
	end
	local ok, err = internalstore:set("plugins", new_plugins, nil, true)
	if not ok then
		logger:log(ERR, "can't save plugins into internalstore : " .. err)
		return false
	end

	local ok, err = internalstore:set("variables", new_variables, nil, true)
	if not ok then
		logger:log(ERR, "can't save variables into internalstore : " .. err)
		return false
	end
	logger:log(NOTICE, "saved variables into internalstore")
	local ok, err = internalstore:set(INTERNAL_API_TOKEN_KEY, internal_api_token, nil, true)
	if not ok then
		local store_err = "can't save internal API token into internalstore : " .. err
		logger:log(ERR, store_err)
		error(store_err, 0)
	end

	-- Purge cache
	local cachestore = require "bunkerweb.cachestore":new(false)
	local ok, err = cachestore:purge()
	if not ok then
		logger:log(ERR, "can't purge cachestore : " .. err)
	end

	-- Log plugin order
	local log_orders = new_order.global or new_order
	for phase, id_list in pairs(log_orders) do
		if type(id_list) == "table" and phase ~= "per_site" then
			logger:log(NOTICE, "plugins order for phase " .. phase .. " : " .. encode(id_list))
		end
	end

	local function warn_missing(scope, phase_missing)
		for phase, ids in pairs(phase_missing) do
			for id, _ in pairs(ids) do
				logger:log(
					WARN,
					"plugin " .. id .. " referenced in " .. scope .. " PLUGINS_ORDER_" .. phase:upper() .. " is not available or doesn't implement the phase, skipping"
				)
			end
		end
	end
	if missing_plugins.global then
		warn_missing("global", missing_plugins.global)
	end
	if missing_plugins.per_site then
		for server_name, phase_missing in pairs(missing_plugins.per_site) do
			warn_missing("site " .. server_name, phase_missing)
		end
	end
	local ok, err = internalstore:set("plugins_order", new_order, nil, true)
	if not ok then
		logger:log(ERR, "can't save plugins order into internalstore : " .. err)
		return false
	end
	logger:log(NOTICE, "saved plugins order into internalstore")

	-- Call init() method
	logger:log(NOTICE, "calling init() methods of plugins ...")
	for i, plugin_id in ipairs(new_order["init"]) do
		-- Require call
		local plugin_lua, err = require_plugin(plugin_id)
		if plugin_lua == false then
			logger:log(ERR, err)
		elseif plugin_lua == nil then
			logger:log(NOTICE, err)
		else
			-- Check if plugin has init method
			if plugin_lua.init ~= nil then
				-- New call
				local ok, plugin_obj = new_plugin(plugin_lua)
				if not ok then
					logger:log(ERR, plugin_obj)
				else
					local ok, ret = call_plugin(plugin_obj, "init")
					if not ok then
						logger:log(ERR, ret)
					elseif not ret.ret then
						logger:log(ERR, plugin_id .. ":init() call failed : " .. ret.msg)
					else
						logger:log(NOTICE, plugin_id .. ":init() call successful : " .. ret.msg)
					end
				end
			else
				logger:log(NOTICE, "skipped execution of " .. plugin_id .. " because method init() is not defined")
			end
		end
	end
	logger:log(NOTICE, "called init() methods of plugins")

	logger:log(NOTICE, "init-stream phase ended")
}

# Comments outside a *_by_lua_block are read by NGINX, not by Lua: `--` starts a directive
# there and the config fails to parse ("unexpected ,"), which took down every stack with a
# stream service.
#
# Stream had no init_worker_by_lua at all, so it had no timer phase either. Everything that
# runs on a timer was therefore HTTP-only : badbehavior:log_stream() pushed its counters onto
# plugin_badbehavior_incr in datastore_stream and nothing ever drained them (the HTTP timer
# reads datastore, a different shared dict -- ngx.shared is built per subsystem), so stream
# traffic could never reach a ban threshold. metrics could not flush its stream buffer either.
#
# Deliberately much smaller than init-worker-lua.conf : only the recurrent timer phase. The
# init_workers / init_worker / "ready" ceremony stays HTTP-owned, running it twice would call
# every plugin's init_worker() a second time. Of the three timer plugins, sessions:timer()
# already returns early when kind ~= "http", and metrics/badbehavior act on the stream dict.
init_worker_by_lua_block {
	local ban_sync = require "bunkerweb.ban_sync"
	local helpers = require "bunkerweb.helpers"
	local utils = require "bunkerweb.utils"

	local ngx = ngx
	local ERR = ngx.ERR
	local INFO = ngx.INFO
	local WARN = ngx.WARN
	local worker = ngx.worker
	local timer_at = ngx.timer.at
	local shared = ngx.shared
	local require_plugin = helpers.require_plugin
	local new_plugin = helpers.new_plugin
	local call_plugin = helpers.call_plugin
	local get_variable = utils.get_variable
	local tostring = tostring
	local time = os.time
	local randomseed = math.randomseed
	local internalstore = require "bunkerweb.datastore":new(shared.internalstore_stream)

	-- Random seed
	randomseed(time() + worker.pid())

	local function get_timer_log_level()
		local level_name = get_variable("TIMERS_LOG_LEVEL", false)
		level_name = level_name and level_name:upper() or "INFO"
		return ngx[level_name] or INFO
	end

	local function reconcile_bans(logger)
		if worker.id() ~= 0 then
			return
		end
		local call_ok, sync_ok, sync_err = pcall(ban_sync.reconcile)
		if not call_ok then
			logger:log(ERR, "ban synchronization raised an error : " .. tostring(sync_ok))
		elseif not sync_ok then
			logger:log(ERR, "ban synchronization failed : " .. tostring(sync_err))
		end
	end

	local recurrent_timer
	recurrent_timer = function(premature)
		local logger = require "bunkerweb.logger":new("TIMER-STREAM-" .. tostring(worker.id()))

		-- Worker exiting
		if premature then
			logger:log(WARN, "worker is exiting, disabling timer")
			return
		end

		-- Don't go further we are in loading state
		local is_loading, err = get_variable("IS_LOADING", false)
		if not is_loading then
			logger:log(ERR, "utils.get_variable() failed : " .. err)
		elseif is_loading == "yes" then
			-- Restore enforcement as soon as the authenticated UDS is reachable,
			-- without waiting for the rest of the plugin timer phase to be ready.
			reconcile_bans(logger)
			local hdl_loading
			hdl_loading, err = timer_at(5, recurrent_timer)
			if not hdl_loading then
				logger:log(ERR, "can't create timer : " .. err)
			end
			return
		end

		local timers_log_level = get_timer_log_level()
		logger:log(timers_log_level, "timer started")

		-- Get plugins order
		local order
		order, err = internalstore:get("plugins_order", true)
		if not order then
			logger:log(ERR, "can't get plugins order from internalstore : " .. err)
		else
			-- Call timer() methods
			logger:log(timers_log_level, "calling timer() methods of plugins ...")
			for _, plugin_id in ipairs(order.timer or {}) do
				local metadata, metadata_err = internalstore:get("plugin_" .. plugin_id, true)
				if not metadata then
					logger:log(ERR, "can't get " .. plugin_id .. " metadata from internalstore : " .. metadata_err)
				elseif metadata.stream == "no" then
					logger:log(timers_log_level, "skipped execution of " .. plugin_id .. " because it does not support stream")
				else
					-- Require call
					local plugin_lua, require_err = require_plugin(plugin_id)
					if plugin_lua == false then
						logger:log(ERR, require_err)
					elseif plugin_lua == nil then
						logger:log(timers_log_level, require_err)
					elseif plugin_lua.timer ~= nil then
						-- New call
						local ok, plugin_obj = new_plugin(plugin_lua)
						if not ok then
							logger:log(ERR, plugin_obj)
						else
							local call_ok, ret = call_plugin(plugin_obj, "timer")
							if not call_ok then
								logger:log(ERR, ret)
							elseif not ret.ret then
								logger:log(ERR, plugin_id .. ":timer() call failed : " .. ret.msg)
							else
								logger:log(timers_log_level, plugin_id .. ":timer() call successful : " .. ret.msg)
							end
						end
					else
						logger:log(timers_log_level, "skipped execution of " .. plugin_id .. " because method timer() is not defined")
					end
				end
			end
			logger:log(timers_log_level, "called timer() methods of plugins")
		end

		reconcile_bans(logger)

		local hdl
		hdl, err = timer_at(5, recurrent_timer)
		if not hdl then
			logger:log(ERR, "can't create timer : " .. err)
		end
	end

	local hdl, err = timer_at(0, recurrent_timer)
	if not hdl then
		require "bunkerweb.logger":new("INIT-WORKER-STREAM"):log(ERR, "can't create timer : " .. err)
	end
}
