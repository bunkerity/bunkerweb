server {

	# healthcheck service for docker, swarm and k8s
	server_name healthcheck.bunkerweb.io;

	# only listen on localhost
	listen 127.0.0.1:6000;

	# healthcheck endpoint
	location ~ ^/healthz$ {
		keepalive_timeout 0;
		default_type "text/plain";
		content_by_lua_block {
			-- Data plane availability: only an instance without its configuration reads as
			-- loading. A configured instance is ok, including during a graceful reload, as the
			-- previous workers keep serving. The API /health endpoint reports reloading.
			local get_variable = require("bunkerweb.utils").get_variable

			local is_loading = get_variable("IS_LOADING", false)
			if not is_loading or is_loading == "yes" then
				return ngx.say("loading")
			end

			ngx.say("ok")
		}
	}

	# disable logging
	access_log off;

	# don't respond to other requests
	location / {
		return 444;
	}
}
