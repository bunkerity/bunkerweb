server {

	# healthcheck service for docker, swarm and k8s
	server_name healthcheck.bunkerweb.io;

	# only listen on localhost
	listen 127.0.0.1:6000;

	# healthcheck endpoint
	location ~ ^/healthz$ {
		keepalive_timeout 0;
		default_type "text/plain";
		content_by_lua_block {
			-- Same states as the API /health endpoint (bunkerweb/api.lua), collapsed to the
			-- two answers a probe acts on : an unreadable IS_LOADING and an in-flight reload
			-- both read as loading rather than as ready.
			local get_variable = require("bunkerweb.utils").get_variable

			local is_loading = get_variable("IS_LOADING", false)
			if not is_loading or is_loading == "yes" then
				return ngx.say("loading")
			end

			local f = io.open("/var/tmp/bunkerweb_reloading", "r")
			if f then
				f:close()
				return ngx.say("loading")
			end

			ngx.say("ok")
		}
	}

	# disable logging
	access_log off;

	# don't respond to other requests
	location / {
		return 444;
	}
}
