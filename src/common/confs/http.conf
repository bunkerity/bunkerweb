# /etc/nginx/http.conf

# zero copy within the kernel
sendfile on;

# send packets only if filled
tcp_nopush on;

# remove 200ms delay
tcp_nodelay on;

# load mime types and set default one
include /etc/nginx/mime.types;
default_type application/octet-stream;

# access log format
{% if ACCESS_LOG == "off" %}
access_log off;
{% else %}
{% for k, v in all.items() %}
	{% if k.startswith("ACCESS_LOG") and v != "" and v != "off" -%}
		{% set access_log = v %}
		{% set suffix = k.removeprefix("ACCESS_LOG") %}
		{% set log_format = all["LOG_FORMAT" + suffix] %}
log_format logf{{ suffix }} '{{ log_format }}';
access_log {{ access_log }} logf{{ suffix }};
	{% endif %}
{% endfor %}
{% endif %}

# temp paths
proxy_temp_path /var/tmp/bunkerweb/proxy_temp;
client_body_temp_path /var/tmp/bunkerweb/client_temp;
fastcgi_temp_path /var/tmp/bunkerweb/fastcgi_temp;
uwsgi_temp_path /var/tmp/bunkerweb/uwsgi_temp;
scgi_temp_path /var/tmp/bunkerweb/scgi_temp;

# close connections in FIN_WAIT1 state
reset_timedout_connection on;

# timeouts
client_body_timeout {{ CLIENT_BODY_TIMEOUT }};
client_header_timeout {{ CLIENT_HEADER_TIMEOUT }};
keepalive_timeout {{ KEEPALIVE_TIMEOUT }};
send_timeout {{ SEND_TIMEOUT }};

# resolvers to use
resolver {{ DNS_RESOLVERS }} {% if USE_IPV6 == "no" %}ipv6=off{% endif %};

# remove ports when sending redirects
port_in_redirect off;

# Strip client-supplied mTLS result headers; only BunkerWeb may set X-SSL-*.
# The legitimate producers (reverseproxy/grpc `*_set_header X-SSL-... $ssl_client_*`) read
# nginx handshake variables, not the request header, so they are unaffected -- while a
# service with USE_MTLS=no or MTLS_FORWARD_CLIENT_HEADERS=no sets nothing, and without this
# a forged X-SSL-Client-Verify: SUCCESS reached the backend untouched.
more_clear_input_headers "X-SSL-*" "X_SSL_*";

# lua configs
lua_package_path "/usr/share/bunkerweb/lua/?.lua;/usr/share/bunkerweb/core/?.lua;/etc/bunkerweb/plugins/?.lua;/etc/bunkerweb/pro/plugins/?.lua;/usr/share/bunkerweb/deps/lib/lua/?.lua;/usr/share/bunkerweb/deps/lib/lua/?/init.lua;;";
lua_package_cpath "/usr/share/bunkerweb/deps/lib/?.so;/usr/share/bunkerweb/deps/lib/lua/?.so;;";
{# REDIS_SSL_CA joins this bundle rather than replacing it. A cosocket has no per-connection
    trust store, so `clusterstore.lua` verifies its Redis/Valkey connection against whatever this
    one directive names -- and so do antibot, BunkerNet and CrowdSec for their own HTTPS. The
    combined file is written by gen/main.py (write_lua_trusted_ca_bundle) into the rendered tree
    and travels to every instance with this configuration. `| default("", true)` rather than a
    bare comparison because an Undefined REDIS_SSL_CA compares NOT-equal to "" -- the naive guard
    would name a bundle that was never written and NGINX would refuse to start. #}
{% if REDIS_SSL_CA | default("", true) %}
lua_ssl_trusted_certificate "/etc/nginx/lua-trusted-ca.pem";
{% else %}
lua_ssl_trusted_certificate "/usr/share/bunkerweb/misc/root-ca.pem";
{% endif %}
lua_ssl_verify_depth 2;
lua_shared_dict internalstore {{ normalize_memory_size(INTERNALSTORE_MEMORY_SIZE) }};
lua_shared_dict datastore {{ normalize_memory_size(DATASTORE_MEMORY_SIZE) }};
lua_shared_dict ban_sync {{ normalize_memory_size(CACHESTORE_LOCKS_MEMORY_SIZE) }};
lua_shared_dict cachestore {{ normalize_memory_size(CACHESTORE_MEMORY_SIZE) }};
lua_shared_dict cachestore_ipc {{ normalize_memory_size(CACHESTORE_IPC_MEMORY_SIZE) }};
lua_shared_dict cachestore_miss {{ normalize_memory_size(CACHESTORE_MISS_MEMORY_SIZE) }};
lua_shared_dict cachestore_locks {{ normalize_memory_size(CACHESTORE_LOCKS_MEMORY_SIZE) }};
# only show LUA socket errors at info/debug
{% if LOG_LEVEL != "info" and LOG_LEVEL != "debug" %}
lua_socket_log_errors off;
{% endif %}
access_by_lua_no_postpone on;

# LUA init block
include /etc/nginx/init-lua.conf;

# LUA init worker block
include /etc/nginx/init-worker-lua.conf;

# API server
include /etc/nginx/api.conf;

# healthcheck server
include /etc/nginx/healthcheck.conf;

# default server
{# ALL_*_PORTS empty means the default server would render with no `listen` at all -- and a
   server{} with no listen directive is not inert, NGINX gives it an implicit one. Which port
   depends on who the master runs as: ngx_http_core_module.c:3061 is
   `htons((getuid() == 0) ? 80 : 8000)`. The Linux packages run the master as root
   (src/linux/bunkerweb.service:9) and get *:80 -- a silent bind on the one port this product must
   never take by accident; the images run as `nginx` (src/bw/Dockerfile:138,
   src/all-in-one/Dockerfile:291) and get *:8000 instead, which is not privileged but is still a
   listener nobody asked for. Either way it happens in exactly the configuration that asked for no
   HTTP listener: HTTP_PORT="" and HTTPS_PORT="", the documented way to disable listening
   (settings.json:23). Not including the block is the whole fix: it has nothing left to serve.
   A stream-only deployment does NOT reach this: union_ports seeds the union from the GLOBAL
   config, where HTTP_PORT still sits at 8080 whatever every service's SERVER_TYPE is -- only the
   per-service half of the union is gated on rendering an http listener. Emptying the ports is the
   only way to arrive here. #}
{% if (ALL_HTTP_PORTS or ALL_HTTPS_PORTS) and (MULTISITE == "yes" or DISABLE_DEFAULT_SERVER == "yes" or IS_LOADING == "yes") +%}
include /etc/nginx/default-server-http.conf;
{% endif +%}

# disable sending nginx version globally
server_tokens off;

# server_names_hash_bucket_size to avoid errors when hostname are (very) long
{% if SERVER_NAMES_HASH_BUCKET_SIZE != "" %}
server_names_hash_bucket_size {{ SERVER_NAMES_HASH_BUCKET_SIZE }};
{% endif %}

# server config(s)
{% if MULTISITE == "yes" and SERVER_NAME != "" %}
	{% set map_servers = {} %}
	{% for server_name in SERVER_NAME.split() %}
		{% if server_name + "_SERVER_NAME" in all and all[server_name + "_SERVER_TYPE"] == "http" %}
			{% set x = map_servers.update({server_name : all[server_name + "_SERVER_NAME"].split()}) %}
		{% endif %}
	{% endfor %}
	{% for server_name in SERVER_NAME.split() %}
		{% if not server_name in map_servers %}
			{% set found = {"res": false} %}
			{% for first_server, servers in map_servers.items() %}
				{% if server_name in servers %}
					{% set x = found.update({"res" : true}) %}
				{% endif %}
			{% endfor %}
			{% if not found["res"] and all[server_name + "_SERVER_TYPE"] == "http" %}
				{% set x = map_servers.update({server_name : [server_name]}) %}
			{% endif %}
		{% endif %}
	{% endfor %}
	{% for first_server in map_servers +%}
include /etc/nginx/{{ first_server }}/server.conf;
	{% endfor %}
{% elif MULTISITE == "no" and SERVER_NAME != "" and SERVER_TYPE == "http" +%}
include /etc/nginx/server.conf;
{% endif %}
