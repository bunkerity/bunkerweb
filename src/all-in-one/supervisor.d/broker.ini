[program:broker]
command=sh -c 'if [ "${SERVICE_WORKER}" = "yes" ] && [ "${CELERY_BROKER_URL}" = "redis://127.0.0.1:6380/0" ]; then exec /usr/share/bunkerweb/all-in-one/service-log-wrapper.sh broker "[BROKER] " redis-server /etc/broker.conf; else echo "[BROKER] Dedicated job broker disabled" && exit 0; fi'
user=nginx
group=nginx
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
priority=12
startsecs=5
startretries=3
stopwaitsecs=10
stopsignal=TERM
autostart=false
autorestart=false
redirect_stderr=false
killasgroup=true
stopasgroup=true
stdout_events_enabled=true
stderr_events_enabled=true
