; Bounds /var/log/bunkerweb in the all-in-one image.
;
; The other images symlink access.log, error.log and modsec_audit.log to PID 1's
; file descriptors, so the container runtime owns retention there. This image cannot:
; logstream.sh follows the real files with `tail -F` to prefix each line, apply
; HIDE_SERVICE_LOGS and strip control characters, so the files have to exist.
;
; The policy is the one the Linux packages ship, unchanged. copytruncate is what makes
; it work on both counts here: it empties the file in place rather than renaming it, so
; ModSecurity keeps writing through the descriptor it never reopens, and `tail -F` finds
; nothing to re-read instead of re-emitting the retained tail into the container logs.
[program:logrotate]
command=sh -c 'while :; do logrotate -s /var/tmp/bunkerweb/logrotate.status /etc/logrotate.d/bunkerweb || echo "[LOGROTATE] rotation failed"; sleep 3600; done'
directory=/var/log/bunkerweb
user=nginx
group=nginx
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
priority=45
startsecs=5
startretries=3
stopwaitsecs=10
stopsignal=TERM
autostart=true
autorestart=true
redirect_stderr=false
killasgroup=true
stopasgroup=true
stdout_events_enabled=true
stderr_events_enabled=true
