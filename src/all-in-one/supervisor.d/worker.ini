[program:worker]
command=sh -c 'if [ "${SERVICE_WORKER}" = "yes" ]; then exec /usr/share/bunkerweb/all-in-one/service-log-wrapper.sh worker "[WORKER] " /usr/share/bunkerweb/deps/python/bin/celery -A worker.app worker --loglevel=$(/usr/share/bunkerweb/worker/celery-loglevel.sh "${LOG_LEVEL:-info}") --concurrency=${WORKER_CONCURRENCY:-2} --pool=prefork --max-tasks-per-child=1 --max-memory-per-child=${WORKER_MAX_MEMORY_KB:-300000} --hostname=worker@%%h --without-heartbeat --without-mingle --without-gossip -Ofair -Q "${WORKER_QUEUES:-default}"; else echo "[WORKER] Disabled by SERVICE_WORKER setting" && exit 0; fi'
directory=/usr/share/bunkerweb
user=nginx
group=nginx
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/usr/share/bunkerweb:/usr/share/bunkerweb/deps/python:/usr/share/bunkerweb/db:/usr/share/bunkerweb/utils:/usr/share/bunkerweb/api"
priority=28
startsecs=5
startretries=3
stopwaitsecs=30
stopsignal=TERM
autostart=true
autorestart=false
redirect_stderr=false
killasgroup=true
stopasgroup=true
stdout_events_enabled=true
stderr_events_enabled=true

[program:worker-heavy]
command=sh -c 'if [ "${SERVICE_WORKER}" = "yes" ] && [ -n "${WORKER_HEAVY_QUEUES-heavy}" ]; then exec /usr/share/bunkerweb/all-in-one/service-log-wrapper.sh worker "[WORKER.HEAVY] " /usr/share/bunkerweb/deps/python/bin/celery -A worker.app worker --loglevel=$(/usr/share/bunkerweb/worker/celery-loglevel.sh "${LOG_LEVEL:-info}") --concurrency=${WORKER_HEAVY_CONCURRENCY:-1} --pool=prefork --max-tasks-per-child=1 --max-memory-per-child=${WORKER_HEAVY_MAX_MEMORY_KB:-${WORKER_MAX_MEMORY_KB:-300000}} --hostname="${WORKER_HEAVY_HOSTNAME:-worker-heavy@%%h}" --without-heartbeat --without-mingle --without-gossip -Ofair -Q "${WORKER_HEAVY_QUEUES-heavy}"; else echo "[WORKER] Heavy worker disabled by SERVICE_WORKER or WORKER_HEAVY_QUEUES" && exit 3; fi'
directory=/usr/share/bunkerweb
user=nginx
group=nginx
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/usr/share/bunkerweb:/usr/share/bunkerweb/deps/python:/usr/share/bunkerweb/db:/usr/share/bunkerweb/utils:/usr/share/bunkerweb/api"
priority=28
# Exit 3 disables this lane; even a clean master exit must otherwise restart.
startsecs=0
startretries=3
stopwaitsecs=30
stopsignal=TERM
autostart=true
autorestart=unexpected
exitcodes=3
redirect_stderr=false
killasgroup=true
stopasgroup=true
stdout_events_enabled=true
stderr_events_enabled=true
