[program:bunkerweb]
command=sh -c 'exec /usr/share/bunkerweb/all-in-one/service-log-wrapper.sh bunkerweb "[BUNKERWEB] " /usr/share/bunkerweb/entrypoint.sh'
user=nginx
group=nginx
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/usr/share/bunkerweb/deps/python",SKIP_ASCII_BANNER="yes"
priority=10
startsecs=10
# entrypoint.sh exits 1 to deliberately refuse to start (e.g. an enrolled instance with a lost
# credential) well before startsecs elapses. supervisord's finish() treats any exit before startsecs
# as "exited too quickly" -- STARTING -> BACKOFF -> FATAL once startretries is exceeded -- WITHOUT
# ever consulting exitcodes/autorestart (those only govern a RUNNING -> EXITED transition, i.e. a
# process that survived past startsecs). startretries=0 makes that BACKOFF give up after exactly one
# attempt, so a fast refusal (or any other fast startup failure) prints once and goes FATAL instead
# of retrying 3x; autorestart stays "true" unconditional, so a process that actually reached RUNNING
# and later crashed still restarts, unbounded, exactly as before.
startretries=0
stopwaitsecs=30
stopsignal=TERM
autostart=true
autorestart=true
redirect_stderr=false
killasgroup=true
stopasgroup=true
stdout_events_enabled=true
stderr_events_enabled=true
