# Message extraction for `pybabel extract` (Lot A of native i18n).
#
# The catalogs in `translations/` are generated from `app/static/locales/*.json` by
# `misc/dev/i18n/json_to_po.py` while the migration is under way — the JSON stays the source of
# truth until the last `data-i18n` attribute is gone (Lot D). This config is what takes over
# afterwards, and what tells you *today* which keys a converted template actually references:
#
#   pybabel extract -F src/ui/babel.cfg -k _ -k gettext -k ngettext:1,2 -o /tmp/messages.pot src/ui
#
# Message ids are dotted keys, not English text, so extraction finds `_('button.create_service')`
# and the id is that key.
[python: **.py]
[jinja2: **/templates/**.html]
