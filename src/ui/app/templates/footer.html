<!-- Footer -->
<footer class="content-footer footer bg-footer-theme">
    <div class="container-xxl">
        <div class="footer-container d-flex align-items-center justify-content-between py-4 flex-md-row flex-column">
            <div class="text-body">
                ©
                <script nonce="{{ script_nonce }}">document.write(new Date().getFullYear());</script>, <span>{{ _("footer.made_by") }}</span>
                <a href="https://www.bunkerity.com/?utm_campaign=self&utm_source=ui"
                   target="_blank"
                   rel="noopener"
                   class="footer-link">Bunkerity</a>
            </div>
            <div class="d-none d-md-inline-block">
                {% from 'macros/docs_link.html' import docs_url %}
                <a href="{{ docs_url() }}"
                   target="_blank"
                   rel="noopener"
                   class="footer-link me-4 docs-link"
                   data-endpoint=""
                   data-fragment="">{{ _("footer.documentation") }}</a>
                <a href="https://www.bunkerweb.io/privacy-policy?utm_campaign=self&utm_source=ui"
                   target="_blank"
                   rel="noopener"
                   class="footer-link me-4">{{ _("footer.privacy") }}</a>
                <a href="https://www.bunkerweb.io/blog?utm_campaign=self&utm_source=ui"
                   target="_blank"
                   rel="noopener"
                   class="footer-link me-4">{{ _("footer.blog") }}</a>
                <a href="https://panel.bunkerweb.io/store/support?utm_campaign=self&utm_source=ui"
                   target="_blank"
                   rel="noopener"
                   class="footer-link me-4">{{ _("footer.support") }}</a>
                <a href="https://github.com/bunkerity/bunkerweb/blob/{% if bw_version != 'dev' and bw_version != 'testing' %}v{% endif %}{{ bw_version | replace('~', '-') }}/LICENSE.md"
                   class="footer-link"
                   target="_blank"
                   rel="noreferrer">{{ _("footer.license") }}</a>
            </div>
        </div>
    </div>
</footer>
<!-- / Footer -->
